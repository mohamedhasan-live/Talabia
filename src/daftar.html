/* ---------- «استنساخ»: one branch's set-up copied into another — NEVER its sales ----------
   What can travel: the products' settings (and products the target lacks), the order settings and schedule, the
   occasions, the market, the groups, the screens' arrangement. What never travels, by construction: days (sales),
   stock, orders, imports, the trash — the result is built from the target's own record with only the chosen parts
   replaced, and cloneGuard() checks the sales are byte-for-byte the target's before anything is written. */
var CLONE_PROD_FIELDS=["shelfLife","packSize","moq","unit","mto","aliases","aliasList","group","active","price","cost","lean","leanAt"];
var CLONE_CFG_ORDER=["orderDays","dayCfg","leadDays","deliveryHour","tendency","horizonBuffer","afterShare","trackWaste","trackStockout","trackPacking","trackStock","showShelfInClose"];
function cloneKeyMap(target,source){
  // a source product → its counterpart in the target: same id and name first, then an Odoo code, then the name
  var map={}, used={};
  var tk={}; target.products.forEach(function(p){ productKeys(p).forEach(function(k){ (tk[k]=tk[k]||[]).push(p) }) });
  source.products.forEach(function(sp){
    var hit=target.products.filter(function(tp){return tp.id===sp.id&&normName(tp.name)===normName(sp.name)&&!used[tp.id]})[0];
    if(!hit){ var ks=productKeys(sp); for(var i=0;i<ks.length&&!hit;i++){ hit=(tk[ks[i]]||[]).filter(function(tp){return !used[tp.id]})[0] } }
    if(hit){ map[sp.id]=hit.id; used[hit.id]=1 }
  });
  return map;
}
/** target, source: whole branch records. parts: {products, order, events, market, groups, ui}. only: source product ids (an edit spread to the brand). */
function cloneInto(target,source,parts,only){
  var out=JSON.parse(JSON.stringify(target)), src=JSON.parse(JSON.stringify(source));
  out.cfg=out.cfg||{}; src.cfg=src.cfg||{};
  var map=cloneKeyMap(out,src), added=0, updated=0;
  if(parts.products){
    var ids={}; out.products.forEach(function(p){ids[p.id]=1});
    src.products.forEach(function(sp){
      if(only&&only.indexOf(sp.id)<0) return;
      var tid=map[sp.id], tp=tid&&out.products.filter(function(p){return p.id===tid})[0];
      if(tp){ CLONE_PROD_FIELDS.forEach(function(k){ if(sp[k]===undefined) delete tp[k]; else tp[k]=JSON.parse(JSON.stringify(sp[k])) }); if(only) tp.name=sp.name; updated++ }
      else{
        var np=JSON.parse(JSON.stringify(sp)); if(ids[np.id]) np.id="p"+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
        ids[np.id]=1; map[sp.id]=np.id; out.products.push(np); added++;
      }
    });
    // the source's order, for the products both have; the target's own extras keep their place at the end
    if(!only){ var pos={}; src.products.forEach(function(sp,i){ if(map[sp.id]) pos[map[sp.id]]=i });
      out.products=out.products.map(function(p,i){return [p,pos[p.id]!=null?pos[p.id]:1e6+i]}).sort(function(a,b){return a[1]-b[1]}).map(function(x){return x[0]}) }
  }
  if(parts.order){
    CLONE_CFG_ORDER.forEach(function(k){ if(src.cfg[k]===undefined) delete out.cfg[k]; else out.cfg[k]=JSON.parse(JSON.stringify(src.cfg[k])) });
    // «ماذا يُطلب في كل يوم»: products follow the id map; materials are the brand's, so they keep their ids
    var idays={}; Object.keys(src.cfg.itemDays||{}).forEach(function(k){ var m=/^p:(.+)$/.exec(k); if(m){ if(map[m[1]]) idays["p:"+map[m[1]]]=src.cfg.itemDays[k] } else idays[k]=src.cfg.itemDays[k] });
    out.cfg.itemDays=idays;
  }
  if(parts.groups&&src.cfg.groups) out.cfg.groups=JSON.parse(JSON.stringify(src.cfg.groups));
  if(parts.market){ if(src.cfg.market) out.cfg.market=src.cfg.market; else delete out.cfg.market }
  if(parts.ui){ if(src.cfg.ui) out.cfg.ui=JSON.parse(JSON.stringify(src.cfg.ui)); else delete out.cfg.ui }
  if(parts.events){
    var have={}; (out.events||[]).forEach(function(e){ have[normName(e.name)+"|"+e.from]=1 });
    out.events=(out.events||[]).concat((src.events||[]).filter(function(e){return !have[normName(e.name)+"|"+e.from]}).map(function(e){ var c=JSON.parse(JSON.stringify(e)); c.id="e"+Date.now().toString(36)+Math.floor(Math.random()*46656).toString(36); return c }));
  }
  return {rec:out, added:added, updated:updated};
}
/** The sales and everything recorded in a branch must come out exactly as they went in. */
function cloneGuard(before,after){
  return ["days","stock","orders","imports","trash"].every(function(k){ return JSON.stringify(before[k]===undefined?null:before[k])===JSON.stringify(after[k]===undefined?null:after[k]) });
}
/** Copy into one branch (open or not). Resolves {ok, added, updated}. */
function cloneToBranch(targetId,sourceRec,parts,only){
  var isCur=targetId===S.branchId;
  var finish=function(before,res){
    if(!cloneGuard(before,res.rec)) return {ok:false, error:"توقّف الاستنساخ: كان سيلمس المبيعات"};
    return res;
  };
  if(isCur){
    var before=payload(), res=finish(before,cloneInto(before,sourceRec,parts,only));
    if(res.ok===false) return Promise.resolve(res);
    S.products=res.rec.products; S.cfg=res.rec.cfg; S.events=res.rec.events||[]; S.cfg.branch=(curBranch()||{}).name||S.cfg.branch;
    saveLocal(); relearn();
    return Promise.resolve({ok:true, added:res.added, updated:res.updated});
  }
  return Promise.resolve(BR.load(targetId)).then(function(r){
    if(!r||!r.ok) return {ok:false, error:(r&&r.error)||"تعذّرت قراءة الفرع"};
    var base=sanitizeRecord(r.data||{products:[]})||{products:[],cfg:{},days:{},stock:{},events:[],orders:{},imports:[],trash:[]};
    var raw=r.data||{};
    var res=cloneInto(Object.assign({},raw,{products:base.products, cfg:Object.assign({},raw.cfg||{},base.cfg), events:base.events}),sourceRec,parts,only);
    if(!cloneGuard(raw,res.rec)) return {ok:false, error:"توقّف الاستنساخ: كان سيلمس المبيعات"};
    var b=findBranch(targetId); if(b) res.rec.cfg.branch=b.name;
    return Promise.resolve(BR.save(targetId,res.rec,r.rev)).then(function(w){
      if(!w||!w.ok) return {ok:false, error:(w&&w.error)||"تعذّر الحفظ"};
      var e=findBranch(targetId); if(e&&w.rev) e.rev=w.rev;
      return {ok:true, added:res.added, updated:res.updated};
    });
  });
}
function cloneSource(id){

  return Promise.resolve(BR.load(id)).then(function(r){ return r&&r.ok&&r.data?r.data:null });

document.addEventListener("click",function(e){

  var parts={products:on("clProducts"), order:on("clOrder"), groups:on("clGroups"), market:on("clMarket"), ui:on("clUi"), events:on("clEvents")};
  if(!Object.keys(parts).some(function(k){return parts[k]})){ toast("اختر شيئاً واحداً على الأقلّ للنسخ"); return }
  var targets=/^brand:/.test(to)?branchesOf(to.slice(6)).map(function(b){return b.id}).filter(function(id){return id!==from}):[to];
  targets=targets.filter(function(id){return id!==from});
  if(!targets.length){ toast("اختر فرعاً غير المصدر"); return }
  var fb=findBranch(from), names=targets.map(function(id){return (findBranch(id)||{}).name}).join("، ");

    var seq=Promise.resolve(), done=[], bad=[];
    targets.forEach(function(id){ seq=seq.then(function(){ return cloneToBranch(id,src,parts).then(function(r){ (r&&r.ok?done:bad).push({id:id, r:r}) }) }) });
    return seq.then(function(){
      t.disabled=false;
      logAct("setup","استنساخ من «"+(fb?fb.name:"")+"» إلى "+done.length+" فرع");
      if(bad.length) toast("نُسخ إلى "+done.length+" وتعذّر "+bad.length+": "+((bad[0].r&&bad[0].r.error)||""));
      else toast("نُسخ إلى "+done.length+" فرع — "+done.reduce(function(a,x){return a+(x.r.added||0)},0)+" صنفاً أُضيف، والمبيعات لم تُمسّ");
      render(); loadBranchStats();
    });
  }).catch(function(err){ t.disabled=false; toast((err&&err.message)||"تعذّر الاستنساخ") });
});

/* ---------- «التعديل يُطبَّق على»: a product edit kept in this branch, or carried to the brand's other branches ---------- */
var SPREAD={q:{}, t:null};
function itemScope(){ try{ return localStorage.getItem("talabia.itemScope.v1")==="brand"?"brand":"branch" }catch(e){ return "branch" } }
function spreadProduct(p){

  var cb=curBranch(); if(!cb||branchesOf(cb.brand).length<2) return;

    var seq=Promise.resolve(), n=0;
    branchesOf(b.brand).filter(function(x){return x.id!==S.branchId}).forEach(function(x){ seq=seq.then(function(){ return cloneToBranch(x.id,src,{products:true},ids).then(function(r){ if(r&&r.ok) n++ }) }) });
    seq.then(function(){ if(n) toast("طُبّق التعديل على "+n+" فرع آخر من "+brandWord(b.brand)) });
  },900);
}
function itemScopeBar(){

/* ===================== analytics ===================== */
/*
 * Everything the shop is shown about the past is derived here, once, from the
 * same de-censored demand the forecast learns from — so a figure on the
 * analysis screen and a figure behind an order quantity can never disagree.
 */

/**
 * A window of the record. Accepts a day count (the quick buttons), an explicit
 * {from, to} (the shop's own dates), or nothing at all for the whole record —
 * so every report below reads the same way whichever the shop picked.
 */
function normRange(r){
  if(r==null) return {from:null,to:null};
  if(typeof r==="number"){
    if(!r) return {from:null,to:null};
    return {from:ymd(addDays(today(),-(r-1))), to:ymd(today())};
  }
  var f=r.from||null, t=r.to||null;
  if(f&&t&&f>t){var s=f;f=t;t=s}     // dates entered back to front still work
  return {from:f, to:t};
}
/** What the analysis screen is currently showing. */
var STAT_OVR=null;                                  // a card's own period, while that card is being drawn
function statRange(){
  if(STAT_OVR) return normRange(STAT_OVR);
  if(S.statFrom||S.statTo) return normRange({from:S.statFrom,to:S.statTo});
  return normRange(S.statPeriod||0);
}

/** The record as a plain chronological list, trimmed to the window. */
function seriesFor(pid,range){
  var R=normRange(range);
  var keys=Object.keys(S.days).sort(), out=[];
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    if(R.from&&k<R.from) continue;
    if(R.to&&k>R.to) continue;
    var rec=S.days[k], e=rec.items?rec.items[pid]:null;
    if(!hasSold(e)) continue;                      // missing data: not a day of this product's history
    out.push({date:k, d:parseYmd(k), qty:demandOf(e), sold:+e.sold||0,
              waste:+e.waste||0, stockout:!!e.stockout});
  }
  return out;
}
function mean(a){return a.length?sum(a)/a.length:0}
function stdev(a){
  if(a.length<2) return 0;
  var m=mean(a);
  return Math.sqrt(sum(a.map(function(x){return (x-m)*(x-m)}))/(a.length-1));
}

/** ↑ / → / ↓ by comparing a recent block against the block before it. */
function trendOf(series,block){
  if(series.length<block+2) return {dir:"?", pct:null, recent:null, prior:null, enough:false};
  var recent=series.slice(-block), prior=series.slice(-2*block,-block);
  if(!prior.length) return {dir:"?", pct:null, recent:null, prior:null, enough:false};
  var r=mean(recent.map(function(x){return x.qty})), p=mean(prior.map(function(x){return x.qty}));
  var pct=p>0?(r-p)/p:(r>0?1:0);
  var dir=Math.abs(pct)<0.10?"flat":(pct>0?"up":"down");
  return {dir:dir, pct:pct, recent:r, prior:p, enough:true, n:recent.length};
}
function trendMark(t){
  if(!t.enough) return '<span style="color:var(--ink-3)">—</span>';
  if(t.dir==="up") return '<span style="color:var(--accent-ink)">↑ '+(t.pct>0?"+":"")+Math.round(t.pct*100)+'٪</span>';
  if(t.dir==="down") return '<span style="color:var(--crit)">↓ '+Math.round(t.pct*100)+'٪</span>';
  return '<span style="color:var(--ink-3)">→ مستقرّ</span>';
}

/** Coefficient of variation, bucketed — two products can share a mean and behave nothing alike. */
function volatilityOf(series){
  var q=series.map(function(x){return x.qty});
  var m=mean(q), sd=stdev(q);
  var cv=m>0?sd/m:0;
  var band=cv<0.35?"low":cv<0.70?"mid":"high";
  return {cv:cv, sd:sd, band:band,
    label:band==="low"?"منخفض":band==="mid"?"متوسّط":"مرتفع",
    cls:band==="low"?"a":band==="mid"?"":"c"};
}

/** How much the shop should trust a forecast: enough days, and steady enough. */
function confidenceOf(series){
  var n=series.length;
  var v=volatilityOf(series);
  var daysScore=clamp(n/28,0,1);
  var steadyScore=clamp(1-(v.cv-0.30)/0.90,0,1);
  var score=0.6*daysScore+0.4*steadyScore;
  if(n<4) score=Math.min(score,0.15);
  var band=score<0.30?"low":score<0.60?"mid":"good";
  return {score:score, n:n, band:band,
    label:band==="low"?"ضعيف":band==="mid"?"متوسّط":"جيّد",
    cls:band==="low"?"c":band==="mid"?"w":"a"};
}

/** Raw average per weekday for one product — the shop's real Thursday, not an index. */
function byWeekday(series){
  var buckets=[[],[],[],[],[],[],[]];
  series.forEach(function(x){buckets[x.d.getDay()].push(x.qty)});
  var avg=buckets.map(function(b){return b.length?mean(b):null});
  var known=avg.map(function(v,i){return v===null?null:{i:i,v:v}}).filter(Boolean);
  known.sort(function(a,b){return b.v-a.v});
  return {avg:avg, counts:buckets.map(function(b){return b.length}),
          best:known.length?known[0]:null, worst:known.length?known[known.length-1]:null};
}

/** One product, fully described. */
function productReport(p,range){
  var s=seriesFor(p.id,range);
  var qty=s.map(function(x){return x.qty});
  var total=sum(qty);
  var wd=byWeekday(s);
  var d=S.planDate?parseYmd(S.planDate):(isOrderDay(today())?today():nextOrderDay(today()));
  var plan=planFor(p,d);
  return {
    p:p, series:s, nDays:s.length, total:total,
    dailyAvg:s.length?total/s.length:0,
    soldTotal:sum(s.map(function(x){return x.sold})),
    wasteTotal:sum(s.map(function(x){return x.waste})),
    outDays:s.filter(function(x){return x.stockout}).length,
    weekday:wd,
    trend7:trendOf(s,7), trend28:trendOf(s,28),
    vol:volatilityOf(s), conf:confidenceOf(s),
    plan:plan,
    thin:s.length<7||total<5
  };
}

/** A sentence that says exactly how a suggested quantity was arrived at. */
function orderReason(r){
  var pl=r.plan, bits=[];
  var u=unitOf(r.p);
  bits.push('الطلب المتوقَّع على نافذة <b>'+round1(pl.win.span)+'</b> يوم هو <b>'+numText(qtyRound(r.p,pl.expected))+'</b> '+u);
  var safety=pl.z*pl.sigmaW;
  bits.push('واحتياطيُّ صنفٍ صلاحيتُه '+(r.p.shelfLife||"—")+' أيام عند مستوى '+Math.round(pl.cr*100)+'٪ يضيف <b>'+(safety>=0?"+":"")+round1(safety)+'</b>');
  if(pl.offerExpected>0.05) bits.push('منها <b>'+numText(qtyRound(r.p,pl.offerExpected))+'</b> '+u+' داخل العروض');
  if(pl.usable>0.5) bits.push('ويُطرح منها <b>'+numText(qtyRound(r.p,pl.usable))+'</b> على الرفّ ما زالت صالحة');
  else bits.push('ولا يوجد على الرفّ ما يُطرح');
  if(pl.capBinds) bits.push('<b style="color:var(--warn)">ثمّ قُصّ الناتج عند سقف الصلاحية ('+qty(r.p,pl.cap)+') لأنّ الزيادة لن تُباع قبل أن تنتهي</b>');
  if(pl.moqForced) bits.push('<b style="color:var(--calm)">ورُفع إلى الحدّ الأدنى الذي يفرضه المورّد ('+r.p.moq+')</b>');
  if(r.conf.band==="low") bits.push('<b style="color:var(--crit)">والثقة ضعيفة ('+r.nDays+' يوماً من السجلّ)، فراجع الرقم بعينك</b>');
  return bits.join('، ')+'. والناتج <b>'+numText(pl.suggested)+'</b> '+u+'.';
}

/** The whole branch, for the period. */
function periodReport(range){
  var R=normRange(range);
  var plist=S.products.filter(function(p){return p.active!==false});
  var reports=plist.map(function(p){return productReport(p,R)});
  var keys=Object.keys(S.days).sort();
  // a day counts once sales were recorded on it (a confirmed 0 included); a day holding no sales
  // figure at all — closed empty, or only waste typed — is missing data, not a zero-sales day
  var dayKeys=keys.filter(function(k){
    if(!((!R.from||k>=R.from)&&(!R.to||k<=R.to))) return false;
    var it=S.days[k].items||{};
    return Object.keys(it).some(function(pid){return hasSold(it[pid])});
  });

  var totalQty=0, totalWaste=0, soldProducts=0;
  reports.forEach(function(r){totalQty+=r.total; totalWaste+=r.wasteTotal; if(r.total>0) soldProducts++});

  // branch-wide daily totals, for the overall trend and the weekday table
  var byDay=dayKeys.map(function(k){
    var rec=S.days[k], t=0;
    for(var pid in rec.items) t+=demandOf(rec.items[pid]);
    return {date:k, d:parseYmd(k), qty:t};
  });
  var wd=byWeekday(byDay);
  var thin=reports.filter(function(r){return r.thin}).length;
  var confAvg=reports.length?mean(reports.map(function(r){return r.conf.score})):0;
  var confBand=confAvg<0.30?"low":confAvg<0.60?"mid":"good";

  var ranked=reports.slice().sort(function(a,b){return b.total-a.total});
  return {
    reports:reports, ranked:ranked, dayKeys:dayKeys, byDay:byDay, weekday:wd,
    days:dayKeys.length, totalQty:totalQty, totalWaste:totalWaste,
    dailyAvg:dayKeys.length?totalQty/dayKeys.length:0,
    soldProducts:soldProducts, productCount:plist.length, thin:thin,
    trend7:trendOf(byDay,7), trend28:trendOf(byDay,28),
    vol:volatilityOf(byDay),
    conf:{score:confAvg, band:confBand,
          label:confBand==="low"?"ضعيف":confBand==="mid"?"متوسّط":"جيّد",
          cls:confBand==="low"?"c":confBand==="mid"?"w":"a"}
  };
}

/** Each occasion measured against the ordinary days around it. */
function eventReport(ev){
  var obs=observedLift(ev);
  var during=[], before=[];
  var from=ev.from, to=ev.to;
  if(!from||!to) return null;
  var beforeFrom=ymd(addDays(parseYmd(from),-14));
  Object.keys(S.days).sort().forEach(function(k){
    var rec=S.days[k], t=0;
    for(var pid in rec.items) t+=demandOf(rec.items[pid]);
    if(k>=from&&k<=to) during.push(t);
    else if(k>=beforeFrom&&k<from) before.push(t);
  });
  var dAvg=during.length?mean(during):null, bAvg=before.length?mean(before):null;
  return {
    ev:ev, kind:kindOf(ev.kind),
    duringDays:during.length, duringTotal:sum(during), duringAvg:dAvg,
    beforeDays:before.length, beforeAvg:bAvg,
    pct:(dAvg!=null&&bAvg>0)?(dAvg-bAvg)/bAvg:null,
    observed:obs?obs.lift:null,
    applied:(+ev.mult||1)!==1
  };
}

/* ===================== intelligence layer: observations, insight, traces ===================== */
/*
 * Read-only views over the record, for the analysis screen, the backtest and the AI explanation. Nothing here
 * writes a sale, changes a product or moves a forecast: forecast(), planFor() and the order formulas are untouched.
 *
 * One rule for every day of every product (the shop's semantics):
 *   sold     a sales figure above 0 is recorded
 *   zero     a figure of 0 is recorded (Odoo's 0 row, or P0-1's 0 for an active product absent from a complete
 *            file) — or the day is covered by a complete import and this active product has no line in it
 *   missing  no figure and no complete import for that day: never a zero, never in an average
 */
var INTEL={halfLife:14, recent:7, longWindow:30, payBands:[[1,5,"بعد الراتب (1–5)"],[6,20,"منتصف الشهر (6–20)"],[21,26,"قبل الراتب (21–26)"],[27,31,"الراتب (27–31)"]]};

/** Is this day covered by a complete import, recorded some other way, or missing? */
function dayKind(k){
  var c=coverageOf(k);
  if(c&&c.complete) return "covered";
  var rec=S.days[k], it=rec&&rec.items||{};
  for(var pid in it) if(hasSold(it[pid])) return "recorded";
  return "missing";
}
/** One product on one day: {state:"sold"|"zero"|"missing", qty (demand, stockout-lifted), sold}. */
function obsOf(p,k){
  var rec=S.days[k], e=rec&&rec.items?rec.items[p.id]:null;
  if(hasSold(e)){ var q=demandOf(e); return {state:(+e.sold>0||q>0)?"sold":"zero", qty:q, sold:+e.sold||0, recorded:true} }
  var c=coverageOf(k);
  if(c&&c.complete&&p.active!==false) return {state:"zero", qty:0, sold:0, recorded:false};
  return {state:"missing", qty:null, sold:null, recorded:false};
}
/** The record's first and last day (a recorded figure or a covered import), or null. */
function recordSpan(){
  var keys=Object.keys(S.days).filter(function(k){ var it=S.days[k].items||{}; for(var pid in it) if(hasSold(it[pid])) return true; return false });
  (S.imports||[]).forEach(function(x){ if(x.complete&&x.from&&x.to){ keys.push(x.from); keys.push(x.to) } });
  if(!keys.length) return null;
  keys.sort();
  var hi=keys[keys.length-1], t=ymd(today()); if(hi>t) hi=t;
  return {from:keys[0], to:hi};
}
function datesBetween(from,to){
  var out=[]; if(!from||!to||from>to) return out;
  for(var d=parseYmd(from),g=0;ymd(d)<=to&&g<1500;d=addDays(d,1),g++) out.push(ymd(d));
  return out;
}
/** The range asked for, inside the record. */
function insightRange(range){
  var R=normRange(range), sp=recordSpan();
  if(!sp) return {from:null,to:null,dates:[]};
  var f=R.from&&R.from>sp.from?R.from:sp.from, t=R.to&&R.to<sp.to?R.to:sp.to;
  return {from:f, to:t, dates:datesBetween(f,t)};
}

/**
 * Automated checks on the record — warnings only, nothing is changed. The checks a person would otherwise have
 * to remember: days with no file, days recorded without a complete import, the same table imported twice,
 * imports that proved nothing, a covered day shadowed by a later incomplete import, unusual daily totals.
 */
function dataQuality(){
  var sp=recordSpan(), out={span:sp, covered:[], recorded:[], missing:[], duplicates:[], incomplete:{}, shadowed:[], spikes:[], negative:[], warnings:[]};
  if(!sp) return out;
  datesBetween(sp.from,sp.to).forEach(function(k){ out[dayKind(k)].push(k) });
  var seen={};
  (S.imports||[]).forEach(function(x){
    if(x.hash){ if(seen[x.hash]) out.duplicates.push({hash:x.hash, first:seen[x.hash].at, again:x.at, mode:x.mode}); else seen[x.hash]=x }
    if(!x.complete) out.incomplete[x.reason||"?"]=(out.incomplete[x.reason||"?"]||0)+1;
  });
  // a day a complete import covered, whose latest record is not complete: it now reads as missing
  var everComplete={};
  (S.imports||[]).forEach(function(x){ if(x.complete) datesBetween(x.from,x.to).forEach(function(k){everComplete[k]=1}) });
  Object.keys(everComplete).forEach(function(k){ var c=coverageOf(k); if(!(c&&c.complete)) out.shadowed.push(k) });
  // daily totals far from the usual (over 3× or under a third of the median of observed days)
  var tot=[];
  Object.keys(S.days).sort().forEach(function(k){
    var it=S.days[k].items||{}, t=0, any=false;
    for(var pid in it){ if(hasSold(it[pid])){ any=true; t+=demandOf(it[pid]); if(+it[pid].sold<0) out.negative.push(k+" "+pid) } }
    if(any) tot.push({date:k, qty:t});
  });
  if(tot.length>=7){
    var q=tot.map(function(x){return x.qty}).sort(function(a,b){return a-b}), med=q[Math.floor(q.length/2)];
    tot.forEach(function(x){ if(med>0&&(x.qty>3*med||x.qty<med/3)) out.spikes.push({date:x.date, qty:x.qty, median:med}) });
  }
  if(out.missing.length) out.warnings.push(out.missing.length+" يوماً بلا ملفٍّ داخل السجلّ — بيانات ناقصة لا تدخل الحساب");
  if(out.recorded.length) out.warnings.push(out.recorded.length+" يوماً مسجّلاً بلا استيرادٍ كامل — الصفر فيها غير مؤكَّد");
  if(out.duplicates.length) out.warnings.push(out.duplicates.length+" ملفّاً استُورد أكثر من مرّة");
  if(out.shadowed.length) out.warnings.push(out.shadowed.length+" يوماً مكتملاً غطّاه بعدُ استيرادٌ ناقص فصار يُقرأ ناقصاً");
  if(out.spikes.length) out.warnings.push(out.spikes.length+" يوماً بإجماليٍّ غير معتاد — راجعه (مناسبة؟ طلبٌ كبير؟ خطأ؟)");
  if(out.negative.length) out.warnings.push(out.negative.length+" رقم مبيعات سالب");
  return out;
}

/** Everything about one product's demand in a range — missing days out, confirmed zeros in. */
function productInsight(p,range){
  var R=insightRange(range), series=[], counts={sold:0,zero:0,missing:0};
  R.dates.forEach(function(k){
    var o=obsOf(p,k); counts[o.state]++;
    if(o.state!=="missing") series.push({date:k, d:parseYmd(k), qty:o.qty, state:o.state});
  });
  var q=series.map(function(x){return x.qty}), total=sum(q), n=series.length;
  var last=n?series[n-1].date:null;
  // recency-weighted average: a day halfLife days older counts half as much
  var ws=0, wq=0;
  series.forEach(function(x){ var age=last?daysBetween(x.d,parseYmd(last)):0; var w=Math.pow(0.5,age/INTEL.halfLife); ws+=w; wq+=w*x.qty });
  var windowOf=function(days){
    if(!last) return {from:null,to:null,observed:0,total:0,avg:null};
    var from=ymd(addDays(parseYmd(last),-(days-1))), s=series.filter(function(x){return x.date>=from});
    var t=sum(s.map(function(x){return x.qty}));
    return {from:from, to:last, observed:s.length, total:t, avg:s.length?t/s.length:null};
  };
  var best=null, worst=null;
  series.forEach(function(x){ if(!best||x.qty>best.qty) best={date:x.date,qty:x.qty}; if(!worst||x.qty<worst.qty) worst={date:x.date,qty:x.qty} });
  var sales=series.filter(function(x){return x.state==="sold"});
  return {pid:p.id, name:p.name, unit:unitOf(p), range:{from:R.from,to:R.to,days:R.dates.length},
    counts:counts, observed:n, total:total, avg:n?total/n:null, weightedAvg:ws>0?wq/ws:null,
    last7:windowOf(INTEL.recent), last30:windowOf(INTEL.longWindow),
    recent:n?mean(q.slice(-INTEL.recent)):null,
    best:best, worst:worst, weekday:byWeekday(series), trend:trendOf(series,7),
    vol:volatilityOf(series), conf:confidenceOf(series),
    firstSale:sales.length?sales[0].date:null, lastSale:sales.length?sales[sales.length-1].date:null, series:series};
}
function payBandOf(d){ var x=d.getDate(); for(var i=0;i<INTEL.payBands.length;i++){ var b=INTEL.payBands[i]; if(x>=b[0]&&x<=b[1]) return i } return 0 }
/** The branch as a whole: daily totals on days that are not missing, by weekday, pay band and occasion. */
function branchInsight(range){
  var R=insightRange(range), plist=S.products, byDay=[];
  R.dates.forEach(function(k){
    var kind=dayKind(k); if(kind==="missing") return;
    var t=0; plist.forEach(function(p){ var o=obsOf(p,k); if(o.state!=="missing") t+=o.qty });
    byDay.push({date:k, d:parseYmd(k), qty:t, kind:kind, events:eventsOn(parseYmd(k),S.events).map(function(e){return e.name})});
  });
  var all=mean(byDay.map(function(x){return x.qty}));
  var wd=byWeekday(byDay);
  var pay=INTEL.payBands.map(function(b,i){
    var s=byDay.filter(function(x){return payBandOf(x.d)===i}), raw=mean(s.map(function(x){return x.qty}));
    // the same days with their weekday taken out (each day ÷ its weekday's ratio to the overall mean)
    var adj=s.filter(function(x){return wd.avg[x.d.getDay()]>0&&wd.counts[x.d.getDay()]>=2}).map(function(x){return x.qty/(wd.avg[x.d.getDay()]/all)});
    return {band:b[2], days:s.length, avg:s.length?raw:null, ratio:s.length&&all>0?raw/all:null, weekdayAdjusted:adj.length&&all>0?mean(adj)/all:null};
  });
  var evDays=byDay.filter(function(x){return x.events.length}), normal=byDay.filter(function(x){return !x.events.length});
  var top=byDay.slice().sort(function(a,b){return b.qty-a.qty}).slice(0,3).map(function(x){return {date:x.date,qty:x.qty}});
  var strongPay=pay.filter(function(x){return x.days>=3&&x.ratio!=null}).sort(function(a,b){return b.ratio-a.ratio})[0]||null;
  return {range:{from:R.from,to:R.to,days:R.dates.length}, counted:byDay.length,
    covered:byDay.filter(function(x){return x.kind==="covered"}).length, recordedOnly:byDay.filter(function(x){return x.kind==="recorded"}).length,
    dailyAvg:byDay.length?all:null, weekday:wd, trend7:trendOf(byDay,7), trend28:trendOf(byDay,28), pay:pay,
    events:{days:evDays.length, avg:evDays.length?mean(evDays.map(function(x){return x.qty})):null, normalAvg:normal.length?mean(normal.map(function(x){return x.qty})):null},
    peaks:{days:top, weekday:wd.best?DOW_AR[wd.best.i]:null, payBand:strongPay?strongPay.band:null}, series:byDay};
}

/** What an occasion's factor rests on: the shop's own number, and what the record measured. */
function eventInsight(){
  return (S.events||[]).map(function(ev){
    var o=observedLift(ev);
    return {name:ev.name, kind:kindOf(ev.kind).label, from:ev.from, to:ev.to, factor:+ev.mult||1,
            source:"assumed", measured:o?{lift:o.lift, days:o.days}:null};
  });
}

/**
 * Why the forecast for one product on one day is what it is: every factor, where it comes from, what is
 * assumed rather than learned, and the fallback in force. Reads the same functions forecast() uses.
 */
function forecastTrace(p,d){
  var m=S.model[p.id]||{base:0,sigma:0,n:0};
  var base=forecastBase(p,d), sd=similarDays(p,d,base), fin=forecast(p,d);
  var isDefault=S.dowIndex.every(function(v,i){return Math.abs(v-DEFAULT_DOW[i])<1e-12});
  var hist=Object.keys(S.days).length;
  var dowF=S.dowIndex[d.getDay()], payF=payFactor(d), evs=eventsOn(d,S.events), evF=eventFactor(d,S.events);
  var drivers=[
    {key:"weekday", label:"يوم الأسبوع ("+DOW_AR[d.getDay()]+")", factor:dowF, source:isDefault?"assumed":"mixed", note:isDefault?marketPattern()+" الافتراضي":"نمط الفرع "+Math.round(clamp(hist/56,0,1)*100)+"٪ والباقي افتراضي"},
    {key:"payday", label:"موضع الشهر والراتب (يوم "+d.getDate()+")", factor:payF, source:"assumed", note:"منحنى ثابت في الكود، غير متعلَّم"}
  ];
  if(evs.length) drivers.push({key:"event", label:"مناسبة: "+evs.map(function(e){return e.name}).join("، "), factor:evF, source:"assumed", note:"معامل يكتبه المستخدم"});
  if(SIMILAR_DAYS.on&&sd.lambda>0) drivers.push({key:"similar", label:"الأيام المشابهة", factor:base>0?sd.final/base:1, source:"learned", note:"وزن "+Math.round(sd.lambda*100)+"٪ من "+sd.days.length+" يوماً"});
  drivers.sort(function(a,b){return Math.abs(Math.log(b.factor||1))-Math.abs(Math.log(a.factor||1))});
  var series=seriesFor(p.id), conf=confidenceOf(series);
  var fallback=!m.n?"no-history":m.n<SIMILAR_DAYS.minObs?"few-observations":isDefault?"default-weekday-pattern":"";
  return {pid:p.id, product:p.name, date:ymd(d), weekday:DOW_AR[d.getDay()], forecast:fin, base:base,
    level:m.base, observations:m.n, drivers:drivers, events:evs.map(function(e){return e.name}),
    similar:{on:SIMILAR_DAYS.on, lambda:sd.lambda, signal:sd.signal, why:sd.why, days:sd.days.map(function(x){return {date:x.date, qty:x.qty, score:x.score}})},
    confidence:{band:conf.band, label:conf.label, score:conf.score, days:conf.n}, fallback:fallback};
}

/** A recommended quantity, taken apart. The quantity is planFor's own; nothing is ordered here. */
function orderTrace(p,orderDate){
  var pl=planFor(p,orderDate), series=seriesFor(p.id), conf=confidenceOf(series);
  var stockOn=S.cfg.trackStock===true;
  var r={p:p, plan:pl, conf:conf, nDays:series.length};
  return {pid:p.id, product:p.name, unit:unitOf(p), orderDate:ymd(orderDate), delivery:ymd(pl.win.delivery), nextDelivery:ymd(pl.win.nextDelivery),
    coverDays:pl.win.span, expected:pl.expected, safety:pl.z*pl.sigmaW, serviceLevel:pl.cr, target:pl.target,
    available:stockOn?pl.usable:null, availableSource:stockOn?"shelf-count":"none", onHand:stockOn?pl.onHand:null,
    need:stockOn?Math.max(0,pl.target-pl.usable):pl.target, cap:pl.cap, capBinds:pl.capBinds, recommended:pl.suggested,
    fromOffers:pl.offerExpected||0, offerDemandOn:OFFER_DEMAND.on, isOffer:isOffer(p),
    madeToOrder:!!p.mto, confidence:{band:conf.band, label:conf.label, days:conf.n},
    daily:pl.win.days.map(function(d,i){return {date:ymd(d), share:pl.win.weights[i], forecast:pl.fc[i]}}),
    explanation:orderReason(r).replace(/<[^>]+>/g,"")};
}

/**
 * Product demand → component demand, through the brand's offers, links and recipes (opNeeds, unchanged), with the
 * four figures kept apart. Available is null until a stock source exists — the shop never types stock for this.
 */
function componentDemand(plans){
  var n=opNeeds(plans);
  return {rows:n.rows.map(function(r){
      return {item:r.item.name, unit:r.base, expected:r.expected, required:r.target, available:null, availableSource:"none", shortage:null,
              sources:r.sources.map(function(s){return {name:s.name, amount:s.amount}})};
    }), unlinked:Object.keys(n.unlinked).map(function(k){return {name:opName(n.ctx,k), qty:n.unlinked[k].qty, why:n.unlinked[k].why}})};
}

/* ===================== AI explanation: context, validation, screen ===================== */
/*
 * The model never calculates. aiContext() hands it the app's own results (the deterministic engine is the source of
 * truth for every number); the answer comes back through main.js (ai.js), and aiValidate() checks that each number
 * in it exists in that context before it is shown as verified. Off until the owner stores a key in Settings.
 */
function aiRound(v){ return typeof v==="number"&&isFinite(v)?Math.round(v*100)/100:v }
function aiClean(o,depth){
  depth=depth||0;
  if(o==null||depth>8) return o;
  if(typeof o==="number") return aiRound(o);
  if(Array.isArray(o)) return o.map(function(x){return aiClean(x,depth+1)});
  if(typeof o==="object"){ var r={}; Object.keys(o).forEach(function(k){ if(k==="series"||k==="d"||k==="cls") return; r[k]=aiClean(o[k],depth+1) }); return r }
  return o;
}
/** Everything the explanation may rest on, already calculated. Synthetic or demo data is never sent. */
function aiContext(){
  if(S.demo) return null;
  var b=S.multi?curBranch():null, od=isOrderDay(today())?today():nextOrderDay(today());
  var plist=S.products.filter(function(p){return p.active!==false});
  var plans=plist.map(function(p){return {p:p, plan:planFor(p,od)}});
  var dq=dataQuality();
  var wkName=function(wd){ var o={}; wd.avg.forEach(function(v,i){ if(v!=null) o[DOW_AR[i]]={avg:v, days:wd.counts[i]} }); return o };
  var products=plist.map(function(p){
    var pi=productInsight(p,null);
    var fc=[0,1,2,3,4,5,6].map(function(i){ var t=forecastTrace(p,addDays(today(),i)); return {date:t.date, weekday:t.weekday, forecast:t.forecast,
      drivers:t.drivers.map(function(x){return {label:x.label, factor:x.factor, source:x.source}}), fallback:t.fallback||null, events:t.events} });
    var ot=orderTrace(p,od); delete ot.daily;
    return {name:p.name, unit:unitOf(p), shelfLifeDays:+p.shelfLife||null, madeToOrder:!!p.mto,
      history:{daysSold:pi.counts.sold, daysConfirmedZero:pi.counts.zero, daysMissing:pi.counts.missing, observedDays:pi.observed, total:pi.total,
        average:pi.avg, weightedAverage:pi.weightedAvg, last7DataDays:pi.last7, last30DataDays:pi.last30, best:pi.best, worst:pi.worst,
        byWeekday:wkName(pi.weekday), trend7:{direction:pi.trend.dir, change:pi.trend.pct, enough:pi.trend.enough},
        volatilityCV:pi.vol.cv, confidence:{label:pi.conf.label, score:pi.conf.score}},
      next7Days:fc, nextOrder:ot};
  });
  var bi=branchInsight(null);
  return aiClean({
    app:"Talabia", today:ymd(today()), branch:{name:b?b.name:(S.cfg.branch||""), brand:b?brandWord(b.brand):""},
    semantics:{missing:"يومٌ بلا ملفّ أودو: بيانات ناقصة لا تدخل الحساب", zero:"يومٌ مكتمل والصنف غائب أو صفر: صفرٌ مؤكَّد", available:"null = المخزون غير معروف (لا مصدر مخزون)"},
    dataQuality:{span:dq.span, coveredDays:dq.covered.length, recordedNotCovered:dq.recorded, missingDays:dq.missing, warnings:dq.warnings},
    branchBehaviour:{countedDays:bi.counted, coveredDays:bi.covered, dailyAverage:bi.dailyAvg, byWeekday:wkName(bi.weekday), payPeriods:bi.pay,
      eventDays:bi.events, peaks:bi.peaks, trend7:{direction:bi.trend7.dir, change:bi.trend7.pct, enough:bi.trend7.enough}},
    forecastSettings:{similarDays:{on:SIMILAR_DAYS.on}, paydayCurve:"assumed (fixed)", weekdayPattern:S.dowIndex.every(function(v,i){return Math.abs(v-DEFAULT_DOW[i])<1e-12})?"assumed (default)":"mixed"},
    nextOrder:{orderDate:ymd(od), weekday:DOW_AR[od.getDay()]},
    events:eventInsight(), products:products, components:componentDemand(plans),
    market:aiMarket(), offers:offerInsight(null).map(function(o){ delete o.trend.n; return o }),
    normalizedDemand:plist.map(function(p){return normalizedInsight(p,null)}).filter(function(x){return x.offers.length}),
    dataSufficiency:aiSufficiency(products)
  });
}
/** The market calendar for the AI: today's Hijri date, the next 14 days, every factor with assumed vs observed. */
function aiMarket(){
  var F=marketFactors(), days=[];
  for(var i=0;i<14;i++){ var m=marketDay(addDays(today(),i),F); days.push(m) }
  return {todayHijri:hijriLabel(today()), hijriSource:"تقويم أم القرى", next14Days:days,
    factors:F.map(function(f){return {name:f.name, active:f.active, needsDates:!!f.needs, inCurrentForecast:f.inBaseline||"no",
      assumption:"غير محدّد", observed:f.observed?{change:f.observed.lift!=null?f.observed.lift-1:null, days:f.observed.inDays, missingDays:f.observed.missingIn, confidence:CONF_AR[f.observed.conf]}:null}}),
    upcomingEvents:marketEvents(ymd(today()),ymd(addDays(today(),90))).filter(function(e){return e.type!=="season"}).map(function(e){return {name:e.name, start:e.start, end:e.end, source:e.source, expectedImpact:"غير محدّد (لا افتراض)"}}),
    enhancedForecast:{on:MARKET.on, note:"تجريبي، مطفأ — لا يغيّر أيّ رقم"}};
}
/** What each advanced feature can rest on right now. */
function aiSufficiency(products){
  var dq=dataQuality();
  return {coveredDays:dq.covered.length, missingDays:dq.missing.length,
    forecast:"يعمل؛ الأصناف بلا تاريخ توقّعها صفر", weekdayPattern:Object.keys(S.days).length<14?"افتراضي (أقلّ من 14 يوماً)":"مخلوط بنمط الفرع",
    similarDays:SIMILAR_DAYS.on?"مشغّل":"مطفأ — يحتاج يومين مشابهين مؤكَّدين على الأقلّ لكلّ يوم",
    eventImpact:"افتراض ما لم يُقس من 3 أيام مؤكَّدة على الأقلّ", offersInOrder:OFFER_DEMAND.on?"مشغّل":"مطفأ",
    productsWithFewObservations:products.filter(function(p){return p.history.observedDays<SIMILAR_DAYS.minObs}).map(function(p){return p.name})};

/** Numbers in a text (Arabic-Indic digits too), with their written decimals. */
function aiNumbers(text){
  var s=westernDigits(String(text||"")).replace(/[٫]/g,".").replace(/(\d),(?=\d{3}\b)/g,"$1");
  var out=[], re=/\d+(?:\.\d+)?/g, m;
  while((m=re.exec(s))){ out.push({raw:m[0], v:parseFloat(m[0]), dec:(m[0].split(".")[1]||"").length}) }
  return out;
}
/**
 * Every number the answer states must come from the context (or the question): as it is, rounded the way it is
 * written, or as a percentage of a ratio. Date parts count. Anything else is listed — shown, never hidden.
 */
function aiValidate(text,context,question){
  var vals=[];
  var walk=function(o){
    if(o==null) return;
    if(typeof o==="number"){ vals.push(o); return }
    if(typeof o==="string"){ aiNumbers(o).forEach(function(n){vals.push(n.v)}); return }
    if(Array.isArray(o)){ o.forEach(walk); return }
    if(typeof o==="object") Object.keys(o).forEach(function(k){ walk(o[k]) });
  };
  walk(context); aiNumbers(question).forEach(function(n){vals.push(n.v)});
  var r=function(v,d){ var f=Math.pow(10,d); return Math.round(v*f)/f };
  var ok=function(n){
    for(var i=0;i<vals.length;i++){
      var v=vals[i], a=Math.abs(v);
      if(r(a,n.dec)===n.v||r(a*100,n.dec)===n.v||r((a-1)*100,n.dec)===n.v||r((1-a)*100,n.dec)===n.v) return true;
    }
    return false;
  };
  var unknown=[];
  aiNumbers(text).forEach(function(n){ if(!ok(n)&&unknown.indexOf(n.raw)<0) unknown.push(n.raw) });
  return {ok:!unknown.length, unknown:unknown, checked:aiNumbers(text).length};
}

/*
 * A reading of the market calendar beside the sales — never a forecast factor by itself.
 *   Hijri dates: the Umm al-Qura calendar built into the browser engine (ICU «islamic-umalqura», offline, no
 *     approximation). Official announcements by moon sighting can differ by a day; dates are labelled with their source.
 *   Calendar: generic rules (MARKET_RULES) — fixed Gregorian dates, Hijri dates, astronomical seasons; anything without
 *     a citable date (school calendar, vacations, exams, Umrah season…) is listed «يحتاج تأكيد» with no dates.
 *   Impact: no rule carries an impact. «Expected» is null until the shop sets one (an assumption, labelled so); «observed»
 *     is measured from the record only — confirmed days, weekday taken out, missing days never read as zero.
 *   Event exists ≠ event has a proven effect. MARKET.on (off) is the experimental enhanced forecast: only effects with
 *     enough confirmed days, shrunk and bounded, and never on a day the shop's own occasion already covers.

  var k=ymd(d); if(HIJ.cache[k]!==undefined) return HIJ.cache[k];
  var out=null;
  try{
    HIJ.fmt=HIJ.fmt||new Intl.DateTimeFormat("en-u-ca-islamic-umalqura-nu-latn",{day:"numeric",month:"numeric",year:"numeric"});
    var o={}; HIJ.fmt.formatToParts(d).forEach(function(p){ if(p.type==="day"||p.type==="month"||p.type==="year") o[p.type]=+westernDigits(p.value) });
    if(o.year&&o.month&&o.day) out={y:o.year, m:o.month, d:o.day};

      // walk the days once, from a month before: where the Umm al-Qura date is the rule's start, an occurrence begins
      for(var d=addDays(F,-35),g=0;ymd(d)<=to&&g<2000;d=addDays(d,1),g++){
        var h=hijriOf(d); if(!h||h.m!==r.hijri[0]||h.d!==r.hijri[1]) continue;
        var end=d;
        if(r.wholeMonth){ var x=addDays(d,1); while(true){ var hx=hijriOf(x); if(!hx||hx.m!==r.hijri[0]) break; end=x; x=addDays(x,1) } }
        else end=addDays(d,(r.days||1)-1);
        add(ymd(d),ymd(end));
      }
    }
  });
  out.sort(function(a,b){return a.start<b.start?-1:a.start>b.start?1:0});
  MKT_CACHE[ck]=out;
  return out.slice();
}
/** Easter Sunday (Gregorian date): the Western one (Anonymous Gregorian algorithm) and the Orthodox one (Meeus, Julian + 13 days). */
function westernEaster(y){ var a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1; return new Date(y,mo-1,da) }
function orthodoxEaster(y){ var a=y%4,b=y%7,c=y%19,d=(19*c+15)%30,e=(2*a+4*b-d+34)%7,mo=Math.floor((d+e+114)/31),da=((d+e+114)%31)+1; return addDays(new Date(y,mo-1,da),y>=2100?14:13) }
function marketEventsOn(k){ return marketEvents(k,k).filter(function(e){return k>=e.start&&k<=e.end}) }

/**
 * What the record says about a set of days: the branch's daily demand on them against the other days, each day
 * divided by its weekday's usual level. Only confirmed / recorded days (missing days are counted as missing, never
 * as zero), and only days before `before` when given (backtest: the past only).
 */
function measureLift(test,before){
  var sp=recordSpan(); if(!sp) return {lift:null, inDays:0, outDays:0, missingIn:0, conf:"insufficient"};
  var to=sp.to; if(before&&before<=to) to=ymd(addDays(parseYmd(before),-1));
  var days=[], missingIn=0;
  datesBetween(sp.from,to).forEach(function(k){
    var d=parseYmd(k), kind=dayKind(k);
    if(kind==="missing"){ if(test(d,k)) missingIn++; return }
    var t=0; S.products.forEach(function(p){ var o=obsOf(p,k); if(o.state!=="missing") t+=o.qty });
    days.push({k:k, d:d, qty:t, isIn:!!test(d,k)});
  });
  var out=days.filter(function(x){return !x.isIn}), inn=days.filter(function(x){return x.isIn});
  var wdSum=[0,0,0,0,0,0,0], wdN=[0,0,0,0,0,0,0];
  out.forEach(function(x){ wdSum[x.d.getDay()]+=x.qty; wdN[x.d.getDay()]++ });
  var all=out.length?mean(out.map(function(x){return x.qty})):0;
  var ratio=function(w){ return wdN[w]>=2&&all>0?(wdSum[w]/wdN[w])/all:1 };
  var adj=function(x){ var r=ratio(x.d.getDay()); return r>0?x.qty/r:x.qty };
  var mi=inn.length?mean(inn.map(adj)):null, mo=out.length?mean(out.map(adj)):null;
  var n=inn.length;
  var conf=n<3||out.length<MARKET.minDays?"insufficient":n<7?"low":n<14?"medium":"good";
  return {lift:mi!=null&&mo>0?mi/mo:null, inDays:n, outDays:out.length, missingIn:missingIn, conf:conf};
}
var CONF_AR={insufficient:"البيانات غير كافية للحكم", low:"ثقة منخفضة", medium:"ثقة متوسّطة", good:"ثقة جيّدة"};
function inRanges(ranges){ return function(d,k){ k=k||ymd(d); for(var i=0;i<ranges.length;i++) if(k>=ranges[i].start&&k<=ranges[i].end) return true; return false } }
/** The market factors: what is active, what the baseline already prices, what the record measured. */
function marketFactors(before){
  var sp=recordSpan(), from=sp?sp.from:ymd(today()), to=ymd(addDays(today(),400));
  var evs=marketEvents(from,to), rows=[];
  MARKET_PERIODS.forEach(function(f){
    var m=measureLift(f.test,before);
    rows.push({id:f.id, name:f.name, type:f.type, active:true, inBaseline:f.inBaseline, expected:null, observed:m});
  });
  var byRule={};
  evs.forEach(function(e){ (byRule[e.rule]=byRule[e.rule]||[]).push(e) });
  MARKET_RULES.forEach(function(r){
    if(r.needs){ rows.push({id:r.id, name:r.name, type:r.type, active:false, needs:true, source:r.source, expected:null, observed:null}); return }
    var list=byRule[r.id]||[];
    rows.push({id:r.id, name:r.name, type:r.type, active:true, source:r.source, dateConf:r.dateConf, expected:null,
      next:list.filter(function(e){return e.end>=ymd(today())}).slice(0,1).map(function(e){return {start:e.start,end:e.end}})[0]||null,
      observed:measureLift(inRanges(list),before)});
  });
  return rows;
}
/** The experimental enhanced forecast: the baseline × effects the record proved (MARKET.on decides if forecast() could use it — it does not, yet). */
function marketMultiplier(d,before,factors){
  var k=ymd(d);
  if(eventsOn(d,S.events).length) return {m:1, used:[]};             // the shop's own occasion already prices this day
  factors=factors||marketFactors(before);
  var on=marketEventsOn(k).map(function(e){return e.rule}), m=1, used=[];
  factors.forEach(function(f){
    if(f.inBaseline||!f.observed||f.observed.lift==null||on.indexOf(f.id)<0) return;
    if(f.observed.conf!=="medium"&&f.observed.conf!=="good") return;
    var n=f.observed.inDays, eff=1+(f.observed.lift-1)*n/(n+MARKET.shrink);
    eff=clamp(eff,MARKET.lo,MARKET.hi); m*=eff; used.push({factor:f.name, effect:eff, days:n});
  });
  return {m:m, used:used};
}
function forecastMarket(p,d,before,factors){ return forecastBase(p,d)*marketMultiplier(d,before,factors).m }

/** One day as the manager sees it: Hijri date, periods, calendar events, the shop's occasions, the branch forecast and why. */
function marketDay(d,factors){
  var k=ymd(d), plist=S.products.filter(function(p){return p.active!==false&&!(OFFER_DEMAND.on&&isOffer(p))});
  factors=factors||marketFactors();
  var periods=MARKET_PERIODS.filter(function(f){return f.test(d)}).map(function(f){return f.name});
  var evs=marketEventsOn(k).map(function(e){
    var f=factors.filter(function(x){return x.id===e.rule})[0], o=f&&f.observed;
    return {name:e.name, source:e.source, status:o&&o.lift!=null&&o.conf!=="insufficient"?"observed":"no-proven-effect", lift:o?o.lift:null, days:o?o.inDays:0, conf:o?o.conf:"insufficient"};
  });
  var own=eventsOn(d,S.events).map(function(e){return {name:e.name, factor:+e.mult||1, measured:observedLift(e)}});
  var total=0; plist.forEach(function(p){ total+=forecast(p,d) });
  var why=["نمط يوم "+DOW_AR[d.getDay()]+" ×"+Math.round(S.dowIndex[d.getDay()]*100)/100+(S.dowIndex.every(function(v,i){return Math.abs(v-DEFAULT_DOW[i])<1e-12})?" (افتراض: "+marketPattern()+")":""),
           "موضع الشهر والراتب ×"+Math.round(payFactor(d)*100)/100+" (افتراض: منحنى ثابت)",
           "مستوى كلّ صنف من مبيعاته الأخيرة"];
  own.forEach(function(o){ why.push("مناسبتك «"+o.name+"» ×"+o.factor+(o.measured?" (المقيس ×"+Math.round(o.measured.lift*100)/100+")":" (افتراض)")) });
  if(!own.length) why.push(evs.length?"لا أثر مثبت لمناسبات التقويم في هذا اليوم — لا تدخل التوقّع":"لا مناسبة");
  return {date:k, weekday:DOW_AR[d.getDay()], hijri:hijriLabel(d), periods:periods, events:evs, ownEvents:own, forecast:total, why:why};
}

/* ===================== offers in the record: normalized product demand ===================== */
/** One product's demand with the offers that contain it added back: own sales + Σ offer sales × quantity. */
function normalizedInsight(p,range){
  var R=insightRange(range), lst=offerMap().map[p.id]||[], own=0, fromOffers=0, days=0;
  var offerById={}; S.products.forEach(function(o){offerById[o.id]=o});
  R.dates.forEach(function(k){
    var o=obsOf(p,k); if(o.state==="missing") return;
    days++; own+=o.qty;
    lst.forEach(function(x){ var of=offerById[x.offer]; if(!of) return; var oo=obsOf(of,k); if(oo.state!=="missing") fromOffers+=oo.qty*x.qty });
  });
  return {pid:p.id, name:p.name, days:days, own:own, fromOffers:fromOffers, normalized:own+fromOffers, share:own+fromOffers>0?fromOffers/(own+fromOffers):0,
          offers:lst.map(function(x){return {offer:(offerById[x.offer]||{}).name, qty:x.qty}})};
}
/** Each offer's own sales (kept for offer analysis), and what it brings to its products. */
function offerInsight(range){
  var om=offerMap(), byId={}; S.products.forEach(function(p){byId[p.id]=p});
  var contents={};
  Object.keys(om.map).forEach(function(pid){ om.map[pid].forEach(function(x){ (contents[x.offer]=contents[x.offer]||[]).push({product:(byId[pid]||{}).name, qty:x.qty}) }) });
  return Object.keys(om.offers).map(function(id){
    var p=byId[id], pi=productInsight(p,range);
    return {name:p.name, unit:unitOf(p), total:pi.total, avg:pi.avg, observed:pi.observed, trend:pi.trend, contents:contents[id]||[]};
  }).sort(function(a,b){return b.total-a.total});
}
