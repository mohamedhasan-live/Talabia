<style>
:root{ --r:12px; --r-sm:8px; }

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
}
.num{font-family:"IBM Plex Mono","IBM Plex Sans Arabic",ui-monospace,monospace; font-variant-numeric:tabular-nums; direction:ltr; unicode-bidi:isolate}
h1,h2,h3{font-family:"IBM Plex Sans Arabic","Segoe UI",sans-serif; margin:0; text-wrap:balance; line-height:1.3; font-weight:600}
/* The wordmark, set in whatever register the shop's own logo uses. */
.mark{
  font-family:var(--mark-font); font-style:var(--mark-style); font-weight:var(--mark-weight);
  font-size:var(--mark-size); letter-spacing:var(--mark-spacing);
  color:var(--accent-ink); line-height:1;
  direction:ltr; unicode-bidi:isolate; white-space:nowrap;
}

/* ---------- shell ---------- */
/*
 * The page runs the full width of the window. On a desk monitor that width is
 * useful: order rows stop wrapping, tables stop scrolling sideways, and the
 * card grids gain columns. Running prose is capped separately below, because a
 * paragraph a metre wide is unreadable however big the screen is.
 */
.app{max-width:none; margin:0 auto; padding-inline:clamp(16px,2.5vw,40px); padding-block:0 96px}
@media (min-width:1800px){ .app{max-width:1760px} }
header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  margin-inline:calc(-1 * clamp(16px,2.5vw,40px)); padding-inline:clamp(16px,2.5vw,40px);
  padding-block:12px 0;
  border-bottom:1px solid var(--line);
}
/* The app's mark and name on top, the open brand and branch beneath. */
.brand{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.applogo{width:40px; height:40px; flex:none; border-radius:11px; overflow:hidden; box-shadow:var(--shadow)}
.applogo svg{width:100%; height:100%; display:block}
.titles{display:flex; flex-direction:column; gap:3px; min-width:0}
.apptitle{font-size:18px; font-weight:700; line-height:1.15; color:var(--ink); letter-spacing:-.01em; direction:ltr; unicode-bidi:isolate}
.subline{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.subline .mark{font-size:12px}
.brand .sub{font-size:12px; color:var(--ink-3); letter-spacing:.02em}
.brand .sub::before{content:""; display:inline-block; width:1px; height:11px; background:var(--line-strong); margin-inline-end:8px; vertical-align:-1px}
.brand .spacer{flex:1}
.datechip{display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:99px;
  background:var(--accent-soft); border:1px solid var(--accent-line); color:var(--accent-ink); font-size:12.5px; font-weight:600}
.themebtn{
  border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink-2);
  border-radius:9px; width:36px; height:36px; cursor:pointer; line-height:1;
  display:grid; place-items:center; transition:background .15s, color .15s, border-color .15s;
}
.themebtn:hover{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent-line)}

nav.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; margin-top:10px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  appearance:none; border:0; background:transparent; color:var(--ink-3);
  font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
  padding:9px 13px 11px; white-space:nowrap; border-bottom:2px solid transparent;
  margin-bottom:-1px; transition:color .15s;
  display:inline-flex; align-items:center; gap:7px;
}
nav.tabs button svg{width:15px; height:15px; flex:none}
nav.tabs button:hover{color:var(--ink-2)}
nav.tabs button[aria-selected="true"]{color:var(--accent-ink); border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; border-radius:4px}

/* ---------- generic ---------- */
.banner{
  display:flex; gap:12px; align-items:flex-start; flex-wrap:wrap;
  background:var(--warn-soft); border:1px solid var(--warn-line);
  border-radius:var(--r); padding:12px 14px; margin-top:16px; font-size:13.5px; color:var(--ink);
}
.banner b{color:var(--warn)}
.banner .grow{flex:1; min-width:180px}
.banner .acts{display:flex; gap:8px; flex-wrap:wrap}

.section-head{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin:26px 0 12px}
.section-head h2{font-size:15px; font-weight:600; letter-spacing:.01em}
.section-head .note{font-size:12.5px; color:var(--ink-3); flex:1}
.section-head > .btn:last-child{margin-inline-start:auto}

button.btn{
  font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer;
  border-radius:var(--r-sm); padding:8px 14px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--ink); transition:background .15s,border-color .15s;
}
button.btn:hover{background:var(--surface-2)}
button.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
button.btn.primary:hover{filter:brightness(1.08)}
button.btn.ghost{border-color:transparent; background:transparent; color:var(--ink-2); padding-inline:8px}
button.btn.ghost:hover{background:var(--surface-2)}
button.btn.danger{border-color:var(--crit-line); color:var(--crit); background:transparent}
button.btn.danger:hover{background:var(--crit-soft)}
button.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
button.btn:disabled{opacity:.45; cursor:not-allowed}

input,select{
  font-family:inherit; font-size:14px; color:var(--ink); background:var(--surface);
  border:1px solid var(--line-strong); border-radius:var(--r-sm); padding:7px 10px; width:100%;
}
input:focus,select:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
label.fld{display:flex; flex-direction:column; gap:5px; font-size:12px; color:var(--ink-3); font-weight:600}
label.fld input, label.fld select{font-weight:400; color:var(--ink)}

.chip{
  display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:600;
  padding:2px 8px; border-radius:99px; border:1px solid var(--line-strong);
  color:var(--ink-2); background:var(--surface-2); white-space:nowrap;
}
.chip.a{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent-ink)}
.chip.w{background:var(--warn-soft); border-color:var(--warn-line); color:var(--warn)}
.chip.c{background:var(--crit-soft); border-color:var(--crit-line); color:var(--crit)}
.chip.k{background:var(--calm-soft); border-color:transparent; color:var(--calm)}

/* ---------- order header strip ---------- */
.plan{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  box-shadow:var(--shadow); margin-top:16px; overflow:hidden;
}
.plan .hd{padding:16px 16px 14px; border-bottom:1px solid var(--line); display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start}
.plan .hd .who{flex:1; min-width:200px}
.plan .hd .kicker{font-size:11px; font-weight:700; letter-spacing:.09em; color:var(--ink-3); text-transform:uppercase}
.plan .hd h2{font-size:19px; margin-top:3px}
.plan .hd .win{font-size:13px; color:var(--ink-2); margin-top:6px}
.daystrip{display:flex; gap:5px; margin-top:9px; flex-wrap:wrap}
.daystrip span{
  font-size:11.5px; font-weight:600; padding:3px 9px; border-radius:6px;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line);
}
.daystrip span.peak{background:var(--warn-soft); border-color:var(--warn-line); color:var(--warn)}
.daystrip span.pay{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent-ink)}

.totals{display:grid; grid-template-columns:repeat(auto-fit,minmax(112px,1fr)); border-top:1px solid var(--line)}
.totals>div{padding:12px 16px; border-inline-start:1px solid var(--line)}
.totals>div:first-child{border-inline-start:0}
.totals .lbl{font-size:11px; color:var(--ink-3); font-weight:600; letter-spacing:.03em}
.totals .lbl, .totals .val{text-align:right}
.totals .val{font-size:20px; font-weight:600; margin-top:2px; font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace; font-variant-numeric:tabular-nums; direction:ltr}
.totals .val small{font-size:11px; color:var(--ink-3); font-family:"IBM Plex Sans Arabic",sans-serif}

/* ---------- product rows ---------- */
/* On a wide window the order sheet becomes two columns of rows, so a 14-item
   order is visible without scrolling. */
.rows{display:flex; flex-direction:column; gap:8px; margin-top:14px}
@media (min-width:1500px){
  .rows{display:grid; grid-template-columns:1fr 1fr; align-items:start}
}
.row{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r);
  padding:12px 14px; display:grid; gap:10px;
  grid-template-columns:1fr auto; align-items:start;
}
.row.flag{border-color:var(--warn-line)}
.row .name{font-weight:600; font-size:14.5px; line-height:1.35}
.row .meta{display:flex; gap:5px; flex-wrap:wrap; margin-top:6px}
.row .ctl{display:flex; gap:10px; align-items:flex-end}
.stockbox{display:flex; flex-direction:column; gap:4px; width:76px}
.stockbox .cap{font-size:10.5px; color:var(--ink-3); font-weight:600; text-align:center}
.stockbox input{text-align:center; padding:6px 4px; font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace; font-variant-numeric:tabular-nums}
.qtybox{display:flex; flex-direction:column; gap:4px; align-items:center}
.qtybox .cap{font-size:10.5px; color:var(--ink-3); font-weight:600}
.qtybox .unit{font-size:11px; color:var(--ink-2); font-weight:600; letter-spacing:.2px}
.stepper{display:flex; align-items:stretch; border:1px solid var(--line-strong); border-radius:var(--r-sm); overflow:hidden; background:var(--surface)}
[dir="ltr"] .stepper{flex-direction:row-reverse}   /* English: − on the left, + on the right */
.stepper button{
  width:30px; border:0; background:var(--surface-2); color:var(--ink-2); cursor:pointer;
  font-size:16px; font-family:inherit; line-height:1; display:grid; place-items:center;
}
.stepper button:hover{background:var(--surface-3); color:var(--ink)}
.stepper input{
  width:58px; border:0; border-radius:0; text-align:center; font-size:17px; font-weight:600;
  font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace; font-variant-numeric:tabular-nums; padding:6px 2px; background:transparent;
}
.stepper input:focus{outline:2px solid var(--accent); outline-offset:-2px}
.stepper.edited{border-color:var(--calm); box-shadow:inset 0 0 0 1px var(--calm)}

.cover{grid-column:1 / -1; display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding-top:2px}
.cover svg{display:block; flex:0 0 auto; max-width:100%}
.cover .why{font-size:11.5px; color:var(--ink-3); flex:1; min-width:160px; line-height:1.6}
.cover .why b{color:var(--ink-2); font-weight:600}

@media (max-width:520px){
  .row{grid-template-columns:1fr}

}

/* ---------- tables ---------- */
.tablewrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
table{border-collapse:collapse; width:100%; min-width:520px; font-size:13.5px}
th,td{padding:9px 12px; text-align:start; border-bottom:1px solid var(--line); white-space:nowrap}
th{font-size:11px; font-weight:700; color:var(--ink-3); letter-spacing:.04em; background:var(--surface-2)}
tbody tr:last-child td{border-bottom:0}
/*
 * Numbers carry direction:ltr so a sign, a slash or a decimal point keeps its
 * order — but that flips what `start` means, and the value would drift away
 * from its own right-aligned Arabic header. Aligning them to the right edge
 * explicitly puts every figure directly under the column it belongs to.
 */
td.n{font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace; font-variant-numeric:tabular-nums; direction:ltr; text-align:right}
td input{padding:5px 7px; font-size:13px; text-align:center; font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace}
td .w70{width:70px} td .w90{width:90px}
td .w130{width:100%; max-width:360px; text-align:start; font-family:inherit}
/* The label column absorbs the spare width so the data columns pack tight
   against their headers instead of being stretched apart on a wide screen. */
table th:first-child, table td:first-child{width:99%}
table th:not(:first-child), table td:not(:first-child){white-space:nowrap}
input[type="checkbox"]{width:auto; accent-color:var(--crit); transform:scale(1.15); cursor:pointer}
input[type="range"]{
  padding:0; border:0; background:transparent; accent-color:var(--accent);
  cursor:pointer; height:22px;
}
input[type="range"]:focus{outline:2px solid var(--accent); outline-offset:3px; border-radius:4px}

.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 14px}
.card .lbl{font-size:11.5px; color:var(--ink-3); font-weight:600}
.card .val{font-size:24px; font-weight:600; font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace; font-variant-numeric:tabular-nums; direction:ltr; text-align:right; margin-top:3px; line-height:1.15}
.card .hint{font-size:11.5px; color:var(--ink-3); margin-top:4px; line-height:1.5}
.card.good .val{color:var(--accent-ink)} .card.warn .val{color:var(--warn)} .card.bad .val{color:var(--crit)}

.stack{display:flex; flex-direction:column; gap:8px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
/* Running prose stays at a readable measure however wide the window gets. */
.muted{color:var(--ink-3); font-size:12.5px; line-height:1.6; max-width:96ch}
.section-head .note{max-width:96ch}
.banner .grow{max-width:110ch}
.plan .hd .win{max-width:80ch}
.empty{text-align:center; padding:40px 20px; color:var(--ink-3); font-size:13.5px}
hr.sep{border:0; border-top:1px solid var(--line); margin:22px 0}

.footbar{
  position:fixed; inset-inline:0; bottom:0; z-index:30;
  background:color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));
}
.footbar{padding-inline:clamp(16px,2.5vw,40px)}
.footbar .inner{max-width:1760px; margin:0 auto; display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.footbar .sum{flex:1; min-width:150px; font-size:12.5px; color:var(--ink-2); line-height:1.4}
.footbar .sum b{font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace; font-variant-numeric:tabular-nums; color:var(--ink); font-size:14px}

.toast{
  position:fixed; inset-inline:0; bottom:calc(74px + env(safe-area-inset-bottom,0px)); z-index:60;
  display:flex; justify-content:center; pointer-events:none; padding-inline:16px;
}

  background:var(--ink); color:var(--bg); font-size:13px; font-weight:600;
  padding:9px 16px; border-radius:99px; box-shadow:var(--shadow-lift);
  opacity:0; transform:translateY(8px); transition:opacity .2s, transform .2s;
}

/* ---------- brands & branches ---------- */
.branchpick{

  padding:4px 12px; cursor:pointer;
}

<script>
"use strict";
document.documentElement.setAttribute("lang","ar");
document.documentElement.setAttribute("dir","rtl");

/* ===================== language: Arabic as built, English as a layer over it =====================
 * The screens are written in Arabic and stay exactly so in Arabic. In English, everything the page shows —
 * text, titles, placeholders, dialogs, toasts — passes through one dictionary (src/i18n-en.json, injected
 * at build as window.I18N_EN): a whole text first, then its known fragments (longest first, whole words).
 * What the shop typed — product, branch, material, occasion and user names — is left as written.
 * The layout turns left-to-right. Nothing in the logic or the data changes with the language.
 */
var LANG=(function(){ try{ return localStorage.getItem("talabia-lang")==="en"?"en":"ar" }catch(e){ return "ar" } })();
var I18N=null;
function i18nPrep(){
  if(I18N) return I18N;
  var d=window.I18N_EN||{};
  var subs=Object.keys(d).filter(function(k){return k.replace(/[^ء-ي]/g,"").length>=3}).sort(function(a,b){return b.length-a.length});
  var rx=function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")};
  // a piece is only taken whole: where it starts or ends on a letter, the letter beside it must not be Arabic
  var L="\\u0621-\\u064A\\u064B-\\u0652", isL=/[ء-يً-ْ]/;
  var alt=subs.map(function(k){ return (isL.test(k.charAt(0))?"(?<!["+L+"])":"")+rx(k)+(isL.test(k.charAt(k.length-1))?"(?!["+L+"])":"") });
  I18N={dict:d, re:alt.length?new RegExp(alt.join("|"),"g"):null};
  return I18N;
}
/** The names the shop typed: never translated. Refreshed on every render. */
var I18N_KEEP=[];
function i18nKeepRefresh(){
  var out={}, add=function(s){ s=String(s==null?"":s).trim(); if(s&&/[؀-ۿ]/.test(s)) out[s]=1 };
  try{
    (window.S&&S.products||[]).forEach(function(p){add(p.name); (p.aliases||[]).forEach(add)});

function tr(s){
  if(LANG!=="en"||s==null) return s;
  s=String(s);
  if(!/[؀-ۿ]/.test(s)) return s;
  s=s.replace(/[\u2068\u2069]/g,"");   // isolation marks from an earlier pass, set again below
  var I=i18nPrep(), core=s.trim();
  if(I18N_KEEP.indexOf(core)>=0) return s;
  if(I.dict[core]!=null) return s.replace(core,I.dict[core]);
  // the shop's own names inside a sentence are set aside first, and put back untouched
  var kept=[], out=s;
  I18N_KEEP.forEach(function(k){ if(out.indexOf(k)>=0){ out=out.split(k).join(""+kept.length+""); kept.push(k) } });
  if(I.re) out=out.replace(I.re,function(m){ return I.dict[m] });
  // the short words the pieces above leave between numbers: a day's initial, «9ي» days, «من» / «في»
  out=out.replace(/(^|[^ء-ْ])([حنثرخجس])(?= ?\d|$)/g,function(m,p,c){ return p+{"ح":"Su","ن":"Mo","ث":"Tu","ر":"We","خ":"Th","ج":"Fr","س":"Sa"}[c] })
    .replace(/(\d|\/) ?ي(?![ء-ْ])/g,"$1d")
    .replace(/(^|[^ء-ْ])من(?= \d+(:\d\d)? ?(AM|PM))/g,"$1from")
    .replace(/(^|[^ء-ْ])من(?= \d)/g,"$1of")
    .replace(/(^|[^ء-ْ])في(?= \d)/g,"$1in");
  out=out.replace(/،/g,",").replace(/؛/g,";").replace(/؟/g,"?").replace(/٪/g,"%")
    .replace(/(^|[^\d.])(\d+(?:\.\d+)?) (day|product|item|material|branch|row)(?![a-z])/g,function(m,p,n,w){ return p+n+" "+(+n===1?w:w==="branch"?"branches":w+"s") });
  // a name kept in Arabic sits isolated, so the «» around it and the English beside it keep their order
  return kept.length?out.replace(/(\d+)/g,function(m,i){return "\u2068"+kept[+i]+"\u2069"}):out;
}
var I18N_ATTRS=["title","placeholder","aria-label"];
function trNode(root){
  if(LANG!=="en"||!root) return;
  if(root.nodeType===3){ var v=tr(root.nodeValue); if(v!==root.nodeValue) root.nodeValue=v; return }
  if(root.nodeType!==1) return;
  if(/^(SCRIPT|STYLE|TEXTAREA)$/.test(root.tagName)) return;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    var p=n.parentNode; return p&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.tagName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT }});
  var n, list=[]; while((n=w.nextNode())) if(/[؀-ۿ]/.test(n.nodeValue)) list.push(n);
  list.forEach(function(t){ var v=tr(t.nodeValue); if(v!==t.nodeValue) t.nodeValue=v });
  var els=[root].concat(Array.prototype.slice.call(root.querySelectorAll("[title],[placeholder],[aria-label]")));
  els.forEach(function(el){ I18N_ATTRS.forEach(function(a){ var v=el.getAttribute&&el.getAttribute(a); if(v&&/[؀-ۿ]/.test(v)){ var t=tr(v); if(t!==v) el.setAttribute(a,t) } }) });

/**

  if(ov!=null&&ov!=="") return clamp(+ov,0.05,0.95);

  for(var i=0;i<HOUR_W.length;i++){tot+=HOUR_W[i][1]; if(HOUR_W[i][0]>=hour) after+=HOUR_W[i][1]}

/* ===================== math ===================== */
/* ===================== units of measure ===================== */
/*
 * A shop does not sell everything the same way: bites go by the piece, sauce
 * goes by the kilo. Every product carries its own unit, written by the shop in
 * its own words, and every number on screen is spoken in that unit.
 *
 * Two consequences the code must respect:
 *  - A countable unit rounds to a whole number; a weight or a volume does not,
 *    because 2.5 kg is a real order and 2.5 pieces is not.
 *  - Totals across products are grouped BY unit, never added together: adding
 *    kilos to pieces produces a number that means nothing.
 */
var DEFAULT_UNIT="حبة";
var COUNTABLE_UNIT=/^\s*(حبة|حبه|حبات|قطعة|قطعه|قطع|علبة|علبه|علب|كرتون|كرتونة|صينية|صينيه|كيس|أكياس|اكياس|طبق|كوب|باكيت|درزن|دستة|piece|pieces|pcs|pc|box|boxes|tray|unit|units)\s*$/i;

function unitOf(p){
  var u=p&&p.unit!=null?String(p.unit).trim():"";
  return u||DEFAULT_UNIT;
}
function isCountable(p){ return COUNTABLE_UNIT.test(unitOf(p)) }
/** Round a quantity the way its unit deserves. */
function qtyRound(p,v){
  return isCountable(p)?Math.round(v):Math.round(v*10)/10;
}
/**
 * A quantity as text. Thousands are separated, and a decimal is kept only when
 * it carries meaning — 23.5 كجم must not be printed as 24.
 */
function numText(n){
  var r=Math.abs(n-Math.round(n))<0.05?Math.round(n):Math.round(n*10)/10;
  return r.toLocaleString("en-US",{maximumFractionDigits:1});
}
/** Print a number with its unit: "63 حبة" / "2.5 كجم". */
function qty(p,v){ return numText(qtyRound(p,v))+" "+unitOf(p) }
/** Total a list of {p, v} grouped by unit, because mixing them is meaningless. */
function totalsByUnit(rows){
  var m={}, order=[];
  rows.forEach(function(r){
    if(!r||!r.p) return;
    var u=unitOf(r.p);
    if(m[u]==null){m[u]=0; order.push(u)}
    m[u]+=(+r.v||0);
  });
  return order.map(function(u){return {unit:u, total:m[u]}});
}
/** "980 حبة · 23.5 كجم" */
function fmtTotals(list,opts){
  if(!list.length) return "—";
  var bold=opts&&opts.bold;
  return list.map(function(t){
    var num=numText(t.total);
    return (bold?"<b>"+num+"</b>":num)+" "+esc(t.unit);
  }).join(" · ");
}
/** The one unit a set of products shares, or null when they differ. */
function commonUnit(list){
  var u=null;
  for(var i=0;i<list.length;i++){
    var x=unitOf(list[i]);
    if(u===null) u=x; else if(u!==x) return null;
  }
  return u;
}

/** Inverse standard-normal CDF (Acklam's rational approximation). */
function probit(p){
  if(p<=0)return -6; if(p>=1)return 6;
  var a=[-3.969683028665376e1,2.209460984245205e2,-2.759285104469687e2,1.383577518672690e2,-3.066479806614716e1,2.506628277459239e0];
  var b=[-5.447609879822406e1,1.615858368580409e2,-1.556989798598866e2,6.680131188771972e1,-1.328068155288572e1];
  var c=[-7.784894002430293e-3,-3.223964580411365e-1,-2.400758277161838e0,-2.549732539343734e0,4.374664141464968e0,2.938163982698783e0];
  var d=[7.784695709041462e-3,3.224671290700398e-1,2.445134137142996e0,3.754408661907416e0];
  var pl=0.02425,q,r;
  if(p<pl){q=Math.sqrt(-2*Math.log(p));
    return (((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  if(p>1-pl){q=Math.sqrt(-2*Math.log(1-p));
    return -(((((c[0]*q+c[1])*q+c[2])*q+c[3])*q+c[4])*q+c[5])/((((d[0]*q+d[1])*q+d[2])*q+d[3])*q+1);}
  q=p-0.5;r=q*q;
  return (((((a[0]*r+a[1])*r+a[2])*r+a[3])*r+a[4])*r+a[5])*q/(((((b[0]*r+b[1])*r+b[2])*r+b[3])*r+b[4])*r+1);
}

/* ===================== seasonality ===================== */
/** Salary-cycle multiplier by day of month (Saudi pay lands ~27th onward). */
var PAY_CURVE = (function(){
  var v=[];
  for(var day=1;day<=31;day++){
    var f;
    if(day<=5)       f=1.20;
    else if(day<=10) f=1.05;
    else if(day<=15) f=0.95;
    else if(day<=20) f=0.86;
    else if(day<=24) f=0.80;
    else if(day<=26) f=0.96;
    else             f=1.26;
    v.push(f);
  }
  var mean=avg(v.slice(0,30));
  return v.map(function(x){return x/mean});
})();
function payFactor(d){return PAY_CURVE[Math.min(d.getDate(),31)-1]}
function payLabel(d){
  var day=d.getDate();
  if(day>=27||day<=5) return "بعد الراتب";
  if(day>=21&&day<=24) return "آخر الشهر (ركود)";
  return null;
}
function eventFactor(d,events){
  var f=1,s=ymd(d);
  for(var i=0;i<events.length;i++){
    var e=events[i];
    if(!e.from||!e.to) continue;
    if(s>=e.from&&s<=e.to) f*=(+e.mult||1);
  }
  return f;
}
function eventsOn(d,events){
  var s=ymd(d),out=[];
  for(var i=0;i<events.length;i++){var e=events[i];if(e.from&&e.to&&s>=e.from&&s<=e.to)out.push(e)}
  return out;
}

];
function kindOf(k){

  return EVENT_KINDS[EVENT_KINDS.length-1];

/**
 * What the occasion ACTUALLY did, measured from the record: average demand
 * during its days against the ordinary baseline, both stripped of the
 * day-of-week and salary effects so only the occasion is left.
 */
function observedLift(ev){
  if(!ev.from||!ev.to) return null;
  var hist=historyAsc(), during=[], base=[];
  for(var i=0;i<hist.length;i++){
    var rec=hist[i], d=parseYmd(rec.date), tot=0;
    for(var pid in rec.items) tot+=demandOf(rec.items[pid]);
    if(tot<=0) continue;
    var seas=S.dowIndex[d.getDay()]*payFactor(d);
    if(seas<=0) continue;
    var des=tot/seas, s=ymd(d);
    if(s>=ev.from&&s<=ev.to) during.push(des); else base.push(des);
  }
  if(during.length<1||base.length<10) return null;
  var b=avg(base);
  return b>0?{lift:avg(during)/b, days:during.length}:null;
}

/* ===================== learning ===================== */
/** Sales on a stockout day understate real demand — lift them back up. */
function demandOf(e){
  if(!e) return 0;
  var sold=+e.sold||0;
  // A flag recorded while tracking was on still counts after it is switched off.
  if(e.stockout){
    if(e.lost>0) return sold+(+e.lost);
    return sold/0.82;
  }
  return sold;
}
/**
 * Is this a sales observation? Sold recorded (a quantity, 0 included: a confirmed zero) — yes.
 * No entry, or an entry with only waste / a stockout tick and no sold typed — missing data, left out.
 */
function hasSold(e){ return !!e&&e.sold!=null&&e.sold!=="" }
function historyAsc(){
  return Object.keys(S.days).sort().map(function(k){return S.days[k]});
}
/** Pooled day-of-week index, shrunk toward the Riyadh baseline until data earns its weight. */
function learnDow(){
  var hist=historyAsc();
  if(hist.length<14){S.dowIndex=DEFAULT_DOW.slice();return}
  var buckets=[[],[],[],[],[],[],[]];
  for(var i=0;i<hist.length;i++){
    var rec=hist[i], d=parseYmd(rec.date), tot=0;
    for(var pid in rec.items) tot+=demandOf(rec.items[pid]);
    if(tot<=0) continue;
    var deseason=payFactor(d)*eventFactor(d,S.events);
    if(deseason>0) buckets[d.getDay()].push(tot/deseason);
  }
  var means=buckets.map(function(b){return b.length?avg(b):null});
  if(means.some(function(m){return m===null})){S.dowIndex=DEFAULT_DOW.slice();return}
  var gm=avg(means);
  if(gm<=0){S.dowIndex=DEFAULT_DOW.slice();return}
  var w=clamp(hist.length/56,0,1);   // full confidence at 8 weeks of data
  var raw=means.map(function(m,i){return w*(m/gm)+(1-w)*DEFAULT_DOW[i]});
  var norm=avg(raw);
  S.dowIndex=raw.map(function(x){return x/norm});
}
/** Per-product level (EWMA of deseasonalised demand) and forecast error spread. */
function learnProducts(){
  var hist=historyAsc();
  S.model={};
  for(var pi=0;pi<S.products.length;pi++){
    var p=S.products[pi], base=null, errs=[], n=0;
    for(var i=0;i<hist.length;i++){
      var rec=hist[i], e=rec.items?rec.items[p.id]:null;
      if(!hasSold(e)) continue;                    // missing data is not an observation
      var d=parseYmd(rec.date);
      var seas=S.dowIndex[d.getDay()]*payFactor(d)*eventFactor(d,S.events);
      if(seas<=0) continue;
      var dem=demandOf(e), des=dem/seas;
      if(base===null){base=des}
      else{
        errs.push(dem-base*seas);
        // A young branch is still climbing, and a settled one is not. Early
        // points get a heavy weight so the level tracks the last few days
        // instead of being anchored to opening week; it relaxes to a steady
        // 0.25 once there are about a dozen days to lean on.
        var alpha=Math.max(0.25,2/(n+2));
        base=alpha*des+(1-alpha)*base;
      }
      n++;
    }
    if(base===null){S.model[p.id]={base:0,sigma:0,n:0};continue}
    var sigma;
    if(errs.length>=6){sigma=Math.sqrt(sum(errs.map(function(x){return x*x}))/errs.length)}
    else{sigma=base*0.45}
    // never let the model get overconfident on a dessert counter
    sigma=Math.max(sigma,base*0.18);
    S.model[p.id]={base:base,sigma:sigma,n:n};
  }
}
function relearn(){learnDow();learnProducts();learnSimilar()}

/** The current forecast, unchanged: level × weekday × salary × occasion. */
function forecastBase(p,d){
  var m=S.model[p.id];
  if(!m||!m.base) return 0;
  return m.base*S.dowIndex[d.getDay()]*payFactor(d)*eventFactor(d,S.events);
}

/* ===================== similar days ===================== */
/**
 * Similar Days — a second opinion from the product's ACTUAL sales on past days that looked like the target day
 * (same weekday first, then where in the month / how near payday, then recency), blended into the current
 * forecast by how much evidence there is. No fixed multiplier: the signal is the sales themselves.
 *   candidates  covered days only (an import record with complete:true), strictly before the target day and before
 *               today; on such a day a product the file does not list sold 0 (the Odoo report is the whole branch,
 *               sold items only); a day with no file is missing data and never a candidate. Days before a product's
 *               first recorded sale are before it existed, not zeros.
 *   occasions   a target on an occasion looks at that occasion's days only; an ordinary target never at occasion days.
 *   blend       final = (1−λ)·base + λ·signal, λ = Neff/(Neff+k); λ=0 below minNeff similar days or minObs observations.
 * `on` decides whether forecast() uses it; similarDays() itself always works, for the backtest and the explanation.
 */
var SIMILAR_DAYS={on:false, w:{dow:0.45, pay:0.25, month:0.15, recency:0.15}, minScore:0.55, k:3, minNeff:2, minObs:5, recencyDays:21};
var SD={covered:[], first:{}};
function learnSimilar(){
  var keys=Object.keys(S.days).sort(), first={};
  SD.covered=keys.filter(function(k){ var c=coverageOf(k); return !!(c&&c.complete) });
  S.products.forEach(function(p){
    for(var i=0;i<keys.length;i++){ var it=S.days[keys[i]].items; if(it&&hasSold(it[p.id])){ first[p.id]=keys[i]; break } }
  });
  SD.first=first;
}
function sdDowGroup(w){ return w===4||w===5?"we":w<=2?"early":"w"+w }
function sdMonthPart(d){ var x=d.getDate(); return x<=10?0:x<=20?1:2 }
/** Days since the last payday (the 27th). */
function sdPayPhase(d){
  var x=d.getDate();
  if(x>=27) return x-27;
  var prevLen=new Date(d.getFullYear(),d.getMonth(),0).getDate();
  return x+prevLen-27;
}
function sdEventMatch(target,cand){
  var et=eventsOn(target,S.events), ec=eventsOn(cand,S.events);
  if(!et.length) return ec.length?null:1;               // an ordinary day never borrows an occasion's sales
  for(var i=0;i<et.length;i++) for(var j=0;j<ec.length;j++)
    if(et[i].id===ec[j].id||(et[i].kind&&et[i].kind===ec[j].kind)) return 1;
  return null;
}
function similarDays(p,d,base,opt){
  var o=Object.assign({},SIMILAR_DAYS,opt||{}), w=o.w;
  if(base==null) base=forecastBase(p,d);
  var target=ymd(d), now=ymd(today()), first=SD.first[p.id], m=S.model[p.id]||{n:0};
  var days=[];
  SD.covered.forEach(function(k){
    if(k>=target||k>=now) return;                       // only what was known before the target day
    if(!first||k<first) return;                           // before the product existed: not a zero
    var rec=S.days[k]; if(!rec) return;
    var cd=parseYmd(k);
    if(!sdEventMatch(d,cd)) return;
    var e=rec.items?rec.items[p.id]:null;
    var qty=hasSold(e)?demandOf(e):0;                     // covered day, not listed = sold 0
    var dPhase=Math.abs(sdPayPhase(d)-sdPayPhase(cd)); dPhase=Math.min(dPhase,Math.max(0,30-dPhase));   // the pay cycle wraps
    var parts={
      dow: cd.getDay()===d.getDay()?1:sdDowGroup(cd.getDay())===sdDowGroup(d.getDay())?0.3:0,
      month: sdMonthPart(cd)===sdMonthPart(d)?1:0,
      pay: Math.max(0,1-dPhase/10),
      recency: Math.exp(-Math.round((d-cd)/864e5)/o.recencyDays)
    };
    var score=w.dow*parts.dow+w.month*parts.month+w.pay*parts.pay+w.recency*parts.recency;
    days.push({date:k, dow:cd.getDay(), qty:qty, listed:hasSold(e), score:score, parts:parts});
  });
  days.sort(function(a,b){return b.score-a.score||(a.date<b.date?1:-1)});
  var use=days.filter(function(x){return x.score>=o.minScore});
  var sw=sum(use.map(function(x){return x.score})), sw2=sum(use.map(function(x){return x.score*x.score}));
  var signal=sw>0?sum(use.map(function(x){return x.score*x.qty}))/sw:null;
  var neff=sw2>0?sw*sw/sw2:0;
  var why=signal==null?"no-similar-days":neff<o.minNeff?"too-few-similar-days":m.n<o.minObs?"few-observations":"";
  var lambda=why?0:neff/(neff+o.k);
  return {base:base, signal:signal, neff:neff, lambda:lambda, why:why,
          final:lambda>0?(1-lambda)*base+lambda*signal:base, days:use, candidates:days.length};
}

function forecast(p,d){
  var base=forecastBase(p,d);
  if(!SIMILAR_DAYS.on||!base) return base;
  return similarDays(p,d,base).final;
}

/* ===================== order engine ===================== */
function nextOrderDay(from){
  var days=S.cfg.orderDays.slice().sort();
  if(!days.length) days=[0,3];
  for(var i=1;i<=7;i++){var d=addDays(from,i); if(days.indexOf(d.getDay())>=0) return d}
  return addDays(from,7);
}
function isOrderDay(d){return S.cfg.orderDays.indexOf(d.getDay())>=0}

/** Each order day may carry its own lead time and arrival hour; otherwise the shop default. */
function dayCfgFor(dow){
  var dc=(S.cfg.dayCfg||{})[String(dow)]||{};
  return {
    lead: dc.lead!=null?clamp(+dc.lead,0,6):clamp(+S.cfg.leadDays||0,0,6),
    hour: dc.hour!=null?clamp(+dc.hour,0,23):clamp(+S.cfg.deliveryHour||19,0,23),
    custom: dc.lead!=null||dc.hour!=null
  };
}
function deliveryFor(orderDate){
  var c=dayCfgFor(orderDate.getDay());
  return {date:addDays(orderDate,c.lead), hour:c.hour, after:shareAfterHour(c.hour), lead:c.lead};
}
/** The most recent delivery on or before `from` — what today's shelf stock came in on. */
function lastDeliveryDate(from){
  for(var i=0;i<=12;i++){
    var c=addDays(from,-i);
    for(var j=0;j<7;j++){
      if(S.cfg.orderDays.indexOf(j)<0) continue;
      var o=addDays(c,-dayCfgFor(j).lead);
      if(o.getDay()===j) return c;
    }
  }
  return addDays(from,-3);
}
/**
 * The truck lands in the evening, so a delivery covers the tail of its own day,
 * every whole day after it, and the DAYTIME of the next delivery's day — that
 * last slice is the part everyone forgets, and on a Wednesday order it is all
 * of Sunday's daytime.
 */
function coverageWindow(orderDate){
  var d0=deliveryFor(orderDate);
  var nextOrder=nextOrderDay(orderDate);
  var d1=deliveryFor(nextOrder);
  var delivery=d0.date, nextDelivery=d1.date;
  // A longer lead on the next order day can make its delivery land before this
  // one's; the window must still move forward.
  if(nextDelivery<=delivery) nextDelivery=addDays(delivery,1);
  var days=[delivery], weights=[d0.after];
  var cur=addDays(delivery,1), guard=0;
  while(cur<nextDelivery&&guard++<21){days.push(cur);weights.push(1);cur=addDays(cur,1)}
  if(nextDelivery>delivery){days.push(nextDelivery);weights.push(1-d1.after)}
  return {delivery:delivery, nextDelivery:nextDelivery, days:days, weights:weights,
          after:d0.after, hour:d0.hour, lead:d0.lead,
          nextAfter:d1.after, nextHour:d1.hour, nextOrder:nextOrder,
          span:sum(weights)};
}

/**
 * The stretch the CURRENT shelf stock has to carry on its own: from the moment
 * the order is placed until the truck lands. With next-day evening delivery
 * that is a full day plus the following daytime — and when the order day is
 * Wednesday, the daytime it has to cover is Thursday's, the busiest of the week.
 * No order size can rescue a shortfall here; only a transfer can.
 */
function preWindow(orderDate,w){
  var days=[], weights=[], cur=orderDate, guard=0;
  while(cur<w.delivery&&guard++<8){days.push(cur);weights.push(1);cur=addDays(cur,1)}
  days.push(w.delivery); weights.push(1-w.after);
  return {days:days, weights:weights, span:sum(weights)};
}

/**
 * How boldly to stock an item, read off its shelf life alone.
 *
 * The question behind the number: if I over-order, does the surplus survive to
 * the next cycle or does it go in the bin? An item whose life ends with the
 * coverage window gets a cautious level, because every extra piece is a gamble
 * with no second chance. An item that outlives the window gets a generous one,
 * because its surplus simply waits on the shelf. `tendency` slides the whole
 * curve when the shop wants to lean one way.
 */
function serviceLevel(p,coverDays){
  var shelf=Math.max(1,+p.shelfLife||1);
  var carry=clamp((shelf-coverDays)/4,0,1);          // 4 days ≈ one full cycle
  var base=0.72+0.23*carry;
  var longBonus=clamp((shelf-coverDays-4)/26,0,1)*0.03;
  var lean=((+S.cfg.tendency||50)-50)/50*0.10;       // −1..+1 → ∓10 points
  return clamp(base+longBonus+lean,0.55,0.985);
}
/**
 * FEFO against the real demand queue. The first slot is the delivery day BEFORE
 * the truck arrives — that slice is on today's shelf stock alone, and a shortfall
 * there is an afternoon stockout no order size can fix. `expiry` is the last day
 * the lot is still sellable, inclusive.
 */
function allocateStock(p,w,fc,pw){
  // With shelf counting switched off the app knows nothing about what is on the
  // shelf, so it claims nothing: no usable stock, and no shortfall warning it
  // has no grounds for.
  if(S.cfg.trackStock!==true){
    return {usable:0, onHand:0, atRisk:0,
            preDem:sum(pw.days.map(function(d,i){return forecast(p,d)*pw.weights[i]})), preGap:0};
  }
  var lots=(S.stock[p.id]||[]).slice().sort(function(a,b){return a.expiry<b.expiry?-1:1});
  var queue=[], preDem=0, i;
  for(i=0;i<pw.days.length;i++){
    var need=forecast(p,pw.days[i])*pw.weights[i];
    preDem+=need;
    queue.push({d:pw.days[i],need:need,pre:true});
  }
  for(i=0;i<w.days.length;i++) queue.push({d:w.days[i],need:fc[i],pre:false});
  var usable=0, preCov=0, onHand=0;
  var farOut=addDays(w.days[w.days.length-1],99);
  for(var li=0;li<lots.length;li++){
    var q=+lots[li].qty||0; onHand+=q;
    var lastGood=lots[li].expiry?parseYmd(lots[li].expiry):farOut;
    for(var j=0;j<queue.length&&q>0;j++){

      var take=Math.min(q,queue[j].need);

    }

}
function roundToPack(need,p){
  if(need<=0) return 0;
  // With packing switched off the shop orders in its own unit: a countable one
  // lands on a whole number, a weight keeps its decimal.
  if(S.cfg.trackPacking!==true) return qtyRound(p,need);
  var pack=Math.max(1,+p.packSize||1);
  var units = (+p.shelfLife||1)<=7 ? Math.round(need/pack)*pack : Math.ceil(need/pack)*pack;
  if(units===0&&need>=pack*0.4) units=pack;
  if(units>0&&p.moq) units=Math.max(units,Math.ceil(p.moq/pack)*pack);
  return units;

function planFor(p,orderDate){
  var w=coverageWindow(orderDate);
  var pw=preWindow(orderDate,w);
  var fc=w.days.map(function(d,i){return forecast(p,d)*w.weights[i]});
  var expected=sum(fc);
  var m=S.model[p.id]||{base:0,sigma:0};
  var cv=m.base>0?m.sigma/m.base:0.45;
  var sigmaW=cv*Math.sqrt(sum(fc.map(function(x){return x*x})));
  var cr=serviceLevel(p,w.span);
  var z=probit(cr);
  var target=expected+z*sigmaW;

  var alloc=allocateStock(p,w,fc,pw);

  // Hard ceiling: never buy more than can plausibly sell before it expires.
  // Day 0 is the delivery day, and only its evening counts.
  var shelf=Math.max(1,+p.shelfLife||1), capSum=0;
  for(var i=0;i<shelf;i++) capSum+=forecast(p,addDays(w.delivery,i))*(i===0?w.after:1);
  var cap=capSum*S.cfg.horizonBuffer;
  var lastGood=addDays(w.delivery,shelf-1);
  // Stock arriving now that still has to cover the tail of the window
  var coversWindow = lastGood>=w.days[w.days.length-1];

  var rawNeed=target-alloc.usable;
  var capped=Math.min(rawNeed,cap-alloc.onHand);
  var capBinds = capped < rawNeed - 0.5 && rawNeed > 0;
  var qty=roundToPack(Math.max(0,capped),p);
  var moqForced = qty>0 && p.moq && qty>Math.max(0,capped)+ (p.packSize||1)*0.5;

  return {
    win:w, pre:pw, fc:fc, expected:expected, sigmaW:sigmaW, cr:cr, z:z, target:target,
    usable:alloc.usable, onHand:alloc.onHand, atRisk:alloc.atRisk,
    preDem:alloc.preDem, preGap:alloc.preGap,
    cap:cap, capBinds:capBinds, moqForced:moqForced,
    lastGood:lastGood, coversWindow:coversWindow, suggested:qty
  };
}
function orderQty(p,plan){
  return S.overrides.hasOwnProperty(p.id) ? S.overrides[p.id] : plan.suggested;
}

    stock[pp.id]=[{qty:qty,expiry:ymd(addDays(lastDel,pp.shelfLife-1))}];
  }
  return {products:products,days:days,stock:stock,events:JSON.parse(JSON.stringify(DEMO_EVENTS))};
}

/* ===================== persistence ===================== */
/*
 * Two backing stores. Inside claude.ai the `db` capability keeps the data with
 * the page, so it follows the owner to any device. Opened as a plain file on a
 * computer there is no `db`, so the browser's own storage takes over: same app,
 * data kept on that one machine in that one browser.
 */
var LS_KEY="daftar-altalabiya-v1";
var localT=null;
function payload(){
  var p={v:1, savedAt:new Date().toISOString(), cfg:S.cfg, products:S.products,
          days:S.days, stock:S.stock, events:S.events, orders:S.orders, imports:S.imports||[]};
  if(S.multi&&S.branchId){var b=curBranch(); p.meta={branchId:S.branchId, brand:b?b.brand:CUR_BRAND}}
  return p;
}
function saveLocal(){
  if(!S.local||S.demo) return;
  var data=payload();
  // With branches, every write names the branch it belongs to, taken at the
  // moment of the write — never whatever happens to be open when it lands.
  if(S.multi&&BR&&S.branchId){
    var id=S.branchId;
    // one write at a time, each on the revision the last one left, so the file
    // store can tell a genuine edit from one made on a copy that has moved on
    queueBranchOp(function(){
      if(id!==S.branchId) return;                  // the branch changed before this ran
      return Promise.resolve(BR.save(id,data,S.branchRev)).then(function(r){
        if(r&&r.ok){
          var e=findBranch(id); if(e){ if(r.rev) e.rev=r.rev; if(r.updatedAt) e.updatedAt=r.updatedAt }
          if(id===S.branchId){ if(r.rev) S.branchRev=r.rev; S.savedAt=new Date(); touchSaveStamp() }
        }else if(r&&r.stale){
          toast("وصلت نسخةٌ أحدث لهذا الفرع من جهازٍ آخر — أُعيد تحميله");
          if(id===S.branchId) openBranch(id,{keepView:true});
        }else toast("تعذّر الحفظ: "+((r&&r.error)||"خطأ غير معروف"));
      },function(){toast("تعذّر الحفظ إلى الملف")});
    });
    return;
  }
  // Desktop build: a real JSON file on disk, which survives anything a browser does.
  if(S.desktop&&window.desktop&&window.desktop.save){
    window.desktop.save(data).then(function(r){
      if(r&&r.ok){S.savedAt=new Date(); touchSaveStamp()}
      else toast("تعذّر الحفظ: "+((r&&r.error)||"خطأ غير معروف"));
    },function(e){toast("تعذّر الحفظ إلى الملف")});
    return;
  }
  try{
    localStorage.setItem(LS_KEY,JSON.stringify(data));
    S.savedAt=new Date(); touchSaveStamp();
  }catch(e){ toast("تعذّر الحفظ — مساحة المتصفّح ممتلئة") }
}
function touchSaveStamp(){
  var el=document.getElementById("saveStamp");
  if(!el||!S.savedAt) return;
  var d=S.savedAt, p=function(n){return (n<10?"0":"")+n};
  el.textContent="حُفظ "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}
function scheduleLocalSave(){
  if(localT) clearTimeout(localT);
  localT=setTimeout(function(){localT=null;saveLocal()},500);
}
/*
 * Every record passes through here, whatever its source: this computer's file,
 * the cloud, a restored backup, an old app's file. Anything that is not the
 * shape the app writes is dropped or coerced, so a tampered record cannot
 * smuggle markup or script into the page through an id, a date or a number.
 */
var SAFE_ID=/^[A-Za-z0-9_\-]{1,64}$/, SAFE_DAY=/^\d{4}-\d{2}-\d{2}$/;
function sNum(v,def){var n=+v;return isFinite(n)?n:def}
function sStr(v,max){return v==null?"":String(v).slice(0,max||200)}
function sBool(v){return v===true}
function sDay(v){return typeof v==="string"&&SAFE_DAY.test(v)?v:null}
function sanitizeRecord(d){
  if(!d||typeof d!=="object"||!Array.isArray(d.products)) return null;
  var out={v:1};
  var c=d.cfg&&typeof d.cfg==="object"?d.cfg:{}, cfg={};
  cfg.branch=sStr(c.branch,60);
  cfg.orderDays=(Array.isArray(c.orderDays)?c.orderDays:[0,3]).map(function(x){return Math.round(+x)}).filter(function(x,i,a){return x>=0&&x<=6&&a.indexOf(x)===i});
  ["leadDays","deliveryHour","tendency","horizonBuffer"].forEach(function(k){ if(c[k]!=null) cfg[k]=sNum(c[k],DEFAULT_CFG[k]) });
  if(c.afterShare!=null&&c.afterShare!=="") cfg.afterShare=sNum(c.afterShare,null);
  ["trackWaste","trackStockout","trackPacking","trackStock","showShelfInClose"].forEach(function(k){ if(c[k]!=null) cfg[k]=c[k]===true });
  cfg.dayCfg={};
  if(c.dayCfg&&typeof c.dayCfg==="object") Object.keys(c.dayCfg).forEach(function(k){
    if(!/^[0-6]$/.test(k)||!c.dayCfg[k]||typeof c.dayCfg[k]!=="object") return;
    var o={}; if(c.dayCfg[k].lead!=null) o.lead=sNum(c.dayCfg[k].lead,1); if(c.dayCfg[k].hour!=null) o.hour=sNum(c.dayCfg[k].hour,19);
    cfg.dayCfg[k]=o;
  });
  out.cfg=cfg;
  var pids={};
  out.products=d.products.filter(function(p){return p&&typeof p==="object"&&SAFE_ID.test(String(p.id))&&!pids[p.id]&&(pids[p.id]=1)}).map(function(p){
    var q={id:String(p.id), name:sStr(p.name,200), shelfLife:sNum(p.shelfLife,5), packSize:sNum(p.packSize,1), moq:sNum(p.moq,0), active:p.active!==false};
    if(p.unit!=null) q.unit=sStr(p.unit,20);
    if(p.mto===true) q.mto=true;                     // «يُحضَّر بالطلب»: ordered through its materials
    if(Array.isArray(p.aliases)) q.aliases=p.aliases.slice(0,400).map(function(a){return sStr(a,200)}).filter(Boolean);
    return q;
  });
  var num3=function(o){var r={};["sold","waste","lost"].forEach(function(k){ if(o[k]!=null&&o[k]!=="") r[k]=sNum(o[k],0) }); r.stockout=sBool(o.stockout); return r};
  out.days={};
  if(d.days&&typeof d.days==="object") Object.keys(d.days).forEach(function(k){
    var rec=d.days[k]; if(!SAFE_DAY.test(k)||!rec||typeof rec!=="object") return;
    var items={};
    if(rec.items&&typeof rec.items==="object") Object.keys(rec.items).forEach(function(pid){ if(SAFE_ID.test(pid)&&rec.items[pid]&&typeof rec.items[pid]==="object") items[pid]=num3(rec.items[pid]) });
    out.days[k]={date:k, items:items, closed:sBool(rec.closed)};
  });
  out.stock={};
  if(d.stock&&typeof d.stock==="object") Object.keys(d.stock).forEach(function(pid){
    if(!SAFE_ID.test(pid)||!Array.isArray(d.stock[pid])) return;
    out.stock[pid]=d.stock[pid].filter(function(l){return l&&typeof l==="object"}).slice(0,50).map(function(l){return {qty:sNum(l.qty,0), expiry:sDay(l.expiry)}});
  });
  var kinds=EVENT_KINDS.map(function(k){return k.k});
  out.events=(Array.isArray(d.events)?d.events:[]).filter(function(e){return e&&typeof e==="object"&&SAFE_ID.test(String(e.id))}).slice(0,500).map(function(e){
    return {id:String(e.id), name:sStr(e.name,120), kind:kinds.indexOf(e.kind)>=0?e.kind:"other", from:sDay(e.from), to:sDay(e.to), mult:sNum(e.mult,1)};
  });
  out.orders={};
  if(d.orders&&typeof d.orders==="object") Object.keys(d.orders).forEach(function(k){
    var o=d.orders[k]; if(!SAFE_DAY.test(k)||!o||typeof o!=="object") return;
    var items={};
    if(o.items&&typeof o.items==="object") Object.keys(o.items).forEach(function(pid){ var it=o.items[pid]; if(SAFE_ID.test(pid)&&it&&typeof it==="object") items[pid]={suggested:sNum(it.suggested,0), ordered:sNum(it.ordered,0)} });
    out.orders[k]={date:k, items:items, status:sStr(o.status,20)};
  });
  // the sales imports and what each covered: a day inside a «complete» record had its whole branch's sales imported
  out.imports=(Array.isArray(d.imports)?d.imports:[]).filter(function(x){return x&&typeof x==="object"}).slice(-2000).map(function(x){
    return {id:sStr(x.id,40), at:sStr(x.at,40), by:sStr(x.by,120), file:sStr(x.file,200), title:sStr(x.title,200),
            from:sDay(x.from), to:sDay(x.to), complete:sBool(x.complete), reason:sStr(x.reason,40),
            mode:x.mode==="add"?"add":"replace", rows:sNum(x.rows,0), qty:sNum(x.qty,0), zeros:sNum(x.zeros,0)};
  });
  return out;
}
function applyData(d){
  d=sanitizeRecord(d);
  if(!d) return false;
  S.cfg=freshCfg(d.cfg||{});
  if(!S.cfg.dayCfg||typeof S.cfg.dayCfg!=="object") S.cfg.dayCfg={};
  if(!Array.isArray(S.cfg.orderDays)||!S.cfg.orderDays.length) S.cfg.orderDays=[0,3];
  S.products=d.products||[]; S.days=d.days||{}; S.stock=d.stock||{};
  S.events=d.events||[]; S.orders=d.orders||{}; S.imports=d.imports||[];
  S.demo=false;
  return true;
}
function loadLocal(){

function subscribeAll(){
  var db=S.db, seen={products:false,days:false,stock:false,events:false};
  function maybeReady(k){seen[k]=true; if(seen.products&&seen.days&&seen.stock&&seen.events){S.ready=true} relearn(); render()}
  db.collection("products").onSnapshot(function(q){
    S.products=q.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    maybeReady("products");
  },function(){maybeReady("products")});
  db.collection("days").orderBy("date","desc").limit(150).onSnapshot(function(q){
    var m={}; q.docs.forEach(function(d){var v=d.data();m[d.id]={date:v.date||d.id,items:v.items||{},closed:!!v.closed}});
    S.days=m; maybeReady("days");
  },function(){maybeReady("days")});
  db.doc("stock/current").onSnapshot(function(s){
    S.stock=s.exists?(s.data().lots||{}):{}; maybeReady("stock");
  },function(){maybeReady("stock")});
  db.collection("events").onSnapshot(function(q){
    S.events=q.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    maybeReady("events");
  },function(){maybeReady("events")});
  db.doc("config/settings").onSnapshot(function(s){
    if(s.exists){S.cfg=freshCfg(s.data());render()}
  },function(){});
}

/* ===================== brands & branches ===================== */
/*
 * Each branch is one self-contained record. BR is the storage behind them,
 * and every backend offers the same ten calls — the desktop file store today,
 * this browser's own storage when the page is opened as a plain file, and a
 * cloud provider later, dropped in behind the same calls without touching the
 * screens. Every record carries meta.branchId, meta.rev and meta.updatedAt,
 * which is what a sync step needs to push a branch and to tell which copy is newer.
 */
var BR=null;

function desktopBranches(){
  var d=window.desktop;
  return {kind:"desktop",
    state:function(){return d.state()},
    load:function(id){return d.load(id)},
    save:function(id,data,baseRev){return d.save(data,id,baseRev)},
    add:function(o){return d.addBranch(o)},
    rename:function(id,name){return d.renameBranch(id,name)},
    setCurrent:function(id){return d.setCurrent(id)},
    remove:function(id){return d.removeBranch(id)},
    stats:function(){return d.branchStats()},
    legacyAdopt:function(id){return d.legacyAdopt(id)},
    legacyDismiss:function(id){return d.legacyDismiss(id)}
  };
}

/** The same calls over this browser's storage, for the page opened as a plain file. */
function browserBranches(){
  var WS_KEY="daftar-ws-v1", PFX="daftar-b-";
  var ok=function(v){return Promise.resolve(Object.assign({ok:true},v||{}))};
  var bad=function(e){return Promise.resolve({ok:false,error:e})};
  var nowIso=function(){return new Date().toISOString()};
  function get(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r):null}catch(e){return null}}
  function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
  var migrated=[];
  var ws=get(WS_KEY);
  if(!ws||!Array.isArray(ws.branches)||!ws.branches.length){
    ws={v:1,branches:[],current:null,sync:{provider:null}};
    BRANDS.forEach(function(b){
      ws.branches.push({id:b.key+"-1",brand:b.key,name:b.branch||b.wordmark,createdAt:nowIso(),rev:1,updatedAt:nowIso()});
    });
    // the single-shop page kept its record under one key; it becomes the first branch
    var old=get(LS_KEY);
    if(old&&Array.isArray(old.products)){
      var first=ws.branches[0];
      if(old.cfg&&old.cfg.branch) first.name=String(old.cfg.branch);
      put(PFX+first.id,old);
      migrated.push({id:first.id,brand:first.brand,products:old.products.length,days:Object.keys(old.days||{}).length});
    }
    ws.current=ws.branches[0].id;
    put(WS_KEY,ws);
  }
  function find(id){for(var i=0;i<ws.branches.length;i++) if(ws.branches[i].id===id) return ws.branches[i]; return null}
  function snap(){return JSON.parse(JSON.stringify(ws))}
  return {kind:"browser",
    state:function(){return ok({ws:snap(),migrated:migrated,legacyNewer:[],root:null})},
    load:function(id){ if(!find(id)) return bad("unknown branch"); return ok({data:get(PFX+id),path:null,id:id}) },
    save:function(id,data){
      var e=find(id); if(!e) return bad("unknown branch");
      e.rev=(+e.rev||1)+1; e.updatedAt=nowIso();
      var rec=Object.assign({},data,{meta:{branchId:id,brand:e.brand,rev:e.rev,updatedAt:e.updatedAt}});
      if(!put(PFX+id,rec)) return bad("مساحة المتصفّح ممتلئة");
      put(WS_KEY,ws); return ok({rev:e.rev,updatedAt:e.updatedAt});
    },
    add:function(o){
      var id=o.brand+"-"+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
      var e={id:id,brand:o.brand,name:o.name,createdAt:nowIso(),rev:1,updatedAt:nowIso()};
      var rec=Object.assign({v:1,products:[],days:{},stock:{},events:[],orders:{}},o.data||{});
      rec.meta={branchId:id,brand:o.brand,rev:1,updatedAt:e.updatedAt};
      if(!put(PFX+id,rec)) return bad("مساحة المتصفّح ممتلئة");
      ws.branches.push(e); put(WS_KEY,ws); return ok({id:id,ws:snap()});
    },
    rename:function(id,name){var e=find(id); if(!e) return bad("unknown branch"); e.name=name; put(WS_KEY,ws); return ok({ws:snap()})},
    setCurrent:function(id){if(!find(id)) return bad("unknown branch"); ws.current=id; put(WS_KEY,ws); return ok({ws:snap()})},
    remove:function(id){
      var e=find(id); if(!e) return bad("unknown branch");
      if(ws.branches.length<=1) return bad("last branch");
      var rec=get(PFX+id); if(rec) put("daftar-trash-"+id+"-"+Date.now(),rec);
      try{localStorage.removeItem(PFX+id)}catch(x){}
      ws.branches=ws.branches.filter(function(b){return b.id!==id});
      if(ws.current===id){var same=ws.branches.filter(function(b){return b.brand===e.brand})[0];ws.current=(same||ws.branches[0]).id}
      put(WS_KEY,ws); return ok({ws:snap()});
    },
    stats:function(){
      var out={};
      ws.branches.forEach(function(b){var r=get(PFX+b.id)||{};
        out[b.id]={products:(r.products||[]).length,days:Object.keys(r.days||{}).length,hasFile:!!r.products,updatedAt:b.updatedAt,rev:b.rev}});
      return ok({stats:out});
    },
    legacyAdopt:function(){return bad("not available here")},
    legacyDismiss:function(){return bad("not available here")}
  };
}

var opChain=Promise.resolve();
function queueBranchOp(fn){
  opChain=opChain.then(fn).catch(function(){});
  return opChain;
}

function hhmm(iso){

function cloudLook(){

  if(c.conflicts&&c.conflicts.length) return {cls:"warn",txt:"تعارض يحتاج قرارك"};
  if(c.status==="ok") return {cls:"ok"+(c.running?" busy":""),txt:"متزامن "+hhmm(c.lastSync)};
  if(c.status==="setup") return {cls:"warn",txt:"السحاب يحتاج إعداداً"};
  if(c.status==="signin") return {cls:"warn",txt:"سجّل الدخول للمزامنة"};
  if(c.status==="notmember") return {cls:"bad",txt:"الحساب غير مُصرَّح له"};
  if(c.status==="disabled") return {cls:"bad",txt:"الحساب موقوف"};
  if(c.status==="offline") return {cls:"bad",txt:"غير متّصل — محفوظ محلياً"};

}

function handleCloud(u){

  S.cloud=u;
  // another device changed this brand's materials or recipes: read them again

  if(u.catalogNote==="conflict") setTimeout(function(){ toast("تغيّرت الوصفات على جهازين — أُخذت نسخة السحاب، ونسخة هذا الجهاز محفوظة جانباً") },400);

  if(u.access&&u.access.email&&u.access.email!==prevEmail) S.tab=firstAllowedTab();

  if(u.refused) setTimeout(function(){ toast("رفض الخادم تعديلاً ليس من صلاحيات دورك — أُعيدت نسخة السحاب") },300);

    toast(amAdmin()?"حُذف هذا الفرع من جهازٍ آخر":"لم يعد هذا الفرع مسنداً لحسابك");

function flushSave(){ if(localT){clearTimeout(localT);localT=null;saveLocal()} }

/** Whatever the screens were in the middle of belongs to the branch being left. */
function resetViewState(){
  S.overrides={}; S.planDate=null; S.entryDate=ymd(today());
  S.statProduct=null; S.statFrom=null; S.statTo=null; S.statPeriod=0;
  S.imp=null; S.impNew=[]; S.impNewCount=0; S.savedAt=null; S.dataPath=null;
}

function openBranch(id,opts){
  opts=opts||{};
  var b=findBranch(id); if(!b||!BR) return Promise.resolve(false);
  flushSave();
  var seq=++S.openSeq;
  return Promise.resolve(BR.load(id)).then(function(r){
    if(seq!==S.openSeq) return false;       // a later choice overtook this one
    var keep=opts.keepView&&id===S.branchId?{tab:S.tab,entryDate:S.entryDate,planDate:S.planDate,statFrom:S.statFrom,statTo:S.statTo,statPeriod:S.statPeriod}:null;
    S.branchId=id; applyBrand(b.brand); resetViewState();
    if(keep) Object.assign(S,keep);
    S.branchRev=r&&r.rev!=null?r.rev:null;
    if(r&&r.ok&&r.data&&applyData(r.data)){ S.dataPath=r.path||null }
    else{
      S.cfg=freshCfg(); seedDemoState(); S.dataPath=(r&&r.path)||null;
      if(r&&!r.ok&&r.error) toast("تعذّرت قراءة ملفّ الفرع: "+r.error);
    }
    S.cfg.branch=b.name;
    S.ready=true;
    if(opts.tab) S.tab=opts.tab;
    relearn(); render();
    if(S.ws.current!==id){S.ws.current=id; Promise.resolve(BR.setCurrent(id)).catch(function(){})}
    if(S.tab==="branches") loadBranchStats();
    return true;
  },function(){toast("تعذّر فتح الفرع");return false});
}

function loadBranchStats(){
  if(!BR) return;
  Promise.resolve(BR.stats()).then(function(r){
    if(r&&r.ok){S.branchStats=r.stats; if(S.tab==="branches") render()}
  },function(){});
}

function renameBranch(id,name){
  var e=findBranch(id); if(!e) return;
  var nm=String(name||"").replace(/\s+/g," ").trim();
  if(!nm) return;
  e.name=nm;
  if(id===S.branchId){S.cfg.branch=nm}
  renderHeader();
  if(renameT[id]) clearTimeout(renameT[id]);
  renameT[id]=setTimeout(function(){
    delete renameT[id];
    flushSave();
    // the store writes the new name into the branch file and moves its revision on
    queueBranchOp(function(){
      return Promise.resolve(BR.rename(id,nm)).then(function(r){
        if(r&&r.ok&&r.rev!=null&&id===S.branchId) S.branchRev=r.rev;
      });
    });
  },500);
}

/* ===================== analytics ===================== */
/*
 * Everything the shop is shown about the past is derived here, once, from the
 * same de-censored demand the forecast learns from — so a figure on the
 * analysis screen and a figure behind an order quantity can never disagree.
 */

/**
 * A window of the record. Accepts a day count (the quick buttons), an explicit
 * {from, to} (the shop's own dates), or nothing at all for the whole record —
 * so every report below reads the same way whichever the shop picked.
 */
function normRange(r){
  if(r==null) return {from:null,to:null};
  if(typeof r==="number"){
    if(!r) return {from:null,to:null};
    return {from:ymd(addDays(today(),-(r-1))), to:ymd(today())};
  }
  var f=r.from||null, t=r.to||null;
  if(f&&t&&f>t){var s=f;f=t;t=s}     // dates entered back to front still work
  return {from:f, to:t};
}
/** What the analysis screen is currently showing. */
function statRange(){
  if(S.statFrom||S.statTo) return normRange({from:S.statFrom,to:S.statTo});
  return normRange(S.statPeriod||0);
}

/** The record as a plain chronological list, trimmed to the window. */
function seriesFor(pid,range){
  var R=normRange(range);
  var keys=Object.keys(S.days).sort(), out=[];
  for(var i=0;i<keys.length;i++){
    var k=keys[i];
    if(R.from&&k<R.from) continue;
    if(R.to&&k>R.to) continue;
    var rec=S.days[k], e=rec.items?rec.items[pid]:null;
    if(!hasSold(e)) continue;                      // missing data: not a day of this product's history
    out.push({date:k, d:parseYmd(k), qty:demandOf(e), sold:+e.sold||0,
              waste:+e.waste||0, stockout:!!e.stockout});
  }
  return out;
}
function mean(a){return a.length?sum(a)/a.length:0}
function stdev(a){
  if(a.length<2) return 0;
  var m=mean(a);
  return Math.sqrt(sum(a.map(function(x){return (x-m)*(x-m)}))/(a.length-1));
}

/** ↑ / → / ↓ by comparing a recent block against the block before it. */
function trendOf(series,block){
  if(series.length<block+2) return {dir:"?", pct:null, recent:null, prior:null, enough:false};
  var recent=series.slice(-block), prior=series.slice(-2*block,-block);
  if(!prior.length) return {dir:"?", pct:null, recent:null, prior:null, enough:false};
  var r=mean(recent.map(function(x){return x.qty})), p=mean(prior.map(function(x){return x.qty}));
  var pct=p>0?(r-p)/p:(r>0?1:0);
  var dir=Math.abs(pct)<0.10?"flat":(pct>0?"up":"down");
  return {dir:dir, pct:pct, recent:r, prior:p, enough:true, n:recent.length};
}
function trendMark(t){
  if(!t.enough) return '<span style="color:var(--ink-3)">—</span>';
  if(t.dir==="up") return '<span style="color:var(--accent-ink)">↑ '+(t.pct>0?"+":"")+Math.round(t.pct*100)+'٪</span>';
  if(t.dir==="down") return '<span style="color:var(--crit)">↓ '+Math.round(t.pct*100)+'٪</span>';
  return '<span style="color:var(--ink-3)">→ مستقرّ</span>';
}

/** Coefficient of variation, bucketed — two products can share a mean and behave nothing alike. */
function volatilityOf(series){
  var q=series.map(function(x){return x.qty});
  var m=mean(q), sd=stdev(q);
  var cv=m>0?sd/m:0;
  var band=cv<0.35?"low":cv<0.70?"mid":"high";
  return {cv:cv, sd:sd, band:band,
    label:band==="low"?"منخفض":band==="mid"?"متوسّط":"مرتفع",
    cls:band==="low"?"a":band==="mid"?"":"c"};
}

/** How much the shop should trust a forecast: enough days, and steady enough. */
function confidenceOf(series){
  var n=series.length;
  var v=volatilityOf(series);
  var daysScore=clamp(n/28,0,1);
  var steadyScore=clamp(1-(v.cv-0.30)/0.90,0,1);
  var score=0.6*daysScore+0.4*steadyScore;
  if(n<4) score=Math.min(score,0.15);
  var band=score<0.30?"low":score<0.60?"mid":"good";
  return {score:score, n:n, band:band,
    label:band==="low"?"ضعيف":band==="mid"?"متوسّط":"جيّد",
    cls:band==="low"?"c":band==="mid"?"w":"a"};
}

/** Raw average per weekday for one product — the shop's real Thursday, not an index. */
function byWeekday(series){
  var buckets=[[],[],[],[],[],[],[]];
  series.forEach(function(x){buckets[x.d.getDay()].push(x.qty)});
  var avg=buckets.map(function(b){return b.length?mean(b):null});
  var known=avg.map(function(v,i){return v===null?null:{i:i,v:v}}).filter(Boolean);
  known.sort(function(a,b){return b.v-a.v});
  return {avg:avg, counts:buckets.map(function(b){return b.length}),
          best:known.length?known[0]:null, worst:known.length?known[known.length-1]:null};
}

/** One product, fully described. */
function productReport(p,range){
  var s=seriesFor(p.id,range);
  var qty=s.map(function(x){return x.qty});
  var total=sum(qty);
  var wd=byWeekday(s);
  var d=S.planDate?parseYmd(S.planDate):(isOrderDay(today())?today():nextOrderDay(today()));
  var plan=planFor(p,d);
  return {
    p:p, series:s, nDays:s.length, total:total,
    dailyAvg:s.length?total/s.length:0,
    soldTotal:sum(s.map(function(x){return x.sold})),
    wasteTotal:sum(s.map(function(x){return x.waste})),
    outDays:s.filter(function(x){return x.stockout}).length,
    weekday:wd,
    trend7:trendOf(s,7), trend28:trendOf(s,28),
    vol:volatilityOf(s), conf:confidenceOf(s),
    plan:plan,
    thin:s.length<7||total<5
  };
}

/** A sentence that says exactly how a suggested quantity was arrived at. */
function orderReason(r){
  var pl=r.plan, bits=[];
  var u=unitOf(r.p);
  bits.push('الطلب المتوقَّع على نافذة <b>'+round1(pl.win.span)+'</b> يوم هو <b>'+numText(qtyRound(r.p,pl.expected))+'</b> '+u);
  var safety=pl.z*pl.sigmaW;
  bits.push('واحتياطيُّ صنفٍ صلاحيتُه '+(r.p.shelfLife||"—")+' أيام عند مستوى '+Math.round(pl.cr*100)+'٪ يضيف <b>'+(safety>=0?"+":"")+round1(safety)+'</b>');
  if(pl.usable>0.5) bits.push('ويُطرح منها <b>'+numText(qtyRound(r.p,pl.usable))+'</b> على الرفّ ما زالت صالحة');
  else bits.push('ولا يوجد على الرفّ ما يُطرح');
  if(pl.capBinds) bits.push('<b style="color:var(--warn)">ثمّ قُصّ الناتج عند سقف الصلاحية ('+qty(r.p,pl.cap)+') لأنّ الزيادة لن تُباع قبل أن تنتهي</b>');
  if(pl.moqForced) bits.push('<b style="color:var(--calm)">ورُفع إلى الحدّ الأدنى الذي يفرضه المورّد ('+r.p.moq+')</b>');
  if(r.conf.band==="low") bits.push('<b style="color:var(--crit)">والثقة ضعيفة ('+r.nDays+' يوماً من السجلّ)، فراجع الرقم بعينك</b>');
  return bits.join('، ')+'. والناتج <b>'+numText(pl.suggested)+'</b> '+u+'.';
}

/** The whole branch, for the period. */
function periodReport(range){
  var R=normRange(range);
  var plist=S.products.filter(function(p){return p.active!==false});
  var reports=plist.map(function(p){return productReport(p,R)});
  var keys=Object.keys(S.days).sort();
  // a day counts once sales were recorded on it (a confirmed 0 included); a day holding no sales
  // figure at all — closed empty, or only waste typed — is missing data, not a zero-sales day
  var dayKeys=keys.filter(function(k){
    if(!((!R.from||k>=R.from)&&(!R.to||k<=R.to))) return false;
    var it=S.days[k].items||{};
    return Object.keys(it).some(function(pid){return hasSold(it[pid])});
  });

  var totalQty=0, totalWaste=0, soldProducts=0;
  reports.forEach(function(r){totalQty+=r.total; totalWaste+=r.wasteTotal; if(r.total>0) soldProducts++});

  // branch-wide daily totals, for the overall trend and the weekday table
  var byDay=dayKeys.map(function(k){
    var rec=S.days[k], t=0;
    for(var pid in rec.items) t+=demandOf(rec.items[pid]);
    return {date:k, d:parseYmd(k), qty:t};
  });
  var wd=byWeekday(byDay);
  var thin=reports.filter(function(r){return r.thin}).length;
  var confAvg=reports.length?mean(reports.map(function(r){return r.conf.score})):0;
  var confBand=confAvg<0.30?"low":confAvg<0.60?"mid":"good";

  var ranked=reports.slice().sort(function(a,b){return b.total-a.total});
  return {
    reports:reports, ranked:ranked, dayKeys:dayKeys, byDay:byDay, weekday:wd,
    days:dayKeys.length, totalQty:totalQty, totalWaste:totalWaste,
    dailyAvg:dayKeys.length?totalQty/dayKeys.length:0,
    soldProducts:soldProducts, productCount:plist.length, thin:thin,
    trend7:trendOf(byDay,7), trend28:trendOf(byDay,28),
    vol:volatilityOf(byDay),
    conf:{score:confAvg, band:confBand,
          label:confBand==="low"?"ضعيف":confBand==="mid"?"متوسّط":"جيّد",
          cls:confBand==="low"?"c":confBand==="mid"?"w":"a"}
  };
}

/** Each occasion measured against the ordinary days around it. */
function eventReport(ev){
  var obs=observedLift(ev);
  var during=[], before=[];
  var from=ev.from, to=ev.to;
  if(!from||!to) return null;
  var beforeFrom=ymd(addDays(parseYmd(from),-14));
  Object.keys(S.days).sort().forEach(function(k){
    var rec=S.days[k], t=0;
    for(var pid in rec.items) t+=demandOf(rec.items[pid]);
    if(k>=from&&k<=to) during.push(t);
    else if(k>=beforeFrom&&k<from) before.push(t);
  });
  var dAvg=during.length?mean(during):null, bAvg=before.length?mean(before):null;
  return {
    ev:ev, kind:kindOf(ev.kind),
    duringDays:during.length, duringTotal:sum(during), duringAvg:dAvg,
    beforeDays:before.length, beforeAvg:bAvg,
    pct:(dAvg!=null&&bAvg>0)?(dAvg-bAvg)/bAvg:null,
    observed:obs?obs.lift:null,
    applied:(+ev.mult||1)!==1
  };
}
