<style>
:root{ --r:12px; --r-sm:8px; }

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans Arabic","Segoe UI",system-ui,sans-serif;
  font-size:15px; line-height:1.55; -webkit-text-size-adjust:100%;
}

/* The wordmark, set in whatever register the shop's own logo uses. */
.mark{
  font-family:var(--mark-font); font-style:var(--mark-style); font-weight:var(--mark-weight);
  font-size:var(--mark-size); letter-spacing:var(--mark-spacing);
  color:var(--accent-ink); line-height:1;
  direction:ltr; unicode-bidi:isolate; white-space:nowrap;
}

/* ---------- shell ---------- */
/*
 * The page runs the full width of the window. On a desk monitor that width is
 * useful: order rows stop wrapping, tables stop scrolling sideways, and the
 * card grids gain columns. Running prose is capped separately below, because a
 * paragraph a metre wide is unreadable however big the screen is.
 */
.app{max-width:none; margin:0 auto; padding-inline:clamp(16px,2.5vw,40px); padding-block:0 96px}
@media (min-width:1800px){ .app{max-width:1760px} }
header.top{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
  background:color-mix(in srgb, var(--bg) 97%, transparent);
  margin-inline:calc(-1 * clamp(16px,2.5vw,40px)); padding-inline:clamp(16px,2.5vw,40px);
  padding-block:12px 0;
  border-bottom:1px solid var(--line);
}
/* The app's mark and name on top, the open brand and branch beneath. */
.brand{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
.applogo{width:40px; height:40px; flex:none; border-radius:11px; overflow:hidden; box-shadow:var(--shadow)}
.applogo svg{width:100%; height:100%; display:block}
.titles{display:flex; flex-direction:column; gap:3px; min-width:0}
.apptitle{font-size:18px; font-weight:700; line-height:1.15; color:var(--ink); letter-spacing:-.01em; direction:ltr; unicode-bidi:isolate}
.subline{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.subline .mark{font-size:12px}
.brand .sub{font-size:12px; color:var(--ink-3); letter-spacing:.02em}
.brand .sub::before{content:""; display:inline-block; width:1px; height:11px; background:var(--line-strong); margin-inline-end:8px; vertical-align:-1px}
.brand .spacer{flex:1}
.datechip{display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:99px;
  background:var(--accent-soft); border:1px solid var(--accent-line); color:var(--accent-ink); font-size:12.5px; font-weight:600}
.themebtn{
  border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink-2);

  display:grid; place-items:center; transition:background .15s, color .15s, border-color .15s;
}
.themebtn:hover{background:var(--accent-soft); color:var(--accent-ink); border-color:var(--accent-line)}

nav.tabs{display:flex; gap:2px; overflow-x:auto; scrollbar-width:none; margin-top:10px}

button.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

}

.chip{

/* ---------- order header strip ---------- */
.plan{

.totals .val small{font-size:11px; color:var(--ink-3); font-family:"IBM Plex Sans Arabic",sans-serif}

/* On a wide window the order sheet becomes two columns of rows, so a 14-item
   order is visible without scrolling. */
.rows{display:flex; flex-direction:column; gap:8px; margin-top:14px}
@media (min-width:1000px){

.iseg{display:inline-flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--surface)}

.isegb.on.sm{background:var(--accent); color:var(--on-accent)}

/* «السوق والدولة» */

.brrow.paused .brSw, .brrow.paused .brDel{opacity:1}
.brSw{display:inline-flex; gap:6px; align-items:center; cursor:pointer; white-space:nowrap}
.uiRow{display:flex; gap:10px; align-items:center; padding:7px 10px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--surface); cursor:grab}
.uiRow .grow{flex:1}
.uiRow.dragging{opacity:.45}
.uiRow.dropBefore{box-shadow:inset 0 3px 0 var(--accent)}
.uiRow.dropAfter{box-shadow:inset 0 -3px 0 var(--accent)}
.alertRow{display:flex; gap:12px; align-items:flex-start; padding:12px 14px}
.alertRow .alertDot{width:10px; height:10px; border-radius:50%; margin-top:6px; flex:0 0 auto; background:var(--ink-3)}
.alertRow.c{border-color:var(--crit-line)} .alertRow.c .alertDot{background:var(--crit)}
.alertRow.w{border-color:var(--warn-line)} .alertRow.w .alertDot{background:var(--warn)}
.alertRow.a .alertDot{background:#2E9E6A}
.cmpRow{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px}

.cmpTabs{display:flex; gap:6px; flex-wrap:wrap; padding:4px; border-radius:14px; background:var(--surface-2); border:1px solid var(--line); margin-bottom:14px; width:max-content; max-width:100%}
.cmpTabB{border:0; background:transparent; color:var(--ink-2); font:inherit; font-size:13.5px; font-weight:600; padding:8px 16px; border-radius:10px; cursor:pointer; transition:background-color .16s, color .16s, transform .12s}
.cmpTabB:active{transform:scale(.97)} .cmpTabB.on{background:var(--accent); color:var(--on-accent)}
.cmpEvSel{width:100%; min-width:0}
.cmpVs{display:grid; grid-template-columns:1fr auto 1fr; gap:14px; align-items:end}
.cmpVsF{display:flex; flex-direction:column; gap:6px; min-width:0}
.cmpVsX{font-weight:700; color:var(--ink-3); padding-bottom:10px}
@media (max-width:760px){ .cmpVs{grid-template-columns:1fr} .cmpVsX{padding:0; text-align:center} }
.cmpTag{min-width:96px} .cmpTag.a{color:var(--accent-ink)} .cmpTag.b{color:var(--calm)}
#printSheet{display:none}
@media print{
  body > *:not(#printSheet){display:none!important}
  #printSheet{display:block!important; direction:rtl; font-family:"IBM Plex Sans Arabic",sans-serif; color:#000; padding:24px}
  #printSheet h1{font-size:22px; margin:0 0 4px} #printSheet .ps-sub{color:#444; margin-bottom:16px}
  #printSheet table{width:100%; border-collapse:collapse; font-size:14px} #printSheet th,#printSheet td{border-bottom:1px solid #ccc; padding:8px; text-align:right}
  #printSheet .ps-sum{margin:0 0 14px; line-height:1.9; font-size:14px}
  #printSheet td.n{font-weight:700} #printSheet .ps-foot{margin-top:14px; color:#666; font-size:12px}
}
.cmpGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px}
.cmpCard{padding:12px 14px}
.cmpCard .cmpBig{font-size:22px; font-weight:700; margin:6px 0 2px}
.cmpv{font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace; font-weight:700; white-space:nowrap}
.cmpv.up{color:#2E9E6A} .cmpv.down{color:var(--crit)} .cmpv.flat{color:var(--ink-3)}
:root[data-theme="dark"] .cmpv.up{color:#5BD08F}
.spark{display:block}
.tlKey{display:inline-flex; gap:8px; align-items:center; font-size:12px; color:var(--ink-3); margin-inline-start:auto}
.tlKey i{display:inline-block; width:18px; height:3px; border-radius:2px}
.tlKey i.dash{background:repeating-linear-gradient(90deg,var(--ink-3) 0 5px,transparent 5px 9px)}
.mkGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:10px}
.mkCard{all:unset; cursor:pointer; display:flex; flex-direction:column; gap:4px; padding:12px 14px; border:1px solid var(--line); border-radius:var(--r); background:var(--surface)}
.mkCard b{font-size:14.5px; color:var(--ink)}
.mkCard small{font-size:11.5px; color:var(--ink-3)}
.mkCard:hover{border-color:var(--line-strong)}
.mkCard.on{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft); background:var(--accent-soft)}
.mkCard.on b{color:var(--accent-ink)}
.mkCard:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.mkCard[disabled]{cursor:default; opacity:.7}
/* «المظهر والألوان»: theme swatches */
.thGrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px}
.thSw{all:unset; cursor:pointer; display:flex; flex-direction:column; gap:6px; padding:8px; border:1px solid var(--line); border-radius:14px; background:var(--surface); transition:border-color .15s, box-shadow .15s}
.thSw:hover{border-color:var(--line-strong)}
.thSw.on{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.thSw:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.thPrev{display:block; height:76px; border-radius:10px; border:1px solid; padding:10px; box-sizing:border-box}
.thCard{display:block; position:relative; height:100%; border-radius:8px; border:1px solid; padding:8px 10px; box-sizing:border-box}
.thBar{display:block; width:40%; height:6px; border-radius:3px; margin-bottom:6px}
.thLine{display:block; width:75%; height:4px; border-radius:2px; margin-bottom:5px; opacity:.85}
.thLine.s{width:55%}
.thChip{position:absolute; left:8px; bottom:6px; font-size:10px; font-weight:700; line-height:1; padding:3px 6px; border-radius:99px; border:1px solid}
.thName{font-size:12.5px; font-weight:600; text-align:center; color:var(--ink)}
.thSw.on .thName{color:var(--accent-ink)}
.thLogoImg{width:64px; height:64px; object-fit:contain; border-radius:12px; background:var(--surface-2); border:1px solid var(--line); padding:6px}
.thDots{display:inline-flex; gap:6px}
.thDots span{width:22px; height:22px; border-radius:50%; border:2px solid var(--surface); box-shadow:0 0 0 1px var(--line)}
/* «يُحضَّر بالطلب»: the expected amount in the place of «اطلب» — read, not typed */
.row.mto .mtoQty{min-width:118px; height:44px; display:flex; align-items:center; justify-content:center; padding:0 14px; box-sizing:border-box;
  border:1px dashed var(--line-strong); border-radius:var(--r-sm); background:var(--surface-2); font-family:var(--num-font,inherit); font-size:20px; font-weight:700; color:var(--ink); direction:ltr}
/* «قائمة الأصناف»: the drag handle and where the row will land */
.itDrag{display:inline-flex; align-items:center; justify-content:center; width:26px; height:30px; margin-inline-end:4px; border-radius:var(--r-sm); color:var(--ink-3); cursor:grab; font-size:16px; user-select:none; vertical-align:middle}
.itDrag:hover{background:var(--surface-2); color:var(--ink)}
.itDrag:active{cursor:grabbing}
tr.dragging{opacity:.45}
tr.dropBefore td{box-shadow:inset 0 3px 0 var(--accent)}
tr.dropAfter td{box-shadow:inset 0 -3px 0 var(--accent)}
.defPick.dragging{opacity:.45}
.grpSec.dragging{opacity:.45}
.paneSec[draggable="true"]{cursor:grab} .paneSec[draggable="true"]:active{cursor:grabbing}
.paneSec.dragging{opacity:.4; transform:scale(.98)}
.paneSec.dropBefore{box-shadow:inset -4px 0 0 var(--accent)} .paneSec.dropAfter{box-shadow:inset 4px 0 0 var(--accent)}
[dir="ltr"] .paneSec.dropBefore{box-shadow:inset 4px 0 0 var(--accent)} [dir="ltr"] .paneSec.dropAfter{box-shadow:inset -4px 0 0 var(--accent)}
.grpSec.dropInto{border-color:var(--accent)!important; box-shadow:0 0 0 3px var(--accent-soft)}
.grpSec.dropBefore{box-shadow:inset -3px 0 0 var(--accent)}
.grpSec.dropAfter{box-shadow:inset 3px 0 0 var(--accent)}
[dir="ltr"] .grpSec.dropBefore{box-shadow:inset 3px 0 0 var(--accent)}
[dir="ltr"] .grpSec.dropAfter{box-shadow:inset -3px 0 0 var(--accent)}
.defPick[draggable="true"]{cursor:grab}
.defPick.dropBefore{box-shadow:inset -3px 0 0 var(--accent)}
.defPick.dropAfter{box-shadow:inset 3px 0 0 var(--accent)}
[dir="ltr"] .defPick.dropBefore{box-shadow:inset 3px 0 0 var(--accent)}
[dir="ltr"] .defPick.dropAfter{box-shadow:inset -3px 0 0 var(--accent)}
.card-range{display:flex; align-items:center; gap:10px 16px; flex-wrap:wrap; padding:10px 14px; margin:0 0 12px; border:1px dashed var(--line); border-radius:12px; background:var(--surface)}
.card-range.own{border-style:solid; border-color:var(--accent-line); background:var(--accent-soft)}
.card-range .lbl{font-weight:700; margin:0}
.card-range .crf{display:inline-flex; align-items:center; gap:8px; margin:0}
.card-range .crf span{font-size:13px; color:var(--ink-2); white-space:nowrap}
.card-range .crf input{width:160px; height:36px; padding:4px 10px}
.card-range .chip{margin:0}
.card-range .btn{height:34px; padding-block:0}
.pane-badge{margin-inline-start:auto; align-self:center; font-size:11px; font-weight:700; padding:2px 8px; border-radius:99px; background:var(--accent-soft); color:var(--accent-ink); white-space:nowrap}
.paneSec.on .pane-badge{background:var(--surface); color:var(--accent-ink)}
.pane.pane-enter, .cp-panel.pane-enter, .uiGroup.pane-enter, .pane-enter{animation:foldIn .26s cubic-bezier(.2,.8,.2,1)}
.folds-bar{display:flex; align-items:center; gap:10px; margin:26px 0 10px}
.folds-bar h3{font-size:13px; font-weight:700; color:var(--ink-3); letter-spacing:.02em}
.folds-bar .line{flex:1; height:1px; background:var(--line)}
.folds-bar button{all:unset; font-size:12px; color:var(--ink-3); cursor:pointer; padding:2px 6px; border-radius:6px}
.folds-bar button:hover{color:var(--accent-ink); background:var(--accent-soft)}
.folds{display:flex; flex-direction:column; gap:10px}
.fold{border:1px solid var(--line); border-radius:14px; background:var(--surface); overflow:hidden; transition:border-color .18s, box-shadow .18s, transform .18s}
.fold:hover{border-color:var(--line-strong); box-shadow:var(--shadow)}
.fold.open{border-color:var(--accent-line); box-shadow:var(--shadow)}
.fold-head{all:unset; box-sizing:border-box; width:100%; display:flex; align-items:center; gap:14px; padding:13px 16px; cursor:pointer}
.fold-head:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; border-radius:14px}
.fold .fic{width:40px; height:40px; flex:none; border-radius:12px; display:grid; place-items:center; background:var(--accent-soft); color:var(--accent-ink); transition:background .18s, color .18s}
.fold.open .fic{background:var(--accent); color:var(--on-accent)}
.fold .fic svg{width:20px; height:20px}
.fold .ft{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
.fold .ft b{font-size:14.5px; font-weight:700; color:var(--ink)}
.fold .ft small{font-size:12px; color:var(--ink-3); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fold .fchips{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end}
.fold .fchips .chip{font-size:11.5px}
.fold .fchev{width:18px; height:18px; flex:none; color:var(--ink-3); transition:transform .22s}
.fold.open .fchev{transform:rotate(180deg); color:var(--accent-ink)}
.fold-body{padding:2px 16px 16px; border-top:1px solid var(--line)}
.fold-body > .section-head{margin-top:12px}
.fold-body > .section-head h2{display:none}          /* the card's own title says it */
#view.view-enter{animation:viewIn .22s cubic-bezier(.2,.8,.2,1)}
@keyframes viewIn{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
.btn, .cp-sec, .paneSec, #tabs button, .stepBtn, .matStep{transition:transform .12s cubic-bezier(.2,.8,.2,1), background-color .16s ease, border-color .16s ease, color .16s ease, box-shadow .16s ease}
.btn:active:not(:disabled), .cp-sec:active, .paneSec:active, #tabs button:active, .stepBtn:active, .matStep:active{transform:scale(.97)}
.outBox{animation:outFade .16s ease-out} .outBox .outCard{animation:outPop .22s cubic-bezier(.2,.8,.2,1)}
.outBox.closing{animation:outFadeOff .15s ease-in forwards} .outBox.closing .outCard{animation:outPopOff .15s ease-in forwards}
@keyframes outFade{from{opacity:0} to{opacity:1}} @keyframes outFadeOff{to{opacity:0}}
@keyframes outPop{from{opacity:0; transform:translateY(10px) scale(.98)} to{opacity:1; transform:none}} @keyframes outPopOff{to{opacity:0; transform:translateY(6px) scale(.985)}}

@keyframes foldIn{from{opacity:0; transform:translateY(-4px)} to{opacity:1; transform:none}}
/* the feel of a native app: presses answer at once, states glide */
.btn, .cp-sec, .isegb, .thSw, .mkCard, .stepper button, .defPick{transition:transform .12s ease, background-color .18s ease, border-color .18s ease, box-shadow .18s ease, color .18s ease}
.btn:active, .cp-sec:active, .isegb:active, .thSw:active, .mkCard:active, .stepper button:active, .defPick:active{transform:scale(.97)}
.cp-sec .chev{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
input, select, textarea{transition:border-color .15s ease, box-shadow .15s ease}
/* numbers: no spin arrows over the value, and room for the whole number */
input[type=number]{-moz-appearance:textfield; appearance:textfield}
input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none; appearance:none; margin:0}
/* ---------- the opening: the app's mark, its three bars filling in, the name — then the app ---------- */
#intro{position:fixed; inset:0; z-index:9999; display:grid; place-items:center; background:var(--bg); pointer-events:none; transition:opacity .6s cubic-bezier(.4,0,.2,1), visibility .6s}
#intro.done .in-box{transform:scale(1.04); transition:transform .6s cubic-bezier(.4,0,.2,1)}
#intro.done{opacity:0; visibility:hidden}
#intro.appIn .in-box{animation:appIn .42s cubic-bezier(.2,.8,.2,1) both}
@keyframes appIn{from{opacity:0; transform:translateY(10px) scale(.985)} to{opacity:1; transform:none}}
#intro .in-box{display:flex; flex-direction:column; align-items:center; gap:18px}
#intro svg{width:92px; height:92px; filter:drop-shadow(0 18px 40px rgba(0,0,0,.25)); animation:inPop 1s cubic-bezier(.2,1.25,.3,1) both}
#intro .bar{transform-box:fill-box; transform-origin:left center; animation:inBar .8s cubic-bezier(.2,.8,.2,1) both}
[dir="rtl"] #intro .bar{transform-origin:left center}
#intro .b1{animation-delay:.5s} #intro .b2{animation-delay:.75s} #intro .b3{animation-delay:1s}
#intro .in-name{font-family:"IBM Plex Sans Arabic",system-ui,sans-serif; font-weight:700; font-size:26px; letter-spacing:.5px; color:var(--ink); animation:inUp .8s 1.2s cubic-bezier(.2,.8,.2,1) both}
#intro .in-sub{font-size:12.5px; color:var(--ink-3); letter-spacing:2px; margin-top:-10px; animation:inUp .8s 1.5s cubic-bezier(.2,.8,.2,1) both}
#intro .in-line{width:120px; height:3px; border-radius:3px; background:var(--surface-3); overflow:hidden}
#intro .in-line i{display:block; height:100%; width:40%; border-radius:3px; background:var(--accent); animation:inSweep 1.3s .4s cubic-bezier(.4,0,.2,1) infinite}
@keyframes inPop{from{opacity:0; transform:scale(.6)} to{opacity:1; transform:none}}
@keyframes inBar{from{transform:scaleX(0)} to{transform:scaleX(1)}}
@keyframes inUp{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
/* signing out: the same mark, its bars emptying one after another, a goodbye — then the sign-in screen */
#intro.outro{animation:outIn .45s ease}
#intro.outro svg:not(.out-mark){animation:none}
#intro.outro .bar{animation:outBar .55s cubic-bezier(.4,0,.2,1) forwards}
#intro.outro .b3{animation-delay:.45s} #intro.outro .b2{animation-delay:.65s} #intro.outro .b1{animation-delay:.85s}
#intro.outro .in-name, #intro.outro .in-sub{animation:inUp .6s .3s cubic-bezier(.2,.8,.2,1) both}
#intro.outro .in-line{display:none}
#intro.outro .in-sub{letter-spacing:0; font-size:14px; color:var(--ink-2)}
@keyframes outIn{from{opacity:0} to{opacity:1}}
/* the sign-out mark: a door, an arrow leaving through it, the door closing, a check — «you are out, safely» */
#intro .out-mark{width:96px; height:96px; filter:drop-shadow(0 18px 40px rgba(0,0,0,.25)); animation:inPop .6s cubic-bezier(.2,1.25,.3,1) both}
#intro .out-mark .door{stroke-dasharray:220; stroke-dashoffset:220; animation:draw .6s .25s ease forwards}
#intro .out-mark .arrow{stroke-dasharray:80; stroke-dashoffset:80; animation:draw .45s .7s ease forwards, leave .6s 1.25s cubic-bezier(.4,0,.2,1) forwards}
#intro .out-mark .shut{transform-box:fill-box; transform-origin:right center; transform:scaleX(0); animation:shut .35s 1.6s cubic-bezier(.2,.8,.2,1) forwards}
#intro .out-mark .tick{stroke-dasharray:40; stroke-dashoffset:40; animation:draw .4s 1.95s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes leave{to{transform:translateX(-26px); opacity:0}}
@keyframes shut{to{transform:scaleX(1)}}
@keyframes outBar{from{transform:scaleX(1)} to{transform:scaleX(0)}}
@keyframes inSweep{from{transform:translateX(-120%)} to{transform:translateX(260%)}}
/* «المساعد الذكي ✨» — a floating (or pinned) window over the app; the same assistant, shown in a window */
.asstchip{display:inline-flex; align-items:center; gap:6px; font-family:inherit; font-size:13px; font-weight:600; color:var(--accent-ink); background:var(--accent-soft);
  border:1px solid var(--accent-line); border-radius:99px; padding:4px 12px; cursor:pointer; white-space:nowrap}

  border:1px solid var(--line-strong); border-radius:14px; box-shadow:0 18px 50px -12px rgba(0,0,0,.45), 0 2px 8px rgba(0,0,0,.18); overflow:hidden}

.asst-head .ttl{font-weight:700; font-size:14px; white-space:nowrap}
.asst-head .ctx{flex:1; min-width:0; font-size:11.5px; color:var(--ink-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.asst-head .wb{width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center; border-radius:8px; border:0; background:transparent;
  color:var(--ink-2); cursor:pointer; font-size:15px; line-height:1}
.asst-head .wb:hover{background:var(--surface-3); color:var(--ink)}

.asst{display:flex; flex-direction:column; gap:10px; flex:1; min-height:0; padding:12px}

.rz[data-d="e"],.rz[data-d="w"]{top:10px; bottom:10px; width:7px; cursor:ew-resize}
.rz[data-d="n"]{top:-3px} .rz[data-d="s"]{bottom:-3px} .rz[data-d="e"]{right:-3px} .rz[data-d="w"]{left:-3px}
.rz[data-d="ne"],.rz[data-d="nw"],.rz[data-d="se"],.rz[data-d="sw"]{width:14px; height:14px}
.rz[data-d="ne"]{top:-3px; right:-3px; cursor:nesw-resize} .rz[data-d="sw"]{bottom:-3px; left:-3px; cursor:nesw-resize}
.rz[data-d="nw"]{top:-3px; left:-3px; cursor:nwse-resize} .rz[data-d="se"]{bottom:-3px; right:-3px; cursor:nwse-resize}
.asstwin.max .rz, .asstwin.pinned .rz{display:none}

  box-shadow:0 10px 28px -8px rgba(0,0,0,.45)}

.asst-msg.bot{align-self:flex-start; background:var(--surface-2); color:var(--ink); border:1px solid var(--line)}
.asst-msg.me{align-self:flex-end; background:var(--accent-soft); color:var(--ink); border:1px solid var(--accent-line)}

.asst-form{display:flex; gap:8px; align-items:flex-end}
.asst-form textarea{flex:1; min-height:46px; max-height:160px; resize:vertical; font-family:inherit; font-size:14px; padding:10px 12px; border-radius:var(--r-sm); border:1px solid var(--line-strong); background:var(--surface); color:var(--ink)}
.asst-form textarea:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:var(--accent)}
.noteRow{display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent)}
.noteRow:last-child{border-bottom:0}
.noteRow .tx{flex:1; min-width:0; font-size:12.5px; color:var(--ink-2); line-height:1.6}
.noteRow .tx b{color:var(--ink); font-weight:600}
/* calm tables (the owner: «the borders are too much, it feels crowded»): no column rules, faint row lines, and the
   boxes inside a table show their frame only when the pointer is on the row or the box is being typed in */
td{border-bottom-color:color-mix(in srgb, var(--line) 60%, transparent)}
tbody tr:hover > td{background:color-mix(in srgb, var(--surface-2) 55%, transparent)}
td input:not([type="checkbox"]), td select{border-color:var(--line-2,var(--line)); background:var(--surface)}
tbody tr:hover td input:not([type="checkbox"]), tbody tr:hover td select{border-color:var(--line)}
td input:not([type="checkbox"]):focus, td select:focus{border-color:var(--accent); background:var(--surface)}
/*
 * Numbers carry direction:ltr so a sign, a slash or a decimal point keeps its
 * order — but that flips what `start` means, and the value would drift away
 * from its own right-aligned Arabic header. Aligning them to the right edge
 * explicitly puts every figure directly under the column it belongs to.
 */
td.n{font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace; font-variant-numeric:tabular-nums; direction:ltr; text-align:center}
td input{padding:5px 7px; font-size:13px; text-align:center; font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace}
td .w70{width:84px} td .w90{width:96px}
td .w130{width:100%; min-width:170px; max-width:280px; text-align:start; font-family:inherit}
td > div[style*="display:flex"], td > label[style*="inline-flex"]{justify-content:center}
/* The label column absorbs the spare width so the data columns pack tight
   against their headers instead of being stretched apart on a wide screen. */
table th:not(:first-child), table td:not(:first-child){white-space:nowrap}
input[type="checkbox"]{width:auto; cursor:pointer}
/* EVERY checkbox in the app is this on/off switch (the owner: «anything that turns on and off, a switch like the status one») (يعمل / موقوف) — a product, a material, an offer or a recipe is switched off, never lost.
   In the theme's own colours (plum/lilac accent, the knob in the colour that sits on the accent, like the section icons).
   As in the owner's sample: «on» = filled, white knob on the RIGHT; «off» = grey, knob on the left (physical sides,
   not mirrored by the right-to-left page). */
input[type="checkbox"]{appearance:none; -webkit-appearance:none; width:42px; height:24px; flex:none; margin:0; transform:none; position:relative;
  border-radius:999px; background:var(--surface-3); border:1px solid var(--line-strong); cursor:pointer; transition:background .15s, border-color .15s; vertical-align:middle}
input[type="checkbox"]::before{content:""; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
  background:var(--ink-3); box-shadow:0 1px 3px rgba(0,0,0,.35); transition:left .15s, background .15s}
input[type="checkbox"]:checked{background:var(--accent); border-color:var(--accent)}
input[type="checkbox"]:checked::before{left:20px; background:#fff}
input[type="checkbox"]:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
input[type="checkbox"]:disabled{opacity:.5; cursor:not-allowed}
input[type="range"]{
  padding:0; border:0; background:transparent; accent-color:var(--accent);
  cursor:pointer; height:22px;
}
input[type="range"]:focus{outline:2px solid var(--accent); outline-offset:3px; border-radius:4px}

.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; margin-top:12px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 14px}
.card .lbl{font-size:11.5px; color:var(--ink-3); font-weight:600}
.card .val{font-size:24px; font-weight:600; font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace; font-variant-numeric:tabular-nums; direction:ltr; text-align:right; margin-top:3px; line-height:1.15}
.card .hint{font-size:11.5px; color:var(--ink-3); margin-top:4px; line-height:1.5}
.card.good .val{color:var(--accent-ink)} .card.warn .val{color:var(--warn)} .card.bad .val{color:var(--crit)}

.stack{display:flex; flex-direction:column; gap:8px}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
/* Running prose stays at a readable measure however wide the window gets. */

.section-head .note{max-width:96ch}
.banner .grow{max-width:110ch}

.footbar{
  position:fixed; inset-inline:0; bottom:0; z-index:30;

}

.toast{
  position:fixed; inset-inline:0; bottom:calc(74px + env(safe-area-inset-bottom,0px)); z-index:60;
  display:flex; justify-content:center; pointer-events:none; padding-inline:16px;
}

}

.usr{border:1px solid var(--line); border-radius:var(--r); padding:12px 14px; background:var(--surface); margin-top:10px}

/* control panel: every section behind its own button */

.gatelogo{width:68px; height:68px; border-radius:19px; overflow:hidden; flex:none;
  box-shadow:var(--shadow-lift), 0 0 0 6px color-mix(in srgb, var(--accent-soft) 60%, transparent)}
.gatelogo svg{width:100%; height:100%; display:block}
.gatename{font-size:22px; font-weight:700; color:var(--ink); letter-spacing:-.01em; line-height:1.1; direction:ltr; unicode-bidi:isolate}
.gatecard h2{font-size:19px; margin:0 0 4px; text-align:center}
.gatecard #gateSub{text-align:center}
.gatecard .fld{display:block; margin-top:12px}
.gatecard .fld input{width:100%; direction:ltr; text-align:left}
.gatecard #gateBtn{width:100%; margin-top:16px; padding-block:10px}
.gatecard #gateOut{margin-top:10px}
.gatemsg{margin-top:12px; padding:10px 12px; border-radius:var(--r-sm); font-size:13px; line-height:1.6;
  background:var(--crit-soft); border:1px solid var(--crit-line); color:var(--crit)}
.gatemsg.info{background:var(--surface-2); border-color:var(--line); color:var(--ink-2)}
.gatefoot{font-size:11.5px; margin-top:14px}
.perm-group{border:1px solid var(--line); border-radius:var(--r-sm); padding:10px 12px; background:var(--surface-2); margin-top:10px}
.perm-group h4{margin:0 0 6px; font-size:13px}
.perm-list{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:4px 14px}
.perm-list label{display:flex; gap:8px; align-items:flex-start; font-size:13px; cursor:pointer}
.perm-list input{accent-color:var(--accent); margin-top:3px}
.cp-state-on{color:var(--accent-ink); font-weight:600}
.cp-state-off{color:var(--crit); font-weight:600}
.about{text-align:center; padding:20px 16px}
.about .pname{font-size:15px; font-weight:600; color:var(--ink)}
.about .ver{font-size:12.5px; color:var(--ink-3); margin:4px 0 16px; font-family:"IBM Plex Mono","IBM Plex Sans Arabic",monospace}
.about .dev-l{font-size:12px; color:var(--ink-3)}
.about .dev{font-size:16px; font-weight:700; color:var(--ink); margin:2px 0 16px}
.about .copy{font-size:11.5px; color:var(--ink-3)}

<script>
"use strict";
document.documentElement.setAttribute("lang","ar");
document.documentElement.setAttribute("dir","rtl");

/* ===================== language: Arabic as built, English as a layer over it =====================
 * The screens are written in Arabic and stay exactly so in Arabic. In English, everything the page shows —
 * text, titles, placeholders, dialogs, toasts — passes through one dictionary (src/i18n-en.json, injected
 * at build as window.I18N_EN): a whole text first, then its known fragments (longest first, whole words).
 * What the shop typed — product, branch, material, occasion and user names — is left as written.
 * The layout turns left-to-right. Nothing in the logic or the data changes with the language.
 */
var LANG=(function(){ try{ return localStorage.getItem("talabia-lang")==="en"?"en":"ar" }catch(e){ return "ar" } })();
var I18N=null;
function i18nPrep(){
  if(I18N) return I18N;
  var d=window.I18N_EN||{};
  var subs=Object.keys(d).filter(function(k){return k.replace(/[^ء-ي]/g,"").length>=3}).sort(function(a,b){return b.length-a.length});
  var rx=function(s){return s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")};
  // a piece is only taken whole: where it starts or ends on a letter, the letter beside it must not be Arabic
  var L="\\u0621-\\u064A\\u064B-\\u0652", isL=/[ء-يً-ْ]/;
  var alt=subs.map(function(k){ return (isL.test(k.charAt(0))?"(?<!["+L+"])":"")+rx(k)+(isL.test(k.charAt(k.length-1))?"(?!["+L+"])":"") });
  I18N={dict:d, re:alt.length?new RegExp(alt.join("|"),"g"):null};
  return I18N;
}
/** The names the shop typed: never translated. Refreshed on every render. */
var I18N_KEEP=[];
function i18nKeepRefresh(){
  var out={}, add=function(s){ s=String(s==null?"":s).trim(); if(s&&/[؀-ۿ]/.test(s)) out[s]=1 };
  try{
    (window.S&&S.products||[]).forEach(function(p){add(p.name); (p.aliases||[]).forEach(add); (p.aliasList||[]).forEach(add)});
    (window.S&&S.events||[]).forEach(function(e){add(e.name)});
    (window.S&&S.ws&&S.ws.branches||[]).forEach(function(b){add(b.name)});
    (window.S&&S.cat&&S.cat.items||[]).forEach(function(i){add(i.name);add(i.unit)});
    (window.S&&S.products||[]).forEach(function(p){ if(p.unit&&!/^(حبة|كجم|جرام|علبة|صينية|كرتون|لتر|كيس|طبق|كوب|قطعة|جم|مل)$/.test(p.unit)) add(p.unit) });
    if(window.CP&&CP.users) CP.users.forEach(function(u){add(u.name)});
    // the names read from a sales file being imported are the file's, as written
    var imp=window.S&&S.imp, pc=imp&&imp.cols?imp.cols.product:-1;
    if(imp&&imp.rows&&pc>=0) imp.rows.slice(1,5001).forEach(function(r){ if(r) add(r[pc]) });
    if(window.S&&S.cloud&&S.cloud.access) add(S.cloud.access.name);
  }catch(e){}
  I18N_KEEP=Object.keys(out).sort(function(a,b){return b.length-a.length});
}
function tr(s){
  if(LANG!=="en"||s==null) return s;
  s=String(s);
  if(!/[؀-ۿ]/.test(s)) return s;
  s=s.replace(/[\u2068\u2069]/g,"");   // isolation marks from an earlier pass, set again below
  var I=i18nPrep(), core=s.trim();
  if(I18N_KEEP.indexOf(core)>=0) return s;
  if(I.dict[core]!=null) return s.replace(core,I.dict[core]);
  // the shop's own names inside a sentence are set aside first, and put back untouched
  var kept=[], out=s;
  I18N_KEEP.forEach(function(k){ if(out.indexOf(k)>=0){ out=out.split(k).join(""+kept.length+""); kept.push(k) } });
  if(I.re) out=out.replace(I.re,function(m){ return I.dict[m] });
  // the short words the pieces above leave between numbers: a day's initial, «9ي» days, «من» / «في»
  out=out.replace(/(^|[^ء-ْ])([حنثرخجس])(?= ?\d|$)/g,function(m,p,c){ return p+{"ح":"Su","ن":"Mo","ث":"Tu","ر":"We","خ":"Th","ج":"Fr","س":"Sa"}[c] })
    .replace(/(\d|\/) ?ي(?![ء-ْ])/g,"$1d")
    .replace(/(^|[^ء-ْ])من(?= \d+(:\d\d)? ?(AM|PM))/g,"$1from")
    .replace(/(^|[^ء-ْ])من(?= \d)/g,"$1of")
    .replace(/(^|[^ء-ْ])في(?= \d)/g,"$1in");
  out=out.replace(/،/g,",").replace(/؛/g,";").replace(/؟/g,"?").replace(/٪/g,"%")
    .replace(/(^|[^\d.])(\d+(?:\.\d+)?) (day|product|item|material|branch|row)(?![a-z])/g,function(m,p,n,w){ return p+n+" "+(+n===1?w:w==="branch"?"branches":w+"s") });
  // a name kept in Arabic sits isolated, so the «» around it and the English beside it keep their order
  return kept.length?out.replace(/(\d+)/g,function(m,i){return "\u2068"+kept[+i]+"\u2069"}):out;
}
var I18N_ATTRS=["title","placeholder","aria-label"];
function trNode(root){
  if(LANG!=="en"||!root) return;
  if(root.nodeType===3){ var v=tr(root.nodeValue); if(v!==root.nodeValue) root.nodeValue=v; return }
  if(root.nodeType!==1) return;
  if(/^(SCRIPT|STYLE|TEXTAREA)$/.test(root.tagName)) return;
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
    var p=n.parentNode; return p&&/^(SCRIPT|STYLE|TEXTAREA)$/.test(p.tagName)?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT }});
  var n, list=[]; while((n=w.nextNode())) if(/[؀-ۿ]/.test(n.nodeValue)) list.push(n);
  list.forEach(function(t){ var v=tr(t.nodeValue); if(v!==t.nodeValue) t.nodeValue=v });
  var els=[root].concat(Array.prototype.slice.call(root.querySelectorAll("[title],[placeholder],[aria-label]")));
  els.forEach(function(el){ I18N_ATTRS.forEach(function(a){ var v=el.getAttribute&&el.getAttribute(a); if(v&&/[؀-ۿ]/.test(v)){ var t=tr(v); if(t!==v) el.setAttribute(a,t) } }) });
}
function applyLang(){
  var en=LANG==="en";
  document.documentElement.setAttribute("lang",en?"en":"ar");
  document.documentElement.setAttribute("dir",en?"ltr":"rtl");
  var app=document.querySelector(".app"); if(app){ app.setAttribute("dir",en?"ltr":"rtl"); app.setAttribute("lang",en?"en":"ar") }
  var lb=document.getElementById("langBtn"); if(lb){ lb.firstElementChild.textContent=en?"ع":"EN"; lb.title=en?"العربية":"English" }
  if(!en) return;
  i18nKeepRefresh();
  trNode(document.body);
  document.title=tr(document.title);
}
if(LANG==="en"){
  // every change to the page — a redraw, a toast, a dialog — is translated as it lands
  new MutationObserver(function(muts){
    muts.forEach(function(m){
      if(m.type==="characterData") trNode(m.target);
      else if(m.type==="attributes"){ var v=m.target.getAttribute(m.attributeName); if(v&&/[؀-ۿ]/.test(v)){ var t=tr(v); if(t!==v) m.target.setAttribute(m.attributeName,t) } }
      else m.addedNodes.forEach(function(n){ trNode(n) });
    });
  }).observe(document.documentElement,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:I18N_ATTRS});
  var _confirm=window.confirm.bind(window), _alert=window.alert.bind(window);
  window.confirm=function(s){return _confirm(tr(s))};
  window.alert=function(s){return _alert(tr(s))};
  document.addEventListener("DOMContentLoaded",applyLang);
}
var catP=null;   // the catalogue write in flight, so a language switch waits for it
function setLang(l){
  try{ localStorage.setItem("talabia-lang",l==="en"?"en":"ar"); sessionStorage.setItem("talabia-tab",(window.S&&S.tab)||"") }catch(e){}
  // nothing typed is lost: pending writes land before the page comes back in the other language
  try{ flushSave(); if(catT) saveCatalog(true) }catch(e){}
  Promise.all([opChain,catP]).catch(function(){}).then(function(){
    if(window.desktop&&window.desktop.reloadPage) window.desktop.reloadPage(); else location.reload();
  });
}

/* Every screen size: the reference is a 1920×1080 screen at Windows' 125%
   (1536 wide), where nothing changes. A bigger screen scales the whole page up
   by one factor, a smaller laptop scales it down so every column shows whole —
   the same layout everywhere, only larger or smaller. */
(function(){
  var DESIGN_WIDTH=1536, MIN_ZOOM=0.6, MAX_ZOOM=1.6;
  function fitToWindow(){
    var z=Math.max(MIN_ZOOM,Math.min(MAX_ZOOM,window.innerWidth/DESIGN_WIDTH));
    document.documentElement.style.zoom=Math.abs(z-1)<0.005?"":z.toFixed(3);
  }
  fitToWindow();
  window.addEventListener("resize",fitToWindow);
})();

/* The shop's identity, injected at build time; the defaults keep the page
   usable on its own. Nothing else in this script hard-codes a brand. */
var BRAND=Object.assign({key:"caneles",wordmark:"CANELÉS",title:"طلبية | Talabia",branch:"فرع النرجس"},window.BRAND||{});
var APP_NAME=window.APP_NAME||"طلبية | Talabia";   // inside the app
var APP_EXT=window.APP_EXT||"Talabia";              // window title / taskbar
(function(){
  // The window and the taskbar carry the shop's name alone; what the app does
  // is said inside it, beside the mark.
  document.title=APP_EXT;
  // the app's name on top of the header (the brand and branch sit beneath it)
  var an=document.getElementById("appName"); if(an) an.textContent=APP_EXT;
  var tc=document.getElementById("todayChip");
  if(tc){ var d0=new Date(); tc.textContent=String(d0.getDate()).padStart(2,"0")+"/"+String(d0.getMonth()+1).padStart(2,"0")+"/"+d0.getFullYear(); }
  var m=document.getElementById("wordmark"); if(m) m.textContent=BRAND.wordmark;
})();

/* ===================== brand & theme ===================== */
/*
 * A single-brand build carries one identity in window.BRAND. The combined
 * build also carries every brand in window.BRANDS, and the page re-dresses
 * itself in the open branch's brand: its colour tokens, its wordmark and its
 * default light or dark. Each brand remembers its own light/dark choice.
 */
var BRANDS=(Array.isArray(window.BRANDS)&&window.BRANDS.length)?window.BRANDS:null;
// the brands the owner added (company.json on this computer), dressed like a built-in brand, and the parent company
var COMPANY="Cake Village";
var BRANDS_PAUSED=[], BRANDS_DELETED=[];
(function(){
  try{
    var c=window.desktop&&window.desktop.brandsSync?window.desktop.brandsSync():null;
    if(c&&BRANDS){
      (c.brands||[]).forEach(function(b){
        if(!b||!b.key||BRANDS.some(function(x){return x.key===b.key})) return;

 * What the occasion ACTUALLY did, measured from the record: average demand

/** Sales on a stockout day understate real demand — lift them back up. */
function demandOf(e){
  if(!e) return 0;
  var sold=+e.sold||0;

  if(e.stockout){
    if(e.lost>0) return sold+(+e.lost);
    return sold/0.82;
  }
  return sold;
}
/**
 * Is this a sales observation? Sold recorded (a quantity, 0 included: a confirmed zero) — yes.
 * No entry, or an entry with only waste / a stockout tick and no sold typed — missing data, left out.

function hasSold(e){ return !!e&&e.sold!=null&&e.sold!=="" }

  return Object.keys(S.days).sort().map(function(k){return S.days[k]});
}
/** Pooled day-of-week index, shrunk toward the Riyadh baseline until data earns its weight. */
function learnDow(){
  var hist=learnHist();
  if(hist.length<14){S.dowIndex=DEFAULT_DOW.slice();return}
  var buckets=[[],[],[],[],[],[],[]];
  for(var i=0;i<hist.length;i++){
    var rec=hist[i], d=parseYmd(rec.date), tot=0;
    for(var pid in rec.items) tot+=demandOf(rec.items[pid]);
    if(tot<=0) continue;
    var deseason=payFactor(d)*eventFactor(d,S.events);
    if(deseason>0) buckets[d.getDay()].push(tot/deseason);
  }
  var means=buckets.map(function(b){return b.length?avg(b):null});
  if(means.some(function(m){return m===null})){S.dowIndex=DEFAULT_DOW.slice();return}
  var gm=avg(means);
  if(gm<=0){S.dowIndex=DEFAULT_DOW.slice();return}
  var w=clamp(hist.length/56,0,1);   // full confidence at 8 weeks of data
  var raw=means.map(function(m,i){return w*(m/gm)+(1-w)*DEFAULT_DOW[i]});
  var norm=avg(raw);
  S.dowIndex=raw.map(function(x){return x/norm});
}
/** Per-product level (EWMA of deseasonalised demand) and forecast error spread. */
function learnProducts(){
  var hist=learnHist();
  S.model={};
  for(var pi=0;pi<S.products.length;pi++){
    var p=S.products[pi], base=null, errs=[], n=0, past=[];
    for(var i=0;i<hist.length;i++){
      var rec=hist[i], e=rec.items?rec.items[p.id]:null;
      if(!hasSold(e)) continue;                    // missing data is not an observation
      var d=parseYmd(rec.date);
      var seas=S.dowIndex[d.getDay()]*payFactor(d)*eventFactor(d,S.events);
      if(seas<=0) continue;
      var dem=demandOf(e), des=dem/seas;
      if(base===null){base=des}
      else{
        errs.push(dem-base*seas);
        past.push({k:rec.date, act:dem, fc:base*seas, des:des, seas:seas});   // what the model would have said that morning
        // A young branch is still climbing, and a settled one is not. Early
        // points get a heavy weight so the level tracks the last few days
        // instead of being anchored to opening week; it relaxes to a steady
        // 0.25 once there are about a dozen days to lean on.
        var alpha=Math.max(0.25,2/(n+2));

    if(base===null){S.model[p.id]={base:0,sigma:0,n:0};continue}
    var sigma;
    if(errs.length>=6){sigma=Math.sqrt(sum(errs.map(function(x){return x*x}))/errs.length)}

/* The likely range shown beside a forecast («بين … و…») should hold about 8 times in 10. Measured on each product's

  if(R.length<60){ RANGE_K=1; RANGE_CAL={k:1, cover:null, n:R.length}; return }

var PAY_LEARNED=null;
/** Back to the market's own salary curve before each learning pass; learnPay puts a learned one back only if it still proves itself. */

/** Learn how the branch sells across the month (weekday taken out), shrink it toward the default, and keep it only if
 *  replaying the last 28 days per product shows a closer forecast. Otherwise the default curve stays, exactly. */
function learnPay(){
  S.payLearn={active:false};
  if(!PAY_LEARN.on) return;
  var hist=learnHist(); if(hist.length<PAY_LEARN.minDays) { S.payLearn.reason="days"; return }
  var tots=hist.map(function(r){ var t=0; for(var pid in r.items) if(hasSold(r.items[pid])) t+=demandOf(r.items[pid]); var d=parseYmd(r.date); return {d:d, v:t/(S.dowIndex[d.getDay()]*eventFactor(d,S.events)||1)} }).filter(function(x){return x.v>0});

function fmtX(v){ return String(Math.round(v*100)/100) }

  var n=vals.length; if(n<8) return 0;

  var num=0, den=0; for(var i=0;i<n;i++){ num+=(i-mx)*(vals[i]-my); den+=(i-mx)*(i-mx) }

 * it is used only if it would have brought the forecast closer by 3% or more. Never together with the trend. */

 * Some products keep a weekday rhythm of their own that the branch-wide weekday index does not see. For each product
 * the share of this second opinion (0, ¼, ½, ¾ or all) is the one that, replayed on its last 28 days, came closest —
 * and it is used only if that is 3% or more closer than the forecast alone. Never with the trend or a bias correction. */

function learnBlend(){

    var P=S.model[pid].past||[]; if(P.length<BLEND.test+21) return;
    if((S.trend&&S.trend[pid]&&S.trend[pid].active)||(S.bias&&S.bias[pid]&&S.bias[pid].active)) return;

      b.val.lines.forEach(function(l){
        if(l.kind!=="p") return;                                // a material line stays in the materials layer
        var t=ctx.byKey[l.ref]; if(!t) return;
        var q=mult*(+l.qty||0); if(!q) return;
        if(walk(productKeys(t),q,offerPid,depth+1,path.concat([keys[0]]))) return;
        (map[t.id]=map[t.id]||[]).push({offer:offerPid, qty:q});
      });
      return true;
    };
    S.products.forEach(function(o){
      if(o.active===false) return;
      if(walk(productKeys(o),1,o.id,0,[])) offers[o.id]=1;
    });
  }

}
function isOffer(p){ return !!offerMap().offers[p.id] }
/** The demand for product p on day d that comes from the offers containing it. */
function offerDemand(p,d){
  var lst=offerMap().map[p.id]; if(!lst) return 0;
  var t=0; lst.forEach(function(x){ var o=S.products.filter(function(y){return y.id===x.offer})[0]; if(o) t+=forecast(o,d)*x.qty });
  return t;
}
/** What an order has to cover for product p on day d: its own forecast, plus its offers' when switched on. */

/* ===================== order engine ===================== */
/**
 * What a product or material does on an order weekday: "m" ordered (the main order — its quantity covers until the
 * item's NEXT main order), "t" top-up (shown on that order for shortfalls and extras, never splitting the main
 * coverage), "x" not ordered that day. Untouched = ordered on every order day, exactly as before.
 */
function itemMode(key,dow){
  if(S.cfg.orderDays.indexOf(dow)<0) return "x";
  var v=((S.cfg.itemDays||{})[key]||{})[dow];
  return v==="t"||v==="x"?v:"m";
}
function mainDaysOf(key){ return S.cfg.orderDays.filter(function(d){return itemMode(key,d)==="m"}) }
/**
 * A top-up order's suggestion: since the item's last MAIN order landed, how much more actually sold than was expected
 * (recorded days only). soldOf(day) → the recorded amount or null; expOf(day) → the forecast for that day.
 */
function topupShortfall(orderDate,mainDays,soldOf,expOf){
  var prev=null;
  for(var i=1;i<=14;i++){ var c=addDays(orderDate,-i); if(mainDays.indexOf(c.getDay())>=0){ prev=c; break } }
  if(!prev) return {short:0, from:null, sold:0, exp:0};
  var dv=deliveryFor(prev), sold=0, exp=0, n=0;
  for(var d=dv.date, g=0; d<=orderDate&&g<15; d=addDays(d,1), g++){
    var v=soldOf(d); if(v==null) continue;                 // a day not closed yet says nothing
    var wgt=+d===+dv.date?dv.after:1;
    sold+=v*wgt; exp+=expOf(d)*wgt; n++;
  }
  return {short:Math.max(0,sold-exp), from:prev, sold:sold, exp:exp, days:n};
}
function nextOrderDay(from,only){
  var days=(only&&only.length?only:S.cfg.orderDays).slice().sort();
  if(!days.length) days=[0,3];
  for(var i=1;i<=7;i++){var d=addDays(from,i); if(days.indexOf(d.getDay())>=0) return d}
  return addDays(from,7);
}
function isOrderDay(d){return S.cfg.orderDays.indexOf(d.getDay())>=0}

/** Each order day may carry its own lead time and arrival hour; otherwise the shop default. */
function dayCfgFor(dow){
  var dc=(S.cfg.dayCfg||{})[String(dow)]||{};
  return {
    lead: dc.lead!=null?clamp(+dc.lead,0,6):clamp(+S.cfg.leadDays||0,0,6),
    hour: dc.hour!=null?clamp(+dc.hour,0,23):clamp(+S.cfg.deliveryHour||19,0,23),
    custom: dc.lead!=null||dc.hour!=null

}
function deliveryFor(orderDate){
  var c=dayCfgFor(orderDate.getDay());
  return {date:addDays(orderDate,c.lead), hour:c.hour, after:shareAfterHour(c.hour), lead:c.lead};
}
/** The most recent delivery on or before `from` — what today's shelf stock came in on. */
function lastDeliveryDate(from){
  for(var i=0;i<=12;i++){
    var c=addDays(from,-i);
    for(var j=0;j<7;j++){
      if(S.cfg.orderDays.indexOf(j)<0) continue;
      var o=addDays(c,-dayCfgFor(j).lead);
      if(o.getDay()===j) return c;
    }
  }
  return addDays(from,-3);
}
/**
 * The truck lands in the evening, so a delivery covers the tail of its own day,
 * every whole day after it, and the DAYTIME of the next delivery's day — that
 * last slice is the part everyone forgets, and on a Wednesday order it is all
 * of Sunday's daytime.
 */
function coverageWindow(orderDate,only){
  var d0=deliveryFor(orderDate);
  var nextOrder=nextOrderDay(orderDate,only);           // only: the weekdays this item is ordered on (its own cycle)
  var d1=deliveryFor(nextOrder);
  var delivery=d0.date, nextDelivery=d1.date;
  // A longer lead on the next order day can make its delivery land before this
  // one's; the window must still move forward.
  if(nextDelivery<=delivery) nextDelivery=addDays(delivery,1);
  var days=[delivery], weights=[d0.after];
  var cur=addDays(delivery,1), guard=0;
  while(cur<nextDelivery&&guard++<21){days.push(cur);weights.push(1);cur=addDays(cur,1)}
  if(nextDelivery>delivery){days.push(nextDelivery);weights.push(1-d1.after)}
  return {delivery:delivery, nextDelivery:nextDelivery, days:days, weights:weights, orderDate:orderDate,
          after:d0.after, hour:d0.hour, lead:d0.lead,
          nextAfter:d1.after, nextHour:d1.hour, nextOrder:nextOrder,
          span:sum(weights)};
}

/**
 * The stretch the CURRENT shelf stock has to carry on its own: from the moment
 * the order is placed until the truck lands. With next-day evening delivery
 * that is a full day plus the following daytime — and when the order day is
 * Wednesday, the daytime it has to cover is Thursday's, the busiest of the week.
 * No order size can rescue a shortfall here; only a transfer can.
 */
function preWindow(orderDate,w){
  var days=[], weights=[], cur=orderDate, guard=0;
  while(cur<w.delivery&&guard++<8){days.push(cur);weights.push(1);cur=addDays(cur,1)}
  days.push(w.delivery); weights.push(1-w.after);
  return {days:days, weights:weights, span:sum(weights)};
}

/**
 * How boldly to stock an item, read off its shelf life alone.
 *
 * The question behind the number: if I over-order, does the surplus survive to
 * the next cycle or does it go in the bin? An item whose life ends with the
 * coverage window gets a cautious level, because every extra piece is a gamble
 * with no second chance. An item that outlives the window gets a generous one,
 * because its surplus simply waits on the shelf. `tendency` slides the whole
 * curve when the shop wants to lean one way.
 */
function serviceLevel(p,coverDays){
  var shelf=Math.max(1,+p.shelfLife||1);
  var carry=clamp((shelf-coverDays)/4,0,1);          // 4 days ≈ one full cycle
  var base=0.72+0.23*carry;
  var longBonus=clamp((shelf-coverDays-4)/26,0,1)*0.03;
  var lean=((+S.cfg.tendency||50)-50)/50*0.10;       // −1..+1 → ∓10 points
  lean+=clamp(Math.round(+p.lean||0),-2,2)*0.04;      // this product's own lean, if the shop chose one (∓4 points a step)
  return clamp(base+longBonus+lean,0.55,0.985);
}
/**
 * FEFO against the real demand queue. The first slot is the delivery day BEFORE
 * the truck arrives — that slice is on today's shelf stock alone, and a shortfall
 * there is an afternoon stockout no order size can fix. `expiry` is the last day
 * the lot is still sellable, inclusive.
 */
function allocateStock(p,w,fc,pw){
  // With shelf counting switched off the app knows nothing about what is on the
  // shelf, so it claims nothing: no usable stock, and no shortfall warning it
  // has no grounds for.
  if(S.cfg.trackStock!==true){
    return {usable:0, onHand:0, atRisk:0,
            preDem:sum(pw.days.map(function(d,i){return demandFc(p,d)*pw.weights[i]})), preGap:0};
  }
  var lots=(S.stock[p.id]||[]).slice().sort(function(a,b){return a.expiry<b.expiry?-1:1});
  var queue=[], preDem=0, i;
  for(i=0;i<pw.days.length;i++){
    var need=demandFc(p,pw.days[i])*pw.weights[i];
    preDem+=need;
    queue.push({d:pw.days[i],need:need,pre:true});
  }
  for(i=0;i<w.days.length;i++) queue.push({d:w.days[i],need:fc[i],pre:false});
  var usable=0, preCov=0, onHand=0;
  var farOut=addDays(w.days[w.days.length-1],99);
  for(var li=0;li<lots.length;li++){
    var q=+lots[li].qty||0; onHand+=q;
    var lastGood=lots[li].expiry?parseYmd(lots[li].expiry):farOut;
    for(var j=0;j<queue.length&&q>0;j++){
      if(queue[j].d>lastGood) break;
      var take=Math.min(q,queue[j].need);
      queue[j].need-=take; q-=take;
      if(queue[j].pre) preCov+=take; else usable+=take;
    }
  }
  return {usable:usable, onHand:onHand, atRisk:Math.max(0,onHand-usable-preCov),

}
function roundToPack(need,p){
  if(need<=0) return 0;
  // With packing switched off the shop orders in its own unit: a countable one
  // lands on a whole number, a weight keeps its decimal.
  if(S.cfg.trackPacking!==true) return qtyRound(p,need);
  var pack=Math.max(1,+p.packSize||1);
  var units = (+p.shelfLife||1)<=7 ? Math.round(need/pack)*pack : Math.ceil(need/pack)*pack;
  if(units===0&&need>=pack*0.4) units=pack;
  if(units>0&&p.moq) units=Math.max(units,Math.ceil(p.moq/pack)*pack);
  return units;
}

function planFor(p,orderDate){
  var mode=itemMode("p:"+p.id,orderDate.getDay()), md=mainDaysOf("p:"+p.id);
  var w=coverageWindow(orderDate,md);
  var topup=mode!=="t"?null:topupShortfall(orderDate,md,function(day){ var r=S.days[ymd(day)], e=r&&r.items&&r.items[p.id]; return e&&e.sold!=null?+e.sold:null },function(day){return demandFc(p,day)});
  var pw=preWindow(orderDate,w);
  var fc=w.days.map(function(d,i){return demandFc(p,d)*w.weights[i]});
  var offerExp=OFFER_DEMAND.on?sum(w.days.map(function(d,i){return offerDemand(p,d)*w.weights[i]})):0;
  var expected=sum(fc);
  var m=S.model[p.id]||{base:0,sigma:0};
  var cv=m.base>0?m.sigma/m.base:0.45;
  var sigmaW=cv*Math.sqrt(sum(fc.map(function(x){return x*x})));
  var cr=serviceLevel(p,w.span);
  var z=probit(cr);
  var target=expected+z*sigmaW;

  var alloc=allocateStock(p,w,fc,pw);

  // Hard ceiling: never buy more than can plausibly sell before it expires.
  // Day 0 is the delivery day, and only its evening counts.
  var shelf=Math.max(1,+p.shelfLife||1), capSum=0;
  for(var i=0;i<shelf;i++) capSum+=demandFc(p,addDays(w.delivery,i))*(i===0?w.after:1);
  var cap=capSum*S.cfg.horizonBuffer;
  var lastGood=addDays(w.delivery,shelf-1);
  // Stock arriving now that still has to cover the tail of the window
  var coversWindow = lastGood>=w.days[w.days.length-1];

  var rawNeed=target-alloc.usable;
  var capped=Math.min(rawNeed,cap-alloc.onHand);
  var capBinds = capped < rawNeed - 0.5 && rawNeed > 0;
  var qty=roundToPack(Math.max(0,capped),p);
  var moqForced = qty>0 && p.moq && qty>Math.max(0,capped)+ (p.packSize||1)*0.5;

  return {
    win:w, pre:pw, fc:fc, expected:expected, sigmaW:sigmaW, cr:cr, z:z, target:target,
    usable:alloc.usable, onHand:alloc.onHand, atRisk:alloc.atRisk,
    preDem:alloc.preDem, preGap:alloc.preGap,
    cap:cap, capBinds:capBinds, moqForced:moqForced,
    lastGood:lastGood, coversWindow:coversWindow, offerExpected:offerExp, mode:mode, topup:topup,
    // a top-up day: with the shelf counted, the shortfall until the next main order; without a count, what sold beyond
    // the forecast since the last main order
    suggested:mode==="t"&&S.cfg.trackStock!==true?roundToPack(topup.short,p):qty
  };
}

var DEMO_EVENTS=[
  {id:"e1",name:"اليوم الوطني السعودي", kind:"national", from:"2026-09-21", to:"2026-09-24", mult:1.45},
  {id:"e2",name:"يوم التأسيس",          kind:"national", from:"2027-02-21", to:"2027-02-23", mult:1.35}

function buildDemo(){
  var rnd=mulberry32(20260923);
  var products=DEMO_PRODUCTS.map(function(p){
    return {id:p.id,name:p.name,unit:p.unit||DEFAULT_UNIT,shelfLife:p.shelfLife,
            packSize:p.packSize,moq:p.moq,active:true};
  });
  var days={}, end=addDays(today(),-1);
  for(var k=62;k>=0;k--){
    var d=addDays(end,-k), items={};
    var seas=DEFAULT_DOW[d.getDay()]*payFactor(d)*eventFactor(d,DEMO_EVENTS);
    for(var i=0;i<DEMO_PRODUCTS.length;i++){
      var sp=DEMO_PRODUCTS[i];
      var raw=sp.base*seas*(0.72+0.56*rnd());
      // a weight keeps a decimal; a countable unit does not
      var dem=COUNTABLE_UNIT.test(sp.unit||DEFAULT_UNIT)
        ? Math.max(0,Math.round(raw)) : Math.max(0,Math.round(raw*10)/10);
      var rec;
      if(rnd()<0.11&&dem>2){
        var sold=Math.round(dem*(0.66+0.18*rnd()));
        rec={sold:sold,waste:0,stockout:true};
      }else{
        var w=0;
        if(sp.shelfLife<=7&&rnd()<0.42) w=Math.round(dem*(0.02+0.11*rnd()));
        else if(rnd()<0.10) w=Math.round(dem*0.04);
        rec={sold:dem,waste:w,stockout:false};
      }
      items[sp.id]=rec;
    }
    days[ymd(d)]={date:ymd(d),items:items,closed:true};
  }
  // a plausible shelf count left over from the last delivery
  var stock={}, lastDel=lastDeliveryDate(today());
  for(var q=0;q<DEMO_PRODUCTS.length;q++){
    var pp=DEMO_PRODUCTS[q];
    var qty=Math.round(pp.base*(0.25+0.5*rnd()));
    stock[pp.id]=[{qty:qty,expiry:ymd(addDays(lastDel,pp.shelfLife-1))}];
  }
  return {products:products,days:days,stock:stock,events:JSON.parse(JSON.stringify(DEMO_EVENTS))};
}

/* ===================== persistence ===================== */
/*
 * Two backing stores. Inside claude.ai the `db` capability keeps the data with
 * the page, so it follows the owner to any device. Opened as a plain file on a
 * computer there is no `db`, so the browser's own storage takes over: same app,
 * data kept on that one machine in that one browser.

var LS_KEY="daftar-altalabiya-v1";
var localT=null;
function payload(){
  var p={v:1, savedAt:new Date().toISOString(), cfg:S.cfg, products:S.products,
          days:S.days, stock:S.stock, events:S.events, orders:S.orders, imports:S.imports||[], trash:S.trash||[]};
  if(S.multi&&S.branchId){var b=curBranch(); p.meta={branchId:S.branchId, brand:b?b.brand:CUR_BRAND}}
  return p;
}
function saveLocal(){
  if(!S.local||S.demo) return;
  var data=payload();
  // With branches, every write names the branch it belongs to, taken at the
  // moment of the write — never whatever happens to be open when it lands.
  if(S.multi&&BR&&S.branchId){
    var id=S.branchId;
    // one write at a time, each on the revision the last one left, so the file
    // store can tell a genuine edit from one made on a copy that has moved on
    queueBranchOp(function(){
      if(id!==S.branchId) return;                  // the branch changed before this ran
      return Promise.resolve(BR.save(id,data,S.branchRev)).then(function(r){
        if(r&&r.ok){
          var e=findBranch(id); if(e){ if(r.rev) e.rev=r.rev; if(r.updatedAt) e.updatedAt=r.updatedAt }
          if(id===S.branchId){ if(r.rev) S.branchRev=r.rev; S.savedAt=new Date(); touchSaveStamp() }
        }else if(r&&r.stale){
          toast("وصلت نسخةٌ أحدث لهذا الفرع من جهازٍ آخر — أُعيد تحميله");
          if(id===S.branchId) openBranch(id,{keepView:true});
        }else toast("تعذّر الحفظ: "+((r&&r.error)||"خطأ غير معروف"));
      },function(){toast("تعذّر الحفظ إلى الملف")});
    });
    return;
  }
  // Desktop build: a real JSON file on disk, which survives anything a browser does.
  if(S.desktop&&window.desktop&&window.desktop.save){
    window.desktop.save(data).then(function(r){
      if(r&&r.ok){S.savedAt=new Date(); touchSaveStamp()}
      else toast("تعذّر الحفظ: "+((r&&r.error)||"خطأ غير معروف"));
    },function(e){toast("تعذّر الحفظ إلى الملف")});
    return;
  }
  try{
    localStorage.setItem(LS_KEY,JSON.stringify(data));
    S.savedAt=new Date(); touchSaveStamp();
  }catch(e){ toast("تعذّر الحفظ — مساحة المتصفّح ممتلئة") }
}
function touchSaveStamp(){
  var el=document.getElementById("saveStamp");
  if(!el||!S.savedAt) return;
  var d=S.savedAt, p=function(n){return (n<10?"0":"")+n};
  el.textContent="حُفظ "+p(d.getHours())+":"+p(d.getMinutes())+":"+p(d.getSeconds());
}
function scheduleLocalSave(){
  if(localT) clearTimeout(localT);

/*
 * Every record passes through here, whatever its source: this computer's file,
 * the cloud, a restored backup, an old app's file. Anything that is not the
 * shape the app writes is dropped or coerced, so a tampered record cannot
 * smuggle markup or script into the page through an id, a date or a number.
 */
var SAFE_ID=/^[A-Za-z0-9_\-]{1,64}$/, SAFE_DAY=/^\d{4}-\d{2}-\d{2}$/;

function sBool(v){return v===true}
function sDay(v){return typeof v==="string"&&SAFE_DAY.test(v)?v:null}
function sanitizeRecord(d){
  if(!d||typeof d!=="object"||!Array.isArray(d.products)) return null;
  var out={v:1};
  var c=d.cfg&&typeof d.cfg==="object"?d.cfg:{}, cfg={};
  cfg.branch=sStr(c.branch,60);
  cfg.orderDays=(Array.isArray(c.orderDays)?c.orderDays:[0,3]).map(function(x){return Math.round(+x)}).filter(function(x,i,a){return x>=0&&x<=6&&a.indexOf(x)===i});
  // «ماذا يُطلب في كل يوم»: per product ("p:id") or material ("i:id"), per order weekday: "t" top-up, "x" not ordered (absent = ordered)
  cfg.itemDays={};
  if(c.itemDays&&typeof c.itemDays==="object") Object.keys(c.itemDays).slice(0,5000).forEach(function(k){
    var v=c.itemDays[k], o={}; if(!/^[pi]:[A-Za-z0-9_.\-]{1,80}$/.test(k)||!v||typeof v!=="object") return;
    Object.keys(v).forEach(function(d){ if(/^[0-6]$/.test(d)&&(v[d]==="t"||v[d]==="x")) o[d]=v[d] });
    if(Object.keys(o).length) cfg.itemDays[k]=o;
  });
  ["leadDays","deliveryHour","tendency","horizonBuffer"].forEach(function(k){ if(c[k]!=null) cfg[k]=sNum(c[k],DEFAULT_CFG[k]) });
  if(c.afterShare!=null&&c.afterShare!=="") cfg.afterShare=sNum(c.afterShare,null);
  ["trackWaste","trackStockout","trackPacking","trackStock","showShelfInClose"].forEach(function(k){ if(c[k]!=null) cfg[k]=c[k]===true });
  cfg.dayCfg={};
  if(c.dayCfg&&typeof c.dayCfg==="object") Object.keys(c.dayCfg).forEach(function(k){
    if(!/^[0-6]$/.test(k)||!c.dayCfg[k]||typeof c.dayCfg[k]!=="object") return;
    var o={}; if(c.dayCfg[k].lead!=null) o.lead=sNum(c.dayCfg[k].lead,1); if(c.dayCfg[k].hour!=null) o.hour=sNum(c.dayCfg[k].hour,19);
    cfg.dayCfg[k]=o;
  });
  if(c.market!=null&&/^[A-Z]{2}$/.test(String(c.market))) cfg.market=String(c.market);   // «السوق والدولة»
  if(c.ui&&typeof c.ui==="object"){ var ui0=sanitizeUi(c.ui); if(ui0) cfg.ui=ui0 }               // «تخصيص الواجهة» of this branch
  // «المجموعات»: the shop's own groups of products, in the order it set

    .map(function(g){return {id:String(g.id), name:sStr(g.name,60)||"مجموعة"}}).filter(function(g,i,a){return a.findIndex(function(x){return x.id===g.id})===i});
  out.cfg=cfg;
  var pids={};
  var cleanProd=function(p){
    var q={id:String(p.id), name:sStr(p.name,200), shelfLife:sNum(p.shelfLife,5), packSize:sNum(p.packSize,1), moq:sNum(p.moq,0), active:p.active!==false};
    if(p.unit!=null) q.unit=sStr(p.unit,20);
    if(p.mto===true) q.mto=true;                     // «يُحضَّر بالطلب»: ordered through its materials
    if(+p.price>0) q.price=sNum(p.price,0);           // selling price of one unit (optional) — the money view
    if(+p.cost>0) q.cost=sNum(p.cost,0);              // what one unit costs the shop (optional)
    if(p.like!=null&&SAFE_ID.test(String(p.like))&&String(p.like)!==String(p.id)){ q.like=String(p.like); if(+p.likePct>0) q.likePct=clamp(Math.round(+p.likePct),5,300) }   // a new product: the one it resembles, and how much of it
    if(p.lean!=null&&+p.lean!==0&&Math.abs(Math.round(+p.lean))<=2){ q.lean=Math.round(+p.lean); if(sDay(p.leanAt)) q.leanAt=p.leanAt }   // its own lean: − less waste, + fewer stock-outs
    if(p.group!=null&&/^g[a-z0-9]{1,24}$/.test(String(p.group))) q.group=String(p.group);   // its group, if the shop put it in one
    if(Array.isArray(p.aliases)) q.aliases=p.aliases.slice(0,400).map(function(a){return sStr(a,200)}).filter(Boolean);
    // the Odoo names exactly as the shop pasted or the import read them («[POS-CH-022] Cinnamon Balls 48 | …»)
    if(Array.isArray(p.aliasList)) q.aliasList=p.aliasList.slice(0,100).map(function(a){return sStr(a,300).trim()}).filter(Boolean);
    return q;
  };
  out.products=d.products.filter(function(p){return p&&typeof p==="object"&&SAFE_ID.test(String(p.id))&&!pids[p.id]&&(pids[p.id]=1)}).map(cleanProd);
  // «المحذوفات»: a deleted product waits here, whole, until it is put back or deleted for good
  out.trash=(Array.isArray(d.trash)?d.trash:[]).filter(function(x){return x&&typeof x==="object"&&x.prod&&typeof x.prod==="object"&&SAFE_ID.test(String(x.prod.id))}).slice(0,300)
    .map(function(x){return {at:sStr(x.at,40), prod:cleanProd(x.prod)}});
  var num3=function(o){var r={};["sold","waste","lost"].forEach(function(k){ if(o[k]!=null&&o[k]!=="") r[k]=sNum(o[k],0) }); r.stockout=sBool(o.stockout); return r};
  out.days={};

  out.stock={};

    if(!SAFE_ID.test(pid)||!Array.isArray(d.stock[pid])) return;

  out.events=(Array.isArray(d.events)?d.events:[]).filter(function(e){return e&&typeof e==="object"&&SAFE_ID.test(String(e.id))}).slice(0,500).map(function(e){
    var ev={id:String(e.id), name:sStr(e.name,120), kind:kinds.indexOf(e.kind)>=0?e.kind:"other", from:sDay(e.from), to:sDay(e.to), mult:sNum(e.mult,1)};
    if(e.ref&&/^[a-z_]{1,30}:\d{4}-\d{2}-\d{2}$/.test(String(e.ref))) ev.ref=String(e.ref);   // the market-calendar entry it was added from
    return ev;
  });
  out.orders={};
  if(d.orders&&typeof d.orders==="object") Object.keys(d.orders).forEach(function(k){
    var o=d.orders[k]; if(!SAFE_DAY.test(k)||!o||typeof o!=="object") return;
    var items={};
    if(o.items&&typeof o.items==="object") Object.keys(o.items).forEach(function(pid){ var it=o.items[pid]; if(SAFE_ID.test(pid)&&it&&typeof it==="object") items[pid]={suggested:sNum(it.suggested,0), ordered:sNum(it.ordered,0)} });

  });
  // the sales imports and what each covered: a day inside a «complete» record had its whole branch's sales imported
  out.imports=(Array.isArray(d.imports)?d.imports:[]).filter(function(x){return x&&typeof x==="object"}).slice(-2000).map(function(x){
    return {id:sStr(x.id,40), at:sStr(x.at,40), by:sStr(x.by,120), file:sStr(x.file,200), title:sStr(x.title,200),
            from:sDay(x.from), to:sDay(x.to), complete:sBool(x.complete), reason:sStr(x.reason,40),
            mode:x.mode==="add"?"add":"replace", rows:sNum(x.rows,0), qty:sNum(x.qty,0), zeros:sNum(x.zeros,0),
            hash:/^[0-9a-f]{1,32}$/.test(String(x.hash||""))?String(x.hash):""};
  });
  return out;
}
function applyData(d){

  S.products=d.products||[]; S.days=d.days||{}; S.stock=d.stock||{};
  S.events=d.events||[]; S.orders=d.orders||{}; S.imports=d.imports||[]; S.trash=d.trash||[];

}
function loadLocal(){

function connect(){

/** No shared store on this view — keep the app usable on this browser alone. */

function subscribeAll(){
  var db=S.db, seen={products:false,days:false,stock:false,events:false};
  function maybeReady(k){seen[k]=true; if(seen.products&&seen.days&&seen.stock&&seen.events){S.ready=true} relearn(); render()}
  db.collection("products").onSnapshot(function(q){
    S.products=q.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    maybeReady("products");
  },function(){maybeReady("products")});
  db.collection("days").orderBy("date","desc").limit(150).onSnapshot(function(q){
    var m={}; q.docs.forEach(function(d){var v=d.data();m[d.id]={date:v.date||d.id,items:v.items||{},closed:!!v.closed}; if(v.ignore===true) m[d.id].ignore=true});
    S.days=m; maybeReady("days");
  },function(){maybeReady("days")});
  db.doc("stock/current").onSnapshot(function(s){
    S.stock=s.exists?(s.data().lots||{}):{}; maybeReady("stock");
  },function(){maybeReady("stock")});
  db.collection("events").onSnapshot(function(q){
    S.events=q.docs.map(function(d){return Object.assign({id:d.id},d.data())});
    maybeReady("events");
  },function(){maybeReady("events")});
  db.doc("config/settings").onSnapshot(function(s){
    if(s.exists){S.cfg=freshCfg(s.data());render()}
  },function(){});
}

/* ===================== brands & branches ===================== */
/*
 * Each branch is one self-contained record. BR is the storage behind them,
 * and every backend offers the same ten calls — the desktop file store today,
 * this browser's own storage when the page is opened as a plain file, and a
 * cloud provider later, dropped in behind the same calls without touching the
 * screens. Every record carries meta.branchId, meta.rev and meta.updatedAt,
 * which is what a sync step needs to push a branch and to tell which copy is newer.
 */
var BR=null;

function desktopBranches(){
  var d=window.desktop;
  return {kind:"desktop",
    state:function(){return d.state()},
    load:function(id){return d.load(id)},
    save:function(id,data,baseRev){return d.save(data,id,baseRev)},
    add:function(o){return d.addBranch(o)},
    rename:function(id,name){return d.renameBranch(id,name)},
    setCurrent:function(id){return d.setCurrent(id)},
    remove:function(id){return d.removeBranch(id)},
    stats:function(){return d.branchStats()},
    legacyAdopt:function(id){return d.legacyAdopt(id)},
    legacyDismiss:function(id){return d.legacyDismiss(id)}
  };
}

/** The same calls over this browser's storage, for the page opened as a plain file. */
function browserBranches(){

  function put(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
  var migrated=[];
  var ws=get(WS_KEY);
  if(!ws||!Array.isArray(ws.branches)||!ws.branches.length){
    ws={v:1,branches:[],current:null,sync:{provider:null}};
    BRANDS.forEach(function(b){
      ws.branches.push({id:b.key+"-1",brand:b.key,name:b.branch||b.wordmark,createdAt:nowIso(),rev:1,updatedAt:nowIso()});
    });
    // the single-shop page kept its record under one key; it becomes the first branch
    var old=get(LS_KEY);
    if(old&&Array.isArray(old.products)){
      var first=ws.branches[0];
      if(old.cfg&&old.cfg.branch) first.name=String(old.cfg.branch);
      put(PFX+first.id,old);
      migrated.push({id:first.id,brand:first.brand,products:old.products.length,days:Object.keys(old.days||{}).length});
    }
    ws.current=ws.branches[0].id;
    put(WS_KEY,ws);
  }
  function find(id){for(var i=0;i<ws.branches.length;i++) if(ws.branches[i].id===id) return ws.branches[i]; return null}
  function snap(){return JSON.parse(JSON.stringify(ws))}
  return {kind:"browser",
    state:function(){return ok({ws:snap(),migrated:migrated,legacyNewer:[],root:null})},
    load:function(id){ if(!find(id)) return bad("unknown branch"); return ok({data:get(PFX+id),path:null,id:id}) },
    save:function(id,data){
      var e=find(id); if(!e) return bad("unknown branch");
      e.rev=(+e.rev||1)+1; e.updatedAt=nowIso();
      var rec=Object.assign({},data,{meta:{branchId:id,brand:e.brand,rev:e.rev,updatedAt:e.updatedAt}});
      if(!put(PFX+id,rec)) return bad("مساحة المتصفّح ممتلئة");
      put(WS_KEY,ws); return ok({rev:e.rev,updatedAt:e.updatedAt});
    },
    add:function(o){
      var id=o.brand+"-"+Date.now().toString(36)+Math.floor(Math.random()*1296).toString(36);
      var e={id:id,brand:o.brand,name:o.name,createdAt:nowIso(),rev:1,updatedAt:nowIso()};
      var rec=Object.assign({v:1,products:[],days:{},stock:{},events:[],orders:{}},o.data||{});
      rec.meta={branchId:id,brand:o.brand,rev:1,updatedAt:e.updatedAt};
      if(!put(PFX+id,rec)) return bad("مساحة المتصفّح ممتلئة");
      ws.branches.push(e); put(WS_KEY,ws); return ok({id:id,ws:snap()});
    },
    rename:function(id,name){var e=find(id); if(!e) return bad("unknown branch"); e.name=name; put(WS_KEY,ws); return ok({ws:snap()})},
    setCurrent:function(id){if(!find(id)) return bad("unknown branch"); ws.current=id; put(WS_KEY,ws); return ok({ws:snap()})},
    remove:function(id){
      var e=find(id); if(!e) return bad("unknown branch");
      if(ws.branches.length<=1) return bad("last branch");
      var rec=get(PFX+id); if(rec) put("daftar-trash-"+id+"-"+Date.now(),rec);
      try{localStorage.removeItem(PFX+id)}catch(x){}
      ws.branches=ws.branches.filter(function(b){return b.id!==id});
      if(ws.current===id){var same=ws.branches.filter(function(b){return b.brand===e.brand})[0];ws.current=(same||ws.branches[0]).id}
      put(WS_KEY,ws); return ok({ws:snap()});
    },
    stats:function(){
      var out={};
      ws.branches.forEach(function(b){var r=get(PFX+b.id)||{};
        out[b.id]={products:(r.products||[]).length,days:Object.keys(r.days||{}).length,hasFile:!!r.products,updatedAt:b.updatedAt,rev:b.rev}});
      return ok({stats:out});
    },
    legacyAdopt:function(){return bad("not available here")},
    legacyDismiss:function(){return bad("not available here")}
  };
}

function cloudLook(){

  if(c.conflicts&&c.conflicts.length) return {cls:"warn",txt:"تعارض يحتاج قرارك"};
  if(c.status==="ok") return {cls:"ok"+(c.running?" busy":""),txt:"متزامن "+hhmm(c.lastSync)};

function handleCloud(u){
  var prevRole=S.cloud&&S.cloud.access?S.cloud.access.role:null;
  if((u.access?u.access.role:null)!==prevRole){ CP.users=null; CP.loaded=false; }
  var prevEmail=S.cloud&&S.cloud.access?S.cloud.access.email:null;
  var prev=S.cloud&&S.cloud.status;
  S.cloud=u;
  // another device changed this brand's materials or recipes: read them again
  if(u.changed&&u.changed.indexOf("catalog:"+curBrandKey())>=0&&!catT) S.catBrand=null;
  if(u.catalogNote==="conflict") setTimeout(function(){ toast("تغيّرت الوصفات على جهازين — أُخذت نسخة السحاب، ونسخة هذا الجهاز محفوظة جانباً") },400);
  // a different account just came in: open on the first screen its role allows
  if(u.access&&u.access.email&&u.access.email!==prevEmail) S.tab=firstAllowedTab();
  // the database refused an edit outside this account's role; the cloud's copy is back
  if(u.refused) setTimeout(function(){ toast("رفض الخادم تعديلاً ليس من صلاحيات دورك — أُعيدت نسخة السحاب") },300);
  if(prev!==u.status) loadCloudSettings();
  var cur=S.branchId, reopen=false, gone=false;
  if(u.ws&&u.ws.branches){
    var keepCur=S.ws?S.ws.current:null;
    S.ws=u.ws; if(keepCur&&findBranch(keepCur)) S.ws.current=keepCur;
    if(cur&&!findBranch(cur)) gone=true;
  }
  if(u.changed&&cur&&u.changed.indexOf(cur)>=0&&!gone) reopen=true;
  if(gone){
    if(!S.ws.branches.length){ S.branchId=null; render(); return }
    toast(amAdmin()?"حُذف هذا الفرع من جهازٍ آخر":"لم يعد هذا الفرع مسنداً لحسابك");
    openBranch(S.ws.current&&findBranch(S.ws.current)?S.ws.current:S.ws.branches[0].id);
  }else if(!cur&&S.ws&&S.ws.branches.length){
    openBranch(S.ws.current&&findBranch(S.ws.current)?S.ws.current:S.ws.branches[0].id);
  }else if(reopen){
    if(localT){ flushSave(); }                     // its write will be refused as stale and reload
    else{ openBranch(cur,{keepView:true}); toast("وصل تحديثٌ لهذا الفرع من جهازٍ آخر"); }
  }else{
    var a=document.activeElement;
    if(S.tab==="setup"&&a&&/^(cloudUrl|cloudKey|authEmail|authPass)$/.test(a.id)){ renderCloudChip(); if(a.id!=="authPass") softStorage(); }
    // the owner mid-typing in the control panel: a background sync must not wipe the field
    else if(S.tab==="admin"&&a&&a.closest&&a.closest("#view")&&/^(INPUT|SELECT)$/.test(a.tagName)){ renderCloudChip(); renderUserChip(); }
    else render();
    if(S.tab==="branches"&&u.changed&&u.changed.length) loadBranchStats();
  }
}
