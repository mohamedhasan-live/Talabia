      h+='<td>'+(l&&isB&&isB.val.active!==false?'<span class="chip w" title="المنتج معرَّفٌ عرضاً، فيُفكَّك بتعريف العرض ولا يُستعمل ربطه">عرض — الربط لا يُستعمل</span>':
                 (l&&ed?'<button class="btn ghost catEd catLinkMove" data-key="'+esc(lk)+'" title="انقل هذه الكمية سطراً في وصفة المنتج">← إلى الوصفة</button>':''))+'</td></tr>';
    });
    h+='</tbody></table></div>';
  }
  h+='</div>';

  /* the scope of the offers and recipes being edited */
  h+='<div class="card" style="margin-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="lbl">العروض والوصفات أدناه:</span>'+
     '<button class="btn'+(scope==="brand"?' primary':'')+'" id="catScopeBrand">للبراند كلّه — كلّ الفروع</button>'+
     (b?'<button class="btn'+(scope==="branch"?' primary':'')+'" id="catScopeBranch">خاصّة بفرع «'+esc(b.name)+'»</button>':'')+
     '<span class="hint" style="flex:1;min-width:200px">'+(scope==="branch"?'ما تعرّفه هنا يحلّ محلّ تعريف البراند في هذا الفرع وحده.':'تعريف البراند يعمل في كلّ فروعه الحالية والجديدة، ما لم يكن للفرع تعريفٌ خاص.')+'</span></div>';
  var bucket=function(kind){ if(scope==="branch"){ cat.branches[S.branchId]=cat.branches[S.branchId]||{bundles:{},recipes:{}}; return cat.branches[S.branchId][kind] } return cat[kind] };
  var prodSelect=function(id,exclude){
    return '<select id="'+id+'" class="catEd" style="width:220px"><option value="">— اختر المنتج —</option>'+
      prods.filter(function(p){return !catFind(exclude,productKeys(p))}).map(function(p){return '<option value="'+esc(productKey(p))+'">'+esc(p.name)+'</option>'}).join('')+'</select>';
  };

  /* 3. offers */
  var bundles=bucket("bundles");
  h+='<div class="card" id="catBundles" style="margin-top:10px"><div class="lbl" style="margin-bottom:8px">3 — العروض</div>';
  h+='<p class="muted" style="margin-bottom:8px">عرضٌ يُباع في أودو باسمه («عرض التلة»، «لمتنا»)، ويُفكَّك هنا إلى ما فيه: منتجاتٌ (تُحسب وصفاتها وربطها) أو موادّ مباشرة كالبوكس.</p>';
  Object.keys(bundles).forEach(function(k){h+=catDefCard("b",k,bundles[k],ctx,items,prods,ed,scope)});
  if(!Object.keys(bundles).length) h+='<p class="muted">لا عروض '+(scope==="branch"?'خاصّة بهذا الفرع':'معرّفة')+' بعد.</p>';
  if(ed) h+='<div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:10px"><label class="fld"><span>المنتج الذي هو عرض</span>'+prodSelect("catNewBundle",bundles)+'</label><button class="btn catEd" id="catAddBundle">+ عرّفه عرضاً</button></div>';
  h+='</div>';

  /* 4. recipes */
  var recipes=bucket("recipes");
  h+='<div class="card" id="catRecipes" style="margin-top:10px"><div class="lbl" style="margin-bottom:8px">4 — الوصفات</div>';
  h+='<p class="muted" style="margin-bottom:8px">ما يستهلكه بيعُ وحدةٍ واحدة من المنتج. لكلّ حجمٍ وصفته — «سينابون كبير» غير «سينابون صغير».</p>';
  Object.keys(recipes).forEach(function(k){h+=catDefCard("r",k,recipes[k],ctx,items,prods,ed,scope)});
  if(!Object.keys(recipes).length) h+='<p class="muted">لا وصفات '+(scope==="branch"?'خاصّة بهذا الفرع':'معرّفة')+' بعد.</p>';
  if(ed) h+='<div style="display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;margin-top:10px"><label class="fld"><span>منتج</span>'+prodSelect("catNewRecipe",recipes)+'</label><button class="btn catEd" id="catAddRecipe">+ أضف وصفة</button></div>';
  h+='</div>';
  return h;
}
/** Links that carry a quantity other than 1 (a recipe written as a link), on products that are not offers. */
function catMovableLinks(ctx){
  return Object.keys(ctx.cat.links).filter(function(k){
    var l=ctx.cat.links[k], b=ctx.bundle(ctx.keysOf(k));
    return l.factor!=null&&+l.factor!==1&&!(b&&b.val.active!==false);
  });
}
/** Move a link into its product's brand recipe as one line (same material, same quantity): the totals do not move. */
function catMoveLink(key){
  var l=S.cat.links[key]; if(!l) return false;
  var it=S.cat.items.filter(function(i){return i.id===l.item})[0]; if(!it) return false;
  var ctx=opCtx(S.cat,S.branchId), keys=ctx.keysOf(key);
  var r=catFind(S.cat.recipes,keys), rk=r?r.key:key;
  var rec=S.cat.recipes[rk]=S.cat.recipes[rk]||{active:true,lines:[]};
  var same=rec.lines.filter(function(x){return x.item===it.id})[0];
  var q=l.factor==null?1:+l.factor;
  if(same) same.qty=+(opToBase(same.qty,same.unit||it.unit)+opToBase(q,it.unit))/(opToBase(1,same.unit||it.unit)||1);
  else rec.lines.push({item:it.id,qty:q,unit:it.unit});
  delete S.cat.links[key];
  return true;
}
/** Where a material is used, in words: «وصفة سينامون بولز 16»، «عرض لمتنا 48 (فرع …)»، «ربط Black Coffee». */
function catUsesList(cat,itemId){
  var ctx=opCtx(cat,S.branchId), out=[];
  Object.keys(cat.links).forEach(function(k){ if(cat.links[k].item===itemId) out.push("ربط "+opName(ctx,k)) });
  var scan=function(c,tag){
    Object.keys(c.recipes||{}).forEach(function(k){ if((c.recipes[k].lines||[]).some(function(l){return l.item===itemId})) out.push("وصفة "+opName(ctx,k)+tag) });
    Object.keys(c.bundles||{}).forEach(function(k){ if((c.bundles[k].lines||[]).some(function(l){return l.kind==="i"&&l.ref===itemId})) out.push("عرض "+opName(ctx,k)+tag) });
  };
  scan(cat,"");
  Object.keys(cat.branches).forEach(function(b){ var br=findBranch(b); scan(cat.branches[b]," (خاصّ بفرع "+(br?br.name:b)+")") });
  return out;
}
/** Remove a material and every line that names it, in the brand and in each branch's overrides. */
function catRemoveItem(cat,itemId){
  Object.keys(cat.links).forEach(function(k){ if(cat.links[k].item===itemId) delete cat.links[k] });
  [cat].concat(Object.keys(cat.branches).map(function(b){return cat.branches[b]})).forEach(function(c){
    Object.keys(c.recipes||{}).forEach(function(k){ c.recipes[k].lines=(c.recipes[k].lines||[]).filter(function(l){return l.item!==itemId}) });
    Object.keys(c.bundles||{}).forEach(function(k){ c.bundles[k].lines=(c.bundles[k].lines||[]).filter(function(l){return !(l.kind==="i"&&l.ref===itemId)}) });
  });
  cat.items=cat.items.filter(function(i){return i.id!==itemId});
}
function catUses(cat,itemId){
  var n=0, scan=function(defs,f){Object.keys(defs||{}).forEach(function(k){(defs[k].lines||[]).forEach(function(l){ if(f(l)) n++ })})};
  Object.keys(cat.links).forEach(function(k){ if(cat.links[k].item===itemId) n++ });
  var all=[cat].concat(Object.keys(cat.branches).map(function(b){return cat.branches[b]}));
  all.forEach(function(c){ scan(c.recipes,function(l){return l.item===itemId}); scan(c.bundles,function(l){return l.kind==="i"&&l.ref===itemId}) });
  return n;
}
/** One offer ("b") or recipe ("r") with its lines. */
function catDefCard(kind,key,def,ctx,items,prods,ed,scope){
  var dis=ed?'':' disabled', on=def.active!==false;
  var h='<div class="card catDef" data-kind="'+kind+'" data-key="'+esc(key)+'" style="margin-top:8px'+(on?'':';opacity:.6')+'">';
  h+='<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px"><b>'+esc(opName(ctx,key))+'</b>'+
     (scope==="branch"?'<span class="chip w">خاصّ بالفرع</span>':'')+
     '<label style="display:inline-flex;gap:6px;align-items:center;font-size:12px"><input type="checkbox" class="catEd catDefOn" data-kind="'+kind+'" data-key="'+esc(key)+'"'+(on?' checked':'')+dis+'> '+(on?'<span class="chip a">يعمل</span>':'<span class="chip c">موقوف</span>')+'</label>'+
     '<span class="spacer" style="flex:1"></span>'+(ed?'<button class="btn ghost catEd catDefDel" data-kind="'+kind+'" data-key="'+esc(key)+'" title="حذف">✕</button>':'')+'</div>';
  h+='<div class="tablewrap"><table><thead><tr><th>'+(kind==="b"?'يحتوي':'المادة')+'</th><th>الكمية</th><th>الوحدة</th><th></th></tr></thead><tbody>';
  (def.lines||[]).forEach(function(l,i){
    var ref=kind==="b"?(l.kind==="i"?"i:"+l.ref:"p:"+l.ref):"i:"+l.item;
    var it=kind==="b"?(l.kind==="i"?ctx.items[l.ref]:null):ctx.items[l.item];
    h+='<tr><td><select class="catEd catLine" data-kind="'+kind+'" data-key="'+esc(key)+'" data-i="'+i+'" data-f="ref" style="width:230px"'+dis+'>';
    if(kind==="b"){
      h+='<optgroup label="منتجات">'+prods.map(function(p){var pk=productKey(p);var hit=l.kind!=="i"&&productKeys(p).indexOf(l.ref)>=0;return '<option value="p:'+esc(pk)+'"'+(hit?' selected':'')+'>'+esc(p.name)+'</option>'}).join('')+
         (l.kind!=="i"&&!ctx.byKey[l.ref]?'<option value="p:'+esc(l.ref)+'" selected>'+esc(opName(ctx,l.ref))+' (ليس في هذا الفرع)</option>':'')+'</optgroup>';
      h+='<optgroup label="مواد">'+items.map(function(x){return '<option value="i:'+esc(x.id)+'"'+(l.kind==="i"&&l.ref===x.id?' selected':'')+'>'+esc(x.name)+'</option>'}).join('')+'</optgroup>';
    }else{
      h+=items.map(function(x){return '<option value="i:'+esc(x.id)+'"'+(l.item===x.id?' selected':'')+'>'+esc(x.name)+' ('+esc(x.unit)+')</option>'}).join('');
    }
    h+='</select></td>';
    h+='<td><input type="number" min="0" step="any" class="w70 catEd catLine" data-kind="'+kind+'" data-key="'+esc(key)+'" data-i="'+i+'" data-f="qty" value="'+esc(l.qty)+'"'+dis+'></td>';
    h+='<td>'+(it?'<select class="catEd catLine" data-kind="'+kind+'" data-key="'+esc(key)+'" data-i="'+i+'" data-f="unit" style="width:96px"'+dis+'>'+opCompatible(it.unit).map(function(u){return '<option'+((l.unit||it.unit)===u?' selected':'')+'>'+u+'</option>'}).join('')+'</select>':'<span class="muted" style="font-size:12px">وحدة</span>')+'</td>';
    h+='<td>'+(ed?'<button class="btn ghost catEd catLineDel" data-kind="'+kind+'" data-key="'+esc(key)+'" data-i="'+i+'">✕</button>':'')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  if(ed) h+='<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:8px">'+
     '<button class="btn primary catEd catLineAdd" data-kind="'+kind+'" data-key="'+esc(key)+'"'+((kind==="r"&&!items.length)?' disabled title="أضف مادةً أوّلاً"':'')+'>'+(kind==="r"?'+ أضف مكوّناً':'+ أضف إلى العرض')+'</button>'+
     '<span class="hint">'+(kind==="r"?'للوصفة مكوّناتٌ بلا حدّ — سطرٌ لكلّ مادة. واكتب الكمية بالوحدة التي تناسبك (جم أو كجم…) فتُحوَّل تلقائياً.':'للعرض محتوياتٌ بلا حدّ — منتجاتٌ أو موادّ.')+'</span></div>';
  return h+'</div>';
}
/** The offers or recipes being edited: the brand's, or this branch's overrides. */
function catBucket(kind){
  var f=kind==="b"?"bundles":"recipes";
  if(S.recScope==="branch"&&S.multi&&S.branchId){
    S.cat.branches[S.branchId]=S.cat.branches[S.branchId]||{bundles:{},recipes:{}};
    return S.cat.branches[S.branchId][f];
  }
  return S.cat[f];
}

/* ===================== render: stats tab ===================== */
function barChart(values,labels,highlight){
  var W=320,H=110,pad=18,n=values.length;
  var maxV=Math.max.apply(null,values.concat([1]));
  var colW=(W-pad*2)/n-6, parts=[];
  parts.push('<line x1="'+pad+'" y1="'+(H-20)+'" x2="'+(W-pad)+'" y2="'+(H-20)+'" stroke="var(--line)" stroke-width="1"/>');
  parts.push('<line x1="'+pad+'" y1="'+(H-20-((1/maxV)*(H-46)))+'" x2="'+(W-pad)+'" y2="'+(H-20-((1/maxV)*(H-46)))+'" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="3 3"/>');
  for(var i=0;i<n;i++){
    var h=Math.max(2,(values[i]/maxV)*(H-46));
    var x=pad+i*((W-pad*2)/n)+3;
    var fill=highlight&&highlight.indexOf(i)>=0?"var(--warn)":"var(--accent)";
    parts.push('<rect x="'+x+'" y="'+(H-20-h)+'" width="'+colW+'" height="'+h+'" rx="3" fill="'+fill+'"/>');
    parts.push('<text x="'+(x+colW/2)+'" y="'+(H-20-h-4)+'" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink-2)" font-family="IBM Plex Mono,IBM Plex Sans Arabic,monospace">'+round1(values[i])+'</text>');
    parts.push('<text x="'+(x+colW/2)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="IBM Plex Sans Arabic,sans-serif">'+labels[i]+'</text>');
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px" role="img" aria-label="مؤشر أيام الأسبوع">'+parts.join("")+'</svg>';
}

function weekdayTable(wd,caption){
  var vals=wd.avg.map(function(v){return v==null?0:v});
  var maxV=Math.max.apply(null,vals.concat([0.001]));
  // capped: a bar a metre long says no more than one of a sane length
  var h='<div class="stack" style="gap:7px;max-width:720px">';
  for(var i=0;i<7;i++){
    var v=wd.avg[i], n=wd.counts[i];
    var pct=v==null?0:(v/maxV)*100;
    var isBest=wd.best&&wd.best.i===i, isWorst=wd.worst&&wd.worst.i===i&&!isBest;
    h+='<div style="display:grid;grid-template-columns:58px 1fr 74px;gap:10px;align-items:center">';
    h+= '<span style="font-size:12.5px;font-weight:'+(isBest?"600":"400")+';color:'+(isBest?"var(--accent-ink)":isWorst?"var(--crit)":"var(--ink-2)")+'">'+DOW_AR[i]+'</span>';
    h+= '<div style="height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden">'+
        '<div style="height:100%;width:'+pct.toFixed(1)+'%;border-radius:99px;background:'+(isBest?"var(--accent)":isWorst?"var(--crit)":"var(--line-strong)")+'"></div></div>';
    h+= '<span class="num" style="font-size:12px;color:var(--ink-2)">'+(v==null?'—':round1(v))+
        ' <span style="color:var(--ink-3);font-size:10px">'+(n?n+'ي':'')+'</span></span>';
    h+='</div>';
  }
  h+='</div>';
  if(caption) h+='<p class="muted" style="margin-top:10px">'+caption+'</p>';
  return h;
}

}

function renderStats(){
  var hist=historyAsc();
  if(hist.length<1) return '<div class="empty">سجِّل يوماً واحداً على الأقلّ في «إقفال اليوم» لتبدأ الأرقام بالظهور هنا.</div>';
  var custom=!!(S.statFrom||S.statTo);
  var period=S.statPeriod||0;         // 0 = the whole record
  var rng=statRange();
  var R=periodReport(rng);
  var allKeys=Object.keys(S.days).sort();
  var firstDay=allKeys.length?allKeys[0]:ymd(today());
  var h='';

  /* ---------- period picker ---------- */
  h+='<div class="section-head"><h2>ملخّص الفترة</h2><div class="note">'+
     (R.days?R.dayKeys[0]+' → '+R.dayKeys[R.dayKeys.length-1]+' · '+R.days+' يوماً مسجّلاً'
           :'لا أيام مسجّلة في هذه الفترة')+'</div></div>';

  h+='<div class="card" style="margin-bottom:12px">';
  h+='<div style="display:flex;gap:6px;flex-wrap:wrap">';
  [[7,"7 أيام"],[30,"30 يوماً"],[90,"90 يوماً"],[0,"كلّ السجلّ"]].forEach(function(o){
    h+='<button class="btn statPeriod'+(!custom&&period===o[0]?" primary":"")+'" data-p="'+esc(o[0])+'">'+o[1]+'</button>';
  });
  h+='<button class="btn statSince'+(custom&&S.statFrom===firstDay&&!S.statTo?" primary":"")+'">منذ الافتتاح</button>';
  h+='</div>';

  h+='<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">';
  h+= '<label class="fld" style="width:160px"><span>من تاريخ</span>'+
      '<input type="date" id="statFrom" value="'+esc(S.statFrom||"")+'" max="'+ymd(today())+'"></label>';
  h+= '<label class="fld" style="width:160px"><span>إلى تاريخ</span>'+
      '<input type="date" id="statTo" value="'+esc(S.statTo||"")+'" max="'+ymd(today())+'"></label>';
  if(custom) h+='<button class="btn" id="statClear">مسح التحديد</button>';
  h+= '<div class="hint" style="flex:1;min-width:180px">'+
      (custom?'<b style="color:var(--accent-ink)">فترة مخصّصة</b> — كلّ الأرقام أدناه محسوبةٌ عليها وحدها.'
             :'حدّد أيّ مدّة شئت. ويكفي ملءُ خانةٍ واحدة: «من» وحدها تعني حتى اليوم، و«إلى» وحدها تعني من أوّل السجلّ.')+
      '</div>';
  h+='</div></div>';

  if(!R.days) return h+'<div class="empty">لا توجد أيام مسجّلة بين هذين التاريخين.<br>سجلّك يبدأ من '+firstDay+'.</div>';

  /* ---------- headline numbers ---------- */
  var tw=S.cfg.trackWaste!==false, ts=S.cfg.trackStockout!==false;
  var best=R.ranked[0], worst=null;
  for(var wi=R.ranked.length-1;wi>=0;wi--){ if(R.ranked[wi].total>0){worst=R.ranked[wi];break} }

  h+='<div class="cards">';
  var soldTot=totalsByUnit(R.reports.map(function(x){return {p:x.p,v:x.total}}));
  var avgTot=totalsByUnit(R.reports.map(function(x){return {p:x.p,v:R.days?x.total/R.days:0}}));
  h+='<div class="card good"><div class="lbl">إجمالي المبيعات</div><div class="val" style="font-size:'+(soldTot.length>1?"17px":"24px")+'">'+fmtTotals(soldTot)+'</div><div class="hint">'+(soldTot.length>1?"مجموعةً بوحدتها":"&nbsp;")+'</div></div>';
  h+='<div class="card"><div class="lbl">متوسّط يومي</div><div class="val" style="font-size:'+(avgTot.length>1?"17px":"24px")+'">'+fmtTotals(avgTot)+'</div><div class="hint">في اليوم</div></div>';
  h+='<div class="card"><div class="lbl">أصناف بيعت</div><div class="val">'+R.soldProducts+'<small> / '+R.productCount+'</small></div><div class="hint">'+(R.productCount-R.soldProducts)+' لم تتحرّك</div></div>';
  h+='<div class="card"><div class="lbl">اتجاه المبيعات</div><div style="font-size:17px;font-weight:600;margin-top:5px">'+trendMark(R.trend7)+'</div><div class="hint">آخر 7 أيام</div></div>';
  h+='<div class="card '+(R.thin?"warn":"")+'"><div class="lbl">بياناتها غير كافية</div><div class="val">'+R.thin+'</div><div class="hint">صنفاً من '+R.productCount+'</div></div>';
  h+='<div class="card '+(R.conf.band==="low"?"bad":R.conf.band==="mid"?"warn":"good")+'"><div class="lbl">ثقة التوقّع</div><div class="val" style="font-size:20px">'+R.conf.label+'</div><div class="hint">'+Math.round(R.conf.score*100)+'٪ · يرتفع بطول السجلّ وثباته</div></div>';
  h+='</div>';

  h+='<div class="card" style="margin-top:10px"><div class="stack" style="gap:6px">';
  if(best&&best.total>0) h+='<div class="muted"><b style="color:var(--accent-ink)">الأكثر مبيعاً:</b> '+esc(best.p.name)+' — '+qty(best.p,best.total)+'</div>';
  if(worst&&best&&worst.p.id!==best.p.id) h+='<div class="muted"><b style="color:var(--crit)">الأقلّ مبيعاً:</b> '+esc(worst.p.name)+' — '+qty(worst.p,worst.total)+' فقط</div>';
  h+='<div class="muted"><b style="color:var(--ink)">اتجاه 4 أسابيع:</b> '+trendMark(R.trend28)+' · <b style="color:var(--ink)">تذبذب الفرع:</b> '+R.vol.label+' ('+Math.round(R.vol.cv*100)+'٪)</div>';
  if(tw) h+='<div class="muted"><b style="color:var(--ink)">الهدر:</b> '+fmtTotals(totalsByUnit(R.reports.map(function(x){return {p:x.p,v:x.wasteTotal}})))+(R.totalQty>0?' ('+round1(R.totalWaste/R.totalQty*100)+'٪ من المباع)':'')+'</div>';
  h+='</div></div>';

  /* ---------- weekday analysis ---------- */
  var branchUnit=commonUnit(R.reports.map(function(x){return x.p}));
  h+='<div class="section-head"><h2>تحليل الأيام</h2><div class="note">متوسّط مبيعات الفرع في كلّ يوم من أيام الأسبوع، من سجلّك أنت.'+
     (branchUnit?' الأرقام بوحدة <b>'+esc(branchUnit)+'</b>.'
               :' <b style="color:var(--warn)">وأصنافك بوحداتٍ مختلفة</b>، فهذه الأرقام تجمعها معاً: اقرأها نسبةً بين الأيام — أيُّها أقوى — لا عدداً مطلقاً.')+'</div></div>';
  h+='<div class="card">'+weekdayTable(R.weekday,
      R.weekday.best&&R.weekday.worst&&R.weekday.best.i!==R.weekday.worst.i
        ? 'أقوى يوم عندك: <b>'+DOW_AR[R.weekday.best.i]+'</b> بمتوسّط '+round1(R.weekday.best.v)+(branchUnit?' '+esc(branchUnit):'')+' · وأهدأ يوم: <b>'+DOW_AR[R.weekday.worst.i]+'</b> بمتوسّط '+round1(R.weekday.worst.v)+
          (R.weekday.worst.v>0?' — الفارق بينهما '+Math.round((R.weekday.best.v/R.weekday.worst.v-1)*100)+'٪. ولهذا لا يستعمل النظام متوسّطاً واحداً للأسبوع كلّه، بل يزن كلّ يومٍ بوزنه.':'')
        : 'لم تُسجَّل كلّ أيام الأسبوع بعد، فالمقارنة ناقصة.')+'</div>';

  /* ---------- events ---------- */
  var evReports=S.events.map(eventReport).filter(Boolean);
  if(evReports.length){
    h+='<div class="section-head"><h2>تحليل المناسبات</h2><div class="note">كلّ مناسبة مقيسةً بما بِيع فيها مقابل الأسبوعين اللذين سبقاها.</div></div>';
    h+='<div class="tablewrap"><table><thead><tr><th>المناسبة</th><th>النوع</th><th>الفترة</th><th>أيام</th><th>المبيعات فيها</th><th>المتوسّط قبلها</th>'+
       '<th title="مقارنة مباشرة بلا تعديل">التغيّر الخام</th>'+
       '<th title="بعد تجريد أثر اليوم والراتب — هذا هو أثر المناسبة وحدها">الأثر الصافي</th>'+
       '<th>مفعّلة؟</th></tr></thead><tbody>';
    var anyGap=false;
    evReports.forEach(function(e){
      var net=e.observed!=null?e.observed-1:null;
      if(e.pct!=null&&net!=null&&Math.sign(e.pct)!==Math.sign(net)) anyGap=true;
      h+='<tr><td class="w130">'+esc(e.ev.name)+'</td>';
      h+='<td style="font-size:12px;color:var(--ink-3)">'+e.kind.label+'</td>';
      h+='<td style="font-size:12px;color:var(--ink-3)">'+(e.ev.from||'—')+' → '+(e.ev.to||'—')+'</td>';
      h+='<td class="n">'+e.duringDays+'</td>';
      h+='<td class="n">'+(e.duringDays?round1(e.duringTotal)+' <span style="color:var(--ink-3);font-size:10px">('+round1(e.duringAvg)+'/ي)</span>':'—')+'</td>';
      h+='<td class="n">'+(e.beforeAvg!=null?round1(e.beforeAvg)+' <span style="color:var(--ink-3);font-size:10px">/ي</span>':'—')+'</td>';
      h+='<td class="n" style="color:var(--ink-3)">'+(e.pct!=null?(e.pct>0?"+":"")+Math.round(e.pct*100)+'٪':'—')+'</td>';
      h+='<td class="n">'+(net!=null?'<b style="color:'+(net>0.05?"var(--accent-ink)":net<-0.05?"var(--crit)":"var(--ink-3)")+'">'+(net>0?"+":"")+Math.round(net*100)+'٪</b>':'—')+'</td>';
      h+='<td>'+(e.applied?'<span class="chip a">×'+(+e.ev.mult||1)+'</span>':'<span class="chip">لا</span>')+'</td></tr>';
    });
    h+='</tbody></table></div>';
    h+='<p class="muted" style="margin-top:8px"><b style="color:var(--ink)">لماذا عمودان؟</b> «الخام» يقارن ما بِيع في المناسبة بما بِيع قبلها مباشرةً، وهو يخلط أثر المناسبة بأثر اليوم والراتب. و«الصافي» يجرّد هذين الأثرين فلا يبقى إلّا أثر المناسبة وحدها — وهو الرقم الذي يُعتمد عليه.</p>';
    if(anyGap) h+='<p class="muted" style="margin-top:6px"><b style="color:var(--warn)">لاحظ الفرق بين العمودين</b> في إحدى المناسبات: مناسبةٌ تقع في آخر الشهر (أيام 21–24 حيث تهدأ المبيعات قبل الراتب) قد تبدو خاسرةً في العمود الخام وهي رابحةٌ في الصافي، لأنّ ركود آخر الشهر ابتلع أثرها. فاحكم بالصافي لا بالخام.</p>';
  }

  /* ---------- per-product table ---------- */
  h+='<div class="section-head"><h2>تحليل كلّ صنف</h2><div class="note">اضغط أيّ صنفٍ لتفتح تفصيله كاملاً.</div></div>';
  h+='<div class="tablewrap"><table><thead><tr><th>الصنف</th><th>إجمالي</th><th>يومي</th><th>أفضل يوم</th><th>الاتجاه</th><th>التذبذب</th><th>أيام</th><th>الثقة</th><th>المقترح</th></tr></thead><tbody>';
  R.ranked.forEach(function(r){
    var wd=r.weekday;
    h+='<tr class="statRow" data-pid="'+esc(r.p.id)+'" style="cursor:pointer'+(S.statProduct===r.p.id?';background:var(--accent-soft)':'')+'">';
    h+='<td class="w130">'+esc(r.p.name)+(r.thin?' <span class="chip w" style="font-size:9.5px">بيانات قليلة</span>':'')+'</td>';
    h+='<td class="n">'+round1(r.total)+'</td>';
    h+='<td class="n">'+round1(r.dailyAvg)+'</td>';
    h+='<td style="font-size:12px;color:var(--ink-2)">'+(wd.best?DOW_AR[wd.best.i]+' <span class="num" style="color:var(--ink-3)">'+round1(wd.best.v)+'</span>':'—')+'</td>';
    h+='<td style="font-size:12px">'+trendMark(r.trend7)+'</td>';
    h+='<td><span class="chip '+r.vol.cls+'">'+r.vol.label+'</span></td>';
    h+='<td class="n" style="color:var(--ink-3)">'+r.nDays+'</td>';
    h+='<td><span class="chip '+r.conf.cls+'">'+r.conf.label+'</span></td>';
    h+='<td class="n"><b>'+r.plan.suggested+'</b></td>';
    h+='</tr>';
  });
  h+='</tbody></table></div>';

  if(S.statProduct){
    var sel=R.reports.filter(function(r){return r.p.id===S.statProduct})[0];
    if(sel) h+=renderProductDetail(sel);
  }

  // what the sales mean operationally: offers broken down, linked products grouped, recipes counted
  h+=renderOpStats(rng);

  // The original analysis follows, unchanged — waste, unmet demand, forecast
  // error, the learned weekday index, and where the money moves.
  var legacy=renderLegacyStats();
  if(legacy) h+='<hr class="sep" style="margin:28px 0">'+legacy;

  return h;
}

/** The first analysis screen, kept whole. */
function renderLegacyStats(){
  var hist=historyAsc();
  if(hist.length<3) return '';
  var recent=hist.slice(-28);
  var plist=S.products;
  var pmap={}; plist.forEach(function(p){pmap[p.id]=p});

  var soldQty=0,wasteQty=0,lostQty=0,outDays=0,totDays=recent.length;
  var perP={};
  recent.forEach(function(rec){
    var d=parseYmd(rec.date), anyOut=false;
    for(var pid in rec.items){
      var p=pmap[pid]; if(!p) continue;
      var e=rec.items[pid];
      if(!perP[pid]) perP[pid]={sold:0,waste:0,lost:0,outs:0,err:0,act:0};
      var sq=+e.sold||0, wq=+e.waste||0;
      var lq=e.stockout?Math.max(0,demandOf(e)-sq):0;
      soldQty+=sq; wasteQty+=wq; lostQty+=lq;
      perP[pid].sold+=sq; perP[pid].waste+=wq; perP[pid].lost+=lq;
      if(e.stockout){perP[pid].outs++;anyOut=true}
      if(hasSold(e)){                              // missing sales data is not an observation to score
        var act=demandOf(e), pred=forecast(p,d);
        perP[pid].err+=Math.abs(act-pred); perP[pid].act+=act;
      }
    }
    if(anyOut) outDays++;
  });
  var wastePct=soldQty>0?wasteQty/soldQty*100:0;
  var lostPct=soldQty>0?lostQty/soldQty*100:0;
  var totErr=0,totAct=0;
  for(var k in perP){totErr+=perP[k].err;totAct+=perP[k].act}
  var wape=totAct>0?totErr/totAct*100:0;

  var h='';
  var soldByUnit=totalsByUnit(Object.keys(perP).map(function(pid){return {p:pmap[pid],v:perP[pid].sold}}));
  var wasteByUnit=totalsByUnit(Object.keys(perP).map(function(pid){return {p:pmap[pid],v:perP[pid].waste}}));
  var lostByUnit=totalsByUnit(Object.keys(perP).map(function(pid){return {p:pmap[pid],v:perP[pid].lost}}));
  h+='<div class="section-head"><h2>الهدر والنفاد — آخر '+totDays+' يوماً</h2><div class="note">الميزانُ هنا بين هدرٍ ونفاد.</div></div>';
  var tw=S.cfg.trackWaste!==false, ts=S.cfg.trackStockout!==false;
  h+='<div class="cards">';
  h+='<div class="card good"><div class="lbl">المباع</div><div class="val" style="font-size:'+(soldByUnit.length>1?"17px":"24px")+'">'+fmtTotals(soldByUnit)+'</div><div class="hint">&nbsp;</div></div>';
  if(tw) h+='<div class="card '+(wastePct>6?"bad":wastePct>3?"warn":"good")+'"><div class="lbl">الهدر</div><div class="val">'+round1(wastePct)+'٪</div><div class="hint">'+fmtTotals(wasteByUnit)+' · الهدف دون 3٪</div></div>';
  if(ts) h+='<div class="card '+(lostPct>wastePct?"bad":"warn")+'"><div class="lbl">طلبٌ لم يُلبَّ</div><div class="val">'+round1(lostPct)+'٪</div><div class="hint">نحو '+fmtTotals(lostByUnit)+' · '+outDays+' يوماً فيه نفاد</div></div>';
  h+='<div class="card '+(wape>35?"warn":"good")+'"><div class="lbl">خطأ التنبّؤ</div><div class="val">'+round1(wape)+'٪</div><div class="hint">كلّما قلَّ كان أدقّ</div></div>';
  h+='</div>';
  if(tw&&ts) h+='<p class="muted" style="margin-top:10px">هذان الرقمان — الهدر والطلب غير المُلبَّى — يتجاذبان دائماً: فخفضُ أحدهما يرفع الآخر. وإن رأيتَ أحدهما غالباً، حرِّك «ميل النظام» في الإعدادات نحو الجهة الأخرى.</p>';

  h+='<div class="section-head"><h2>مؤشّر أيام الأسبوع</h2><div class="note">1.0 يومٌ متوسّط. هذه أرقام فرعك بعد التعلّم من سجلّك.</div></div>';
  h+='<div class="card">'+barChart(S.dowIndex,DOW_SHORT,[4,5])+
     '<p class="muted" style="margin-top:8px">أعلى يوم: <b>'+DOW_AR[S.dowIndex.indexOf(Math.max.apply(null,S.dowIndex))]+'</b> · أهدأ يوم: <b>'+DOW_AR[S.dowIndex.indexOf(Math.min.apply(null,S.dowIndex))]+'</b> · الفارق بينهما '+Math.round((Math.max.apply(null,S.dowIndex)/Math.min.apply(null,S.dowIndex)-1)*100)+'٪</p></div>';

  var rows=Object.keys(perP).map(function(pid){
    var p=pmap[pid]; var v=perP[pid];
    return {p:p, name:p?p.name:pid, unit:p?unitOf(p):DEFAULT_UNIT,
            shelf:p?p.shelfLife:0, sold:v.sold, waste:v.waste,
            wpct:v.sold>0?v.waste/v.sold*100:0, outs:v.outs, lost:v.lost};
  });
  // Best sellers — the ranking the shop actually thinks in
  var best=rows.slice().sort(function(a,b){return b.sold-a.sold});
  var topShare=best.length?best[0].sold:1;
  var half=0, cum=0, i2;
  for(i2=0;i2<best.length;i2++){cum+=best[i2].sold; if(cum>=soldQty*0.5){half=i2+1;break}}
  // ترتيبٌ بالكمّية: إن اختلفت الوحدات فالمقارنة بين حبّةٍ وكيلو لا تستقيم، فقُل ذلك
  var mixedUnits=commonUnit(rows.map(function(r){return r.p}).filter(Boolean))===null;
  h+='<div class="section-head"><h2>الأكثر مبيعاً</h2><div class="note">'+
     (mixedUnits?'بحسب الكمّية المباعة — وأصنافك بوحداتٍ مختلفة، فقارن كلَّ صنفٍ بنفسه عبر الزمن لا بغيره.'
               :'بحسب سجلّ الاستهلاك الفعلي، لا التقدير.')+'</div></div>';
  h+='<div class="card"><div class="stack">';
  best.slice(0,8).forEach(function(r,i){
    var pct=topShare>0?r.sold/topShare*100:0;
    var share=soldQty>0?r.sold/soldQty*100:0;
    h+='<div style="display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center">';
    h+= '<span class="num" style="font-size:11px;color:var(--ink-3);font-weight:600">'+(i+1)+'</span>';
    h+= '<div><div style="font-size:13px;font-weight:500;margin-bottom:4px">'+esc(r.name)+'</div>'+
        '<div style="height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden">'+
        '<div style="height:100%;width:'+pct.toFixed(1)+'%;border-radius:99px;background:var(--accent)"></div></div></div>';
    h+= '<span class="num" style="font-size:12px;color:var(--ink-2)">'+(r.p?qty(r.p,r.sold):money(r.sold))+' <span style="color:var(--ink-3);font-size:10.5px">'+round1(share)+'٪</span></span>';
    h+='</div>';
  });
  h+='</div>';
  if(half>0) h+='<p class="muted" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)"><b>'+half+'</b> '+(half===1?"صنف يصنع":"أصناف تصنع")+' نصف مبيعاتك. هذه هي التي لا يُحتمل نفادها، وعليها ركِّز عند العدّ.</p>';
  h+='</div>';

  var slow=best.filter(function(r){return r.sold>0}).slice(-3).reverse();
  if(best.length>6&&slow.length){
    h+='<p class="muted" style="margin-top:10px">أبطأ الأصناف حركةً: '+slow.map(function(r){return '<b>'+esc(r.name)+'</b> ('+(r.p?qty(r.p,r.sold):money(r.sold))+')'}).join("، ")+'. راجع جدواها، فبطءُ الحركة مع قصر الصلاحية أقصرُ طريقٍ إلى الهدر.</p>';
  }

  rows.sort(function(a,b){return (b.waste+b.lost)-(a.waste+a.lost)});
  h+='<div class="section-head"><h2>كلّ الأصناف</h2><div class="note">مرتّبةً بالأكثر إشكالاً: هدراً أو نفاداً.</div></div>';
  h+='<div class="tablewrap"><table><thead><tr><th>الصنف</th><th>الوحدة</th><th>الصلاحية</th><th>مباع</th>'+

function tendencyHint(){

          : t<=42?"يميل إلى التحفّظ"
          : t<=58?"متوازن"
          : t<=75?"يميل إلى السعة"
          : "واسع — النفاد أسوأ عندك من الهدر";
  return '<b>'+txt+'</b> — الاحتياطي لصنفٍ صلاحيتُه 5 أيام: <b class="num">'+
         Math.round(serviceLevel({shelfLife:5},4)*100)+'٪</b>، ولصنفٍ صلاحيتُه 30 يوماً: <b class="num">'+
         Math.round(serviceLevel({shelfLife:30},4)*100)+'٪</b>.';
}

function render(){
  // A date being typed by hand is never rebuilt under the fingers; the redraw waits until it is applied.
  if(LANG==="en") i18nKeepRefresh();    // the shop's names are never translated
  if(dateTypingInView()||HOLD_RENDER){ S.renderPending=true; renderHeader(); return }
  S.renderPending=false;
  if(S.ready) ensureCatalog();          // the open brand's materials and recipes (loads once per brand)
  renderHeader();
  if(S.multi&&S.ws&&!branchList().length){
    renderBanner();
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.setAttribute("aria-selected",b.dataset.tab==="setup"?"true":"false")});
    var au=S.cloud&&S.cloud.access;
    document.getElementById("view").innerHTML='<div class="empty" style="padding-top:60px"><b style="font-size:16px;color:var(--ink)">لا فروع مسندة لهذا الحساب بعد</b><br>'+
      (au&&au.email?'<span class="num">'+esc(au.email)+'</span><br>':'')+'اطلب من المدير أن يحدّد فروعك، وستظهر هنا تلقائياً خلال دقيقة.</div>'+storageCard();
    document.getElementById("footbar").hidden=true;
    renderGate();
    return;
  }
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){
    b.setAttribute("aria-selected",b.dataset.tab===S.tab?"true":"false");
  });
  renderBanner();
  var v=document.getElementById("view");
  var keep=keepTyping();               // a redraw (sync, stats) must not wipe the field being typed in
  if(S.tab==="order")      v.innerHTML=renderOrder();
  else if(S.tab==="entry") v.innerHTML=renderEntry();
  else if(S.tab==="items") v.innerHTML=renderItems();
  else if(S.tab==="recipes") v.innerHTML=renderRecipes();
  else if(S.tab==="stats") v.innerHTML=renderStats();
  else if(S.tab==="branches") v.innerHTML=renderBranches();
  else if(S.tab==="admin") v.innerHTML=renderAdminPanel();
  else                     v.innerHTML=renderSetup();

  var fb=document.getElementById("footbar"), fi=document.getElementById("footinner");
  var foot=S.tab==="order"?orderFooter():S.tab==="entry"?entryFooter():null;
  if(foot){fi.innerHTML=foot;fb.hidden=false}else{fb.hidden=true;fi.innerHTML=""}
  applyPermsDom();
  if(keep) keep();
  renderGate();
}
/* Remember the focused text field in the view (its text and caret) and put it back after the view is
   rebuilt. Fields are found again by id, or by their classes and data-* attributes. */
var KEEP_OFF=false;
function keepTyping(){
  var el=document.activeElement;
  if(KEEP_OFF||!el||!el.closest||!el.closest("#view")) return null;
  var textual=el.tagName==="TEXTAREA"||(el.tagName==="INPUT"&&/^(text|search|email|password|number|tel|url|date|)$/.test(el.type||""));
  if(!textual) return null;
  var sel;
  if(el.id) sel="#"+CSS.escape(el.id);
  else{
    sel=el.tagName.toLowerCase()+Array.prototype.map.call(el.classList,function(c){return "."+CSS.escape(c)}).join("");
    Array.prototype.forEach.call(el.attributes,function(a){ if(/^data-/.test(a.name)) sel+='['+a.name+'="'+CSS.escape(a.value)+'"]' });
  }
  var val=el.value, s0=null, s1=null;
  try{ s0=el.selectionStart; s1=el.selectionEnd }catch(e){}
  return function(){
    var n=document.querySelector("#view "+sel);
    if(!n||n.disabled) return;
    if(n.value!==val) n.value=val;
    n.focus({preventScroll:true});
    try{ if(s0!=null) n.setSelectionRange(s0,s1) }catch(e){}
  };
}

  S.tab=b.dataset.tab; render(); window.scrollTo({top:0,behavior:"instant"});

function ensureDay(date){
  if(!S.days[date]) S.days[date]={date:date,items:{}};
  return S.days[date];
}
function ensureItem(date,pid){
  var d=ensureDay(date);
  // «sold» is left out until the shop types it: a day with only waste or a stockout tick recorded
  // is missing sales data, not a confirmed zero (hasSold).
  if(!d.items[pid]) d.items[pid]={waste:0,lost:0,stockout:false};
  return d.items[pid];
}

  if(t.id==="wipe"){

    if(!confirm("تأكيد أخير — لا تراجع بعده.")) return;
    logAct("data","مسح كل بيانات الفرع");

/** A backup carries the branch and, beside it, its brand's materials and recipes. */
function exportPayload(){
  var p=payload();
  if(S.cat&&S.catBrand===curBrandKey()&&catHasRules(S.cat)) p.brandCatalog=JSON.parse(JSON.stringify(S.cat));
  return p;
}
function snapshotJson(){return JSON.stringify(exportPayload())}
function doBackup(){
  var txt=snapshotJson();
  logAct("data","نسخ نسخة احتياطية");
  var done=function(){toast("نُسخت النسخة — الصقها في ملف نصّي واحفظه")};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,function(){legacyCopy(txt,done)});
  }else legacyCopy(txt,done);
}
function legacyCopy(txt,done){
  var ta=document.createElement("textarea");
  ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  var ok=false; try{ok=document.execCommand("copy")}catch(e){}
  document.body.removeChild(ta);
  if(ok) done(); else toast("تعذّر النسخ — حاول من متصفح آخر");
}
function doRestore(){
  // The desktop build has no window.prompt, and a file picker is the better
  // door anyway: pick the backup file you saved.
  if(S.desktop&&window.desktop&&window.desktop.importFile){
    window.desktop.importFile().then(function(r){
      if(!r||!r.ok){ if(r&&!r.cancelled) toast((r&&r.error)||"تعذّرت قراءة الملف"); return }
      applyRestored(r.data);
    },function(){toast("تعذّرت قراءة الملف")});
    return;
  }
  var raw=prompt("الصق النسخة الاحتياطية هنا:");
  if(!raw) return;
  var d;
  try{d=JSON.parse(raw)}catch(e){toast("النسخة غير صالحة");return}
  applyRestored(d);
}
function applyRestored(d){
  if(!d||!d.products){toast("النسخة غير صالحة");return}
  var fromB=d.meta&&d.meta.branchId&&S.multi&&d.meta.branchId!==S.branchId?findBranch(d.meta.branchId):null;
  var fromTxt=d.meta&&d.meta.branchId&&S.multi&&d.meta.branchId!==S.branchId
    ?"تنبيه: هذه النسخة مأخوذة من فرعٍ آخر"+(fromB?" («"+branchLabel(fromB)+"»)":"")+".\n\n":"";
  if(!confirm(fromTxt+(S.multi&&curBranch()?"سيستبدل هذا بيانات فرع «"+curBranch().name+"» وحده بالنسخة. ":"سيستبدل هذا كلّ بياناتك الحالية بالنسخة. ")+"أتتابع؟")) return;
  if(!applyData(d)){toast("النسخة غير صالحة");return}
  logAct("data","استعادة نسخة احتياطية");
  // the brand's materials and recipes, if the backup carries them — only into the same brand, and only if asked
  if(d.brandCatalog&&typeof d.brandCatalog==="object"&&S.cat&&String(d.brandCatalog.brand||"")===curBrandKey()&&canP("items.edit")&&
     confirm("النسخة تحمل مكوّنات «"+brandWord(curBrandKey())+"» ووصفاتها. أتستعيدها أيضاً؟ (تستبدل الحالية)")){
    S.cat=sanitizeCatalog(d.brandCatalog,curBrandKey()); saveCatalog(true);
  }
  if(S.multi&&curBranch()) S.cfg.branch=curBranch().name;
  S.overrides={}; relearn(); render();
  if(S.local){saveLocal();toast("استُعيدت النسخة");return}
  if(!S.db){toast("استُعيدت في هذه الجلسة فقط");return}
  S.demo=false;
  var jobs=[S.db.doc("config/settings").set(S.cfg),
            S.db.doc("stock/current").set({lots:S.stock,countedAt:ymd(today())})];
  S.products.forEach(function(p){jobs.push(S.db.doc("products/"+p.id).set(p))});
  S.events.forEach(function(e){jobs.push(S.db.doc("events/"+e.id).set(e))});
  Promise.all(jobs.map(function(j){return j.catch(function(){})})).then(function(){
    var keys=Object.keys(S.days).sort(), i=0;
    function step(){
      if(i>=keys.length){toast("استُعيدت النسخة");return}
      var k=keys[i++];
      S.db.doc("days/"+k).set(S.days[k]).then(step,function(){step()});
    }
    step();
  });
}

  if((t.id==="impFrom"||t.id==="impTo")&&S.imp){S.imp[t.id==="impFrom"?"from":"to"]=t.value||null; render(); focusById(t.id); return}

    // an emptied «sold» box is missing data again, not zero; a typed 0 is a confirmed zero

    saveDay(S.entryDate); scheduleSoftRender(); return;
  }
  if(t.classList.contains("itIn")){
    var prod=S.products.filter(function(x){return x.id===t.dataset.id})[0]; if(!prod)return;
    var f=t.dataset.f;
    if(f==="unit"){
      prod.unit=t.value.trim()||DEFAULT_UNIT;
      saveProduct(prod); S.overrides={}; scheduleSoftRender(); return;
    }
    if(f==="aliases"){
      // the field shows only the readable names; the Odoo codes and the machine copies of whole Odoo
      // cells it hides are kept, so editing the names never loses a match
      var av=aliasView(prod);
      prod.aliases=av.codes.concat(av.machine).concat(t.value.split(/[،,]/).map(function(s){return normName(s)}))
        .filter(function(s,i,arr){return s&&arr.indexOf(s)===i});
      saveProduct(prod); return;                    // no re-render: keep the caret
    }

    if(f==="name"&&!t.value.trim()) return;

  }
  if(t.classList.contains("evIn")){

    else ev[ef]=t.value;

  if(t.id==="cfgBranch"){

  if(t.id==="cfgLead"){S.cfg.leadDays=clamp(+t.value,0,6);saveCfg();S.planDate=null;render();return}
  if(t.classList.contains("dcIn")){
    if(!S.cfg.dayCfg) S.cfg.dayCfg={};

    if(!S.cfg.dayCfg[key]) S.cfg.dayCfg[key]={};

    var hint=document.getElementById("tendHint");
    if(hint) hint.innerHTML=tendencyHint();

/* Re-render the derived numbers without stealing focus from the field being typed in. */
function focusById(id){
  var el=document.getElementById(id);
  if(el) el.focus();
}
var softT=null;
/**
 * Re-render the derived numbers without stealing the field being typed in:
 * remember which control had focus, rebuild, then put the caret back where it
 * was. An id identifies a control on its own; the table inputs are found by
 * their class and data attributes.
 */
function scheduleSoftRender(){
  if(softT) clearTimeout(softT);
  softT=setTimeout(function(){
    var a=document.activeElement;
    var sel=null, caret=null;
    if(a&&a.tagName==="INPUT"||a&&a.tagName==="SELECT"){
      if(a.id) sel="#"+a.id;
      else if(a.classList.contains("stockIn")) sel='.stockIn[data-pid="'+CSS.escape(a.dataset.pid)+'"]';
      else if(a.classList.contains("entIn")) sel='.entIn[data-pid="'+CSS.escape(a.dataset.pid)+'"][data-f="'+CSS.escape(a.dataset.f)+'"]';
      else if(a.classList.contains("itIn")) sel='.itIn[data-id="'+CSS.escape(a.dataset.id)+'"][data-f="'+CSS.escape(a.dataset.f)+'"]';
      else if(a.classList.contains("evIn")) sel='.evIn[data-id="'+CSS.escape(a.dataset.id)+'"][data-f="'+CSS.escape(a.dataset.f)+'"]';
      // date and number inputs refuse selectionStart in some browsers
      try{caret=a.selectionStart}catch(err){caret=null}
    }
    relearn(); render();
    if(sel){
      var el=document.querySelector(sel);
      if(el){
        el.focus();
        if(caret!=null){try{el.setSelectionRange(caret,caret)}catch(err){}}
      }
    }
  },700);
}
var footT=null;
function scheduleFooter(){
  if(footT) clearTimeout(footT);
  footT=setTimeout(function(){
    var foot=orderFooter();
    if(foot){ document.getElementById("footinner").innerHTML=foot; applyPermsDom(); }
  },350);
}

function catField(t){
  if(!S.cat||!t.classList) return false;
  if(t.classList.contains("catItem")){
    var it=S.cat.items.filter(function(i){return i.id===t.dataset.id})[0]; if(!it) return true;
    var f=t.dataset.f;
    if(f==="name"){ if(t.value.trim()) it.name=t.value; saveCatalog(); return true }
    if(f==="shelfLife"){ it.shelfLife=t.value===""?null:Math.max(0,+t.value||0); saveCatalog(); return true }
    if(f==="active"){ it.active=t.checked; saveCatalog(); render(); return true }
    if(f==="unit"){
      it.unit=opUnit(t.value);
      // lines written in a unit of another kind fall back to the material's own
      var fix=function(defs){Object.keys(defs||{}).forEach(function(k){(defs[k].lines||[]).forEach(function(l){
        var mine=(l.item===it.id)||(l.kind==="i"&&l.ref===it.id);
        if(mine&&l.unit&&opBase(l.unit)!==opBase(it.unit)) l.unit=it.unit;
      })})};
      [S.cat].concat(Object.keys(S.cat.branches).map(function(b){return S.cat.branches[b]})).forEach(function(c){fix(c.recipes);fix(c.bundles)});
      saveCatalog(); render(); return true;
    }
  }
  if(t.classList.contains("catLink")){
    var k=t.dataset.key;
    if(!t.value) delete S.cat.links[k];
    else S.cat.links[k]={item:t.value,factor:S.cat.links[k]&&S.cat.links[k].factor!=null?S.cat.links[k].factor:1};
    saveCatalog(); render(); return true;
  }
  if(t.classList.contains("catLinkF")){ var l0=S.cat.links[t.dataset.key]; if(l0){ l0.factor=Math.max(0,+t.value||0); saveCatalog() } return true }
  if(t.classList.contains("catDefOn")){ var d=catDef(t.dataset.kind,t.dataset.key); if(d){ d.active=t.checked; saveCatalog(); render() } return true }
  if(t.classList.contains("catLine")){
    var d3=catDef(t.dataset.kind,t.dataset.key); if(!d3) return true;
    var ln=d3.lines[+t.dataset.i]; if(!ln) return true;
    if(t.dataset.f==="qty"){ ln.qty=Math.max(0,+t.value||0); saveCatalog(); return true }
    if(t.dataset.f==="unit"){ ln.unit=opUnit(t.value); saveCatalog(); return true }
    if(t.dataset.f==="ref"){
      var v=t.value, isItem=v.slice(0,2)==="i:", ref=v.slice(2);
      var item=isItem?S.cat.items.filter(function(i){return i.id===ref})[0]:null;
      if(t.dataset.kind==="b"){ ln.kind=isItem?"i":"p"; ln.ref=ref; if(item) ln.unit=item.unit; else delete ln.unit }
      else if(item){ ln.item=ref; ln.unit=item.unit }
      saveCatalog(); render(); return true;
    }
  }
  return false;
}

/* Numbers are written 0-9 everywhere. An Arabic-Indic digit typed or pasted into
   a field becomes its Western twin before the field takes it — a number field
   would otherwise drop it. Passwords are left exactly as typed. */
function westernDigits(s){
  return String(s).replace(/[٠-٩]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x0660+48)})
                  .replace(/[۰-۹]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x06F0+48)});
}
/* Typing a date by hand. A date field reports a whole new date on EVERY keystroke (05 → day 5 of the
   old month and year, then month, then each digit of the year), and each report used to redraw the
   whole screen — which replaced the field under the fingers, so the next keys and clicks landed
   elsewhere and the screen lagged. Now a typed date is held while it is being typed and applied once,
   when the shop leaves the field (Tab, a click elsewhere) or presses Enter. A date picked from the
   calendar is not typed, so it still applies at once. Background redraws wait while a date is held. */
function isDateField(t){ return !!(t&&t.tagName==="INPUT"&&t.type==="date"&&t.closest&&t.closest("#view")) }
// Held, or keys pressed in it moments ago — a half-typed date (no whole date yet) lives only inside the field.
function dateTypingInView(){
  var a=document.activeElement;
  return isDateField(a)&&(!!a._dateHeld||(!!a._typedAt&&Date.now()-a._typedAt<4000));
}
var POINTER_DOWN=false, HOLD_RENDER=false, holdT=null;
function releaseRender(){
  if(!HOLD_RENDER) return;
  HOLD_RENDER=false; if(holdT){clearTimeout(holdT);holdT=null}
  // after the click itself has run; a click that redraws clears the pending flag on its own
  setTimeout(function(){ if(S.renderPending) render() },0);
}
document.addEventListener("pointerdown",function(){POINTER_DOWN=true},true);
document.addEventListener("pointerup",function(){POINTER_DOWN=false; releaseRender()},true);
document.addEventListener("pointercancel",function(){POINTER_DOWN=false; releaseRender()},true);
function commitDate(t){
  if(!t||!t._dateHeld) return;
  t._dateHeld=false; t._typedAt=0; t._dateCommit=true;
  try{
    t.dispatchEvent(new Event("input",{bubbles:true}));
    t.dispatchEvent(new Event("change",{bubbles:true}));
  }finally{ t._dateCommit=false }
  if(S.renderPending) render();
}
document.addEventListener("keydown",function(e){
  var t=e.target; if(!isDateField(t)) return;
  if(e.key==="Enter"){ if(t._dateHeld){ e.preventDefault(); commitDate(t) } return }
  if(e.key.length===1||e.key==="Backspace"||e.key==="Delete"||e.key==="ArrowUp"||e.key==="ArrowDown") t._typedAt=Date.now();
},true);
["input","change"].forEach(function(tp){
  document.addEventListener(tp,function(e){
    var t=e.target; if(!isDateField(t)||t._dateCommit) return;
    if(t._dateHeld||(t._typedAt&&Date.now()-t._typedAt<1000)){ t._dateHeld=true; e.stopImmediatePropagation() }
  },true);
});
document.addEventListener("focusout",function(e){
  var t=e.target; if(!isDateField(t)) return;
  // The whole window losing focus (another program, a notification) is not leaving the field:
  // the half-typed date waits, and typing carries on when the shop comes back.
  if(!document.hasFocus()) return;
  if(!t._dateHeld){ if(S.renderPending) setTimeout(render,0); return }
  // Leaving by a click: apply now, but redraw only after the click has landed, so it cannot be swallowed.
  if(POINTER_DOWN){ HOLD_RENDER=true; holdT=setTimeout(releaseRender,1500) }
  commitDate(t);
},true);

document.addEventListener("beforeinput",function(e){
  var t=e.target;
  if(!t||!/^(INPUT|TEXTAREA)$/.test(t.tagName)||t.type==="password") return;
  var data=e.data!=null?e.data:(e.dataTransfer?e.dataTransfer.getData("text/plain"):null);

/* ---------- sign-in: the first thing any device without an account sees ---------- */
var GATE={busy:false,msg:""};
function gateState(){
  if(!(S.desktop&&BRANDS&&window.desktop&&window.desktop.branches&&window.desktop.cloudSettings)) return null;
  var set=S.cloudSet;
  if(!set) return "loading";
  if(set.mode==="local") return null;
  if(!S.cloud) return "loading";
  if(!S.cloud.enabled) return null;
  var au=set.auth||{}, st=S.cloud.status;

  if(st==="notmember"||st==="disabled") return st;
  return null;
}
function renderGate(){
  var g=document.getElementById("gate"); if(!g) return;
  var st=gateState(), app=document.querySelector(".app"), fb=document.getElementById("footbar");
  if(!st){ if(!g.hidden){ g.hidden=true; if(app) app.inert=false; if(fb) fb.inert=false } return }
  var first=g.hidden;
  g.hidden=false; if(app) app.inert=true; if(fb) fb.inert=true;

  if(gl&&al&&!gl.firstChild) gl.innerHTML=al.innerHTML;          // the same icon as the header and the taskbar
  var msg=GATE.msg, info="";
  if(st==="loading") info="جارٍ التحقّق من الحساب…";
  if(st==="notmember") msg="هذا الحساب ليس من حسابات التطبيق — راجع المالك، أو ادخل بحسابٍ آخر.";
  if(st==="disabled") msg="هذا الحساب موقوف — راجع المالك.";
  if(GATE.busy) info="جارٍ الدخول والتحقّق…";
  var m=document.getElementById("gateMsg"), text=msg||info;
  m.hidden=!text; m.textContent=text; m.className="gatemsg"+(msg?"":" info");

function gateSignIn(){
  var em=document.getElementById("gateEmail").value.trim(), pw=document.getElementById("gatePass").value;
  if(!em||!pw){GATE.msg="اكتب البريد وكلمة المرور";renderGate();return}
  GATE.busy=true; GATE.msg=""; renderGate();
  window.desktop.signIn(em,pw).then(function(r){
    document.getElementById("gatePass").value=""; GATE.busy=false;
    if(r&&r.ok){
      S.cloudSet=r.settings; GATE.msg="";
      if(S.cloud&&S.cloud.status==="signin") S.cloud.status="idle";   // the sync that follows says the rest
      logAct("login","تسجيل دخول"); render(); return;
    }
    GATE.msg=r&&/banned/i.test(r.error||"")?"هذا الحساب موقوف — راجع المالك.":
      r&&r.reason==="credentials"?"البريد أو كلمة المرور غير صحيحة":

function askSignOut(){
  if(document.getElementById("soDlg")) return;
  var a=(accountsOn()&&S.cloud.access)||{}, au=(S.cloudSet&&S.cloudSet.auth)||{};
  var who=a.owner?"المالك":(a.name||a.email||au.email||"");
  var sub=a.owner?"تحكّم كامل":(a.role==="admin"?"مدير":(a.roleName||"بلا دور"));
  var em=a.email||au.email||"";
  var bg=document.createElement("div"); bg.className="modal-bg"; bg.id="soDlg";
  bg.innerHTML='<div class="modal" role="dialog" aria-modal="true" aria-labelledby="soTitle">'+
    '<div class="modal-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 17l-5-5 5-5"/><path d="M5 12h11"/></svg></div>'+
    '<h3 id="soTitle">تسجيل الخروج</h3>'+
    '<p>ستعود إلى شاشة الدخول على هذا الجهاز، ولن يدخل أحدٌ بعدها إلا ببريده وكلمة مروره. بياناتك تبقى محفوظة كما هي.</p>'+
    '<div class="modal-who"><span class="av">'+esc(Array.from(String(who).trim())[0]||"؟")+'</span>'+
      '<span class="w"><b>'+esc(who)+'</b><small>'+esc(sub)+(em?' · <span class="num">'+esc(em)+'</span>':'')+'</small></span></div>'+
    '<div class="modal-act"><button class="btn" id="soNo">البقاء</button><button class="btn primary" id="soYes">تسجيل الخروج</button></div></div>';
  document.body.appendChild(bg);
  var close=function(){ document.removeEventListener("keydown",key,true); bg.classList.add("out"); setTimeout(function(){ if(bg.parentNode) bg.parentNode.removeChild(bg) },140) };
  var key=function(e){ if(e.key==="Escape"){e.preventDefault();close()} else if(e.key==="Enter"){e.preventDefault();close();doSignOut()} };
  document.addEventListener("keydown",key,true);
  bg.addEventListener("click",function(e){
    if(e.target===bg||e.target.closest("#soNo")){close();return}
    if(e.target.closest("#soYes")){close();doSignOut()}
  });
  requestAnimationFrame(function(){ bg.classList.add("in"); var y=document.getElementById("soYes"); if(y) y.focus() });
}

document.addEventListener("click",function(e){
  var t=e.target, b; if(!t||!t.closest) return;
  if(t.id==="gateBtn"){gateSignIn();return}
  if(t.id==="gateOut"){ window.desktop.signOut().then(function(r){ if(r&&r.settings) S.cloudSet=r.settings; GATE.msg=""; render() }); return }
  if(t.closest("#userChip")){ askSignOut(); return }
  if(S.tab!=="admin"||!amAdmin()) return;
  if(t.id==="cpReload"){CP.loaded=false;cpLoad();return}
  if((b=t.closest(".cp-sec"))){ CP.sec=CP.sec===b.dataset.sec?null:b.dataset.sec; render(); return }
  if(t.id==="cpAdd"){ CP.adding=true; render(); var fn=document.getElementById("cpName"); if(fn) fn.focus(); return }
  if(t.id==="cpAddCancel"){ CP.adding=false; CP.newName=""; CP.newEmail=""; delete CP.draft.__new; render(); return }
  if((b=t.closest(".cpOpen"))){ CP.openU=CP.openU===b.dataset.u?null:b.dataset.u; render(); return }
  if(t.id==="cpCreate"){
    var nmN=((document.getElementById("cpName")||{}).value||"").trim();
    var em=((document.getElementById("cpEmail")||{}).value||"").trim(), pw=(document.getElementById("cpPass")||{}).value||"";
    var pw2=(document.getElementById("cpPass2")||{}).value||"";
    var rid=(document.getElementById("cpNewRole")||{}).value||"", brs=admPicked("__new");
    if(!nmN){toast("اكتب اسم المستخدم");return}
    if(cpNameTaken(nmN,null)){toast("يوجد مستخدم بنفس الاسم");return}
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){toast("اكتب بريداً صحيحاً");return}
    if(pw.length<8){toast("كلمة المرور 8 أحرف على الأقل");return}
    if(pw!==pw2){toast("كلمتا المرور غير متطابقتين");return}
    if(!brs.length&&!confirm("لم تختر أيّ فرع — لن يرى هذا المستخدم شيئاً حتى تحدّد له فروعاً. أتتابع؟")) return;
    t.disabled=true;
    admCall("createMember",{name:nmN,email:em,password:pw,roleId:rid||null,branches:brs}).then(function(){
      CP.newEmail=""; CP.newName=""; CP.adding=false; delete CP.draft.__new;
      cpDone("أُنشئ حساب "+nmN,"إضافة المستخدم "+nmN+" ("+em+") — "+cpRoleName(rid));
    },function(x){ t.disabled=false; cpFail(x) });
    return;
  }
  if((b=t.closest(".cpSave"))){
    var uid=b.dataset.u, u=cpUser(uid), d=CP.draft[uid]||{};
    var roleId=d.roleId!==undefined?d.roleId:(u.role_id||""), picks=admPicked(uid);
    var nmS=String(d.name!==undefined?d.name:(u.name||"")).trim();
    if(!nmS&&u.name){toast("لا يمكن ترك الاسم فارغاً");return}
    if(cpNameTaken(nmS,uid)){toast("يوجد مستخدم بنفس الاسم");return}
    admCall("setMember",{user:uid,name:nmS||null,roleId:roleId||null,branches:picks}).then(function(){
      delete CP.draft[uid]; CP.openU=null;
      var who=nmS||u.email||"";
      cpDone("حُفظ «"+who+"»","تعديل "+who+(u.name&&nmS&&u.name!==nmS?" (كان «"+u.name+"»)":"")+": "+cpRoleName(roleId)+" — "+picks.length+" فرع");
    },cpFail);
    return;
  }
  if((b=t.closest(".cpActive"))){
    var au2=cpUser(b.dataset.u), on=b.dataset.a==="1";
    if(!on&&!confirm("إيقاف «"+cpWho(au2.email)+"»؟ يُمنع فوراً من الدخول ومن البيانات على كلّ الأجهزة.")) return;
    admCall("setActive",{user:b.dataset.u,active:on}).then(function(){
      cpDone(on?"فُعِّل الحساب":"أُوقف الحساب",(on?"تفعيل ":"إيقاف ")+cpWho(au2.email));
    },cpFail);
    return;
  }
  if((b=t.closest(".cpPw"))){
    var inp=document.querySelector('.cpNewPw[data-u="'+CSS.escape(b.dataset.u)+'"]'), np=inp?inp.value:"";
    if(np.length<8){toast("كلمة المرور 8 أحرف على الأقل");return}
    admCall("password",{user:b.dataset.u,password:np}).then(function(){
      if(inp) inp.value=""; toast("تغيّرت كلمة المرور"); logAct("admin","تغيير كلمة مرور "+cpWho(cpUser(b.dataset.u).email));
    },cpFail);
    return;
  }
  if((b=t.closest(".cpDel"))){
    var whoD=cpWho(b.dataset.e);
    if(!confirm("حذف «"+whoD+"»؟ يُحذف حسابه ولا يستطيع الدخول بعدها. بيانات الفروع لا تتأثّر.")) return;
    admCall("remove",{user:b.dataset.u,deleteAccount:true}).then(function(){ cpDone("حُذف المستخدم","حذف المستخدم "+whoD) },cpFail);
    return;
  }
  if(t.id==="cpRoleNew"){CP.edit={id:null,name:"",perms:{}};render();return}
  if((b=t.closest(".cpRoleEdit"))||(b=t.closest(".cpRoleCopy"))){
    var r=(CP.roles||[]).filter(function(x){return x.id===b.dataset.r})[0]; if(!r) return;
    var copy=b.classList.contains("cpRoleCopy");
    CP.edit={id:copy?null:r.id,name:copy?r.name+" (نسخة)":r.name,perms:Object.assign({},r.perms||{})};
    render(); var ed=document.getElementById("cpRoleName"); if(ed){ed.scrollIntoView({block:"center"});ed.focus()}
    return;
  }
  if((b=t.closest(".cpRoleDel"))){
    var rr=(CP.roles||[]).filter(function(x){return x.id===b.dataset.r})[0]; if(!rr) return;
    if(+rr.users>0){toast("هذا الدور لـ "+rr.users+" مستخدم — انقلهم لدورٍ آخر أوّلاً");return}
    if(!confirm("حذف الدور «"+rr.name+"»؟")) return;
    admCall("deleteRole",{id:rr.id}).then(function(){ cpDone("حُذف الدور","حذف الدور «"+rr.name+"»") },cpFail);
    return;
  }
  if(t.id==="cpRoleCancel"){CP.edit=null;render();return}
  if(t.id==="cpRoleSave"&&CP.edit){
    var nm=String(CP.edit.name||"").trim();
    if(!nm){toast("اكتب اسم الدور");return}
    var perms={}; Array.prototype.forEach.call(document.querySelectorAll(".cpPerm:checked"),function(x){perms[x.value]=true});
    admCall("saveRole",{id:CP.edit.id,name:nm,perms:perms}).then(function(){
      CP.edit=null; cpDone("حُفظ الدور «"+nm+"»","صلاحيات الدور «"+nm+"»: "+Object.keys(perms).length+" صلاحية");
    },cpFail);
    return;
  }
  if(t.id==="cpActClear"){
    if(!confirm("مسح سجلّ النشاط كلّه؟ البيانات نفسها لا تتأثّر.")) return;
    admCall("clearActivity").then(function(){ CP.activity=[]; cpDone("مُسح السجلّ","مسح سجلّ النشاط") },cpFail);
  }
});
document.addEventListener("change",function(e){
  var t=e.target; if(!t||!t.classList) return;
  if(t.classList.contains("cpRole")){ (CP.draft[t.dataset.u]=CP.draft[t.dataset.u]||{}).roleId=t.value; return }
  if(t.id==="cpNewRole"){ (CP.draft.__new=CP.draft.__new||{}).roleId=t.value; return }
  if(t.classList.contains("admBr")){ (CP.draft[t.dataset.u]=CP.draft[t.dataset.u]||{}).branches=admPicked(t.dataset.u); return }
  if(t.id==="cpActEmail"){
    CP.actEmail=t.value;
    admCall("activity",{limit:300,email:t.value||null}).then(function(a){CP.activity=a||[];render()},cpFail);
    return;
  }
  if(t.classList.contains("cpPerm")&&CP.edit){
    var set=function(k,v){var el=document.querySelector('.cpPerm[value="'+CSS.escape(k)+'"]'); if(el) el.checked=v};
    if(t.checked){ var p=PERM_PARENT[t.value]; if(p) set(p,true) }
    else Object.keys(PERM_PARENT).forEach(function(c){ if(PERM_PARENT[c]===t.value) set(c,false) });
    CP.edit.perms={}; Array.prototype.forEach.call(document.querySelectorAll(".cpPerm:checked"),function(x){CP.edit.perms[x.value]=true});
  }
});
document.addEventListener("input",function(e){
  var t=e.target;
  if(t.id==="cpRoleName"&&CP.edit) CP.edit.name=t.value;
  if(t.id==="cpEmail") CP.newEmail=t.value;
  if(t.id==="cpName") CP.newName=t.value;
  if(t.classList&&t.classList.contains("cpName")) (CP.draft[t.dataset.u]=CP.draft[t.dataset.u]||{}).name=t.value;
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&(e.target.id==="gateEmail"||e.target.id==="gatePass")){e.preventDefault();gateSignIn()}
});

/* ===================== boot ===================== */
function seedDemoState(){
  var demo=buildDemo();
  S.products=demo.products; S.days=demo.days; S.stock=demo.stock; S.events=demo.events; S.imports=[];
  S.demo=true;
}
function bootBranches(store){
  BR=store; S.multi=true;
  if(store.kind==="desktop"&&window.desktop.onCloud){
    window.desktop.onCloud(handleCloud);
    window.desktop.cloudState().then(function(v){ if(v){ S.cloud=v; renderCloudChip(); if(S.ready) render(); else renderGate() } },function(){});
    loadCloudSettings();
  }
  Promise.resolve(BR.state()).then(function(r){
    if(!r||!r.ok||!r.ws||!r.ws.branches) throw new Error((r&&r.error)||"no branches");
    S.ws=r.ws; S.dataRoot=r.root||null; S.appVersion=r.version||null;
    S.migratedNote=r.migrated||[]; S.legacyNewer=r.legacyNewer||[];
    if(r.resynced&&r.resynced.length) S.resyncedNote=r.resynced;
    if(!S.ws.branches.length){ S.ready=true; render(); return true }
    return openBranch(S.ws.current||S.ws.branches[0].id);
  }).catch(function(e){
    S.ready=true; render(); toast("تعذّر تحميل الفروع: "+(e&&e.message||e));
  });
}
(function boot(){
  var hosted = window.claude && typeof window.claude.use==="function";
  var isDesktop = !!(window.desktop && window.desktop.load);

  if(isDesktop){
    // Render the demo at once so the window is never blank, then swap in the
    // real file the moment it comes back off disk.
    S.local=true; S.desktop=true;
    seedDemoState(); relearn(); render();
    if(BRANDS&&window.desktop.branches){ bootBranches(desktopBranches()); return }
    window.desktop.load().then(function(r){
      if(r&&r.brand) S.brandKey=r.brand;
      if(r&&r.ok&&r.data&&applyData(r.data)){ S.dataPath=r.path }
      else { S.dataPath=r&&r.path; }
      S.ready=true; relearn(); render();
    },function(){ S.ready=true; render() });
    return;
  }

  var restored=false;
  if(!hosted&&BRANDS){
    S.local=true; seedDemoState(); relearn(); render();
    bootBranches(browserBranches()); return;
  }
  if(!hosted){S.local=true; S.ready=true; restored=loadLocal()}
  if(!restored) seedDemoState();
  relearn();
  render();
  if(hosted) connect();
})();
</script>
