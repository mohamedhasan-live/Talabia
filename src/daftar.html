/* ===================== operational layer: materials, links, offers, recipes =====================
 * A layer ON TOP of the sales: nothing here changes a product, a sale or the order formulas.
 *   sales product (as Odoo sold it) → offer, if it is one (broken into its products/materials)
 *   → operational link (Black Coffee → قهوة) and recipe (سينابون كبير → صوص + كريمة + مكسرات)
 *   → consumption of operational items and materials.
 * Each brand has its own catalogue (catalog.js); a branch may override a brand recipe or offer.
 * Products are keyed by their Odoo code when they have one ("c:pos cn 017"), else by name.
 * No relation is ever guessed from a name — every one is set by the shop on the screen.
 */
var OP_UNITS={"قطعة":{base:"قطعة",f:1},"جم":{base:"جم",f:1},"كجم":{base:"جم",f:1000},"مل":{base:"مل",f:1},"لتر":{base:"مل",f:1000}};
var OP_UNIT_LIST=["قطعة","جم","كجم","مل","لتر"];
/*
 * A unit is written freely (علبة، كرتونة، كوب، شوت، باكت…). The five standard ones convert among
 * themselves (جم↔كجم، مل↔لتر); any other unit has no conversion and is counted and shown as written.
 * Spacing, Arabic digits and Latin case are evened out, so «كوب» and « كوب » are one unit.
 */
function opUnit(u){
  var s=westernDigits(String(u==null?"":u)).replace(/\s+/g," ").trim().slice(0,20);
  if(!s) return "قطعة";
  for(var i=0;i<OP_UNIT_LIST.length;i++) if(normName(OP_UNIT_LIST[i])===normName(s)) return OP_UNIT_LIST[i];
  return /[a-z]/i.test(s)?s.toLowerCase():s;
}
var OP_SYN=null;
function opStd(u){
  if(OP_UNITS[u]) return OP_UNITS[u];
  if(!OP_SYN){ OP_SYN={};
    [["جم","جرام","غرام","جرامات","غرامات","غم","غ","g","gm","gr","gram","grams"],["كجم","كيلو","كيلوجرام","كيلوغرام","كيلو جرام","كيلو غرام","كغ","kg","kilo"],
     ["مل","ملل","ملي","مللي","ml"],["لتر","لترات","l","liter","litre"]].forEach(function(g){ g.forEach(function(x){ OP_SYN[normName(x)]=g[0] }) }); }
  var std=OP_SYN[normName(u)];
  return std?OP_UNITS[std]:null;
}
function opBase(u){u=opUnit(u);return opStd(u)?opStd(u).base:u}
function opToBase(q,u){u=opUnit(u);return (+q||0)*(opStd(u)?opStd(u).f:1)}
function opCompatible(u){u=opUnit(u);if(!opStd(u)) return [u];var b=opBase(u),l=OP_UNIT_LIST.filter(function(x){return opBase(x)===b});if(l.indexOf(u)<0) l.unshift(u);return l}
/** The standard units, then every unit this brand already uses — offered as suggestions, never imposed. */
function opUnitSuggestions(){
  var out=OP_UNIT_LIST.slice();
  (S.cat&&S.cat.items||[]).forEach(function(i){ if(out.indexOf(i.unit)<0) out.push(i.unit) });
  return out;
}
function num2(v){return (Math.round((+v||0)*100)/100).toLocaleString("en-US",{maximumFractionDigits:2})}
/** An amount held in its base unit (جم، مل، قطعة), shown in the readable one: 2,000 جم → 2 كجم. */
function fmtOp(v,base,plain){
  var big=(base==="جم"||base==="مل")&&Math.abs(v)>=1000;
  // read right to left, number first («2 كجم»), even inside a left-to-right number cell
  var rtl=function(x){return plain?x:'<span dir="rtl" style="unicode-bidi:isolate">'+x+'</span>'};
  if(!big) return rtl(num2(v)+" "+esc(base));
  var main=num2(v/1000)+" "+(base==="جم"?"كجم":"لتر");
  return plain?main:rtl(main+' <span style="color:var(--ink-3);font-size:11px">('+num2(v)+' '+base+')</span>');
}
function curBrandKey(){var b=S.multi?curBranch():null;return (b&&b.brand)||CUR_BRAND}
function emptyCat(brand){return {v:1,brand:brand,items:[],links:{},bundles:{},recipes:{},branches:{},archive:[]}}
/** Everything that enters from a file or the cloud is cleaned: ids, numbers and lengths are checked. */
function sanitizeCatalog(d,brand){
  var out=emptyCat(brand);
  if(!d||typeof d!=="object") return out;
  var ids={};
  (Array.isArray(d.items)?d.items:[]).slice(0,2000).forEach(function(i){
    if(!i||typeof i!=="object"||!SAFE_ID.test(String(i.id))||ids[i.id]) return;
    ids[i.id]=1;
    out.items.push(cleanItem(i));
  });
  function cleanItem(i){
    var o={id:String(i.id),name:sStr(i.name,120),unit:opUnit(i.unit),shelfLife:i.shelfLife==null||i.shelfLife===""?null:sNum(i.shelfLife,null),active:i.active!==false};
    if(i.asProduct===true||i.asProduct===false) o.asProduct=i.asProduct;      // «اعرضها كصنف في الطلبية», set by the shop
    if(i.group!=null&&/^g[a-z0-9]{1,24}$/.test(String(i.group))) o.group=String(i.group);
    return o;
  }
  var key=function(k){return typeof k==="string"&&k.length<=300&&/^[cn]:/.test(k)};
  var lines=function(arr,kinds){
    return (Array.isArray(arr)?arr:[]).slice(0,200).filter(function(l){return l&&typeof l==="object"}).map(function(l){
      var o={qty:sNum(l.qty,0)};
      if(kinds){ o.kind=l.kind==="i"?"i":"p"; o.ref=String(l.ref==null?"":l.ref).slice(0,300); }
      else o.item=String(l.item==null?"":l.item).slice(0,60);
      if(l.unit!=null) o.unit=opUnit(l.unit);
      return o;
    }).filter(function(l){return kinds?(l.kind==="i"?SAFE_ID.test(l.ref):key(l.ref)):SAFE_ID.test(l.item)});
  };
  var defs=function(src,kinds){
    var o={}; if(!src||typeof src!=="object") return o;
    Object.keys(src).slice(0,3000).forEach(function(k){
      var v=src[k]; if(!key(k)||!v||typeof v!=="object") return;
      o[k]={active:v.active!==false,lines:lines(v.lines,kinds)};
      if(v.group!=null&&/^g[a-z0-9]{1,24}$/.test(String(v.group))) o[k].group=String(v.group);   // its own group (recipes / offers)
      if(v.pos!=null&&v.pos!=="") o[k].pos=sNum(v.pos,0);        // its place in the list the shop arranged
    });
    return o;
  };
  if(d.links&&typeof d.links==="object") Object.keys(d.links).slice(0,3000).forEach(function(k){
    var v=d.links[k]; if(!key(k)||!v||typeof v!=="object"||!SAFE_ID.test(String(v.item))) return;
    out.links[k]={item:String(v.item),factor:v.factor==null?1:sNum(v.factor,1)};
  });
  out.bundles=defs(d.bundles,true);
  out.recipes=defs(d.recipes,false);
  if(d.ui&&typeof d.ui==="object"){ var ui1=sanitizeUi(d.ui); if(ui1) out.ui=ui1 }                // «تخصيص الواجهة» of the whole brand
  var cleanGroups=function(L){ return (Array.isArray(L)?L:[]).filter(function(g){return g&&typeof g==="object"&&/^g[a-z0-9]{1,24}$/.test(String(g.id))}).slice(0,200)
    .map(function(g){return {id:String(g.id), name:sStr(g.name,60)||"مجموعة"}}).filter(function(g,i,a){return a.findIndex(function(x){return x.id===g.id})===i}) };
  out.groups=cleanGroups(d.groups); out.rgroups=cleanGroups(d.rgroups); out.bgroups=cleanGroups(d.bgroups);
  if(d.branches&&typeof d.branches==="object") Object.keys(d.branches).slice(0,500).forEach(function(b){
    if(!/^[a-z0-9][a-z0-9-]{0,47}$/.test(b)||!d.branches[b]||typeof d.branches[b]!=="object") return;
    out.branches[b]={bundles:defs(d.branches[b].bundles,true),recipes:defs(d.branches[b].recipes,false)};
  });
  // «المحذوفات»: a deleted material (with every place it was used), offer or recipe, until put back or deleted for good
  var scopeOk=function(x){x=String(x==null?"":x);return /^[a-z0-9][a-z0-9-]{0,47}$/.test(x)?x:""};
  out.archive=(Array.isArray(d.archive)?d.archive:[]).slice(0,300).map(function(a){
    if(!a||typeof a!=="object") return null;
    var r={at:sStr(a.at,40), scope:scopeOk(a.scope)};
    if(a.kind==="b"||a.kind==="r"){
      if(!key(a.key)) return null; var o={}; o[a.key]=a.val; var dd=defs(o,a.kind==="b"); if(!dd[a.key]) return null;
      r.kind=a.kind; r.key=a.key; r.val=dd[a.key]; return r;
    }
    if(a.kind==="i"&&a.item&&typeof a.item==="object"&&SAFE_ID.test(String(a.item.id))){
      r.kind="i"; r.item=cleanItem(a.item);
      r.uses=(Array.isArray(a.uses)?a.uses:[]).slice(0,2000).map(function(u){
        if(!u||typeof u!=="object"||!key(u.k)) return null;
        if(u.w==="l") return u.v&&SAFE_ID.test(String(u.v.item))?{w:"l",s:"",k:u.k,v:{item:String(u.v.item),factor:u.v.factor==null?1:sNum(u.v.factor,1)}}:null;
        if(u.w==="b"||u.w==="r"){ var ln=lines([u.v],u.w==="b")[0]; return ln?{w:u.w,s:scopeOk(u.s),k:u.k,v:ln}:null }
        return null;
      }).filter(Boolean);
      return r;
    }
    return null;
  }).filter(Boolean);
  return out;
}

/* ---------- loading and saving the open brand's catalogue ---------- */
var CAT_LS="talabia-catalog-";
function ensureCatalog(){
  var brand=curBrandKey();
  if(!brand||S.catBrand===brand||S.catLoading===brand) return;
  S.catLoading=brand;
  var done=function(data,rev){
    if(S.catLoading!==brand) return;
    S.catLoading=null; S.catBrand=brand; S.catRev=rev||0; S.cat=sanitizeCatalog(data,brand);
    render();
  };
  if(window.desktop&&window.desktop.catalogLoad){
    window.desktop.catalogLoad(brand).then(function(r){ done(r&&r.ok?r.data:null, r&&r.rev) },function(){ done(null,0) });
  }else{
    var raw=null; try{raw=JSON.parse(localStorage.getItem(CAT_LS+brand)||"null")}catch(e){}
    setTimeout(function(){done(raw,0)},0);
  }
}
var catT=null;
function saveCatalog(now){
  if(!S.cat||!S.catBrand) return;
  if(catT) clearTimeout(catT);
  var brand=S.catBrand;

    catT=null;

      },function(){toast("تعذّر حفظ الوصفات")});

/* ---------- products and their keys ---------- */
function productKeys(p){
  var av=aliasView(p), out=av.codes.map(function(c){return "c:"+c});
  out.push("n:"+normName(p.name));
  av.names.forEach(function(a){out.push("n:"+a)});
  return out.filter(function(k,i,a){return k.length>2&&a.indexOf(k)===i});
}
function productKey(p){return productKeys(p)[0]}
function catFind(map,keys){
  if(!map) return null;
  for(var i=0;i<keys.length;i++) if(map[keys[i]]) return {key:keys[i],val:map[keys[i]]};
  return null;
}
/** The rules in force for one branch: its own overrides first, then the brand's. */
function opCtx(cat,branchId){
  cat=cat||emptyCat(curBrandKey());
  var ov=(cat.branches||{})[branchId]||{bundles:{},recipes:{}};
  var items={}; (cat.items||[]).forEach(function(i){items[i.id]=i});
  var byKey={};
  S.products.forEach(function(p){productKeys(p).forEach(function(k){ if(!byKey[k]) byKey[k]=p })});
  var pick=function(kind){return function(keys){
    var o=catFind(ov[kind],keys); if(o) return {key:o.key,val:o.val,scope:"branch"};
    o=catFind(cat[kind],keys); return o?{key:o.key,val:o.val,scope:"brand"}:null;
  }};
  return {cat:cat, items:items, byKey:byKey, bundle:pick("bundles"), recipe:pick("recipes"),
          link:function(keys){return catFind(cat.links,keys)},
          keysOf:function(ref){var p=byKey[ref];return p?productKeys(p):[ref]}};
}
function opName(ctx,key){
  var p=ctx.byKey[key]; if(p) return p.name;
  if(/^c:/.test(key)) return key.slice(2).toUpperCase().replace(/ /g,"-");
  return key.slice(2);
}
function opAcc(){return {items:{},src:{},prods:{},bundled:{},unlinked:{},cycles:{}}}
function opAdd(acc,itemId,amount,origin){
  if(!amount) return;
  acc.items[itemId]=(acc.items[itemId]||0)+amount;
  var s=acc.src[itemId]=acc.src[itemId]||{}; s[origin]=(s[origin]||0)+amount;
}
/**
 * One product sold `qty` times, all the way down: an offer becomes its products and materials (and those
 * products their own recipes), a product adds to the operational item it is linked to and to the materials
 * of its recipe. A product with none of these is listed as needing an operational link. An offer that
 * contains itself, at any depth, is stopped and reported.
 */
function opExpand(ctx,keys,qty,acc,origin,depth,path){
  var pkey=keys[0];
  if(!qty) return;
  if(depth>8||path.indexOf(pkey)>=0){ acc.cycles[pkey]=1; return }
  var b=ctx.bundle(keys);
  if(b&&b.val.active!==false&&b.val.lines.length){
    acc.bundled[pkey]=(acc.bundled[pkey]||0)+qty;
    b.val.lines.forEach(function(l){
      if(l.kind==="i"){ var it=ctx.items[l.ref]; if(it&&it.active!==false) opAdd(acc,it.id,qty*opToBase(l.qty,l.unit||it.unit),origin); return }
      opExpand(ctx,ctx.keysOf(l.ref),qty*(+l.qty||0),acc,origin,depth+1,path.concat([pkey]));
    });
    return;
  }
  acc.prods[pkey]=(acc.prods[pkey]||0)+qty;
  var used=false, ln=ctx.link(keys);
  if(ln){ var li=ctx.items[ln.val.item]; if(li&&li.active!==false){ opAdd(acc,li.id,qty*opToBase(ln.val.factor==null?1:ln.val.factor,li.unit),origin); used=true } }
  var r=ctx.recipe(keys);
  if(r&&r.val.active!==false) r.val.lines.forEach(function(l){
    var it=ctx.items[l.item]; if(!it||it.active===false) return;
    opAdd(acc,it.id,qty*opToBase(l.qty,l.unit||it.unit),origin); used=true;
  });
  if(!used){
    var why=b&&b.val.active===false?"العرض موقوف":r&&r.val.active===false?"الوصفة موقوفة":"لا ربط تشغيلي ولا وصفة ولا عرض";
    var u=acc.unlinked[pkey]=acc.unlinked[pkey]||{qty:0,why:why}; u.qty+=qty;
  }
}
function opMerge(into,a){
  ["items","prods","bundled"].forEach(function(f){Object.keys(a[f]).forEach(function(k){into[f][k]=(into[f][k]||0)+a[f][k]})});
  Object.keys(a.src).forEach(function(i){var s=into.src[i]=into.src[i]||{};Object.keys(a.src[i]).forEach(function(o){s[o]=(s[o]||0)+a.src[i][o]})});
  Object.keys(a.unlinked).forEach(function(k){var u=into.unlinked[k]=into.unlinked[k]||{qty:0,why:a.unlinked[k].why};u.qty+=a.unlinked[k].qty});
  Object.keys(a.cycles).forEach(function(k){into.cycles[k]=1});
}
/** One day's sales, exactly as recorded, through the layer. */
function opDay(ctx,rec){
  var acc=opAcc(), pmap={};
  S.products.forEach(function(p){pmap[p.id]=p});
  Object.keys(rec&&rec.items||{}).forEach(function(pid){
    var q=+rec.items[pid].sold||0, p=pmap[pid]; if(!q||!p) return;
    var keys=productKeys(p); opExpand(ctx,keys,q,acc,keys[0],0,[]);
  });
  return acc;
}
function catHasRules(cat){
  cat=cat||{};
  return !!((cat.items||[]).length||Object.keys(cat.links||{}).length||Object.keys(cat.bundles||{}).length||Object.keys(cat.recipes||{}).length);
}
/** The period's operational analysis: each item and material analysed like a product. */
function opReport(range){
  var R=normRange(range), ctx=opCtx(S.cat,S.branchId);
  var keys=Object.keys(S.days).sort().filter(function(k){return (!R.from||k>=R.from)&&(!R.to||k<=R.to)});
  var tot=opAcc(), daily={};
  keys.forEach(function(k){
    var a=opDay(ctx,S.days[k]); opMerge(tot,a);
    Object.keys(a.items).forEach(function(id){(daily[id]=daily[id]||{})[k]=a.items[id]});
  });
  var rows=(S.cat&&S.cat.items||[]).filter(function(i){return i.active!==false&&tot.items[i.id]}).map(function(it){
    var series=keys.map(function(k){return {date:k,d:parseYmd(k),qty:(daily[it.id]||{})[k]||0}});
    var total=tot.items[it.id]||0, src=tot.src[it.id]||{};
    return {item:it, base:opBase(it.unit), total:total, dailyAvg:keys.length?total/keys.length:0,
            trend7:trendOf(series,7), weekday:byWeekday(series), series:series,
            sources:Object.keys(src).map(function(o){return {key:o,name:opName(ctx,o),amount:src[o]}}).sort(function(a,b){return b.amount-a.amount})};
  }).sort(function(a,b){return b.total-a.total});
  return {days:keys.length, rows:rows, tot:tot, ctx:ctx};
}
/** What the coming order's window needs, from the app's own forecast for each product (planFor is untouched). */
function opNeeds(plans){
  var ctx=opCtx(S.cat,S.branchId), exp=opAcc(), tgt=opAcc();
  plans.forEach(function(r){
    var keys=productKeys(r.p);
    opExpand(ctx,keys,r.plan.expected,exp,keys[0],0,[]);
    opExpand(ctx,keys,Math.max(r.plan.target,r.plan.expected),tgt,keys[0],0,[]);
  });
  var rows=(S.cat&&S.cat.items||[]).filter(function(i){return i.active!==false&&(exp.items[i.id]||tgt.items[i.id])}).map(function(it){
    var src=exp.src[it.id]||{};
    return {item:it, base:opBase(it.unit), expected:exp.items[it.id]||0, target:tgt.items[it.id]||0,
            sources:Object.keys(src).map(function(o){return {name:opName(ctx,o),amount:src[o]}}).sort(function(a,b){return b.amount-a.amount})};
  }).sort(function(a,b){return b.target-a.target});
  return {rows:rows, unlinked:exp.unlinked, ctx:ctx};
}

/**
 * The ORDER of each material for the made-to-order products — the same arithmetic planFor applies to a product
 * (forecast over the window, a reserve from the shelf life through serviceLevel/probit, and a hard ceiling of what
 * can be used before it expires × horizonBuffer), run on the material's own demand: each made-to-order product's
 * forecast × how much of the material one unit of it takes. A material without a shelf life gets no ceiling.
 * No material stock is subtracted (none is counted yet). planFor itself is untouched.
 */
function opMaterialOrder(plans,w){
  var mto=plans.filter(function(r){return r.p.mto});
  if(!mto.length||!S.cat) return null;
  var ctx=opCtx(S.cat,S.branchId), per={};
  mto.forEach(function(r){ var a=opAcc(), keys=productKeys(r.p); opExpand(ctx,keys,1,a,keys[0],0,[]); per[r.p.id]=a.items });
  var out={}, od=w.orderDate||w.days[0];
  // a product's own demand on a day, offers counted once (through their breakdown), as materialPlans does
  var dem=function(p,day){ var was=OFFER_DEMAND.on; OFFER_DEMAND.on=false; try{ return demandFc(p,day) } finally { OFFER_DEMAND.on=was } };
  (S.cat.items||[]).forEach(function(it){
    if(it.active===false) return;
    var mode=itemMode("i:"+it.id,od.getDay()); if(mode==="x") return;
    var users=mto.filter(function(r){return per[r.p.id][it.id]});
    if(!users.length) return;
    var u=function(r){return per[r.p.id][it.id]};
    var mw=coverageWindow(od,mainDaysOf("i:"+it.id)), w=mw;   // the material's own cycle (cinnabon cores: week to week)
    var fc=w.days.map(function(day,i){return sum(users.map(function(r){return dem(r.p,day)*w.weights[i]*u(r)}))});
    var expected=sum(fc);
    var cvN=0,cvD=0;
    users.forEach(function(r){ var m=S.model[r.p.id]||{base:0,sigma:0}, cv=m.base>0?m.sigma/m.base:0.45, e=sum(w.days.map(function(day,i){return dem(r.p,day)*w.weights[i]}))*u(r); cvN+=cv*e; cvD+=e });
    var cv=cvD>0?cvN/cvD:0.45;
    var sigmaW=cv*Math.sqrt(sum(fc.map(function(x){return x*x})));
    var shelf=+it.shelfLife||0;
    var cr=serviceLevel({shelfLife:shelf||30},w.span), z=probit(cr);
    var target=expected+z*sigmaW, cap=Infinity;
    if(shelf){
      var capSum=0;
      for(var i=0;i<shelf;i++){ var dd=addDays(w.delivery,i); capSum+=sum(users.map(function(r){return forecast(r.p,dd)*u(r)}))*(i===0?w.after:1) }
      cap=capSum*S.cfg.horizonBuffer;
    }
    var q=Math.max(0,Math.min(target,cap));
    q=opBase(it.unit)==="قطعة"||!opStd(it.unit)?Math.ceil(q-1e-9):Math.round(q*100)/100;
    var tp=null;
    if(mode==="t"){                                         // top-up: what the products using it sold beyond the forecast
      tp=topupShortfall(od,mainDaysOf("i:"+it.id),function(day){
        var r=S.days[ymd(day)]; if(!r||!r.items) return null; var any=false, t=0;
        users.forEach(function(x){ var e=r.items[x.p.id]; if(e&&e.sold!=null){ any=true; t+=(+e.sold)*u(x) } });
        return any?t:null;
      },function(day){return sum(users.map(function(x){return dem(x.p,day)*u(x)}))});
      q=opBase(it.unit)==="قطعة"||!opStd(it.unit)?Math.ceil(tp.short-1e-9):Math.round(tp.short*100)/100;
    }
    out[it.id]={expected:expected, target:target, cap:cap, capBinds:target>cap+1e-9, order:q, shelf:shelf, cr:cr, fc:fc, z:z, sigmaW:sigmaW, w:w, mode:mode, topup:tp,
                from:users.map(function(r){return r.p.name})};
  });
  return out;
}

/**
 * «مراجعة»: what in the brand's offers, links and recipes looks misplaced — read only, nothing is changed.

function catReview(cat,ctx){
  cat=cat||S.cat; ctx=ctx||opCtx(cat,S.branchId);
  if(!cat) return [];
  var out=[], items={}; (cat.items||[]).forEach(function(i){items[i.id]=i});
  var act=S.products.filter(function(p){return p.active!==false});
  var nm=function(p){return p?p.name:"؟"};
  var used={};
  var useOf=function(lines,field){ (lines||[]).forEach(function(l){ var id=field==="item"?l.item:(l.kind==="i"?l.ref:null); if(id) used[id]=1 }) };
  Object.keys(cat.links||{}).forEach(function(k){ used[cat.links[k].item]=1 });
  Object.keys(cat.recipes||{}).forEach(function(k){ useOf(cat.recipes[k].lines,"item") });
  Object.keys(cat.bundles||{}).forEach(function(k){ useOf(cat.bundles[k].lines,"ref") });
  act.forEach(function(p){
    var keys=productKeys(p), b=ctx.bundle(keys), r=ctx.recipe(keys), l=ctx.link(keys);
    // 1. a product whose unit says «offer» but is not broken down
    if(!b&&normName(unitOf(p))===normName("عرض")) out.push({level:"high", kind:"offer-undefined", product:p.name,
      text:"«"+p.name+"» وحدته «عرض» ولا تعريف عرضٍ له — مبيعاته لا تصل إلى منتجاته ولا موادّه. عرّفه في «العروض»."});
    // 2. nothing operational at all
    if(!b&&!r&&!l&&normName(unitOf(p))!==normName("عرض")) out.push({level:"mid", kind:"unlinked", product:p.name, text:"«"+p.name+"» بلا وصفةٍ ولا ربطٍ ولا عرض — لا يدخل حساب المواد."});
    // 3. the same material counted twice: through the link and through the recipe
    if(l&&r&&!b&&(r.val.lines||[]).some(function(x){return x.item===l.val.item})) out.push({level:"high", kind:"double", product:p.name,
      text:"«"+p.name+"» مربوطٌ بـ«"+((items[l.val.item]||{}).name||"؟")+"» وفي وصفته المادة نفسها — تُحسب مرّتين. أبقِ واحداً."});
    // 4. a link on a product that is defined as an offer is never used
    if(l&&b&&b.val.active!==false) out.push({level:"low", kind:"link-on-offer", product:p.name, text:"«"+p.name+"» عرضٌ، فربطه لا يُستعمل (العرض يُفكَّك بتعريفه)."});
    // 5. an offer line asking for many units of a product: one box, or many?
    if(b) (b.val.lines||[]).forEach(function(x){
      if(x.kind!=="p"||!((+x.qty||0)>=10)) return;
      var t=ctx.byKey[x.ref];
      out.push({level:"high", kind:"offer-qty", product:p.name, text:"العرض «"+p.name+"» فيه "+x.qty+" × «"+nm(t)+"». إن كان «"+nm(t)+"» علبةً كاملة فالصحيح 1 — وإلا فالعرض يحسب "+x.qty+" علبة."});
    });

    var off=[];
    if(r) (r.val.lines||[]).forEach(function(x){ var it=items[x.item]; if(it&&it.active===false) off.push(it.name) });
    if(off.length) out.push({level:"mid", kind:"inactive-material", product:p.name, text:"وصفة «"+p.name+"» تستعمل مادةً موقوفة ("+off.join("، ")+") — لا تُحسب."});
  });

    var r=ctx.recipe(productKeys(p)); if(!r) return;

    if(!piece||!(+piece.qty>0)) return;

  });
  Object.keys(fam).forEach(function(k){
    var F=fam[k]; if(F.length<2) return;
    var mats={};
    F.forEach(function(x){ x.lines.forEach(function(l){ if(l===x.piece) return; (mats[l.item]=mats[l.item]||[]).push({x:x, per:opToBase(l.qty,l.unit||(items[l.item]||{}).unit)/(+x.piece.qty)}) }) });
    Object.keys(mats).forEach(function(id){
      var arr=mats[id], it=items[id]||{name:"؟"};

      }
      if(arr.length>=2){
        var per=arr.map(function(a){return a.per}).sort(function(a,b){return a-b}), med=per[Math.floor(per.length/2)];
        arr.forEach(function(a){ if(med>0&&(a.per>med*1.5||a.per<med/1.5)) out.push({level:"mid", kind:"size-ratio", product:a.x.p.name,
          text:"«"+a.x.p.name+"»: «"+it.name+"» "+fmtOp(a.per,opBase(it.unit),true)+" لكلّ حبة، وفي أحجامه الأخرى نحو "+fmtOp(med,opBase(it.unit),true)+" — راجع الكمية."}) });
      }

  });

  (cat.items||[]).forEach(function(i){ if(i.active!==false&&!used[i.id]) out.push({level:"low", kind:"unused", product:"", text:"المادة «"+i.name+"» لا تستعملها أيّ وصفةٍ ولا ربطٍ ولا عرض."}) });
  // 9. an alias that is another product's name: a file line with that name could land on the wrong product
  var byName={}; act.forEach(function(p){ byName[normName(p.name)]=p });
  act.forEach(function(p){ (p.aliases||[]).forEach(function(a){ var o=byName[a]; if(o&&o.id!==p.id) out.push({level:"high", kind:"alias-clash", product:p.name,

  // 10. aliases left by typing (a letter or two) or by the placeholder name — they can mislead the import

  });

}

    Object.keys(c.recipes||{}).forEach(function(k){ if((c.recipes[k].lines||[]).some(function(l){return l.item===itemId})) out.push("وصفة "+opName(ctx,k)+tag) });
    Object.keys(c.bundles||{}).forEach(function(k){ if((c.bundles[k].lines||[]).some(function(l){return l.kind==="i"&&l.ref===itemId})) out.push("عرض "+opName(ctx,k)+tag) });
  };
  scan(cat,"");
  Object.keys(cat.branches).forEach(function(b){ var br=findBranch(b); scan(cat.branches[b]," (خاصّ بفرع "+(br?br.name:b)+")") });
  return out;
}
/** Remove a material and every line that names it, in the brand and in each branch's overrides. */
function catRemoveItem(cat,itemId){
  Object.keys(cat.links).forEach(function(k){ if(cat.links[k].item===itemId) delete cat.links[k] });
  [cat].concat(Object.keys(cat.branches).map(function(b){return cat.branches[b]})).forEach(function(c){
    Object.keys(c.recipes||{}).forEach(function(k){ c.recipes[k].lines=(c.recipes[k].lines||[]).filter(function(l){return l.item!==itemId}) });
    Object.keys(c.bundles||{}).forEach(function(k){ c.bundles[k].lines=(c.bundles[k].lines||[]).filter(function(l){return !(l.kind==="i"&&l.ref===itemId)}) });
  });
  cat.items=cat.items.filter(function(i){return i.id!==itemId});
}

function trashRestore(src,i){
  if(src==="p"){
    var e=(S.trash||[])[i]; if(!e) return;
    if(S.products.some(function(p){return p.id===e.prod.id})){ toast("«"+e.prod.name+"» موجودٌ في الأصناف"); S.trash.splice(i,1); scheduleSaveAll(); render(); return }
    S.products.push(e.prod); S.trash.splice(i,1);
    saveProduct(e.prod); relearn(); render(); logAct("items","استرجاع الصنف «"+e.prod.name+"»"); toast("عاد «"+e.prod.name+"» إلى الأصناف"); return;
  }
  var cat=S.cat, a=cat&&(cat.archive||[])[i]; if(!a) return;
  if(a.kind==="i"){
    if(cat.items.some(function(x){return x.id===a.item.id})){ toast("«"+a.item.name+"» موجودةٌ في المواد"); return }
    cat.items.push(a.item);
    var back=0, lost=0;
    a.uses.forEach(function(u){
      if(u.w==="l"){ if(!cat.links[u.k]){ cat.links[u.k]=u.v; back++ } else lost++; return }
      var c=u.s?cat.branches[u.s]:cat, d=c&&c[u.w==="r"?"recipes":"bundles"][u.k];
      if(d){ d.lines=d.lines||[]; d.lines.push(u.v); back++ } else lost++;
    });
    cat.archive.splice(i,1);
    catLog("استرجاع «"+a.item.name+"»"); saveCatalog(); render();
    toast("عادت «"+a.item.name+"»"+(back?" إلى "+back+" موضعاً":"")+(lost?" — "+lost+" موضعاً لم يعد موجوداً":"")); return;
  }
  var c2=a.scope?(cat.branches[a.scope]=cat.branches[a.scope]||{bundles:{},recipes:{}}):cat, bk=c2[a.kind==="b"?"bundles":"recipes"];
  var nm=opName(opCtx(cat,S.branchId),a.key);
  if(bk[a.key]&&!confirm("لـ«"+nm+"» "+(a.kind==="b"?"تعريف عرض":"وصفة")+" الآن. أتستبدله بالمحذوف؟ (يُنقل الحالي إلى «المحذوفات»)")) return;
  var cur=bk[a.key];
  bk[a.key]=a.val; cat.archive.splice(i,1);
  if(cur) catArchive({kind:a.kind, key:a.key, val:cur, scope:a.scope});
  catLog("استرجاع "+(a.kind==="b"?"عرض":"وصفة")+" «"+nm+"»"); saveCatalog(); render(); toast("عادت "+(a.kind==="b"?"العرض":"الوصفة")+" «"+nm+"»");
}
function trashPurge(src,i){
  var list=src==="p"?(S.trash||[]):(S.cat&&S.cat.archive||[]), e=list[i]; if(!e) return;
  var nm=src==="p"?e.prod.name:e.kind==="i"?e.item.name:opName(opCtx(S.cat,S.branchId),e.key);
  if(!confirm("أتحذف «"+nm+"» نهائياً؟ لا يمكن استرجاعه بعد ذلك.")) return;
  list.splice(i,1);
  if(src==="p") scheduleSaveAll(); else saveCatalog();
  render(); toast("حُذف «"+nm+"» نهائياً");
}

/** Every place a material is used, recorded so a deleted material can be put back where it was. */
function catUseRecords(cat,itemId){
  var out=[];
  Object.keys(cat.links).forEach(function(k){ if(cat.links[k].item===itemId) out.push({w:"l",s:"",k:k,v:JSON.parse(JSON.stringify(cat.links[k]))}) });
  [["",cat]].concat(Object.keys(cat.branches).map(function(b){return [b,cat.branches[b]]})).forEach(function(x){
    var sc=x[0], c=x[1];
    Object.keys(c.recipes||{}).forEach(function(k){ (c.recipes[k].lines||[]).forEach(function(l){ if(l.item===itemId) out.push({w:"r",s:sc,k:k,v:JSON.parse(JSON.stringify(l))}) }) });
    Object.keys(c.bundles||{}).forEach(function(k){ (c.bundles[k].lines||[]).forEach(function(l){ if(l.kind==="i"&&l.ref===itemId) out.push({w:"b",s:sc,k:k,v:JSON.parse(JSON.stringify(l))}) }) });
  });
  return out;
}
function catArchive(entry){
  entry.at=new Date().toISOString();

}
/** Offers or recipes in the order the shop set (↑ ↓); those never moved keep the order they were added in. */
function defKeys(bk){
  var ks=Object.keys(bk||{});
  return ks.map(function(k,i){return [k,bk[k]&&bk[k].pos!=null?+bk[k].pos:1e6+i,i]})
    .sort(function(a,b){return a[1]-b[1]||a[2]-b[2]}).map(function(x){return x[0]});
}
function catUses(cat,itemId){
  var n=0, scan=function(defs,f){Object.keys(defs||{}).forEach(function(k){(defs[k].lines||[]).forEach(function(l){ if(f(l)) n++ })})};
  Object.keys(cat.links).forEach(function(k){ if(cat.links[k].item===itemId) n++ });
  var all=[cat].concat(Object.keys(cat.branches).map(function(b){return cat.branches[b]}));
  all.forEach(function(c){ scan(c.recipes,function(l){return l.item===itemId}); scan(c.bundles,function(l){return l.kind==="i"&&l.ref===itemId}) });
  return n;
}

/* ===================== render: stats tab ===================== */
function barChart(values,labels,highlight){
  var W=320,H=110,pad=18,n=values.length;
  var maxV=Math.max.apply(null,values.concat([1]));
  var colW=(W-pad*2)/n-6, parts=[];
  parts.push('<line x1="'+pad+'" y1="'+(H-20)+'" x2="'+(W-pad)+'" y2="'+(H-20)+'" stroke="var(--line)" stroke-width="1"/>');
  parts.push('<line x1="'+pad+'" y1="'+(H-20-((1/maxV)*(H-46)))+'" x2="'+(W-pad)+'" y2="'+(H-20-((1/maxV)*(H-46)))+'" stroke="var(--line-strong)" stroke-width="1" stroke-dasharray="3 3"/>');
  for(var i=0;i<n;i++){
    var h=Math.max(2,(values[i]/maxV)*(H-46));
    var x=pad+i*((W-pad*2)/n)+3;
    var fill=highlight&&highlight.indexOf(i)>=0?"var(--warn)":"var(--accent)";
    parts.push('<rect x="'+x+'" y="'+(H-20-h)+'" width="'+colW+'" height="'+h+'" rx="3" fill="'+fill+'"/>');
    parts.push('<text x="'+(x+colW/2)+'" y="'+(H-20-h-4)+'" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink-2)" font-family="IBM Plex Mono,IBM Plex Sans Arabic,monospace">'+round1(values[i])+'</text>');
    parts.push('<text x="'+(x+colW/2)+'" y="'+(H-7)+'" text-anchor="middle" font-size="10" fill="var(--ink-3)" font-family="IBM Plex Sans Arabic,sans-serif">'+labels[i]+'</text>');
  }
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:'+W+'px" role="img" aria-label="مؤشر أيام الأسبوع">'+parts.join("")+'</svg>';
}

function weekdayTable(wd,caption){
  var vals=wd.avg.map(function(v){return v==null?0:v});
  var maxV=Math.max.apply(null,vals.concat([0.001]));
  // capped: a bar a metre long says no more than one of a sane length
  var h='<div class="stack" style="gap:7px;max-width:720px">';
  for(var i=0;i<7;i++){
    var v=wd.avg[i], n=wd.counts[i];
    var pct=v==null?0:(v/maxV)*100;
    var isBest=wd.best&&wd.best.i===i, isWorst=wd.worst&&wd.worst.i===i&&!isBest;
    h+='<div style="display:grid;grid-template-columns:58px 1fr 74px;gap:10px;align-items:center">';
    h+= '<span style="font-size:12.5px;font-weight:'+(isBest?"600":"400")+';color:'+(isBest?"var(--accent-ink)":isWorst?"var(--crit)":"var(--ink-2)")+'">'+DOW_AR[i]+'</span>';
    h+= '<div style="height:9px;border-radius:99px;background:var(--surface-3);overflow:hidden">'+
        '<div style="height:100%;width:'+pct.toFixed(1)+'%;border-radius:99px;background:'+(isBest?"var(--accent)":isWorst?"var(--crit)":"var(--line-strong)")+'"></div></div>';
    h+= '<span class="num" style="font-size:12px;color:var(--ink-2)">'+(v==null?'—':round1(v))+
        ' <span style="color:var(--ink-3);font-size:10px">'+(n?n+'ي':'')+'</span></span>';
    h+='</div>';
  }
  h+='</div>';
  if(caption) h+='<p class="muted" style="margin-top:10px">'+caption+'</p>';
  return h;
}

  if(S.cfg.trackStockout!==false) h+='<div class="muted"><b style="color:var(--ink)">أيام النفاد:</b> '+r.outDays+'</div>';
  h+='</div></div>';
  h+='</div>';

  h+='<div class="muted">أيام بيع: <b class="num">'+pi.counts.sold+'</b> · صفر مؤكَّد: <b class="num">'+pi.counts.zero+'</b> · بيانات ناقصة (لا تدخل الحساب): <b class="num">'+pi.counts.missing+'</b></div>';

    h+='<div class="muted">المتوسّط: <b class="num">'+round1(pi.avg)+'</b> · الموزون بالحداثة: <b class="num">'+round1(pi.weightedAvg)+'</b>'+
       ' · آخر أسبوعٍ من البيانات: <b class="num">'+(pi.last7.avg==null?'—':round1(pi.last7.avg))+'</b> ('+pi.last7.observed+'ي)'+
       ' · آخر شهرٍ من البيانات: <b class="num">'+(pi.last30.avg==null?'—':round1(pi.last30.avg))+'</b> ('+pi.last30.observed+'ي)</div>';
    h+='<div class="muted">أعلى يوم: <b>'+fmtLong(parseYmd(pi.best.date))+'</b> ('+numText(qtyRound(r.p,pi.best.qty))+') · أدنى يوم: <b>'+fmtLong(parseYmd(pi.worst.date))+'</b> ('+numText(qtyRound(r.p,pi.worst.qty))+')</div>';
  }
  var ftr=forecastTrace(r.p,addDays(today(),1));
  var FB={"no-history":"لا مبيعات مسجّلة بعد — التوقّع صفر ولا يُخترع رقم","few-observations":"مشاهداتٌ قليلة — التوقّع أوّلي","default-weekday-pattern":"نمط الأيام ما زال النمطَ السعودي الافتراضي"};
  h+='<div class="muted" id="statWhy" style="margin-top:4px"><b style="color:var(--ink)">لماذا توقّع الغد '+round1(ftr.forecast)+'؟</b> مستوى الصنف '+round1(ftr.level)+
     ftr.drivers.map(function(x){return ' × '+esc(x.label)+' ×'+round1(x.factor*100)/100+(x.source==="assumed"?' (افتراض)':'')}).join('')+
     (ftr.fallback?' — '+esc(FB[ftr.fallback]||ftr.fallback):'')+'.</div>';

         aiBtn("حلّل أداء «"+r.p.name+"»: الاتجاه، أقوى الأيام، العروض التي تحتويه، ثقة التوقّع، وجودة بياناته.","product","تحليل ذكي");

  h+='</div>';
  h+='<p class="muted" style="margin-top:10px"><b style="color:var(--ink)">سبب الكمية:</b> '+orderReason(r)+'</p>';
  h+='</div>';

}

             :'حدّد أيّ مدّة شئت. ويكفي ملءُ خانةٍ واحدة: «من» وحدها تعني حتى اليوم، و«إلى» وحدها تعني من أوّل السجلّ.')+

  h+='</div></div>';

  /* ---------- headline numbers ---------- */
  var tw=S.cfg.trackWaste!==false, ts=S.cfg.trackStockout!==false;

  h+='<div class="card '+(R.thin?"warn":"")+'"><div class="lbl">بياناتها غير كافية</div><div class="val">'+R.thin+'</div><div class="hint">صنفاً من '+R.productCount+'</div></div>';
  h+='<div class="card '+(R.conf.band==="low"?"bad":R.conf.band==="mid"?"warn":"good")+'"><div class="lbl">ثقة التوقّع</div><div class="val" style="font-size:20px">'+R.conf.label+'</div><div class="hint">'+Math.round(R.conf.score*100)+'٪ · يرتفع بطول السجلّ وثباته</div></div>';
  h+='</div>';

  h+='<div class="card" style="margin-top:10px"><div class="stack" style="gap:6px">';

  if(worst&&best&&worst.p.id!==best.p.id) h+='<div class="muted"><b style="color:var(--crit)">الأقلّ مبيعاً:</b> '+esc(worst.p.name)+' — '+qty(worst.p,worst.total)+' فقط</div>';

  if(sumBtn) h+='<div style="margin-top:10px">'+sumBtn+'</div>';
  h+=aiInline("branch");
  var dq=dataQuality();

     (branchUnit?' الأرقام بوحدة <b>'+esc(branchUnit)+'</b>.'

  h+='<div class="card">'+weekdayTable(R.weekday,
      R.weekday.best&&R.weekday.worst&&R.weekday.best.i!==R.weekday.worst.i

          (R.weekday.worst.v>0?' — الفارق بينهما '+Math.round((R.weekday.best.v/R.weekday.worst.v-1)*100)+'٪. ولهذا لا يستعمل النظام متوسّطاً واحداً للأسبوع كلّه، بل يزن كلّ يومٍ بوزنه.':'')
        : 'لم تُسجَّل كلّ أيام الأسبوع بعد، فالمقارنة ناقصة.')+'</div>';

    h+='<div class="tablewrap"><table><thead><tr><th>المناسبة</th><th>النوع</th><th>الفترة</th><th>أيام</th><th>المبيعات فيها</th><th>المتوسّط قبلها</th>'+

  var tot=function(k){ var it=days[k].items||{}, t=0; for(var pid in it) if(hasSold(it[pid])) t+=demandOf(it[pid]); return t };

}

      if(e.stockout){perP[pid].outs++;anyOut=true}
      if(hasSold(e)){                              // missing sales data is not an observation to score
        var act=demandOf(e), pred=forecast(p,d);
        perP[pid].err+=Math.abs(act-pred); perP[pid].act+=act;
      }
    }
    if(anyOut) outDays++;
  });
  var wastePct=soldQty>0?wasteQty/soldQty*100:0;
  var lostPct=soldQty>0?lostQty/soldQty*100:0;
  var totErr=0,totAct=0;
  for(var k in perP){totErr+=perP[k].err;totAct+=perP[k].act}
  var wape=totAct>0?totErr/totAct*100:0;

  var h='';
  var soldByUnit=totalsByUnit(Object.keys(perP).map(function(pid){return {p:pmap[pid],v:perP[pid].sold}}));
  var wasteByUnit=totalsByUnit(Object.keys(perP).map(function(pid){return {p:pmap[pid],v:perP[pid].waste}}));
  var lostByUnit=totalsByUnit(Object.keys(perP).map(function(pid){return {p:pmap[pid],v:perP[pid].lost}}));
  h+='<div class="section-head"><h2>الهدر والنفاد — آخر '+totDays+' يوماً</h2><div class="note">الميزانُ هنا بين هدرٍ ونفاد.</div></div>';
  var tw=S.cfg.trackWaste!==false, ts=S.cfg.trackStockout!==false;
  h+='<div class="cards">';
  h+='<div class="card good"><div class="lbl">المباع</div><div class="val" style="font-size:'+(soldByUnit.length>1?"17px":"24px")+'">'+fmtTotals(soldByUnit)+'</div><div class="hint">&nbsp;</div></div>';
  if(tw) h+='<div class="card '+(wastePct>6?"bad":wastePct>3?"warn":"good")+'"><div class="lbl">الهدر</div><div class="val">'+round1(wastePct)+'٪</div><div class="hint">'+fmtTotals(wasteByUnit)+' · الهدف دون 3٪</div></div>';
  if(ts) h+='<div class="card '+(lostPct>wastePct?"bad":"warn")+'"><div class="lbl">طلبٌ لم يُلبَّ</div><div class="val">'+round1(lostPct)+'٪</div><div class="hint">نحو '+fmtTotals(lostByUnit)+' · '+outDays+' يوماً فيه نفاد</div></div>';
  h+='<div class="card '+(wape>35?"warn":"good")+'"><div class="lbl">خطأ التنبّؤ</div><div class="val">'+round1(wape)+'٪</div><div class="hint">كلّما قلَّ كان أدقّ</div></div>';
  h+='</div>';
  if(tw&&ts) h+='<p class="muted" style="margin-top:10px">هذان الرقمان — الهدر والطلب غير المُلبَّى — يتجاذبان دائماً: فخفضُ أحدهما يرفع الآخر. وإن رأيتَ أحدهما غالباً، حرِّك «ميل النظام» في الإعدادات نحو الجهة الأخرى.</p>';

  h+='<div class="section-head"><h2>مؤشّر أيام الأسبوع</h2><div class="note">1.0 يومٌ متوسّط. هذه أرقام فرعك بعد التعلّم من سجلّك.</div></div>';
  h+='<div class="card">'+barChart(S.dowIndex,DOW_SHORT,[4,5])+
     '<p class="muted" style="margin-top:8px">أعلى يوم: <b>'+DOW_AR[S.dowIndex.indexOf(Math.max.apply(null,S.dowIndex))]+'</b> · أهدأ يوم: <b>'+DOW_AR[S.dowIndex.indexOf(Math.min.apply(null,S.dowIndex))]+'</b> · الفارق بينهما '+Math.round((Math.max.apply(null,S.dowIndex)/Math.min.apply(null,S.dowIndex)-1)*100)+'٪</p></div>';

  var rows=Object.keys(perP).map(function(pid){
    var p=pmap[pid]; var v=perP[pid];
    return {p:p, name:p?p.name:pid, unit:p?unitOf(p):DEFAULT_UNIT,
            shelf:p?p.shelfLife:0, sold:v.sold, waste:v.waste,
            wpct:v.sold>0?v.waste/v.sold*100:0, outs:v.outs, lost:v.lost};
  });
  // Best sellers — the ranking the shop actually thinks in
  var best=rows.slice().sort(function(a,b){return b.sold-a.sold});
  var topShare=best.length?best[0].sold:1;
  var half=0, cum=0, i2;
  for(i2=0;i2<best.length;i2++){cum+=best[i2].sold; if(cum>=soldQty*0.5){half=i2+1;break}}
  // ترتيبٌ بالكمّية: إن اختلفت الوحدات فالمقارنة بين حبّةٍ وكيلو لا تستقيم، فقُل ذلك
  var mixedUnits=commonUnit(rows.map(function(r){return r.p}).filter(Boolean))===null;
  h+='<div class="section-head"><h2>الأكثر مبيعاً</h2><div class="note">'+
     (mixedUnits?'بحسب الكمّية المباعة — وأصنافك بوحداتٍ مختلفة، فقارن كلَّ صنفٍ بنفسه عبر الزمن لا بغيره.'
               :'بحسب سجلّ الاستهلاك الفعلي، لا التقدير.')+'</div></div>';
  h+='<div class="card"><div class="stack">';
  best.slice(0,8).forEach(function(r,i){
    var pct=topShare>0?r.sold/topShare*100:0;
    var share=soldQty>0?r.sold/soldQty*100:0;
    h+='<div style="display:grid;grid-template-columns:18px 1fr auto;gap:10px;align-items:center">';
    h+= '<span class="num" style="font-size:11px;color:var(--ink-3);font-weight:600">'+(i+1)+'</span>';
    h+= '<div><div style="font-size:13px;font-weight:500;margin-bottom:4px">'+esc(r.name)+'</div>'+
        '<div style="height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden">'+
        '<div style="height:100%;width:'+pct.toFixed(1)+'%;border-radius:99px;background:var(--accent)"></div></div></div>';
    h+= '<span class="num" style="font-size:12px;color:var(--ink-2)">'+(r.p?qty(r.p,r.sold):money(r.sold))+' <span style="color:var(--ink-3);font-size:10.5px">'+round1(share)+'٪</span></span>';
    h+='</div>';
  });
  h+='</div>';
  if(half>0) h+='<p class="muted" style="margin-top:12px;padding-top:10px;border-top:1px solid var(--line)"><b>'+half+'</b> '+(half===1?"صنف يصنع":"أصناف تصنع")+' نصف مبيعاتك. هذه هي التي لا يُحتمل نفادها، وعليها ركِّز عند العدّ.</p>';
  h+='</div>';

  var slow=best.filter(function(r){return r.sold>0}).slice(-3).reverse();
  if(best.length>6&&slow.length){
    h+='<p class="muted" style="margin-top:10px">أبطأ الأصناف حركةً: '+slow.map(function(r){return '<b>'+esc(r.name)+'</b> ('+(r.p?qty(r.p,r.sold):money(r.sold))+')'}).join("، ")+'. راجع جدواها، فبطءُ الحركة مع قصر الصلاحية أقصرُ طريقٍ إلى الهدر.</p>';
  }

  rows.sort(function(a,b){return (b.waste+b.lost)-(a.waste+a.lost)});
  h+='<div class="section-head"><h2>كلّ الأصناف</h2><div class="note">مرتّبةً بالأكثر إشكالاً: هدراً أو نفاداً.</div></div>';
  h+='<div class="tablewrap"><table><thead><tr><th>الصنف</th><th>الوحدة</th><th>الصلاحية</th><th>مباع</th>'+
     (tw?'<th>هدر</th><th>هدر ٪</th>':'')+(ts?'<th>أيام نفاد</th><th>لم يُلبَّ</th>':'')+'</tr></thead><tbody>';
  rows.forEach(function(r){
    var rr=function(v){return r.p?numText(qtyRound(r.p,v)):money(v)};
    h+='<tr><td class="w130">'+esc(r.name)+'</td><td class="n">'+esc(r.unit)+'</td><td class="n">'+r.shelf+'</td><td class="n">'+rr(r.sold)+'</td>'+
       (tw?'<td class="n" style="color:'+(r.waste>0?"var(--warn)":"var(--ink-3)")+'">'+rr(r.waste)+'</td>'+
       '<td class="n" style="color:'+(r.wpct>6?"var(--crit)":r.wpct>3?"var(--warn)":"var(--ink-3)")+'">'+round1(r.wpct)+'٪</td>':'')+
       (ts?'<td class="n" style="color:'+(r.outs>3?"var(--crit)":"var(--ink-3)")+'">'+r.outs+'</td>'+
       '<td class="n" style="color:'+(r.lost>0?"var(--crit)":"var(--ink-3)")+'">'+rr(r.lost)+'</td>':'')+'</tr>';
  });
  h+='</tbody></table></div>';
  return h;
}

var NOTE_TABS={order:"الطلبية",entry:"إقفال اليوم",items:"الأصناف",recipes:"المكوّنات والوصفات",stats:"التحليل",schedule:"جدول الطلب",calendar:"التقويم والمناسبات",setup:"الإعدادات",branches:"البراند والفروع",admin:"لوحة التحكم"};
function notesLoad(k,def){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):def }catch(e){ return def } }

function noteIsHidden(k){ var H=notesHidden(); return H.all||!!H.keys[k] }
/** Give every explanation in a rendered screen a steady name (its screen, its heading, its place), remember it,
 *  and hide the ones switched off. Status lines inside tables and the notes section itself are left alone. */
function tagNotes(root,tab,apply){
  var reg=notesReg(), changed=false, head="", count={};
  var all=root.querySelectorAll(".section-head h2, .card > .lbl, .section-head .note, p.muted, p.hint, p.cp-hint");
  Array.prototype.forEach.call(all,function(el){
    if(el.tagName==="H2"||el.classList.contains("lbl")){ head=el.textContent.trim().slice(0,60); return }
    if(el.closest("td,.empty,#notesSection,#notesList")) return;
    var text=el.textContent.replace(/\s+/g," ").trim(); if(text.length<25) return;
    var base=tab+"|"+head+"|"+(el.classList.contains("note")?"n":"p"); count[base]=(count[base]||0)+1;
    var k=el.id?tab+"|#"+el.id:base+"|"+count[base];
    el.setAttribute("data-nk",k);
    if(!reg[k]||reg[k].text!==text.slice(0,140)){ reg[k]={tab:tab,head:head,text:text.slice(0,140)}; changed=true }
    if(apply) el.classList.toggle("nhide",noteIsHidden(k));
  });
  if(changed) notesSave("talabia.notes.v1",reg);
}
/** Draw every screen once, out of sight, so the list holds all the explanations — not only those already seen. */
var NOTES_HARVESTED=false;
function harvestNotes(){
  if(NOTES_HARVESTED) return; NOTES_HARVESTED=true;
  var keep={tab:S.tab,recSec:S.recSec,itemSec:S.itemSec}, box=document.createElement("div");
  var run=function(tab,fn){ try{ box.innerHTML=fn(); tagNotes(box,tab,false) }catch(e){} };
  run("order",renderOrder); run("entry",renderEntry); run("stats",renderStats); run("schedule",renderSchedule); run("calendar",renderCalendar);
  ["list","help","trash"].forEach(function(x){ S.itemSec=x; run("items",renderItems) });
  [null,"items","links","bundles","recipes","mto","review"].forEach(function(x){ S.recSec=x; run("recipes",renderRecipes) });
  S.tab=keep.tab; S.recSec=keep.recSec; S.itemSec=keep.itemSec; box.innerHTML="";
}

/* ---------- «المساعد الذكي ✨»: the assistant, shown as a floating (or pinned) window over the app — not a screen.
   INTERFACE + CONTEXT ONLY for now: no model, no API, no network. Every answer is the «coming soon» line until the next
   phase connects a model to asstPost(); asstContext() already holds what it will answer from. ---------- */
var ASST_SOON="المساعد الذكي سيتم تفعيله قريبًا.";
var ASST_HELP="لم أفهم السؤال بعد — أجيب من سجلّك مباشرةً، على الجهاز ومن غير إنترنت. جرّب مثلاً:\n• كم بِعتُ من [صنف] هذا الأسبوع؟\n• توقّع الغد لـ[صنف] — أو توقّع الخميس\n• ما أكثر صنف مبيعاً هذا الشهر؟ / وأقلّ صنف؟\n• ما أكثر صنف هدراً؟ / ما الذي نفد؟\n• ما أقوى يوم عندي؟\n• قارن هذا الأسبوع بالذي قبله\n• ما الذي يحتاج طلباً؟\n• كم دقّة التوقّع؟";
/* ---------- «اسأل بياناتك»: questions in everyday Arabic answered from the record — no model, no network ---------- */
function qNorm(t){ return normName(String(t||"").replace(/[٠-٩]/g,function(c){return String("٠١٢٣٤٥٦٧٨٩".indexOf(c))})).toLowerCase() }
/** The product a question names: the longest product name (or Odoo alias) found in it, else the best word match. */
function qProduct(n){
  var best=null, bl=0;
  activeProducts().forEach(function(p){ [p.name].concat(p.aliases||[]).forEach(function(nm){ var k=qNorm(nm).trim(); if(k.length>=2&&n.indexOf(k)>=0&&k.length>bl){ best=p; bl=k.length } }) });
  if(best) return best;

/** The period a question means (defaults to the last 7 recorded days), clipped to the record. */
function qPeriod(n){
  var sp=recordSpan(), end=sp?parseYmd(sp.to):today(), t=today(), r=null, m;
  if(/النهارده|انهارده|اليوم/.test(n)) r={from:t,to:t,label:"اليوم"};
  else if(/امبارح|البارحه|امس/.test(n)){ var y=addDays(t,-1); r={from:y,to:y,label:"أمس"} }
  else if((m=n.match(/(?:اخر|آخر)\s*(\d+)\s*(?:يوم|ايام)/))) r={from:addDays(end,-(+m[1])+1),to:end,label:"آخر "+m[1]+" يوماً"};
  else if(/الاسبوع (اللي|الي) فات|الاسبوع الماضي|الاسبوع السابق/.test(n)) r={from:addDays(end,-13),to:addDays(end,-7),label:"الأسبوع الماضي"};
  else if(/الشهر (اللي|الي) فات|الشهر الماضي|الشهر السابق/.test(n)){ var a=new Date(end.getFullYear(),end.getMonth()-1,1); r={from:a,to:new Date(end.getFullYear(),end.getMonth(),0),label:"الشهر الماضي"} }
  else if(/الشهر|شهر/.test(n)) r={from:new Date(end.getFullYear(),end.getMonth(),1),to:end,label:"هذا الشهر"};
  else if(/السنه|سنه|العام/.test(n)) r={from:addDays(end,-364),to:end,label:"آخر سنة"};
  else if(/كل السجل|من الافتتاح|من البدايه/.test(n)&&sp) r={from:parseYmd(sp.from),to:end,label:"كلّ السجلّ"};
  else r={from:addDays(end,-6),to:end,label:"آخر 7 أيام"};
  return {keys:datesBetween(ymd(r.from),ymd(r.to)), label:r.label};
}
/** The day a forecast question means: بكرة, بعد بكرة, a weekday name, or tomorrow. */
function qDay(n){
  var t=today();
  if(/بعد بكره|بعد بكرا/.test(n)) return addDays(t,2);
  if(/النهارده|انهارده/.test(n)) return t;
  if(/بعد غد/.test(n)) return addDays(t,2);
  var names=["الاحد","الاتنين|الاثنين","التلات|الثلاثاء|الثلاث","الاربع|الاربعاء","الخميس","الجمعه","السبت"];
  for(var i=0;i<7;i++) if(new RegExp(names[i]).test(n)){ var d=addDays(t,1); while(d.getDay()!==i) d=addDays(d,1); return d }
  return addDays(t,1);
}
function soldOver(p,keys){ var t=0,w=0,n=0,o=0; keys.forEach(function(k){ var e=S.days[k]&&S.days[k].items?S.days[k].items[p.id]:null; if(!hasSold(e)) return; n++; t+=+e.sold||0; w+=+e.waste||0; if(e.stockout) o++ }); return {sold:t, waste:w, days:n, outs:o} }
function localAnswer(q){
  var n=qNorm(q), p=qProduct(n), P=qPeriod(n), u=function(pp,v){ return numText(qtyRound(pp,v))+" "+unitOf(pp) };

  if(!historyAsc().length) return "لا سجلّ مبيعات بعد — سجّل يوماً في «إقفال اليوم» أو استورد ملف المبيعات، وأجيبك منه.";

    var d0=S.planDate?parseYmd(S.planDate):(isOrderDay(today())?today():nextOrderDay(today()));
    var L=orderedProducts(d0).map(function(x){ return {p:x, q:orderQty(x,planFor(x,d0))} }).filter(function(r){return r.q>0}).sort(function(a,b){return b.q-a.q});
    if(!L.length) return "طلبية "+fmtLong(d0)+": لا شيء يحتاج طلباً.";
    return "طلبية "+fmtLong(d0)+" — "+L.length+" صنفاً:\n"+L.slice(0,12).map(function(r){return "• "+r.p.name+": "+u(r.p,r.q)}).join("\n")+(L.length>12?"\n… والباقي في شاشة «الطلبية».":"")+"\nلتفاصيل أيّ رقم: «لماذا؟» تحت كارته.";

    var d=qDay(n), lbl=DOW_AR[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1);
    if(p){ var f=demandFc(p,d), m=S.model[p.id]||{}, sd=m.sigma||0; if(!f) return "لا أستطيع توقّع «"+p.name+"» بعد — سجلّه قصير.";
      var why=[], ev=eventsOn(d,S.events).map(function(e){return e.name}); if(ev.length) why.push("مناسبة: "+ev.join("، ")); var pf=payFactor(d); if(Math.abs(pf-1)>=0.04) why.push(pf>1?"فترة راتب":"قبل الراتب");
      return "توقّع «"+p.name+"» يوم "+lbl+": نحو "+u(p,f)+" (غالباً بين "+numText(qtyRound(p,Math.max(0,f-1.28*sd*RANGE_K)))+" و"+numText(qtyRound(p,f+1.28*sd*RANGE_K))+")."+(why.length?"\nيدخل فيه: "+why.join(" · ")+".":"") }
    var R=plist.map(function(x){return {p:x, f:demandFc(x,d)}}).filter(function(r){return r.f>0}).sort(function(a,b){return b.f-a.f});
    if(!R.length) return "لا توقّع بعد — السجلّ قصير.";
    var unit=commonUnit(R.map(function(r){return r.p}));
    return "توقّع يوم "+lbl+(unit?": نحو "+round1(sum(R.map(function(r){return r.f})))+" "+unit+" للفرع":"")+"\nالأعلى:\n"+R.slice(0,8).map(function(r){return "• "+r.p.name+": "+u(r.p,r.f)}).join("\n");
  }

    var sp=recordSpan(), e=parseYmd(sp.to), A=datesBetween(ymd(addDays(e,-6)),ymd(e)), B=datesBetween(ymd(addDays(e,-13)),ymd(addDays(e,-7)));
    if(/شهر/.test(n)){ A=datesBetween(ymd(addDays(e,-27)),ymd(e)); B=datesBetween(ymd(addDays(e,-55)),ymd(addDays(e,-28))) }
    var lab=/شهر/.test(n)?["آخر 28 يوماً","الـ28 قبلها"]:["آخر 7 أيام","الأسبوع قبلها"];
    if(p){ var a=avgOver(p,A), b=avgOver(p,B); if(!a||!b) return "لا يكفي السجلّ للمقارنة في «"+p.name+"»."; var pc=b.avg>0?(a.avg-b.avg)/b.avg:0;
      return "«"+p.name+"» — "+lab[0]+": "+round1(a.avg)+" يومياً مقابل "+round1(b.avg)+" في "+lab[1]+" ("+(pc>=0?"+":"")+Math.round(pc*100)+"٪)." }
    var mv=plist.map(function(x){ var a=avgOver(x,A), b=avgOver(x,B); return a&&b&&b.avg>=1?{p:x,pc:(a.avg-b.avg)/b.avg}:null }).filter(Boolean).sort(function(x,y){return y.pc-x.pc});
    var tA=0,tB=0; plist.forEach(function(x){ var a=avgOver(x,A), b=avgOver(x,B); if(a) tA+=a.avg; if(b) tB+=b.avg });
    var pct=tB>0?(tA-tB)/tB:0;
    return "الفرع — "+lab[0]+" مقابل "+lab[1]+": "+(pct>=0?"+":"")+Math.round(pct*100)+"٪ في المتوسّط اليوميّ."+(mv.length?"\nالأكثر صعوداً: "+mv.slice(0,3).map(function(r){return r.p.name+" ("+(r.pc>=0?"+":"")+Math.round(r.pc*100)+"٪)"}).join("، ")+"\nالأكثر هبوطاً: "+mv.slice(-3).reverse().map(function(r){return r.p.name+" ("+Math.round(r.pc*100)+"٪)"}).join("، "):"");
  }

    var wd=[0,0,0,0,0,0,0], wn=[0,0,0,0,0,0,0];
    historyAsc().slice(-84).forEach(function(r){ var t=0,any=false; for(var pid in r.items) if(hasSold(r.items[pid])){ any=true; t+=demandOf(r.items[pid]) } if(any){ var dd=parseYmd(r.date).getDay(); wd[dd]+=t; wn[dd]++ } });
    var av=wd.map(function(v,i){return wn[i]?v/wn[i]:null}), idx=[0,1,2,3,4,5,6].filter(function(i){return av[i]!=null}).sort(function(a,b){return av[b]-av[a]});

    if(!O.length) return (p?"«"+p.name+"» لم ينفد":"لم ينفد أيّ صنف")+" — "+P.label+".";
    return "النفاد — "+P.label+":\n"+O.slice(0,6).map(function(r){return "• "+r.p.name+": "+r.o+" "+(r.o===1?"يوم":"أيام")+(r.lost>0?" — ضاع نحو "+u(r.p,r.lost):"")}).join("\n");

  }

/* The rules the model will be given in the next phase (kept here so the window and the model speak one language):
   it answers from the app's own data (asstContext) and never invents a number it was not given. */
var ASST_RULES="أجب من بيانات التطبيق المرفقة فقط. إن لم تجد رقماً (كالمخزون الحالي) فقل إنه غير متوفّر ولا تخترعه، ثم أعطِ ما تستطيع من المبيعات والتوقّع. الفرع والشاشة الحاليان هما السياق الافتراضي.";
var ASST_SCREENS={order:"الطلبية",entry:"إقفال اليوم",items:"الأصناف",recipes:"المكوّنات والوصفات",stats:"التحليل",schedule:"جدول الطلب",calendar:"التقويم والمناسبات",setup:"الإعدادات",branches:"البراند والفروع",admin:"لوحة التحكم"};

/* ---------- the window's state, remembered on this device (the app's own localStorage, one key of its own) ---------- */
var ASST_KEY="talabia.assistant.v1", ASST_MIN_W=320, ASST_MIN_H=380, ASST_PIN_MIN=300;
var AST=null;
function asstState(){
  if(AST) return AST;
  var d={open:false, mode:"floating", min:false, max:false, x:null, y:null, w:420, h:560, pinW:380};
  try{ var v=JSON.parse(localStorage.getItem(ASST_KEY)||"null"); if(v&&typeof v==="object") Object.keys(d).forEach(function(k){ if(v[k]!=null&&typeof v[k]===typeof d[k]||(k==="x"||k==="y")&&typeof v[k]==="number") d[k]=v[k] }) }catch(e){}

function asstSave(){ try{ localStorage.setItem(ASST_KEY,JSON.stringify(AST)) }catch(e){} }
function asstAllowed(){ return canP("view.stats")||canP("view.order") }

/* ---------- where the user is: the screen and the branch, never retyped ---------- */
function asstWhere(){
  var b=S.multi&&curBranch();
  var scr=ASST_SCREENS[S.tab]||"";
  if(S.tab==="stats"&&S.statProduct){ var p=S.products.filter(function(x){return x.id===S.statProduct})[0]; if(p) scr+=" — "+p.name }
  if(S.tab==="recipes"&&S.recSec) scr+=" — "+({items:"المواد",links:"الربط",bundles:"العروض",recipes:"الوصفات",mto:"يُحضَّر بالطلب",review:"مراجعة"}[S.recSec]||"");
  return {screen:S.tab, screenName:scr, branch:b?b.name:(S.cfg&&S.cfg.branch||""), brand:b?brandWord(b.brand):"", branchId:S.branchId||null};
}
/** Everything the assistant will answer from: where the user is, and the app's own data (aiContext — the same facts the
 *  app computes: branch, today, next order, schedule, products, history, forecasts, components, events, data quality).
 *  Stock the app does not hold is marked unknown there, so nothing is invented. */
function asstContext(){
  var w=asstWhere(), base=null;
  try{ base=aiContext() }catch(e){ base=null }
  var od=S.cfg&&S.cfg.orderDays||[];
  return {where:w, rules:ASST_RULES,
    schedule:{orderDays:od.map(function(d){return DOW_AR[d]}), perItem:S.cfg&&S.cfg.itemDays||{}, planDate:S.planDate||null},
    stockKnown:S.cfg&&S.cfg.trackStock===true, data:base};
}
function asstWhereText(){ var w=asstWhere(); return [w.screenName, w.branch].filter(Boolean).join(" · ") }

function asstSend(){

  var q=el.value.trim(); if(!q) return;

}
/** One question and its answer into the conversation. The answer is the «coming soon» line until the model phase —
 *  the question already carries its context (screen + branch), so the model will not ask for the branch again. */
function asstPost(q){
  var where=asstWhereText();
  var ans=null; try{ ans=localAnswer(q) }catch(e){ ans=null }
  S.asst=S.asst||[]; S.asst.push({me:true,text:q,where:where}); S.asst.push({me:false,text:ans||ASST_HELP});
  var log=document.getElementById("asstLog");
  if(log){ log.innerHTML=asstLogHtml(); log.scrollTop=log.scrollHeight }
}

/* ---------- geometry: kept inside the app's window, never out of reach ----------
   The page is scaled to the screen (html zoom, fitToWindow), so the window's numbers are in the page's own units:
   the visible area is innerWidth / zoom wide, and a mouse movement of N screen pixels is N / zoom of them. */
function asstZoom(){ var z=parseFloat(document.documentElement.style.zoom); return z>0?z:1 }
function asstView(){ var z=asstZoom(); return {w:window.innerWidth/z, h:window.innerHeight/z} }
function asstClamp(){
  var A=asstState(), V=asstView(), vw=V.w, vh=V.h;
  A.w=Math.max(ASST_MIN_W,Math.min(A.w,vw-16)); A.h=Math.max(ASST_MIN_H,Math.min(A.h,vh-16));
  if(A.x==null||A.y==null){ A.x=24; A.y=Math.max(8,vh-A.h-90) }                 // first time: lower left, clear of the header
  A.x=Math.max(0,Math.min(A.x,Math.max(0,vw-A.w))); A.y=Math.max(0,Math.min(A.y,Math.max(0,vh-A.h)));
  A.pinW=Math.max(ASST_PIN_MIN,Math.min(A.pinW,Math.round(vw*0.6)));
  A.x=Math.round(A.x); A.y=Math.round(A.y); A.w=Math.round(A.w); A.h=Math.round(A.h); A.pinW=Math.round(A.pinW);
}
function asstPaint(){
  var A=asstState(), W=asstBuild(), B=document.getElementById("asstBubble"), btn=document.getElementById("asstBtn");
  if(!W) return;
  var allowed=asstAllowed();
  if(btn){ btn.hidden=!allowed; btn.setAttribute("aria-pressed",A.open&&!A.min?"true":"false") }
  if(!allowed){ W.hidden=true; if(B) B.hidden=true; document.body.classList.remove("asst-pinned"); return }
  asstClamp();
  var pinned=A.mode==="pinned", show=A.open&&!A.min;
  W.hidden=!show; if(B) B.hidden=!(A.open&&A.min);
  W.classList.toggle("pinned",pinned); W.classList.toggle("max",!pinned&&A.max);
  document.body.classList.toggle("asst-pinned",show&&pinned);
  document.body.style.setProperty("--asstW",A.pinW+"px");
  if(pinned){ W.style.cssText="width:"+A.pinW+"px" }
  else if(A.max){ W.style.cssText="left:12px;top:12px;right:12px;bottom:12px" }
  else W.style.cssText="left:"+A.x+"px;top:"+A.y+"px;width:"+A.w+"px;height:"+A.h+"px";
  var ic=function(p){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'};
  var pb=document.getElementById("asstPin"), mb=document.getElementById("asstMaxB");
  pb.innerHTML=pinned?ic('<rect x="4" y="5" width="14" height="14" rx="2"/><path d="M14 3h7v7"/>'):ic('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>');
  pb.title=pinned?"عائم فوق التطبيق":"ثبّته بجانب التطبيق"; pb.setAttribute("aria-label",pb.title);
  mb.hidden=pinned;
  mb.innerHTML=A.max?ic('<rect x="7" y="3" width="14" height="14" rx="2"/><path d="M3 7v12a2 2 0 0 0 2 2h12"/>'):ic('<rect x="4" y="4" width="16" height="16" rx="2"/>');
  mb.title=A.max?"استعادة الحجم":"تكبير"; mb.setAttribute("aria-label",mb.title);
  asstSyncContext();
}
function asstSyncContext(){
  var c=document.getElementById("asstCtx"); if(c){ var t=asstWhereText(); c.textContent=t?"السياق: "+t:""; c.title=c.textContent }
  var btn=document.getElementById("asstBtn"); if(btn&&!asstAllowed()){ btn.hidden=true }
}
function asstOpen(){ var A=asstState(); A.open=true; A.min=false; asstSave(); asstPaint(); var i=document.getElementById("asstInput"); if(i) setTimeout(function(){i.focus()},0) }
function asstSet(ch){ var A=asstState(); Object.keys(ch).forEach(function(k){A[k]=ch[k]}); asstSave(); asstPaint() }

document.addEventListener("click",function(e){
  var t=e.target&&e.target.closest?e.target.closest("#asstBtn,#asstBubble,#asstClose,#asstMinB,#asstMaxB,#asstPin,#asstSend,.asstSoon"):null; if(!t) return;
  var A=asstState();
  if(t.id==="asstBtn"){ if(A.open&&!A.min) asstSet({open:false}); else asstOpen(); return }
  if(t.id==="asstBubble"){ asstOpen(); return }
  if(t.id==="asstClose"){ asstSet({open:false, min:false}); return }
  if(t.id==="asstMinB"){ asstSet({min:true}); return }

  if(t.id==="asstPin"){ asstSet({mode:A.mode==="pinned"?"floating":"pinned", max:false}); return }

/* ---------- moving by the header, resizing by any edge or corner ---------- */
(function(){
  var drag=null;
  document.addEventListener("pointerdown",function(e){
    var A=asstState(), head=e.target.closest&&e.target.closest("#asstHead"), rz=e.target.closest&&e.target.closest("#asstWin .rz");
    if(head&&!e.target.closest(".wb")&&A.mode==="floating"&&!A.max){
      drag={k:"move", sx:e.clientX, sy:e.clientY, x:A.x, y:A.y}; head.classList.add("dragging");
    }else if(rz){
      drag={k:"size", d:rz.dataset.d, sx:e.clientX, sy:e.clientY, x:A.x, y:A.y, w:A.w, h:A.h, pw:A.pinW};
      document.body.classList.add("asst-resizing");
    }else return;
    e.preventDefault();
    try{ e.target.setPointerCapture(e.pointerId) }catch(x){}
  });
  document.addEventListener("pointermove",function(e){
    if(!drag) return;
    var A=asstState(), z=asstZoom(), dx=(e.clientX-drag.sx)/z, dy=(e.clientY-drag.sy)/z;
    if(drag.k==="move"){ A.x=drag.x+dx; A.y=drag.y+dy }
    else if(A.mode==="pinned"){ A.pinW=drag.pw+dx }                     // the panel sits on the left: its right edge sets the width
    else{
      var d=drag.d, V=asstView(), vw=V.w, vh=V.h;
      if(d.indexOf("e")>=0) A.w=Math.min(drag.w+dx,vw-drag.x);
      if(d.indexOf("s")>=0) A.h=Math.min(drag.h+dy,vh-drag.y);
      if(d.indexOf("w")>=0){ var nw=Math.max(ASST_MIN_W,Math.min(drag.w-dx,drag.x+drag.w)); A.x=drag.x+drag.w-nw; A.w=nw }
      if(d.indexOf("n")>=0){ var nh=Math.max(ASST_MIN_H,Math.min(drag.h-dy,drag.y+drag.h)); A.y=drag.y+drag.h-nh; A.h=nh }
    }
    asstPaint();
  });
  var end=function(){ if(!drag) return; drag=null; document.body.classList.remove("asst-resizing");
    var h=document.getElementById("asstHead"); if(h) h.classList.remove("dragging"); asstSave() };
  document.addEventListener("pointerup",end); document.addEventListener("pointercancel",end);
  window.addEventListener("resize",function(){ if(AST){ asstPaint(); asstSave() } });
})();

/* ---------- each analysis card may have its own period ----------
   The period at the top of the screen applies to every card. A card that reads the period (products, days, branch,
   occasions, operations, offers) carries its own «من / إلى»: set it and that card alone is worked out for those dates;
   «اتبع فترة الصفحة» hands it back to the top. Kept on this device. */
var CARD_RANGE_KEYS=["products","days","branch","events","ops","offers"];
var CARD_RNG=null;
function cardRanges(){ if(CARD_RNG) return CARD_RNG; try{ CARD_RNG=JSON.parse(localStorage.getItem("talabia.cardRange.v1")||"{}")||{} }catch(e){ CARD_RNG={} } return CARD_RNG }
function cardRangeSave(){ try{ localStorage.setItem("talabia.cardRange.v1",JSON.stringify(CARD_RNG||{})) }catch(e){} }
function cardRangeBar(k){
  var own=cardRanges()[k], R=normRange(own||(S.statFrom||S.statTo?{from:S.statFrom,to:S.statTo}:(S.statPeriod||0)));
  var keys=Object.keys(S.days).sort(), first=keys[0]||ymd(today()), last=ymd(today());
  return '<div class="card-range'+(own?' own':'')+'" data-k="'+k+'"><span class="lbl">الفترة</span>'+
    '<label class="crf"><span>من</span><input type="date" class="crFrom" data-k="'+k+'" value="'+esc(R.from||first)+'"></label>'+
    '<label class="crf"><span>إلى</span><input type="date" class="crTo" data-k="'+k+'" value="'+esc(R.to||last)+'"></label>'+
    (own?'<span class="chip a">فترة خاصّة بهذه البطاقة</span><button class="btn ghost crClear" type="button" data-k="'+k+'">اتبع فترة الصفحة</button>'
        :'<span class="hint">تتبع فترة الصفحة — غيّرها لهذه البطاقة وحدها</span>')+'</div>';
}
function statsPanes(top,part,items){
  if(part){ var it=items.filter(function(x){return x&&x.k===part})[0]; return it?it.html:'' }
  var own=cardRanges();
  items=items.map(function(x){
    if(!x||CARD_RANGE_KEYS.indexOf(x.k)<0) return x;
    var html=x.html;
    if(own[x.k]&&(own[x.k].from||own[x.k].to)){
      STAT_OVR=own[x.k];
      try{ html=renderStats(x.k) }catch(e){ html='<p class="muted">تعذّر حساب هذه الفترة.</p>' } finally { STAT_OVR=null }
    }
    return Object.assign({},x,{html:cardRangeBar(x.k)+html, sub:own[x.k]?'فترة خاصّة: '+(own[x.k].from||"…")+' → '+(own[x.k].to||"…"):x.sub});
  });
  return top+paneScreen("stats",items,"",'<p class="muted cp-hint">اختر قسماً لفتحه.</p>');
}
document.addEventListener("change",function(e){

  if(!id||id==="brand") return "ألوان البراند";
  if(id==="logo") return "من اللوجو";
  if(id==="custom") return "ألواني";
  var t=(THEMES[mode]||[]).filter(function(x){return x.id===id})[0]; return t?t.name:"ألوان البراند";
}

      '<span class="thCard" style="background:'+pal.surface+';border-color:'+pal.line+'">'+

/** The colours of a logo: its strongest hues, ignoring white, black, grey and transparent pixels. */
function logoColors(img){
  var c=document.createElement("canvas"), N=72; c.width=N; c.height=N;
  var x=c.getContext("2d"); x.drawImage(img,0,0,N,N);
  var d=x.getImageData(0,0,N,N).data, bins={};
  for(var i=0;i<d.length;i+=4){
    if(d[i+3]<128) continue;
    var hs=rgb2hsl(d[i],d[i+1],d[i+2]); if(hs[1]<18||hs[2]<12||hs[2]>92) continue;     // neutral or near white / black
    var k=Math.round(hs[0]/15)%24; var w=hs[1]/100;                                   // 24 hue bins, weighted by colourfulness
    var B=bins[k]||(bins[k]={w:0,h:0,s:0,l:0,n:0}); B.w+=w; B.h+=hs[0]*w; B.s+=hs[1]*w; B.l+=hs[2]*w; B.n++;
  }
  var list=Object.keys(bins).map(function(k){var B=bins[k];return {h:B.h/B.w,s:B.s/B.w,l:B.l/B.w,w:B.w}}).sort(function(a,b){return b.w-a.w});
  return list.slice(0,4);
}
function buildLogoTheme(file,brand,done){
  var K=brand||CUR_BRAND||"default";
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var cols=logoColors(img);
      if(!cols.length){ toast("لم أجد ألواناً واضحة في هذا اللوجو — جرّب صورة ملوّنة"); if(done) done(false); return }
      var main=cols[0], sat=Math.max(30,Math.min(70,main.s));
      // a small copy of the logo, kept with the theme
      var c=document.createElement("canvas"), k=Math.min(1,96/Math.max(img.width,img.height)); c.width=Math.max(1,Math.round(img.width*k)); c.height=Math.max(1,Math.round(img.height*k));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      var theme={light:makePalette("light",main.h,sat,Math.min(20,8+sat/6)), dark:makePalette("dark",main.h,Math.max(35,sat-5),Math.min(22,10+sat/8)),
                 colors:cols.map(function(x){return hsl2hex(x.h,x.s,x.l)}), img:c.toDataURL("image/png"), at:new Date().toISOString()};
      try{ localStorage.setItem("dq-logo-"+K,JSON.stringify(theme)); localStorage.setItem("dq-pal-"+K,JSON.stringify({light:"logo",dark:"logo"})) }catch(e){ toast("تعذّر حفظ الثيم"); if(done) done(false); return }
      if(done){ done(true); return }
      applyBrand(CUR_BRAND); render(); toast("صُمّم ثيم من لوجو «"+brandWord(CUR_BRAND)+"» وطُبّق — نهاري وليلي");
    };
    img.onerror=function(){ toast("تعذّر فتح الصورة"); if(done) done(false) };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

function render(){
  // A date being typed by hand is never rebuilt under the fingers; the redraw waits until it is applied.
  if(LANG==="en") i18nKeepRefresh();    // the shop's names are never translated
  // …and never under a click: leaving one field for another (a save, a redraw) used to replace the field being
  // clicked before the click could land in it — half the clicks were lost («as if I clicked outside the field»).
  // A redraw asked for while the mouse button is down runs once the click has finished (releaseRender).
  if(POINTER_DOWN&&Date.now()-POINTER_AT<3000){ S.renderPending=true; setTimeout(function(){ if(S.renderPending&&!POINTER_DOWN) render() },3100); return }
  if(dateTypingInView()||HOLD_RENDER||typingInView()){ S.renderPending=true; renderHeader(); if(!dateTypingInView()&&!HOLD_RENDER) flushWhenTypingStops(); return }
  S.renderPending=false;
  if(S.ready) ensureCatalog();          // the open brand's materials and recipes (loads once per brand)
  renderHeader();
  if(S.multi&&S.ws&&!branchList().length){
    renderBanner();
    Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){b.setAttribute("aria-selected",b.dataset.tab==="setup"?"true":"false")});
    var au=S.cloud&&S.cloud.access;
    document.getElementById("view").innerHTML='<div class="empty" style="padding-top:60px"><b style="font-size:16px;color:var(--ink)">لا فروع مسندة لهذا الحساب بعد</b><br>'+
      (au&&au.email?'<span class="num">'+esc(au.email)+'</span><br>':'')+'اطلب من المدير أن يحدّد فروعك، وستظهر هنا تلقائياً خلال دقيقة.</div>'+storageCard();
    document.getElementById("footbar").hidden=true;
    renderGate();
    return;
  }
  Array.prototype.forEach.call(document.querySelectorAll("#tabs button"),function(b){
    b.setAttribute("aria-selected",b.dataset.tab===S.tab?"true":"false");
  });
  renderBanner();
  var v=document.getElementById("view");
  var tabMoved=render.lastTab!==undefined&&render.lastTab!==S.tab; render.lastTab=S.tab;
  if(tabMoved) requestAnimationFrame(function(){ v.classList.remove("view-enter"); void v.offsetWidth; v.classList.add("view-enter"); setTimeout(function(){ v.classList.remove("view-enter") },260) });
  var keep=keepTyping();               // a redraw (sync, stats) must not wipe the field being typed in
  REDRAWING=true;                      // a focused field removed by the redraw fires «change»: that is not the shop leaving it
  try{
  if(S.tab==="order")      v.innerHTML=renderOrder();
  else if(S.tab==="entry") v.innerHTML=renderEntry();
  else if(S.tab==="items") v.innerHTML=renderItems();
  else if(S.tab==="recipes") v.innerHTML=renderRecipes();
  else if(S.tab==="stats") v.innerHTML=renderStats();
  else if(S.tab==="schedule") v.innerHTML=renderSchedule();
  else if(S.tab==="calendar") v.innerHTML=renderCalendar();
  else if(S.tab==="branches") v.innerHTML=renderBranches();
  else if(S.tab==="admin") v.innerHTML=renderAdminPanel();
  else                     v.innerHTML=renderSetup();
  } finally { REDRAWING=false }
  tagNotes(v,S.tab,true);

  var fb=document.getElementById("footbar"), fi=document.getElementById("footinner");
  var foot=S.tab==="order"?orderFooter():S.tab==="entry"?entryFooter():null;
  if(foot){fi.innerHTML=foot;fb.hidden=false}else{fb.hidden=true;fi.innerHTML=""}
  applyPermsDom();
  try{ numFields(document) }catch(e){}
  if(keep) keep();
  renderGate();
  try{ animateAfterRender() }catch(e){}
  try{ asstPaint() }catch(e){}
}
/* Remember the focused text field in the view (its text and caret) and put it back after the view is
   rebuilt. Fields are found again by id, or by their classes and data-* attributes. */
var KEEP_OFF=false;
function keepTyping(){
  var el=document.activeElement;
  if(KEEP_OFF||!el||!el.closest||!el.closest("#view")) return null;
  var textual=el.tagName==="TEXTAREA"||(el.tagName==="INPUT"&&/^(text|search|email|password|number|tel|url|date|)$/.test(el.type||""));
  if(!textual) return null;
  var sel;
  if(el.id) sel="#"+CSS.escape(el.id);
  else{
    sel=el.tagName.toLowerCase()+Array.prototype.map.call(el.classList,function(c){return "."+CSS.escape(c)}).join("");
    // data-orig is a note taken when the field got the focus (the name before a rename); the redrawn field never
    // carries it, so it must not be part of how the field is found again — that lost the focus on every redraw
    Array.prototype.forEach.call(el.attributes,function(a){ if(/^data-/.test(a.name)&&a.name!=="data-orig") sel+='['+a.name+'="'+CSS.escape(a.value)+'"]' });
  }
  var val=el.value, s0=null, s1=null;
  try{ s0=el.selectionStart; s1=el.selectionEnd }catch(e){}
  return function(){
    var n=document.querySelector("#view "+sel);
    if(!n||n.disabled) return;
    if(n.value!==val) n.value=val;
    n.focus({preventScroll:true});
    try{ if(s0!=null) n.setSelectionRange(s0,s1) }catch(e){}
  };
}

function ensureDay(date){
  if(!S.days[date]) S.days[date]={date:date,items:{}};
  return S.days[date];
}
function ensureItem(date,pid){
  var d=ensureDay(date);
  // «sold» is left out until the shop types it: a day with only waste or a stockout tick recorded
  // is missing sales data, not a confirmed zero (hasSold).
  if(!d.items[pid]) d.items[pid]={waste:0,lost:0,stockout:false};
  return d.items[pid];
}

/** A backup carries the branch and, beside it, its brand's materials and recipes. */
function exportPayload(){
  var p=payload();
  if(S.cat&&S.catBrand===curBrandKey()&&catHasRules(S.cat)) p.brandCatalog=JSON.parse(JSON.stringify(S.cat));
  return p;
}
function snapshotJson(){return JSON.stringify(exportPayload())}
function doBackup(){
  var txt=snapshotJson();
  logAct("data","نسخ نسخة احتياطية");
  var done=function(){toast("نُسخت النسخة — الصقها في ملف نصّي واحفظه")};
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(done,function(){legacyCopy(txt,done)});
  }else legacyCopy(txt,done);
}
function legacyCopy(txt,done){
  var ta=document.createElement("textarea");
  ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.select();
  var ok=false; try{ok=document.execCommand("copy")}catch(e){}
  document.body.removeChild(ta);
  if(ok) done(); else toast("تعذّر النسخ — حاول من متصفح آخر");
}
function doRestore(){
  // The desktop build has no window.prompt, and a file picker is the better
  // door anyway: pick the backup file you saved.
  if(S.desktop&&window.desktop&&window.desktop.importFile){
    window.desktop.importFile().then(function(r){
      if(!r||!r.ok){ if(r&&!r.cancelled) toast((r&&r.error)||"تعذّرت قراءة الملف"); return }
      applyRestored(r.data);
    },function(){toast("تعذّرت قراءة الملف")});
    return;
  }
  var raw=prompt("الصق النسخة الاحتياطية هنا:");
  if(!raw) return;
  var d;
  try{d=JSON.parse(raw)}catch(e){toast("النسخة غير صالحة");return}
  applyRestored(d);
}
function applyRestored(d){
  if(!d||!d.products){toast("النسخة غير صالحة");return}
  var fromB=d.meta&&d.meta.branchId&&S.multi&&d.meta.branchId!==S.branchId?findBranch(d.meta.branchId):null;
  var fromTxt=d.meta&&d.meta.branchId&&S.multi&&d.meta.branchId!==S.branchId
    ?"تنبيه: هذه النسخة مأخوذة من فرعٍ آخر"+(fromB?" («"+branchLabel(fromB)+"»)":"")+".\n\n":"";
  var ask1=fromTxt+(S.multi&&curBranch()?"سيستبدل هذا بيانات فرع «"+curBranch().name+"» وحده بالنسخة. ":"سيستبدل هذا كلّ بياناتك الحالية بالنسخة. ")+"أتتابع؟";
  // asked after the file was read, so the dialog answers directly (no replay of the file picker)
  if(confirmNativeMode()){ if(confirm(ask1)) applyRestoredNow(d) } else askConfirm(ask1).then(function(ok){ if(ok) applyRestoredNow(d) });
}
function applyRestoredNow(d){
  if(!applyData(d)){toast("النسخة غير صالحة");return}
  logAct("data","استعادة نسخة احتياطية");
  // the brand's materials and recipes, if the backup carries them — only into the same brand, and only if asked
  if(d.brandCatalog&&typeof d.brandCatalog==="object"&&S.cat&&String(d.brandCatalog.brand||"")===curBrandKey()&&canP("items.edit")){
    var ask2="النسخة تحمل مكوّنات «"+brandWord(curBrandKey())+"» ووصفاتها. أتستعيدها أيضاً؟ (تستبدل الحالية)";
    var takeCat=function(){ S.cat=sanitizeCatalog(d.brandCatalog,curBrandKey()); saveCatalog(true); render() };
    if(confirmNativeMode()){ if(confirm(ask2)) takeCat() } else askConfirm(ask2).then(function(ok){ if(ok) takeCat() });
  }
  if(S.multi&&curBranch()) S.cfg.branch=curBranch().name;
  S.overrides={}; relearn(); render();
  if(S.local){saveLocal();toast("استُعيدت النسخة");return}
  if(!S.db){toast("استُعيدت في هذه الجلسة فقط");return}
  S.demo=false;
  var jobs=[S.db.doc("config/settings").set(S.cfg),
            S.db.doc("stock/current").set({lots:S.stock,countedAt:ymd(today())})];
  S.products.forEach(function(p){jobs.push(S.db.doc("products/"+p.id).set(p))});
  S.events.forEach(function(e){jobs.push(S.db.doc("events/"+e.id).set(e))});
  Promise.all(jobs.map(function(j){return j.catch(function(){})})).then(function(){
    var keys=Object.keys(S.days).sort(), i=0;
    function step(){
      if(i>=keys.length){toast("استُعيدت النسخة");return}
      var k=keys[i++];
      S.db.doc("days/"+k).set(S.days[k]).then(step,function(){step()});
    }
    step();
  });
}

function wipeAll(){
  if(S.demo){S.products=[];S.days={};S.stock={};relearn();render();toast("تم");return}
  if(S.local){
    S.products=[];S.days={};S.stock={};S.orders={};S.overrides={};S.imports=[];
    var cleared={v:1,cleared:true,cfg:S.cfg,products:[],days:{},stock:{},events:S.events,orders:{},imports:[]};
    if(S.multi&&BR&&S.branchId){
      if(localT){clearTimeout(localT);localT=null}
      var wid=S.branchId;
      queueBranchOp(function(){
        return Promise.resolve(BR.save(wid,cleared,S.branchRev)).then(function(r){ if(r&&r.ok&&wid===S.branchId) S.branchRev=r.rev });
      });
    }else if(S.desktop&&window.desktop&&window.desktop.save){
      window.desktop.save(cleared);
    }else{try{localStorage.removeItem(LS_KEY)}catch(e){}}
    seedDemoState();
    relearn();render();toast("مُسحت البيانات");
    return;
  }
  if(!S.db){return}
  var jobs=[];
  S.products.forEach(function(p){jobs.push(S.db.doc("products/"+p.id).delete())});

/* Renaming a product must never cost it a match: the name it is leaving is
   remembered, so a sheet still written the old way keeps landing correctly.
   The old value is taken on focus and compared when the field is committed. */
document.addEventListener("keydown",function(e){
  var t=e.target;
  if(e.key==="Enter"&&t.classList&&t.classList.contains("brNew")){e.preventDefault();addBranch(t.dataset.brand)}
  if(e.key==="Enter"&&(t.id==="authPass"||t.id==="authEmail")){e.preventDefault();var b=document.getElementById("signIn");if(b)b.click()}
