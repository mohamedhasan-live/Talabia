/** Arabic-Indic digits, thousands separators and stray marks all become a number. */
function parseNum(v){
  if(typeof v==="number") return isFinite(v)?v:0;
  var s=String(v==null?"":v);
  s=s.replace(/[٠-٩]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x0660+48)})
     .replace(/[۰-۹]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0x06F0+48)})
     .replace(/[‎‏٬\s]/g,"")
     .replace(/[٫،]/g,".")
     .replace(/,(?=\d{3}\b)/g,"");
  var m=s.match(/-?\d+(\.\d+)?/);
  return m?parseFloat(m[0]):0;
}

/**
 * Two spellings of the same cake must land on the same product, so names are
 * flattened: diacritics and tatweel dropped, the alef/ya/ta-marbuta families
 * unified, punctuation reduced to single spaces.
 */
function normName(s){
  return String(s==null?"":s)
    .replace(/[ً-ْـ‎‏]/g,"")
    .replace(/[أإآٱ]/g,"ا").replace(/ة/g,"ه").replace(/[ىئ]/g,"ي").replace(/ؤ/g,"و")
    .replace(/[^\p{L}\p{N}]+/gu," ")
    .trim().toLowerCase();
}

function parseCSV(text){
  text=String(text).replace(/^﻿/,"");
  var head=text.slice(0,text.indexOf("\n")<0?text.length:text.indexOf("\n"));
  var delim=",";
  if(head.split(";").length>head.split(",").length) delim=";";
  if(head.split("\t").length>head.split(",").length&&head.split("\t").length>head.split(";").length) delim="\t";
  var rows=[],row=[],cur="",q=false,i=0;
  while(i<text.length){
    var c=text.charAt(i);
    if(q){
      if(c==='"'){ if(text.charAt(i+1)==='"'){cur+='"';i+=2;continue} q=false;i++;continue }
      cur+=c;i++;continue;
    }
    if(c==='"'){q=true;i++;continue}
    if(c===delim){row.push(cur);cur="";i++;continue}
    if(c==="\r"){i++;continue}
    if(c==="\n"){row.push(cur);rows.push(row);row=[];cur="";i++;continue}
    cur+=c;i++;
  }
  if(cur.length||row.length){row.push(cur);rows.push(row)}
  return rows.filter(function(r){return r.some(function(x){return String(x).trim()!==""})});
}

var xlsxPromise=null;
function loadXLSX(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(xlsxPromise) return xlsxPromise;
  xlsxPromise=new Promise(function(res,rej){
    var s=document.createElement("script");
    // The desktop build ships its own copy so the shop can import offline.
    s.src=S.desktop?"vendor/xlsx.js":"https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.onload=function(){window.XLSX?res(window.XLSX):rej(new Error("xlsx missing"))};
    s.onerror=function(){rej(new Error("xlsx failed"))};
    document.head.appendChild(s);
  });
  return xlsxPromise;
}

/**
 * Odoo closes a report with a totals line, and that line carries a real
 * quantity — so without this it reads as a product and lands in the catalogue.
 */
var SUMMARY_RE=/^\s*[\-–—*]*\s*(الإجمالي|الاجمالي|الإجمالى|الاجمالى|إجمالي|اجمالي|المجموع|المجموع الكلي|الكلي|الكلى|الحصيلة|total|totals|grand\s*total|sub\s*total|subtotal|sum|count|average|المعدل|المتوسط)\s*[:：]?\s*$/i;
function isSummaryRow(name){
  var n=String(name==null?"":name).replace(/[‎‏]/g,"").trim();
  if(!n) return true;
  if(SUMMARY_RE.test(n)) return true;
  // a bare label ending in a colon, with no product text of its own
  if(/[:：]\s*$/.test(n)&&n.replace(/[:：\s]/g,"").length<=10&&!/\d/.test(n)) return true;
  return false;
}

/**
 * Odoo writes a product as "[POS-CH-021] Cinnamon Balls 16 | سينامون بولز 16"
 * and repeats it on a second line. A shop does not want that as a product name,
 * so a name created from a sheet is reduced to the Arabic half with the bracketed
 * code stripped — while every spelling the sheet used is kept as an alias.
 */
function cleanImportName(raw){
  var lines=String(raw==null?"":raw).replace(/\r/g,"").split("\n")
    .map(function(s){return s.trim()}).filter(Boolean);
  var first=lines[0]||String(raw||"");
  var body=first.replace(/\[[A-Za-z0-9\-_.]+\]\s*/g,"").trim();
  var parts=body.split("|").map(function(s){return s.trim()}).filter(Boolean);
  var arabic=parts.filter(function(p){return /[؀-ۿ]/.test(p)})[0];
  return (arabic||parts[0]||body||first).trim();
}
/** Every spelling a sheet used for one product, so the next file matches itself. */
function spellingsOf(raw){
  var out=[], lines=String(raw==null?"":raw).replace(/\r/g,"").split("\n");
  lines.forEach(function(l){
    l=l.trim(); if(!l) return;
    out.push(l);
    out.push(l.replace(/\[[A-Za-z0-9\-_.]+\]\s*/g,"").trim());
    l.replace(/\[[A-Za-z0-9\-_.]+\]\s*/g,"").split("|").forEach(function(p){
      p=p.trim(); if(p) out.push(p);
    });
    var code=(l.match(/\[([A-Za-z0-9\-_.]+)\]/)||[])[1];
    if(code) out.push(code);
  });
  return out;
}
/** Remember a name this product used to be known by. */
function addAlias(p,raw){
  var n=normName(raw);
  if(!n||n===normName(p.name)) return false;
  p.aliases=p.aliases||[];
  if(p.aliases.indexOf(n)>=0) return false;
  p.aliases.push(n);
  return true;
}

var COL_HINTS={
  product:["product","product name","productname","order lines/product","lines/product","name","display name",
           "description","item","المنتج","اسم المنتج","الصنف","اسم الصنف","البيان","المنتَج"],
  date:["date","order date","date order","invoice date","transaction date","accounting date","datetime",
        "date_order","التاريخ","تاريخ","تاريخ الطلب","تاريخ الفاتورة","تاريخ الأمر"],
  qty:["quantity","product quantity","qty","quantity done","qty delivered","qty invoiced","product uom quantity",
       "order lines/quantity","lines/quantity","product_uom_qty","الكمية","الكميه","كمية","العدد","الكمّية"],
  unit:["uom","unit","unit of measure","product uom","uom name","وحدة القياس","وحدة","الوحدة","وحده القياس"]
};
/** Find each column by header, preferring an exact hit over a partial one. */
function detectCols(headers){
  var norm=headers.map(function(h){return normName(h)});
  var tail=norm.map(function(h){var p=h.split("/");return p[p.length-1].trim()});
  var out={};
  Object.keys(COL_HINTS).forEach(function(kind){
    var hints=COL_HINTS[kind].map(normName);
    var best=-1,bestScore=0;
    for(var i=0;i<norm.length;i++){
      var score=0;
      if(hints.indexOf(norm[i])>=0) score=3;
      else if(hints.indexOf(tail[i])>=0) score=2;
      else if(hints.some(function(x){return norm[i].indexOf(x)>=0&&x.length>2})) score=1;
      if(score>bestScore){bestScore=score;best=i}
    }
    out[kind]=best;
  });
  return out;
}

/** Odoo writes dates several ways; d/m and m/d are told apart by scanning the column. */
function sniffDateFormat(values){
  var sawBigFirst=false, sawBigSecond=false, sawDayMonth=false;
  for(var i=0;i<values.length;i++){
    var m=String(values[i]).trim().match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
    if(!m) continue;
    sawDayMonth=true;
    if(+m[1]>12) sawBigFirst=true;
    if(+m[2]>12) sawBigSecond=true;
  }
  // yyyy-mm-dd (and other year-first or spelled-out dates) can be read only one way
  if(!sawDayMonth) return "dmy";
  if(sawBigFirst&&!sawBigSecond) return "dmy";
  if(sawBigSecond&&!sawBigFirst) return "mdy";
  return null;   // genuinely ambiguous — the user picks
}
function parseSheetDate(v,fmt){
  var s=String(v==null?"":v).trim();
  if(!s) return null;
  var iso=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
  if(iso) return ymd(new Date(+iso[1],+iso[2]-1,+iso[3]));
  var dm=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(dm){
    var y=+dm[3]; if(y<100) y+=2000;
    var a=+dm[1], b=+dm[2];
    var day=fmt==="mdy"?b:a, mon=fmt==="mdy"?a:b;
    if(mon<1||mon>12||day<1||day>31) return null;
    return ymd(new Date(y,mon-1,day));
  }
  var t=Date.parse(s);
  if(!isNaN(t)){var d=new Date(t);return ymd(new Date(d.getFullYear(),d.getMonth(),d.getDate()))}
  return null;
}

/**
 * Which product is this sheet cell talking about?
 *
 * Four passes, from certain to merely likely:
 *   exact  — the cell is the product's name
 *   alias  — the cell is a spelling this product was seen under before
 *   inside — the product's name sits INSIDE the cell, which is the usual case
 *            for Odoo: "[POS-CH-021] Cinnamon Balls 16 | سينامون بولز 16"
 *   words  — most of the words are shared
 *
 * The last two are guesses, so they are reported as such and shown to the shop
 * for review. A tie is never resolved by coin flip: two products fitting the
 * cell equally well means the sheet is ambiguous, and the shop decides.
 */
function matchProductDetail(name){
  var n=normName(name);
  if(!n) return {id:null, how:null};
  var list=S.products, i, j;

  for(i=0;i<list.length;i++) if(normName(list[i].name)===n) return {id:list[i].id, how:"exact"};
  for(i=0;i<list.length;i++){
    var al=list[i].aliases||[];
    for(j=0;j<al.length;j++) if(al[j]===n) return {id:list[i].id, how:"alias"};
  }
  // Odoo's product code ([POS-CN-017]) is stable while names and spellings drift: once a product
  // has been linked to a code, that code alone identifies it.
  var codes=(String(name).match(/\[[A-Za-z0-9\-_.]+\]/g)||[]).map(function(c){return normName(c.slice(1,-1))}).filter(Boolean);
  if(codes.length){
    var byCode=list.filter(function(p){return (p.aliases||[]).some(function(a){return codes.indexOf(a)>=0})});
    if(byCode.length===1) return {id:byCode[0].id, how:"code"};
  }

  // the name reads inside the cell (or the cell inside the name)
  var cands=[];
  for(i=0;i<list.length;i++){
    var keys=[normName(list[i].name)].concat(list[i].aliases||[]);
    var best=0;
    for(j=0;j<keys.length;j++){
      var k=keys[j];
      if(!k||k.length<4) continue;                 // too short to be evidence
      if(n.indexOf(k)>=0||k.indexOf(n)>=0) best=Math.max(best,k.length);
    }
    if(best>0) cands.push({id:list[i].id, len:best});
  }
  if(cands.length){
    cands.sort(function(a,b){return b.len-a.len});
    if(cands.length===1||cands[0].len>cands[1].len) return {id:cands[0].id, how:"inside"};
    return {id:null, how:"ambiguous"};             // let the shop choose
  }

  var tok=n.split(" ").filter(function(x){return x.length>1});
  if(!tok.length) return {id:null, how:null};
  var bestId=null, bestScore=0, runnerUp=0;
  for(i=0;i<list.length;i++){
    var pt=normName(list[i].name).split(" ").filter(function(x){return x.length>1});
    if(!pt.length) continue;
    var hit=tok.filter(function(x){return pt.indexOf(x)>=0}).length;
    var score=hit/Math.max(tok.length,pt.length);
    if(score>bestScore){runnerUp=bestScore; bestScore=score; bestId=list[i].id}
    else if(score>runnerUp) runnerUp=score;
  }
  if(bestScore>=0.6&&bestScore>runnerUp) return {id:bestId, how:"words"};
  if(bestScore>=0.6) return {id:null, how:"ambiguous"};
  return {id:null, how:null};
}
function matchProduct(name){ return matchProductDetail(name).id }

/**
 * What the shop said this file covers. "day": one date, and a row with no date
 * of its own lands on it. "period": every row on its own date, inside from–to.
 * An import set up without a scope (older callers) keeps the original rule:
 * each dated row on its own day.
 */
function importScope(imp){
  if(imp.scope==="day") return {kind:"day", day:imp.singleDate||ymd(today())};
  if(imp.scope==="period"){
    var f=imp.from||null, t=imp.to||null;
    if(f&&t&&f>t){var x=f;f=t;t=x}
    return {kind:"period", from:f, to:t};
  }
  return {kind:"legacy"};
}
function inScope(sc,d){return (!sc.from||d>=sc.from)&&(!sc.to||d<=sc.to)}

/** The first and last readable date in the file's date column, today at most. */
function fileDateRange(imp){
  if(!imp||imp.cols.date<0) return null;
  var lo=null, hi=null, todayKey=ymd(today());
  imp.rows.slice(1).forEach(function(r){
    var d=parseSheetDate(r[imp.cols.date],imp.dateFmt);
    if(!d||d>todayKey) return;
    if(!lo||d<lo) lo=d;
    if(!hi||d>hi) hi=d;
  });
  return lo?{from:lo,to:hi}:null;
}

/** Turn the chosen columns into dated quantities, and say what could not be placed. */
function analyzeImport(){
  var imp=S.imp;
  if(!imp) return null;
  var cols=imp.cols, rows=imp.rows.slice(1), sc=importScope(imp);
  var entries=[], unmatched={}, guesses={}, unitClash={}, noDate=0, noQty=0, future=0, summary=0;
  var outside={}, undated=[], skippedNames={}, inactive={};
  var todayKey=ymd(today());
  rows.forEach(function(r,ri){
    var rowNo=ri+1;                                  // its index in imp.rows, stable across redraws
    var name=cols.product>=0?String(r[cols.product]||"").trim():"";
    if(!name) return;
    if(isSummaryRow(name)){summary++;return}
    var qty=cols.qty>=0?parseNum(r[cols.qty]):0;
    // A quantity written as 0 in the sheet is a confirmed zero for a product the app already knows.
    // A blank or unreadable cell, or a negative one, stays out as before — never read as zero.
    var zeroRow=cols.qty>=0&&qty===0&&/^\s*[0٠۰]+(?:[.,٫][0٠۰]+)?\s*$/.test(String(r[cols.qty]==null?"":r[cols.qty]));
    if(!(qty>0)&&!zeroRow){noQty++;return}
    var sheetUnit=cols.unit>=0?String(r[cols.unit]||"").trim():"";
    var rawDate=cols.date>=0?String(r[cols.date]==null?"":r[cols.date]).trim():"";
    var parsed=rawDate?parseSheetDate(r[cols.date],imp.dateFmt):null;
    var date=null;
    var flag=function(d){
      outside[d]=outside[d]||{date:d,rows:0,qty:0,names:{}};
      outside[d].rows++; outside[d].qty+=qty; outside[d].names[name]=1;
    };
    if(sc.kind==="legacy"){
      date=cols.date>=0?parsed:imp.singleDate;
      if(!date){noDate++;return}
    }else if(sc.kind==="day"){
      if(!rawDate) date=sc.day;                     // no date of its own: the day the shop picked
      else if(!parsed){noDate++;return}
      else if(parsed!==sc.day){ if(parsed>todayKey){future++;return} flag(parsed); return }
      else date=parsed;
    }else{
      if(parsed){
        if(parsed>todayKey){future++;return}
        if(!inScope(sc,parsed)){flag(parsed);return}
        date=parsed;
      }else{
        // Never lumped on one day and never spread over many: the shop places it, or it stays out.
        if(zeroRow){noQty++;return}                  // an undated zero proves nothing about any day
        var put=(imp.undated||{})[rowNo]||"";
        var ok=!!put&&put<=todayKey&&inScope(sc,put);
        undated.push({row:rowNo, name:name, qty:qty, raw:rawDate, date:put, placed:ok});
        if(!ok) return;
        date=put;
      }
    }
    if(date>todayKey){future++;return}
    var key=normName(name);
    var pid, how;
    if(imp.mapping.hasOwnProperty(key)){ pid=imp.mapping[key]; how="manual" }
    else { var m=matchProductDetail(name); pid=m.id; how=m.how }
    // a zero row counts only for a product already known with certainty: it never creates a product
    // and never teaches a guessed name
    if(zeroRow&&(!pid||pid==="__skip"||how==="inside"||how==="words"||how==="ambiguous")){noQty++;return}
    if(!pid){
      unmatched[key]=unmatched[key]||{name:name,qty:0,rows:0,how:how,unit:sheetUnit};
      unmatched[key].qty+=qty; unmatched[key].rows++; return;
    }
    if(pid==="__skip"){
      // kept on the list, so a skip can be taken back
      skippedNames[key]=skippedNames[key]||{name:name,qty:0,rows:0,how:how,unit:sheetUnit};
      skippedNames[key].qty+=qty; skippedNames[key].rows++; return;
    }
    var pr=S.products.filter(function(x){return x.id===pid})[0];
    if(pr&&pr.active===false){ inactive[pid]=inactive[pid]||{pid:pid,name:pr.name,qty:0}; inactive[pid].qty+=qty }
    // The sheet states its own unit. If it disagrees with the product's, the
    // numbers mean different things — say so rather than add them blindly.
    if(sheetUnit){
      var prod=S.products.filter(function(x){return x.id===pid})[0];
      if(prod&&normName(sheetUnit)!==normName(unitOf(prod))){
        unitClash[key]=unitClash[key]||{name:name,pid:pid,sheet:sheetUnit,app:unitOf(prod),qty:0};
        unitClash[key].qty+=qty;
      }
    }
    // a guess is recorded as a guess, so the shop can look before it lands
    if(how==="inside"||how==="words"){
      guesses[key]=guesses[key]||{name:name,pid:pid,how:how,qty:0};
      guesses[key].qty+=qty;
    }
    entries.push({date:date,pid:pid,qty:qty,raw:name,key:key,how:how});
  });
  var days={};
  entries.forEach(function(e){
    if(!days[e.date]) days[e.date]={qty:0,items:0,set:{},lines:[]};
    days[e.date].qty+=e.qty;
    days[e.date].lines.push({pid:e.pid,qty:e.qty});
    if(!days[e.date].set[e.pid]){days[e.date].set[e.pid]=1;days[e.date].items++}
  });
  // the days this file would land on that already carry recorded sales
  var clashDays=Object.keys(days).sort().filter(function(d){
    var ex=S.days[d]; if(!ex||!ex.items) return false;
    return Object.keys(ex.items).some(function(pid){return (+ex.items[pid].sold||0)>0});
  });
  return {entries:entries, unmatched:unmatched, guesses:guesses, unitClash:unitClash, days:days,
          noDate:noDate, noQty:noQty, future:future, summary:summary,
          scope:sc, clashDays:clashDays, undated:undated, skippedNames:skippedNames,
          inactive:Object.keys(inactive).map(function(k){return inactive[k]}),
          outside:Object.keys(outside).sort().map(function(k){return outside[k]})};
}
/** A file that touches recorded days must not be saved until the shop says replace or add. */
function importNeedsMode(a){ return !!(S.imp&&S.imp.scope&&a&&a.clashDays.length&&!S.imp.modeChosen) }

/**
 * The new products the shop approved on the review screen: each name never seen before becomes a product
 * under the name shown (as read from the cell, or as the shop edited it), unless it was linked to an
 * existing product or skipped. Its Odoo spellings and code are kept as aliases so the next file matches it.
 */
function createApprovedProducts(a){
  var imp=S.imp, made=0;
  Object.keys(a.unmatched).forEach(function(key){
    if(imp.mapping[key]) return;
    var u=a.unmatched[key];
    var nm=String((imp.newNames&&imp.newNames[key]!=null)?imp.newNames[key]:cleanImportName(u.name)).trim()||cleanImportName(u.name);
    // the same name approved twice (two spellings in one file) is one product
    var same=S.products.filter(function(p){return normName(p.name)===normName(nm)})[0];
    var p=same;
    if(!p){
      p={id:"p"+Date.now().toString(36)+Math.floor(Math.random()*999),name:nm,unit:u.unit||DEFAULT_UNIT,
         shelfLife:5,packSize:1,moq:0,active:true,aliases:[]};
      S.products.push(p); made++;
      S.impNew=(S.impNew||[]); S.impNew.push(p.id);
    }
    addAlias(p,key);
    spellingsOf(u.name).forEach(function(s){addAlias(p,s)});
    saveProduct(p);
    imp.mapping[key]=p.id;
  });
  S.impNewCount=(S.impNewCount||0)+made;
  return made;
}

function applyImport(){
  var a=analyzeImport();
  if(a&&S.imp.scope&&Object.keys(a.unmatched).length){ createApprovedProducts(a); relearn(); a=analyzeImport() }
  if(!a||!a.entries.length){toast("لا توجد صفوف صالحة للاستيراد");return}
  if(importNeedsMode(a)){toast("في بعض هذه الأيام مبيعات مسجّلة — اختر «استبدل» أو «أضف» أوّلاً");render();return}
  var cleared={}, newProducts=[];
  a.entries.forEach(function(e){
    var rec=ensureDay(e.date);
    if(!rec.items[e.pid]) rec.items[e.pid]={sold:0,waste:0,stockout:false};
    var slot=rec.items[e.pid];
    var ck=e.date+"|"+e.pid;
    if(S.imp.mode==="replace"&&!cleared[ck]){slot.sold=0;cleared[ck]=1}
    slot.sold=(+slot.sold||0)+e.qty;
    var ip=S.products.filter(function(x){return x.id===e.pid})[0];
    slot.sold=ip?qtyRound(ip,slot.sold):Math.round(slot.sold*100)/100;
  });
  // P0-1 — a complete report for this branch: every active product it does not list sold 0 on its days.
  // «replace» makes the file the whole truth of those days; «add» leaves a sale the day already holds.
  var cov=importCoverage(S.imp,a), zeros=0, zeroDays={};
  if(cov.complete){
    var listed={}; a.entries.forEach(function(e){(listed[e.date]=listed[e.date]||{})[e.pid]=1});
    var actives=S.products.filter(function(p){return p.active!==false});
    cov.dates.forEach(function(d){
      var rec=ensureDay(d);
      actives.forEach(function(p){
        if(listed[d]&&listed[d][p.id]) return;
        var it=rec.items[p.id];
        if(S.imp.mode==="add"&&hasSold(it)) return;
        if(!it) it=rec.items[p.id]={waste:0,lost:0,stockout:false};
        if(it.sold!==0){ it.sold=0; zeros++; zeroDays[d]=1 }
      });
    });
  }
  var who=S.cloud&&S.cloud.access?(S.cloud.access.name||S.cloud.access.email||""):"";
  S.imports=(S.imports||[]).concat([{id:"i"+Date.now().toString(36), at:new Date().toISOString(), by:String(who),
    file:String(S.imp.fileName||""), title:String(S.imp.reportTitle||""), from:cov.from, to:cov.to,
    complete:cov.complete, reason:cov.reason, mode:S.imp.mode==="add"?"add":"replace",
    rows:a.entries.length, qty:sum(a.entries.map(function(e){return e.qty})), zeros:zeros}]).slice(-2000);
  // Remember every name resolved on this pass — whether the shop chose it or
  // the app read it out of the cell — so the next file matches with certainty
  // instead of guessing again.
  var learn={};
  Object.keys(S.imp.mapping).forEach(function(k){ if(S.imp.mapping[k]&&S.imp.mapping[k]!=="__skip") learn[k]=S.imp.mapping[k] });
  Object.keys(a.guesses).forEach(function(k){ if(!learn[k]) learn[k]=a.guesses[k].pid });
  Object.keys(learn).forEach(function(key){
    var p=S.products.filter(function(x){return x.id===learn[key]})[0];
    if(!p) return;
    if(addAlias(p,key)) saveProduct(p);
  });
  // and the plain names the cell gives it (its English name, its Arabic name), readable in the Products tab
  a.entries.forEach(function(e){
    if(e.how!=="inside"&&e.how!=="words"&&e.how!=="manual") return;
    var p=S.products.filter(function(x){return x.id===e.pid})[0]; if(!p) return;
    var changed=false;
    spellingsOf(e.raw).forEach(function(s){ if(s.indexOf("[")<0&&s.indexOf("|")<0&&addAlias(p,s)) changed=true });
    if(changed) saveProduct(p);
  });
  // and the Odoo code of every product this file named ([POS-CN-017]), which outlives any spelling
  var coded={};
  a.entries.forEach(function(e){
    (String(e.raw).match(/\[[A-Za-z0-9\-_.]+\]/g)||[]).forEach(function(c){
      var p=S.products.filter(function(x){return x.id===e.pid})[0];
      if(p&&addAlias(p,c.slice(1,-1))) coded[p.id]=p;
    });
  });
  Object.keys(coded).forEach(function(id){saveProduct(coded[id])});
  Object.keys(a.days).concat(Object.keys(zeroDays).filter(function(d){return !a.days[d]})).forEach(function(d){
    var rec=S.days[d];
    if(S.imp.markClosed) rec.closed=true;
    saveDay(d);
  });
  var nDays=Object.keys(a.days).length, nRows=a.entries.length;
  var lastDay=Object.keys(a.days).sort().pop();
  var created=S.impNewCount||0;
  S.imp=null; S.impNewCount=0;
  if(lastDay) S.entryDate=lastDay;
  relearn(); render();
  var scTxt=a.scope.kind==="day"?" (يوم "+a.scope.day+")"
           :a.scope.kind==="period"?" (فترة "+(a.scope.from||"…")+" → "+(a.scope.to||"…")+")":"";
  logAct("entry","استيراد ملف أودو"+scTxt+": "+nRows+" صفّاً على "+nDays+" "+(nDays===1?"يوم":"أيام")+(created?" و"+created+" صنفاً جديداً":""));
  toast("استُورد "+nRows+" صفّاً على "+nDays+" "+(nDays===1?"يوم":"أيام")+
        (created?" · "+created+" صنفاً جديداً يحتاج ضبط الصلاحية":"")+
        (a.inactive.length?" · "+a.inactive.length+" منها لأصنافٍ موقوفة":""));
}

/**
 * Does the report's own title name a different branch than the one open? The words that tell this branch
 * from its brand's other branches («النرجس» in «كانوليه النرجس») must appear in the title; a title that
 * names none of them is flagged. Nothing is moved — the shop decides.
 */
function importOtherBranch(imp){
  var b=S.multi&&curBranch(); if(!imp||!imp.reportTitle||!b) return null;
  var words=function(s){return normName(s).split(" ").filter(function(w){return w.length>=3})};
  var sibs=branchesOf(b.brand).filter(function(x){return x.id!==b.id});
  var common={}; if(sibs.length) words(b.name).forEach(function(w){ if(sibs.every(function(x){return words(x.name).indexOf(w)>=0})) common[w]=1 });
  var own=words(b.name).filter(function(w){return !common[w]});
  if(!own.length) return null;
  var t=normName(imp.reportTitle);
  return own.some(function(w){return t.indexOf(w)>=0})?null:b.name;
}
/**
 * P0-1 — does this file prove which products sold nothing? Only a report that states its own period in its header,
 * names the branch that is open, was imported exactly for that period, and whose every row landed on a product.
 * Then (the shop's word: an Odoo POS report is the whole branch's full day, sold items only, no sales outside the POS)
 * an active product it does not list sold 0 on each of its days. Anything short of that proves nothing: those
 * products stay missing data. A day with no file has no record at all.
 */
function importNamesBranch(imp){
  if(!imp||!imp.reportTitle||importOtherBranch(imp)) return false;
  var b=S.multi&&curBranch(), name=b?b.name:(S.cfg.branch||"");
  var sibs=b?branchesOf(b.brand).filter(function(x){return x.id!==b.id}):[];
  // words that name no branch in particular: «فرع», and the brand's own name
  var generic={"فرع":1,"الفرع":1,"branch":1};
  normName(brandWord(b?b.brand:CUR_BRAND)).split(" ").forEach(function(w){generic[w]=1});
  var words=normName(name).split(" ").filter(function(w){return w.length>=3&&!generic[w]});
  // a word every branch of the brand carries does not tell this branch apart either
  var own=words.filter(function(w){return !sibs.length||!sibs.every(function(x){return normName(x.name).split(" ").indexOf(w)>=0})});
  var t=normName(imp.reportTitle);
  // every word that sets this branch apart must be in the title — a shared or generic word is not enough
  return own.length>0&&own.every(function(w){return t.indexOf(w)>=0});
}
function importCoverage(imp,a){
  var ds=Object.keys(a.days).sort(), hp=imp.headPeriod;
  var cov={from:ds[0]||null, to:ds[ds.length-1]||null, complete:false, reason:"", dates:[]};
  if(!hp){cov.reason="no-period";return cov}
  cov.from=hp.from; cov.to=hp.to;
  if(!importNamesBranch(imp)){cov.reason="branch";return cov}
  var sc=a.scope;
  var same=sc.kind==="day"?(hp.from===hp.to&&sc.day===hp.from):sc.kind==="period"?(sc.from===hp.from&&sc.to===hp.to):false;
  if(!same){cov.reason="scope";return cov}
  if(hp.from!==hp.to&&imp.cols.date<0){cov.reason="no-dates";return cov}
  if(a.noQty||a.noDate||a.future||a.outside.length||a.undated.length||Object.keys(a.unmatched).length||Object.keys(a.skippedNames).length){cov.reason="rows";return cov}
  var todayKey=ymd(today());
  for(var d=parseYmd(hp.from),g=0;ymd(d)<=hp.to&&g<400;d=addDays(d,1),g++) if(ymd(d)<=todayKey) cov.dates.push(ymd(d));
  cov.complete=cov.dates.length>0;
  if(!cov.complete) cov.reason="future";
  return cov;
}
/** The latest import record that covers a date, or null: a date no import covered is missing data. */
function coverageOf(date){
  var list=S.imports||[];
  for(var i=list.length-1;i>=0;i--){ var x=list[i]; if(x.from&&x.to&&date>=x.from&&date<=x.to) return x }
  return null;
}
/** Where a sheet's table starts (the first row naming both a product and a quantity column), and the period a report states above it. */
function findTableHead(rows){
  var out={index:0, period:null};
  for(var i=0;i<Math.min(rows.length,12);i++){
    var line=rows[i].map(function(x){return String(x==null?"":x)}).join(" ");
    var m=westernDigits(line).match(/(\d{4}-\d{2}-\d{2})\D{1,12}(\d{4}-\d{2}-\d{2})/);
    if(m&&/الفترة|period|from/i.test(line)&&!out.period) out.period={from:m[1]<m[2]?m[1]:m[2], to:m[1]<m[2]?m[2]:m[1]};
    if(/تقرير|report/i.test(line)&&!out.title) out.title=line.trim();
    var c=detectCols(rows[i].map(function(h){return String(h==null?"":h).trim()}));
    if(c.product>=0&&c.qty>=0&&c.product!==c.qty){ out.index=i; break }
  }
  return out;
}
function startImport(file){
  var name=(file.name||"").toLowerCase();
  var done=function(rows){
    if(!rows||rows.length<2){toast("الملفّ فارغ أو لا يحوي صفوفاً");return}
    // Odoo's "POS orders report" opens with a title, "الفترة: من … إلى …" and the export time before its
    // table: find the table's own header row, and read the period it states.
    var head=findTableHead(rows);
    rows=rows.slice(head.index);
    var headers=rows[0].map(function(h){return String(h==null?"":h).trim()});
    var cols=detectCols(headers);
    var dateVals=cols.date>=0?rows.slice(1,400).map(function(r){return r[cols.date]}):[];
    var fmt=sniffDateFormat(dateVals);
    S.imp={
      fileName:file.name, rows:rows, headers:headers, cols:cols,
      dateFmt:fmt||"dmy", fmtAmbiguous:!fmt&&cols.date>=0,
      singleDate:S.entryDate, mapping:{}, mode:"replace", modeChosen:false, markClosed:false,
      scope:"day", from:S.entryDate, to:S.entryDate, undated:{}
    };
    // A dated file opens as a period spanning its own dates; an undated one as a single day — the day its
    // report states when it states one (a report for several days is a total: its rows wait for the shop).
    S.imp.reportTitle=head.title||null;
    S.imp.headPeriod=head.period||null;             // the period the report states in its own header (coverage)
    var fr=fileDateRange(S.imp);
    if(fr){S.imp.scope="period"; S.imp.from=fr.from; S.imp.to=fr.to}
    else if(head.period&&head.period.from===head.period.to){S.imp.scope="day"; S.imp.singleDate=head.period.from; S.imp.reportDay=head.period.from}
    else if(head.period){S.imp.scope="period"; S.imp.from=head.period.from; S.imp.to=head.period.to; S.imp.reportPeriod=head.period}
    S.tab="entry"; render();
  };
  if(/\.(xlsx|xlsm|xls)$/.test(name)){
    loadXLSX().then(function(XLSX){
      return file.arrayBuffer().then(function(buf){
        var wb=XLSX.read(new Uint8Array(buf),{type:"array",cellDates:true});
        var ws=wb.Sheets[wb.SheetNames[0]];
        done(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,dateNF:"yyyy-mm-dd",defval:""}));
      });
    }).catch(function(){
      toast(S.desktop?"تعذّر فتح ملفّ إكسل — صدّره من أودو بصيغة CSV":"تعذّر تحميل قارئ إكسل — جرّب CSV");
    });
  }else{
    file.text().then(function(txt){done(parseCSV(txt))},function(){toast("تعذّرت قراءة الملفّ")});
  }
}

/* ===================== helpers ===================== */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
var toastT=null;

function shelfChip(p){

/* ===================== render: order tab ===================== */
/**
 * One column per day in the coverage window, height = demand that slice carries.
 * The first and last columns are half-days (evening of the delivery, daytime of
 * the next) and are drawn narrower so the shape of the window reads at a glance.
 */
function coverageSvg(plan,ordered){
  var fc=plan.fc, days=plan.win.days, wts=plan.win.weights, n=days.length;
  var full=26, gap=7, H=48, base=H-14;
  var widths=wts.map(function(w){return Math.max(11,Math.round(full*Math.min(1,w)))});
  var totalW=sum(widths)+(n-1)*gap;
  var peak=Math.max.apply(null,fc.concat([0.001]));
  var supply=plan.usable+ordered, left=supply, parts=[], x=0;
  for(var i=0;i<n;i++){
    var cw=widths[i];
    var h=Math.max(2,(fc[i]/peak)*32);
    var covered=Math.min(left,fc[i]); left-=covered;
    var frac=fc[i]>0?covered/fc[i]:1;
    var ch=h*frac;
    var partial=wts[i]<0.999;
    parts.push('<rect x="'+x+'" y="'+(base-h)+'" width="'+cw+'" height="'+h+'" rx="3" fill="var(--surface-3)" opacity="'+(partial?0.65:1)+'"/>');
    if(ch>0.5) parts.push('<rect x="'+x+'" y="'+(base-ch)+'" width="'+cw+'" height="'+ch+'" rx="3" fill="var(--accent)" opacity="'+(frac>=0.999?0.95:0.55)+'"/>');
    var d=days[i], isPeak=d.getDay()===4||d.getDay()===5;
    parts.push('<text x="'+(x+cw/2)+'" y="'+(H-3)+'" text-anchor="middle" font-size="9.5" font-weight="600" fill="'+(isPeak?"var(--warn)":"var(--ink-3)")+'" font-family="IBM Plex Sans Arabic,sans-serif">'+DOW_SHORT[d.getDay()]+'</text>');
    x+=cw+gap;
  }
  return '<svg viewBox="0 0 '+totalW+' '+H+'" width="'+totalW+'" height="'+H+'" role="img" aria-label="تغطية الأيام">'+parts.join("")+'</svg>';
}

function renderOrder(){
  var plist=activeProducts();

  var d=S.planDate?parseYmd(S.planDate):null;

    var t=today();
    if(isOrderDay(t)){d=t;isToday=true}else{d=nextOrderDay(t)}
  }
  var w=coverageWindow(d);
  // every product is forecast (its materials need it); a made-to-order one is not ordered itself
  var allPlans=plist.map(function(p){return {p:p,plan:planFor(p,d)}});
  var plans=allPlans.filter(function(r){return !r.p.mto});
  var mtoPlans=allPlans.filter(function(r){return r.p.mto});

  });
  var orderT=totalsByUnit(orderRows), riskT=totalsByUnit(riskRows).filter(function(t){return t.total>=0.05});

       'مستوى كلّ صنف مأخوذٌ من مبيعاتك؛ ونمط أيام الأسبوع '+(ownPct?ownPct+'٪ منه من فرعك والباقي':'ما زال')+' النمطُ السعودي المعتاد (الخميس والجمعة أعلى) حتى يكتمل من أرقامك عند ثمانية أسابيع. '+

  }

  if(gaps.length&&S.cfg.trackStock===true){
    gaps.sort(function(a,b){return b.gap-a.gap});

      ? DOW_AR[pwin.days[0].getDay()]+' ونهار '+DOW_AR[pwin.days[pwin.days.length-1].getDay()]
      : 'نهار '+DOW_AR[w.delivery.getDay()];
    h+='<div class="banner"><div class="grow"><b>ينفد قبل وصول التحويل:</b> مخزونك الحالي لا يكفي '+stretch+' في '+gaps.length+' صنفاً — '+names.join("، ")+(gaps.length>4?" وغيرها":"")+
       '. وهذه لا تحلّها الطلبية مهما كبرت، لأنها تصل بعد نفاد الصنف. حوِّل من فرع آخر، أو قدِّم بديلاً، أو قدِّم موعد الطلب.</div></div>';
  }
  if(riskUnits>=1&&S.cfg.trackStock===true){
    h+='<div class="banner"><div class="grow"><b>'+fmtTotals(riskT)+'</b> على الرفّ تنتهي صلاحيتها قبل أن تُباع. صرِّفها بعرضٍ أو خصمٍ اليوم قبل أن تتحوّل إلى هدر.</div></div>';
  }

  h+='<div class="section-head"><h2>الأصناف</h2><div class="note">'+
     (stockOn?'عدِّل «الجرد الآن» ليتحدّث المقترح مباشرةً. ':'المقترح محسوبٌ على أنّ الرفّ فارغ، فعدّ الجرد مُطفأ. ')+
     'الأعمدة تحت كل صنف هي الطلب المتوقَّع لكل شريحة، والملوَّن منها هو المغطّى. العمود الضيّق الأوّل مساءُ يوم التوصيل، والأخير نهارُ يوم الطلبية التالية.</div></div>';

  h+='<div class="rows">';
  plans.forEach(function(r){
    var p=r.p, pl=r.plan, q=orderQty(p,pl);
    var edited=S.overrides.hasOwnProperty(p.id)&&S.overrides[p.id]!==pl.suggested;
    var lots=S.stock[p.id]||[];
    var onHand=lots.reduce(function(s,l){return s+(+l.qty||0)},0);
    var stockExp=lots.length&&lots[0].expiry?"صالح حتى "+fmtLong(parseYmd(lots[0].expiry)):"عُدَّ ما على الرفّ الآن";

    var chips=[shelfChip(p)];
    if(stockOn&&pl.preGap>=1) chips.push('<span class="chip c">ينفد قبل التحويل</span>');
    if(pl.capBinds) chips.push('<span class="chip w">مقيّد بالصلاحية</span>');
    if(!pl.coversWindow) chips.push('<span class="chip w">ينتهي '+fmtLong(pl.lastGood)+'</span>');
    if(stockOn&&pl.atRisk>=1) chips.push('<span class="chip c">'+qty(p,pl.atRisk)+' معرّضة للهدر</span>');
    if(pl.moqForced) chips.push('<span class="chip k">حد أدنى '+p.moq+'</span>');
    chips.push('<span class="chip">احتياطي '+Math.round(pl.cr*100)+'٪</span>');

    var why=[];
    why.push('متوقع <b>'+numText(qtyRound(p,pl.expected))+'</b> '+unitOf(p)+' على '+round1(pl.win.span)+' يوم');
    why.push('احتياطي <b>'+(pl.z>=0?"+":"")+round1(pl.z*pl.sigmaW)+'</b>');
    if(stockOn){
      why.push('لديك <b>'+numText(qtyRound(p,pl.usable))+'</b> صالحة');
      if(pl.preGap>=1) why.push('<b style="color:var(--crit)">ينقص '+qty(p,pl.preGap)+' قبل وصول التحويل</b>');
    }
    if(pl.capBinds) why.push('<b style="color:var(--warn)">سقف الصلاحية '+qty(p,pl.cap)+'</b>');

    h+='<div class="row'+(pl.capBinds||(stockOn&&(pl.atRisk>=1||pl.preGap>=1))?" flag":"")+'" data-pid="'+esc(p.id)+'">';
    h+= '<div><div class="name">'+esc(p.name)+'</div><div class="meta">'+chips.join("")+'</div></div>';
    h+= '<div class="ctl">';
    if(stockOn) h+='<div class="stockbox"><span class="cap">الجرد الآن ('+esc(unitOf(p))+')</span><input type="number" inputmode="'+(isCountable(p)?"numeric":"decimal")+'" min="0" step="'+(isCountable(p)?"1":"0.1")+'" class="stockIn" title="'+esc(stockExp)+'" data-pid="'+esc(p.id)+'" value="'+esc(onHand)+'"></div>';
    h+=  '<div class="qtybox"><span class="cap">اطلب</span><div class="stepper'+(edited?" edited":"")+'">';
    h+=   '<button type="button" class="stepBtn" data-pid="'+esc(p.id)+'" data-dir="1" aria-label="زيادة">+</button>';
    h+=   '<input type="number" inputmode="'+(isCountable(p)?"numeric":"decimal")+'" min="0" step="'+(isCountable(p)?"1":"0.1")+'" class="qtyIn" data-pid="'+esc(p.id)+'" value="'+esc(q)+'">';
    h+=   '<button type="button" class="stepBtn" data-pid="'+esc(p.id)+'" data-dir="-1" aria-label="إنقاص">−</button>';
    // الوحدة إلى جوار الخانة: 12 كجم ليست 12 حبة، والفرق يجب أن يُرى لا أن يُحفظ
    h+=  '</div><span class="unit">'+esc(unitOf(p))+'</span></div>';
    h+= '</div>';
    h+= '<div class="cover">'+coverageSvg(pl,q)+'<div class="why">'+why.join(" · ")+(edited?' · <b style="color:var(--calm)">معدّل يدوياً (المقترح '+qty(p,pl.suggested)+')</b>':'')+'</div></div>';
    h+='</div>';
  });
  h+='</div>';

  if(mtoPlans.length){
    h+='<p class="muted" id="mtoNote" style="margin-top:10px"><b style="color:var(--ink)">يُحضَّر بالطلب</b> ('+mtoPlans.length+'): '+
       mtoPlans.map(function(r){return esc(r.p.name)+' <span class="num" style="color:var(--ink-3)">~'+num2(r.plan.expected)+'</span>'}).join('، ')+
       ' — لا يُطلب جاهزاً؛ تُطلب موادّه أدناه، كلٌّ بصلاحيته.</p>';
  }
  h+=renderOpNeeds(allPlans,w);

  h+='<div class="section-head"><h2>كيف تُحسب الكمية</h2></div>';
  h+='<p class="muted">لا تبدأ النافذة يوم الطلب بل ساعةَ وصول التحويل ('+DOW_AR[w.delivery.getDay()]+' '+hourTxt+')، فما قبلها على مخزونك وحده، وما بعدها إلى تحويل '+DOW_AR[w.nextDelivery.getDay()]+' على هذه الطلبية — ومنه نهارُ ذلك اليوم كاملاً. ولكلّ شريحة يُتوقَّع الطلب من مبيعاتك السابقة (معامل اليوم × معامل الراتب × المناسبات)، ثمّ يُضاف احتياطيٌّ تحدّده الصلاحية: فقصيرُها يأخذ أقلّ لأنّ فائضه يُرمى، وطويلُها أكثر لأنّ فائضه يترحّل. ثمّ يُطرح المخزون الصالح، ويُقَصّ الناتج عند سقف ما يمكن بيعه قبل انتهاء الصلاحية، ويُقرَّب إلى مضاعف العبوة.</p>';

  return h;
}

/** The products ordered as they are (a made-to-order product is ordered through its materials). */
function orderedProducts(){return activeProducts().filter(function(p){return !p.mto})}
function orderFooter(){
  var plist=orderedProducts();
  if(!plist.length) return null;
  var d=S.planDate?parseYmd(S.planDate):(isOrderDay(today())?today():nextOrderDay(today()));
  var n=0, rows=[];
  plist.forEach(function(p){
    var pl=planFor(p,d), q=orderQty(p,pl);
    if(q>0) n++;
    rows.push({p:p,v:q});
  });
  return '<div class="sum">'+n+' صنفاً · '+fmtTotals(totalsByUnit(rows),{bold:true})+'</div>'+
         '<button class="btn ghost" id="resetOv">أعِد المقترح</button>'+
         '<button class="btn primary" id="saveOrder">اعتمد الطلبية</button>';
}

/* ===================== render: import wizard ===================== */
function colSelect(kind,label,cur){
  var h='<label class="fld"><span>'+label+'</span><select class="impCol" data-k="'+esc(kind)+'">';
  h+='<option value="-1"'+(cur<0?" selected":"")+'>— لا يوجد —</option>';
  S.imp.headers.forEach(function(hd,i){
    h+='<option value="'+esc(i)+'"'+(cur===i?" selected":"")+'>'+esc(hd||("عمود "+(i+1)))+'</option>';
  });
  return h+'</select></label>';
}

/** Step 2: one day or a period, and the rows that fall outside it or carry no date. */

  var maxD=ymd(today()), sc=a.scope, fr=fileDateRange(imp);
  var h='<div class="card" id="impScope" style="margin-top:10px"><div class="lbl" style="margin-bottom:8px">2 — النطاق</div>';
  h+='<div style="display:flex;gap:6px;flex-wrap:wrap">';
  h+='<button class="btn'+(sc.kind==="day"?" primary":"")+'" id="impScopeDay">يوم واحد</button>';
  h+='<button class="btn'+(sc.kind==="period"?" primary":"")+'" id="impScopePeriod">فترة</button>';
  h+='</div>';
  if(sc.kind==="day"){
    h+='<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:12px">';
    h+='<label class="fld" style="width:170px"><span>اليوم</span><input type="date" id="impSingleDate" value="'+esc(imp.singleDate||"")+'" max="'+maxD+'"></label>';
    h+='<div class="hint" style="flex:1;min-width:200px">'+(imp.reportDay&&imp.reportDay===imp.singleDate?'<b style="color:var(--accent-ink)">قُرئ هذا اليوم من رأس التقرير</b> («الفترة: من '+esc(imp.reportDay)+'»). ':'')+'الصفوف التي بلا تاريخ تُسجَّل على هذا اليوم. وأيّ صفٍّ مؤرَّخٍ بيومٍ آخر يُعرض أدناه <b>ولا يُحفظ</b>.</div>';
    h+='</div>';
  }else if(sc.kind==="period"){
    h+='<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:12px">';
    h+='<label class="fld" style="width:160px"><span>من تاريخ</span><input type="date" id="impFrom" value="'+esc(imp.from||"")+'" max="'+maxD+'"></label>';
    h+='<label class="fld" style="width:160px"><span>إلى تاريخ</span><input type="date" id="impTo" value="'+esc(imp.to||"")+'" max="'+maxD+'"></label>';
    if(fr&&(fr.from!==sc.from||fr.to!==sc.to)) h+='<button class="btn" id="impRangeFile">كلّ تواريخ الملفّ ('+fmtDate(parseYmd(fr.from))+' → '+fmtDate(parseYmd(fr.to))+')</button>';
    h+='</div>';
    h+='<p class="hint" style="margin-top:8px">كلّ صفٍّ يُسجَّل على يومه. وما خرج عن الفترة يُعرض أدناه <b>ولا يُحفظ</b>. والصفوف التي بلا تاريخ لا تُجمع على يومٍ ولا تُوزَّع على الأيام: اختر لكلٍّ منها يوماً أو اتركه.</p>';
  }
  if(a.outside.length){
    var nOut=a.outside.reduce(function(s,o){return s+o.rows},0);
    h+='<div class="banner" id="impOutside" style="margin-top:12px"><div class="grow"><b>'+nOut+' صفّاً '+(sc.kind==="day"?'بتاريخٍ غير اليوم المختار':'خارج الفترة')+' — لن تُحفظ:</b> '+
       a.outside.slice(0,8).map(function(o){return fmtDate(parseYmd(o.date))+' ('+o.rows+')'}).join('، ')+(a.outside.length>8?' وغيرها':'')+
       '. '+(sc.kind==="day"?'وإن كان الملفّ لعدّة أيام فاختر «فترة».':'وسّع الفترة إن أردتها.')+'</div></div>';
  }
  if(a.undated.length){
    var lo=sc.from||"", hi=sc.to&&sc.to<maxD?sc.to:maxD, placed=a.undated.filter(function(u){return u.placed}).length;
    h+='<div id="impUndated" style="margin-top:14px">';
    h+='<p class="muted"><b style="color:var(--warn)">'+a.undated.length+' صفّاً بلا تاريخٍ مقروء</b> — وُضع منها '+placed+'. اختر لكلّ صفٍّ يومَه، وما يبقى بلا يومٍ لا يُحفظ.</p>';
    h+='<div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;margin-top:8px">';
    h+='<label class="fld" style="width:200px"><span>ضع الكلّ على يوم</span><input type="date" id="impUndatedAll" value="" min="'+esc(lo)+'" max="'+esc(hi)+'"></label>';
    h+='<button class="btn" id="impUndatedClear">اترك الكلّ</button>';
    h+='</div>';
    h+='<div class="tablewrap" style="margin-top:8px;max-height:320px;overflow:auto"><table><thead><tr><th>الاسم في الملفّ</th><th>الكمية</th><th>التاريخ في الملفّ</th><th>يومه</th></tr></thead><tbody>';
    a.undated.slice(0,120).forEach(function(u){
      h+='<tr><td class="w130">'+esc(u.name)+'</td><td class="n" style="color:var(--ink-3)">'+round1(u.qty)+'</td>'+
         '<td style="font-size:12px;color:var(--ink-3)">'+(u.raw?esc(u.raw):'—')+'</td>'+
         '<td><input type="date" class="impUndated" id="impU'+esc(u.row)+'" data-row="'+esc(u.row)+'" value="'+esc(u.date)+'" min="'+esc(lo)+'" max="'+esc(hi)+'">'+
         (u.date&&!u.placed?' <span class="chip c">خارج الفترة</span>':'')+'</td></tr>';
    });
    h+='</tbody></table></div>';
    if(a.undated.length>120) h+='<p class="muted" style="margin-top:6px">تُعرض أوّل 120 صفّاً؛ و«ضع الكلّ» يشملها جميعاً.</p>';
    h+='</div>';
  }
  h+='</div>';
  return h;

function renderImport(){
  var imp=S.imp, a=analyzeImport();
  var unmatchedKeys=Object.keys(a.unmatched).sort(function(x,y){return a.unmatched[y].qty-a.unmatched[x].qty});
  var dayKeys=Object.keys(a.days).sort();

  var h='';
  h+='<div class="section-head"><h2>استيراد مبيعات من أودو</h2><div class="note">'+esc(imp.fileName)+' · '+(imp.rows.length-1)+' صفّاً</div>'+
     '<button class="btn ghost" id="impCancel">إلغاء</button></div>';

  // 1. columns
  h+='<div class="card"><div class="lbl" style="margin-bottom:8px">1 — الأعمدة</div>';
  h+='<div class="grid2">'+
     colSelect("product","اسم المنتج",imp.cols.product)+
     colSelect("date","التاريخ",imp.cols.date)+
     colSelect("qty","الكمية",imp.cols.qty)+
     colSelect("unit","وحدة القياس (اختياري)",imp.cols.unit)+
     '</div>';
  if(imp.cols.date<0){
    h+='<p class="muted" style="margin-top:10px">الملفّ بلا عمود تاريخ. اختر في «النطاق» أدناه اليومَ الذي تُسجَّل عليه صفوفه.</p>';
  }else if(imp.fmtAmbiguous){
    h+='<div class="banner" style="margin-top:10px"><div class="grow">صيغة التاريخ ملتبسة — لم يظهر في الملفّ يومٌ أكبر من 12 يحسمها. اختر الصحيحة وراجع المدى أدناه:</div>'+
       '<div class="acts"><button class="btn'+(imp.dateFmt==="dmy"?" primary":"")+'" id="impFmtDmy">يوم/شهر</button>'+
       '<button class="btn'+(imp.dateFmt==="mdy"?" primary":"")+'" id="impFmtMdy">شهر/يوم</button></div></div>';
  }
  h+='</div>';

  if(imp.cols.product<0||imp.cols.qty<0){
    h+='<div class="banner"><div class="grow"><b>حدِّد عمودي المنتج والكمية</b> لأُكمل القراءة. وإن لم تجدهما في القائمة فالملفّ لا يحويهما — صدِّر من أودو تقريراً فيه سطرُ كلّ منتج وكمّيته.</div></div>';
    return h;
  }

  var other=importOtherBranch(imp);
  if(other) h+='<div class="banner" id="impBranchWarn" style="margin-top:10px"><div class="grow"><b>انتبه: الملفّ لفرعٍ آخر على ما يبدو.</b> رأس التقرير يقول «'+esc(imp.reportTitle)+'»، والمفتوح الآن «'+esc(other)+'». '+
     'الاستيراد يُسجَّل في الفرع المفتوح — فإن لم يكن هو المقصود فألغِ وافتح الفرع الصحيح من أعلى الشاشة.</div></div>';
  h+=renderImportScope(imp,a);

  // 2. matching
  var matchedNames={}; a.entries.forEach(function(e){matchedNames[e.key]=1});
  var nMatched=Object.keys(matchedNames).length;
  h+='<div class="card" style="margin-top:10px"><div class="lbl" style="margin-bottom:8px">3 — مطابقة الأصناف</div>';
  h+='<div class="cards" style="margin-top:0">';
  var nGuess=Object.keys(a.guesses).length;
  h+='<div class="card good" style="padding:10px 12px"><div class="lbl">مطابَق</div><div class="val" style="font-size:20px">'+(nMatched-nGuess)+'</div><div class="hint">يقيناً</div></div>';
  h+='<div class="card '+(nGuess?"warn":"")+'" style="padding:10px 12px"><div class="lbl">بالتشابه</div><div class="val" style="font-size:20px">'+nGuess+'</div><div class="hint">'+(nGuess?"راجعها أدناه":"لا شيء")+'</div></div>';
  h+='<div class="card '+(unmatchedKeys.length?"warn":"")+'" style="padding:10px 12px"><div class="lbl">بلا مطابقة</div><div class="val" style="font-size:20px">'+unmatchedKeys.length+'</div><div class="hint">'+(unmatchedKeys.length?"يحتاج قرارك":"لا شيء")+'</div></div>';
  h+='<div class="card" style="padding:10px 12px"><div class="lbl">أيام</div><div class="val" style="font-size:20px">'+dayKeys.length+'</div><div class="hint">'+(dayKeys.length?fmtDate(parseYmd(dayKeys[0]))+' → '+fmtDate(parseYmd(dayKeys[dayKeys.length-1])):'—')+'</div></div>';
  h+='</div>';

  var newKeys=imp.scope?unmatchedKeys.concat(Object.keys(a.skippedNames)):[];
  if(newKeys.length){
    // A name the shop has never had is a NEW product, not a row to drop: the app reads a clean name out of
    // the cell, the shop approves it as it is, edits it, links it to an existing product, or skips it.
    var nNew=unmatchedKeys.length;
    h+='<div class="banner" id="impNewAsk" style="margin-top:12px"><div class="grow"><b>'+newKeys.length+' '+(newKeys.length===1?'صنفٌ جديد':'أصنافٍ جديدة')+' غير موجودة في التطبيق.</b> '+
       'قرأ النظام لكلٍّ منها اسماً — وافق عليه كما هو، أو عدّله، أو اربطه بصنفٍ عندك، أو تجاهله. '+
       'وعند الاستيراد يُضاف كلُّ صنفٍ جديد باسمه، ويتذكّر النظام اسمه في أودو ورمزه فلا يسأل عنه ثانية.</div></div>';
    h+='<div class="tablewrap" style="margin-top:8px"><table id="impNewTable"><thead><tr><th>الاسم في أودو</th><th>الكمية</th><th>الاسم في التطبيق</th><th>القرار</th></tr></thead><tbody>';
    newKeys.slice(0,60).forEach(function(k){
      var u=a.unmatched[k]||a.skippedNames[k], choice=imp.mapping[k]||"__auto";
      var nm=(imp.newNames&&imp.newNames[k]!=null)?imp.newNames[k]:cleanImportName(u.name);
      h+='<tr data-k="'+esc(k)+'"><td class="w130" style="white-space:pre-line;font-size:12px">'+esc(u.name)+'</td><td class="n" style="color:var(--ink-3)">'+round1(u.qty)+(u.unit?' '+esc(u.unit):'')+'</td>';
      h+='<td><input class="impNewName" data-k="'+esc(k)+'" value="'+esc(nm)+'" style="width:190px"'+(choice!=="__auto"?' disabled':'')+'></td>';
      h+='<td><select class="impMap" data-k="'+esc(k)+'" style="width:210px">';
      h+='<option value="__auto"'+(choice==="__auto"?' selected':'')+'>+ صنفٌ جديد بهذا الاسم</option>';
      S.products.forEach(function(p){h+='<option value="'+esc(p.id)+'"'+(choice===p.id?' selected':'')+'>'+esc(p.name)+(p.active===false?' (موقوف)':'')+'</option>'});
      h+='<option value="__skip"'+(choice==="__skip"?' selected':'')+'>تجاهل هذا الاسم</option>';
      h+='</select></td></tr>';
    });
    h+='</tbody></table></div>';
    if(newKeys.length>60) h+='<p class="muted" style="margin-top:6px">تُعرض أوّل 60 اسماً؛ والباقي يُضاف بالاسم المقترح ما لم تتجاهله.</p>';
    if(nNew) h+='<p class="muted" style="margin-top:6px">سيُضاف '+nNew+' صنفاً جديداً بصلاحية 5 أيام — راجع صلاحيتها في «الأصناف» بعد الاستيراد.</p>';
  }else if(unmatchedKeys.length){
    h+='<p class="muted" style="margin-top:12px">اربط كلّ اسمٍ بصنفك مرّةً واحدة، ويتذكّره النظام في كلّ ملفٍّ بعده.</p>';
    h+='<div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>الاسم في أودو</th><th>الكمية</th><th>يقابله عندك</th></tr></thead><tbody>';
    unmatchedKeys.slice(0,60).forEach(function(k){
      var u=a.unmatched[k];
      h+='<tr><td class="w130">'+esc(u.name)+'</td><td class="n" style="color:var(--ink-3)">'+round1(u.qty)+'</td>';
      h+='<td><select class="impMap" data-k="'+esc(k)+'" style="width:210px">';
      h+='<option value="">— اختر —</option>';
      S.products.forEach(function(p){h+='<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>'});
      h+='<option value="__new">+ أنشئ صنفاً بهذا الاسم</option>';
      h+='<option value="__skip">تجاهل هذا الاسم</option>';
      h+='</select></td></tr>';
    });
    h+='</tbody></table></div>';
    if(unmatchedKeys.length>60) h+='<p class="muted" style="margin-top:6px">تُعرض أوّل 60 اسماً.</p>';
  }

  // a product the shop switched off still gets its sales — but say so, since it is hidden everywhere else
  if(a.inactive.length){
    h+='<div class="banner" id="impInactive" style="margin-top:12px"><div class="grow"><b>أصنافٌ موقوفة في التطبيق وصلتها مبيعات:</b> '+
       a.inactive.map(function(x){return esc(x.name)+' ('+round1(x.qty)+')'}).join('، ')+
       '. ستُسجَّل مبيعاتها، لكنّ الصنف الموقوف لا يظهر في إقفال اليوم ولا في الطلبية ولا في التحليل. فعّلها إن كانت تُباع الآن.</div>'+
       '<div class="acts"><button class="btn primary" id="impActivate">فعّلها</button></div></div>';
  }

  // names the app matched by reading, not by certainty — shown for review
  var guessKeys=Object.keys(a.guesses);
  if(guessKeys.length){
    var pname={}; S.products.forEach(function(p){pname[p.id]=p.name});
    h+='<p class="muted" style="margin-top:14px"><b style="color:var(--warn)">طوبقت بالتشابه — راجعها قبل الاستيراد:</b> قرأ النظام اسم الصنف داخل نصّ أودو الطويل. وهذا صحيحٌ في الغالب، لكنّه استنتاج لا يقين. صحّح أيّ سطرٍ أخطأ فيه، ويُحفظ تصحيحك فلا يتكرّر.</p>';
    h+='<div class="tablewrap" style="margin-top:8px"><table><thead><tr><th>الاسم في أودو</th><th>الكمية</th><th>فُهم أنه</th><th>صحّحه</th></tr></thead><tbody>';
    guessKeys.slice(0,40).forEach(function(k){
      var g=a.guesses[k];
      h+='<tr><td class="w130">'+esc(g.name)+'</td>';
      h+='<td class="n" style="color:var(--ink-3)">'+round1(g.qty)+'</td>';
      h+='<td><span class="chip w">'+esc(pname[g.pid]||g.pid)+'</span></td>';
      h+='<td><select class="impMap" data-k="'+esc(k)+'" style="width:210px">';
      h+='<option value="">— اتركه كما فُهم —</option>';
      S.products.forEach(function(p){h+='<option value="'+esc(p.id)+'"'+(p.id===g.pid?" selected":"")+'>'+esc(p.name)+'</option>'});
      h+='<option value="__new">+ أنشئ صنفاً بهذا الاسم</option>';
      h+='<option value="__skip">تجاهل هذا الاسم</option>';
      h+='</select></td></tr>';
    });
    h+='</tbody></table></div>';
    if(guessKeys.length>40) h+='<p class="muted" style="margin-top:6px">تُعرض أوّل 40.</p>';
  }
  h+='</div>';

  // 4. what lands where — one line per day, checked before anything is saved
  var pById={}; S.products.forEach(function(p){pById[p.id]=p});
  var clashSet={}; a.clashDays.forEach(function(d){clashSet[d]=1});
  var needMode=importNeedsMode(a);
  h+='<div class="card" style="margin-top:10px"><div class="lbl" style="margin-bottom:8px">4 — ما سيُسجَّل، يوماً يوماً</div>';
  if(!dayKeys.length){
    h+='<p class="muted">لا صفوف صالحة بعد. اربط الأسماء أعلاه، أو راجع الأعمدة والنطاق.</p>';
  }else{
    h+='<div class="tablewrap" style="max-height:420px;overflow:auto"><table id="impDays"><thead><tr><th>اليوم</th><th>أصناف</th><th>الكمية</th><th>الحالة</th></tr></thead><tbody>';
    dayKeys.forEach(function(d){
      var dd=parseYmd(d);
      var dayT=totalsByUnit(a.days[d].lines.map(function(l){return {p:pById[l.pid],v:l.qty}}));
      var st=!clashSet[d]?'<span class="chip a">جديد</span>'
            :!imp.scope||imp.modeChosen?'<span class="chip w">فيه مبيعات — '+(imp.mode==="replace"?"سيُستبدل":"سيُضاف إليه")+'</span>'
            :'<span class="chip c">فيه مبيعات — اختر أدناه</span>';
      h+='<tr data-day="'+esc(d)+'"><td>'+DOW_AR[dd.getDay()]+' '+fmtDate(dd)+' <span class="num" style="color:var(--ink-3);font-size:11px">'+esc(d)+'</span></td>'+
         '<td class="n">'+a.days[d].items+'</td><td class="n">'+fmtTotals(dayT)+'</td><td>'+st+'</td></tr>';
    });
    var allT=totalsByUnit(a.entries.map(function(e){return {p:pById[e.pid],v:e.qty}}));
    h+='</tbody><tfoot><tr><td><b>'+dayKeys.length+' '+(dayKeys.length===1?'يوم':'يوماً')+'</b></td><td class="n">—</td><td class="n"><b>'+fmtTotals(allT)+'</b></td><td></td></tr></tfoot></table></div>';
  }
  var clashKeys=Object.keys(a.unitClash);
  if(clashKeys.length){
    h+='<div class="banner" style="margin-top:12px"><div class="grow"><b>اختلاف في وحدة القياس:</b> '+
       clashKeys.slice(0,6).map(function(k){
         var c=a.unitClash[k];
         return esc(c.name)+' — الملفّ يقول <b>'+esc(c.sheet)+'</b> والتطبيق يقول <b>'+esc(c.app)+'</b>';
       }).join('، ')+(clashKeys.length>6?' وغيرها':'')+
       '. والرقم يعني شيئاً مختلفاً في كلّ حالة، فصحّح وحدة الصنف في «الأصناف» قبل الاستيراد، أو تأكّد أنّ الملفّ صحيح.</div></div>';
  }

  var skipped=[];
  if(a.summary) skipped.push(a.summary+' سطرَ مجاميع («الإجمالي» وما شابهه)');
  if(a.noQty) skipped.push(a.noQty+' صفّاً بلا كمية');
  if(a.noDate) skipped.push(a.noDate+' صفّاً بتاريخٍ غير مقروء');
  if(a.future) skipped.push(a.future+' صفّاً بتاريخٍ مستقبلي');
  if(skipped.length) h+='<p class="muted" style="margin-top:8px">تُخطّى: '+skipped.join("، ")+'.</p>';

  // Replace or add is asked outright whenever the file reaches a day that already has sales.
  var chosen=!imp.scope||imp.modeChosen;
  if(a.clashDays.length||!imp.scope){
    if(a.clashDays.length) h+='<div class="banner" id="impModeAsk" style="margin-top:12px"><div class="grow"><b>'+a.clashDays.length+' '+(a.clashDays.length===1?'يومٌ فيه':'أيامٍ فيها')+' مبيعاتٌ مسجّلة من قبل</b> ('+
       a.clashDays.slice(0,5).map(function(d){return fmtDate(parseYmd(d))}).join('، ')+(a.clashDays.length>5?' وغيرها':'')+
       '). '+(chosen?'اخترتَ: <b>'+(imp.mode==="replace"?'استبدل':'أضف')+'</b>.':'ماذا أفعل بها؟ لن يُحفظ شيءٌ حتى تختار.')+'</div></div>';
    h+='<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">';
    h+='<button class="btn'+(chosen&&imp.mode==="replace"?" primary":"")+'" id="impModeRep">استبدل المسجَّل</button>';
    h+='<button class="btn'+(chosen&&imp.mode==="add"?" primary":"")+'" id="impModeAdd">أضف إلى المسجَّل</button>';
    h+='</div>';
    h+='<p class="muted" style="margin-top:8px">«استبدل» يمسح رقم «باع» لتلك الأصناف في تلك الأيام ويكتب ما في الملفّ — وهو الصواب إن كان أودو مرجعك. و«أضف» يجمع فوق المسجَّل، وينفع إن استوردت ملفّاً مكمّلاً. وفي الحالتين <b>لا يُمسّ الهدر ولا علامة النفاد</b>، فهما من عندك وحدك.</p>';
  }else if(dayKeys.length){
    h+='<p class="muted" style="margin-top:12px">كلّ هذه الأيام بلا مبيعاتٍ مسجّلة، فلا يُمسّ شيءٌ ممّا عندك.</p>';
  }
  h+='<label style="display:flex;gap:8px;align-items:center;margin-top:10px;font-size:13px;cursor:pointer">'+
     '<input type="checkbox" id="impClose"'+(imp.markClosed?" checked":"")+'> علّم هذه الأيام «مُقفلة»</label>';
  h+='</div>';

  h+='<div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">';
  var impTotals=totalsByUnit(a.entries.map(function(e){return {p:pById[e.pid],v:e.qty}}));
  h+='<button class="btn primary" id="impApply"'+(dayKeys.length&&!needMode?"":" disabled")+'>استورد '+(dayKeys.length?fmtTotals(impTotals):'')+'</button>';
  h+='<button class="btn" id="impCancel2">إلغاء</button>';
  h+='</div>';
  return h;
}

/* ===================== render: entry tab ===================== */
function renderEntry(){
  if(S.imp) return renderImport();
  var plist=activeProducts();
  if(!plist.length) return '<div class="empty">أضف أصنافك أوّلاً من تبويب «الأصناف».</div>';
  var date=S.entryDate, rec=S.days[date]||{date:date,items:{}};
  var d=parseYmd(date);

  var soldQty=0,wasteQty=0,outs=0,soldRows=[],wasteRows=[];
  plist.forEach(function(p){
    var e=rec.items[p.id]||{};
    soldQty+=(+e.sold||0);
    wasteQty+=(+e.waste||0);
    soldRows.push({p:p,v:+e.sold||0});
    wasteRows.push({p:p,v:+e.waste||0});
    if(e.stockout) outs++;
  });
  var wastePctDay=soldQty>0?wasteQty/soldQty*100:0;
  var soldT=totalsByUnit(soldRows), wasteT=totalsByUnit(wasteRows);

  var h='';
  h+='<div class="section-head"><h2>إقفال اليوم</h2><div class="note">سجِّل المباع والمهدور. وعلِّم «نفد» إن انتهى الصنف قبل الإغلاق، فيرفع النظام تقديرَ الطلب الحقيقي لذلك اليوم بدل أن يحسبه ضعفَ طلب.</div></div>';

  h+='<div class="card" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px">';
  h+='<div style="flex:1;min-width:190px"><div style="font-size:13.5px;font-weight:600">المبيعات من أودو</div>'+
     '<div class="hint" style="margin-top:2px">صدِّر تقرير المبيعات (Excel أو CSV) واستورده بدل الكتابة يدوياً</div></div>';
  h+='<input type="file" id="impFile" accept=".csv,.xlsx,.xlsm,.xls,text/csv" hidden>';
  h+='<button class="btn primary" id="impPick">استورد ملفّ المبيعات</button>';
  h+='</div>';
  var evsToday=eventsOn(d,S.events);
  h+='<div class="grid2" style="max-width:460px">';
  h+='<label class="fld"><span>التاريخ</span><input type="date" id="entryDate" value="'+esc(date)+'" max="'+ymd(today())+'"></label>';
  h+='<div class="card" style="padding:9px 12px"><div class="lbl">'+DOW_AR[d.getDay()]+(payLabel(d)?' · '+payLabel(d):'')+
     (evsToday.length?' · '+esc(evsToday[0].name):'')+'</div>'+
     '<div class="hint" style="margin-top:2px">مؤشّر اليوم ×'+round1(S.dowIndex[d.getDay()]*payFactor(d)*eventFactor(d,S.events))+'</div></div>';
  h+='</div>';

  // Fourteen days back, so a forgotten day is impossible to miss
  h+='<div style="font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--ink-3);margin-top:16px">آخر أربعة عشر يوماً</div>';
  h+='<div class="daystrip" style="margin-top:6px">';
  for(var k=13;k>=0;k--){
    var dd=addDays(today(),-k), key=ymd(dd), r=S.days[key];
    var any=r&&Object.keys(r.items||{}).length>0;
    var state=r&&r.closed?"a":any?"":"w";
    h+='<span class="entDay chip '+state+'" data-d="'+esc(key)+'" role="button" tabindex="0" style="cursor:pointer'+(key===date?';outline:2px solid var(--accent);outline-offset:1px':'')+'">'+
       DOW_SHORT[dd.getDay()]+' '+dd.getDate()+'</span>';
  }
  h+='</div>';
  h+='<p class="muted" style="margin-top:6px">الأخضر مُقفل، والرمادي مبدوء، والأصفر لم يُسجَّل بعد. اضغط أيَّ يوم لفتحه.</p>';

  var tw=S.cfg.trackWaste!==false, ts=S.cfg.trackStockout!==false;

  h+='<div class="cards">';
  h+='<div class="card good"><div class="lbl">مباع اليوم</div><div class="val" style="font-size:19px">'+fmtTotals(soldT)+'</div><div class="hint">'+(soldT.length>1?'مجموعةً بوحدتها':'&nbsp;')+'</div></div>';
  if(tw) h+='<div class="card '+(wastePctDay>6?"bad":wastePctDay>0?"warn":"")+'"><div class="lbl">هدر اليوم</div><div class="val" style="font-size:19px">'+fmtTotals(wasteT)+'</div><div class="hint">'+(soldQty>0?round1(wastePctDay)+'٪ من المباع':'&nbsp;')+'</div></div>';
  if(ts) h+='<div class="card '+(outs?"bad":"")+'"><div class="lbl">أصناف نفدت</div><div class="val">'+outs+'</div><div class="hint">طلبٌ لم يُلبَّ</div></div>';
  h+='</div>';

  h+='<div class="tablewrap" style="margin-top:14px"><table><thead><tr>';
  var showShelf=S.cfg.showShelfInClose===true;
  h+='<th>الصنف</th><th>الوحدة</th>'+(showShelf?'<th>الصلاحية</th>':'')+
     '<th>باع</th>'+(tw?'<th>هدر</th>':'')+(ts?'<th>نفد؟</th>':'')+'<th>كان المتوقَّع</th>';
  h+='</tr></thead><tbody>';
  plist.forEach(function(p){
    var e=rec.items[p.id]||{};
    var fcv=round1(forecast(p,d));
    var sold=+e.sold||0;
    var diff=sold-fcv;
    h+='<tr>';
    var step=isCountable(p)?'step="1" inputmode="numeric"':'step="0.1" inputmode="decimal"';
    h+='<td class="w130">'+esc(p.name)+'</td>';
    h+='<td style="text-align:center;font-size:12px;color:var(--ink-2)">'+esc(unitOf(p))+'</td>';
    if(showShelf) h+='<td class="n" style="color:var(--ink-3)">'+(p.shelfLife||"—")+'</td>';
    h+='<td><input type="number" '+step+' min="0" class="w70 entIn" data-pid="'+esc(p.id)+'" data-f="sold" value="'+esc(e.sold!=null?e.sold:"")+'"></td>';
    if(tw) h+='<td><input type="number" '+step+' min="0" class="w70 entIn" data-pid="'+esc(p.id)+'" data-f="waste" value="'+esc(e.waste!=null?e.waste:"")+'"></td>';
    if(ts) h+='<td style="text-align:center"><input type="checkbox" class="entChk" data-pid="'+esc(p.id)+'" '+(e.stockout?"checked":"")+'></td>';
    h+='<td class="n" style="color:var(--ink-3)">'+fcv+
       (e.sold!=null&&fcv>0?' <span style="color:'+(Math.abs(diff)<fcv*0.2?"var(--ink-3)":diff>0?"var(--accent-ink)":"var(--warn)")+'">('+(diff>=0?"+":"")+round1(diff)+')</span>':'')+
       '</td>';
    h+='</tr>';
  });
  h+='</tbody></table></div>';
  if(ts) h+='<p class="muted" style="margin-top:10px">علامةُ «نفد» مهمّة: فمن دونها يقرأ النظام يوم النفاد على أنّه ضعفُ طلب، فيطلب أقلّ في المرّة القادمة، فتدخل في دوّامة نفادٍ متكرّر. وحين تُعلِّمها يفترض أنّ نحو 18٪ من الطلب قد ضاع ويصحّح تقديره.</p>';
  else h+='<p class="muted" style="margin-top:10px">تتبّع النفاد مُطفأ. لتشغيله: الإعدادات ← ما تسجّله يومياً.</p>';
  return h;
}

function entryFooter(){
  if(S.imp) return null;
  var plist=activeProducts();
  if(!plist.length) return null;
  var rec=S.days[S.entryDate]||{items:{}};
  var filled=0;
  plist.forEach(function(p){var e=rec.items[p.id]; if(e&&e.sold!=null&&e.sold!=="") filled++});
  var done=filled>=plist.length;
  var where=S.desktop?"في ملفّك":S.local?"على هذا الجهاز":"في حسابك";
  return '<div class="sum">'+(rec.closed?'<b style="color:var(--accent-ink)">مُقفل</b> · ':'')+
         'عُبّئ <b>'+filled+'</b> من '+plist.length+' صنفاً · يُحفظ '+where+' تلقائياً</div>'+
         '<button class="btn '+(done?"primary":"")+'" id="closeDay">'+(rec.closed?"مُقفل ✓":"أقفل اليوم")+'</button>';
}

/* ===================== render: items tab ===================== */
/**
 * A product's aliases, sorted for people: Odoo product codes (stored as "pos cn 017", shown POS-CN-017),
 * the machine copies of whole Odoo cells (they hold a code — the code alone now identifies the product,
 * so they are kept for matching but not shown), and the readable names that remain.
 */
function aliasView(p){
  var al=p.aliases||[], codes=[], machine=[], names=[];
  al.forEach(function(a){ if(/^[a-z]{2,6}( [a-z0-9]{1,6})* \d{2,}$/.test(a)&&!/[؀-ۿ]/.test(a)) codes.push(a) });
  al.forEach(function(a){
    if(codes.indexOf(a)>=0) return;
    if(codes.some(function(c){return a.indexOf(c)>=0})) machine.push(a); else names.push(a);
  });
  return {codes:codes, machine:machine, names:names,
          codeText:codes.map(function(c){return c.toUpperCase().replace(/ /g,"-")})};
}

  if(pk){
    h+='<div class="muted"><b style="color:var(--ink)">العبوة</b> — كم وحدة في الصينية أو الكرتون الذي يصلك. لو البايتس تصلك صينيةً فيها 12 حبّة فاكتب 12، فلن يقترح النظام 7 حبّات بل 6 أو 12.</div>';

/* ===================== operational layer: materials, links, offers, recipes =====================
 * A layer ON TOP of the sales: nothing here changes a product, a sale or the order formulas.
 *   sales product (as Odoo sold it) → offer, if it is one (broken into its products/materials)
 *   → operational link (Black Coffee → قهوة) and recipe (سينابون كبير → صوص + كريمة + مكسرات)
 *   → consumption of operational items and materials.
 * Each brand has its own catalogue (catalog.js); a branch may override a brand recipe or offer.
 * Products are keyed by their Odoo code when they have one ("c:pos cn 017"), else by name.
 * No relation is ever guessed from a name — every one is set by the shop on the screen.
 */
var OP_UNITS={"قطعة":{base:"قطعة",f:1},"جم":{base:"جم",f:1},"كجم":{base:"جم",f:1000},"مل":{base:"مل",f:1},"لتر":{base:"مل",f:1000}};
var OP_UNIT_LIST=["قطعة","جم","كجم","مل","لتر"];
/*
 * A unit is written freely (علبة، كرتونة، كوب، شوت، باكت…). The five standard ones convert among
 * themselves (جم↔كجم، مل↔لتر); any other unit has no conversion and is counted and shown as written.
 * Spacing, Arabic digits and Latin case are evened out, so «كوب» and « كوب » are one unit.
 */
function opUnit(u){
  var s=westernDigits(String(u==null?"":u)).replace(/\s+/g," ").trim().slice(0,20);
  if(!s) return "قطعة";
  for(var i=0;i<OP_UNIT_LIST.length;i++) if(normName(OP_UNIT_LIST[i])===normName(s)) return OP_UNIT_LIST[i];
  return /[a-z]/i.test(s)?s.toLowerCase():s;
}
function opStd(u){return OP_UNITS[u]||null}
function opBase(u){u=opUnit(u);return opStd(u)?opStd(u).base:u}
function opToBase(q,u){u=opUnit(u);return (+q||0)*(opStd(u)?opStd(u).f:1)}
function opCompatible(u){u=opUnit(u);if(!opStd(u)) return [u];var b=opBase(u);return OP_UNIT_LIST.filter(function(x){return opBase(x)===b})}
/** The standard units, then every unit this brand already uses — offered as suggestions, never imposed. */
function opUnitSuggestions(){
  var out=OP_UNIT_LIST.slice();
  (S.cat&&S.cat.items||[]).forEach(function(i){ if(out.indexOf(i.unit)<0) out.push(i.unit) });
  return out;
}
function num2(v){return (Math.round((+v||0)*100)/100).toLocaleString("en-US",{maximumFractionDigits:2})}
/** An amount held in its base unit (جم، مل، قطعة), shown in the readable one: 2,000 جم → 2 كجم. */
function fmtOp(v,base,plain){
  var big=(base==="جم"||base==="مل")&&Math.abs(v)>=1000;
  if(!big) return num2(v)+" "+base;
  var main=num2(v/1000)+" "+(base==="جم"?"كجم":"لتر");
  return plain?main:main+' <span style="color:var(--ink-3);font-size:11px">('+num2(v)+' '+base+')</span>';
}
function curBrandKey(){var b=S.multi?curBranch():null;return (b&&b.brand)||CUR_BRAND}
function emptyCat(brand){return {v:1,brand:brand,items:[],links:{},bundles:{},recipes:{},branches:{}}}
/** Everything that enters from a file or the cloud is cleaned: ids, numbers and lengths are checked. */
function sanitizeCatalog(d,brand){
  var out=emptyCat(brand);
  if(!d||typeof d!=="object") return out;
  var ids={};
  (Array.isArray(d.items)?d.items:[]).slice(0,2000).forEach(function(i){
    if(!i||typeof i!=="object"||!SAFE_ID.test(String(i.id))||ids[i.id]) return;
    ids[i.id]=1;
    out.items.push({id:String(i.id),name:sStr(i.name,120),unit:opUnit(i.unit),shelfLife:i.shelfLife==null||i.shelfLife===""?null:sNum(i.shelfLife,null),active:i.active!==false});
  });
  var key=function(k){return typeof k==="string"&&k.length<=300&&/^[cn]:/.test(k)};
  var lines=function(arr,kinds){
    return (Array.isArray(arr)?arr:[]).slice(0,200).filter(function(l){return l&&typeof l==="object"}).map(function(l){
      var o={qty:sNum(l.qty,0)};
      if(kinds){ o.kind=l.kind==="i"?"i":"p"; o.ref=String(l.ref==null?"":l.ref).slice(0,300); }
      else o.item=String(l.item==null?"":l.item).slice(0,60);
      if(l.unit!=null) o.unit=opUnit(l.unit);
      return o;
    }).filter(function(l){return kinds?(l.kind==="i"?SAFE_ID.test(l.ref):key(l.ref)):SAFE_ID.test(l.item)});
  };
  var defs=function(src,kinds){
    var o={}; if(!src||typeof src!=="object") return o;
    Object.keys(src).slice(0,3000).forEach(function(k){
      var v=src[k]; if(!key(k)||!v||typeof v!=="object") return;
      o[k]={active:v.active!==false,lines:lines(v.lines,kinds)};
    });
    return o;
  };
  if(d.links&&typeof d.links==="object") Object.keys(d.links).slice(0,3000).forEach(function(k){
    var v=d.links[k]; if(!key(k)||!v||typeof v!=="object"||!SAFE_ID.test(String(v.item))) return;
    out.links[k]={item:String(v.item),factor:v.factor==null?1:sNum(v.factor,1)};
  });
  out.bundles=defs(d.bundles,true);
  out.recipes=defs(d.recipes,false);
  if(d.branches&&typeof d.branches==="object") Object.keys(d.branches).slice(0,500).forEach(function(b){
    if(!/^[a-z0-9][a-z0-9-]{0,47}$/.test(b)||!d.branches[b]||typeof d.branches[b]!=="object") return;
    out.branches[b]={bundles:defs(d.branches[b].bundles,true),recipes:defs(d.branches[b].recipes,false)};
  });
  return out;
}

/* ---------- loading and saving the open brand's catalogue ---------- */
var CAT_LS="talabia-catalog-";
function ensureCatalog(){
  var brand=curBrandKey();
  if(!brand||S.catBrand===brand||S.catLoading===brand) return;
  S.catLoading=brand;
  var done=function(data,rev){
    if(S.catLoading!==brand) return;
    S.catLoading=null; S.catBrand=brand; S.catRev=rev||0; S.cat=sanitizeCatalog(data,brand);
    render();
  };
  if(window.desktop&&window.desktop.catalogLoad){
    window.desktop.catalogLoad(brand).then(function(r){ done(r&&r.ok?r.data:null, r&&r.rev) },function(){ done(null,0) });
  }else{
    var raw=null; try{raw=JSON.parse(localStorage.getItem(CAT_LS+brand)||"null")}catch(e){}
    setTimeout(function(){done(raw,0)},0);
  }
}
var catT=null;
function saveCatalog(now){
  if(!S.cat||!S.catBrand) return;
  if(catT) clearTimeout(catT);
  var brand=S.catBrand;
  var go=function(){
    catT=null;
    var data=JSON.parse(JSON.stringify(S.cat));
    if(window.desktop&&window.desktop.catalogSave){
      catP=window.desktop.catalogSave(brand,data,S.catRev).then(function(r){
        if(r&&r.ok){ if(S.catBrand===brand) S.catRev=r.rev; return }
        if(r&&r.stale){ toast("تغيّرت الوصفات من جهازٍ آخر — أُعيد تحميلها"); S.catBrand=null; render(); return }
        toast("تعذّر حفظ الوصفات: "+((r&&r.error)||""));
      },function(){toast("تعذّر حفظ الوصفات")});
    }else{ try{localStorage.setItem(CAT_LS+brand,JSON.stringify(data))}catch(e){} }
  };
  if(now) go(); else catT=setTimeout(go,400);
}

/* ---------- products and their keys ---------- */
function productKeys(p){
  var av=aliasView(p), out=av.codes.map(function(c){return "c:"+c});
  out.push("n:"+normName(p.name));
  av.names.forEach(function(a){out.push("n:"+a)});
  return out.filter(function(k,i,a){return k.length>2&&a.indexOf(k)===i});
}
function productKey(p){return productKeys(p)[0]}
function catFind(map,keys){
  if(!map) return null;
  for(var i=0;i<keys.length;i++) if(map[keys[i]]) return {key:keys[i],val:map[keys[i]]};
  return null;
}
/** The rules in force for one branch: its own overrides first, then the brand's. */
function opCtx(cat,branchId){
  cat=cat||emptyCat(curBrandKey());
  var ov=(cat.branches||{})[branchId]||{bundles:{},recipes:{}};
  var items={}; (cat.items||[]).forEach(function(i){items[i.id]=i});
  var byKey={};
  S.products.forEach(function(p){productKeys(p).forEach(function(k){ if(!byKey[k]) byKey[k]=p })});
  var pick=function(kind){return function(keys){
    var o=catFind(ov[kind],keys); if(o) return {key:o.key,val:o.val,scope:"branch"};
    o=catFind(cat[kind],keys); return o?{key:o.key,val:o.val,scope:"brand"}:null;
  }};
  return {cat:cat, items:items, byKey:byKey, bundle:pick("bundles"), recipe:pick("recipes"),
          link:function(keys){return catFind(cat.links,keys)},
          keysOf:function(ref){var p=byKey[ref];return p?productKeys(p):[ref]}};
}
function opName(ctx,key){
  var p=ctx.byKey[key]; if(p) return p.name;
  if(/^c:/.test(key)) return key.slice(2).toUpperCase().replace(/ /g,"-");
  return key.slice(2);
}
function opAcc(){return {items:{},src:{},prods:{},bundled:{},unlinked:{},cycles:{}}}
function opAdd(acc,itemId,amount,origin){
  if(!amount) return;
  acc.items[itemId]=(acc.items[itemId]||0)+amount;
  var s=acc.src[itemId]=acc.src[itemId]||{}; s[origin]=(s[origin]||0)+amount;
}
/**
 * One product sold `qty` times, all the way down: an offer becomes its products and materials (and those
 * products their own recipes), a product adds to the operational item it is linked to and to the materials
 * of its recipe. A product with none of these is listed as needing an operational link. An offer that
 * contains itself, at any depth, is stopped and reported.
 */
function opExpand(ctx,keys,qty,acc,origin,depth,path){
  var pkey=keys[0];
  if(!qty) return;
  if(depth>8||path.indexOf(pkey)>=0){ acc.cycles[pkey]=1; return }
  var b=ctx.bundle(keys);
  if(b&&b.val.active!==false&&b.val.lines.length){
    acc.bundled[pkey]=(acc.bundled[pkey]||0)+qty;
    b.val.lines.forEach(function(l){
      if(l.kind==="i"){ var it=ctx.items[l.ref]; if(it&&it.active!==false) opAdd(acc,it.id,qty*opToBase(l.qty,l.unit||it.unit),origin); return }
      opExpand(ctx,ctx.keysOf(l.ref),qty*(+l.qty||0),acc,origin,depth+1,path.concat([pkey]));
    });
    return;
  }
  acc.prods[pkey]=(acc.prods[pkey]||0)+qty;
  var used=false, ln=ctx.link(keys);
  if(ln){ var li=ctx.items[ln.val.item]; if(li&&li.active!==false){ opAdd(acc,li.id,qty*opToBase(ln.val.factor==null?1:ln.val.factor,li.unit),origin); used=true } }
  var r=ctx.recipe(keys);
  if(r&&r.val.active!==false) r.val.lines.forEach(function(l){
    var it=ctx.items[l.item]; if(!it||it.active===false) return;
    opAdd(acc,it.id,qty*opToBase(l.qty,l.unit||it.unit),origin); used=true;
  });
  if(!used){
    var why=b&&b.val.active===false?"العرض موقوف":r&&r.val.active===false?"الوصفة موقوفة":"لا ربط تشغيلي ولا وصفة ولا عرض";
    var u=acc.unlinked[pkey]=acc.unlinked[pkey]||{qty:0,why:why}; u.qty+=qty;
  }
}
function opMerge(into,a){
  ["items","prods","bundled"].forEach(function(f){Object.keys(a[f]).forEach(function(k){into[f][k]=(into[f][k]||0)+a[f][k]})});
  Object.keys(a.src).forEach(function(i){var s=into.src[i]=into.src[i]||{};Object.keys(a.src[i]).forEach(function(o){s[o]=(s[o]||0)+a.src[i][o]})});
  Object.keys(a.unlinked).forEach(function(k){var u=into.unlinked[k]=into.unlinked[k]||{qty:0,why:a.unlinked[k].why};u.qty+=a.unlinked[k].qty});
  Object.keys(a.cycles).forEach(function(k){into.cycles[k]=1});
}
/** One day's sales, exactly as recorded, through the layer. */
function opDay(ctx,rec){
  var acc=opAcc(), pmap={};
  S.products.forEach(function(p){pmap[p.id]=p});
  Object.keys(rec&&rec.items||{}).forEach(function(pid){
    var q=+rec.items[pid].sold||0, p=pmap[pid]; if(!q||!p) return;
    var keys=productKeys(p); opExpand(ctx,keys,q,acc,keys[0],0,[]);
  });
  return acc;
}
function catHasRules(cat){
  cat=cat||{};
  return !!((cat.items||[]).length||Object.keys(cat.links||{}).length||Object.keys(cat.bundles||{}).length||Object.keys(cat.recipes||{}).length);
}
/** The period's operational analysis: each item and material analysed like a product. */
function opReport(range){
  var R=normRange(range), ctx=opCtx(S.cat,S.branchId);
  var keys=Object.keys(S.days).sort().filter(function(k){return (!R.from||k>=R.from)&&(!R.to||k<=R.to)});
  var tot=opAcc(), daily={};
  keys.forEach(function(k){
    var a=opDay(ctx,S.days[k]); opMerge(tot,a);
    Object.keys(a.items).forEach(function(id){(daily[id]=daily[id]||{})[k]=a.items[id]});
  });
  var rows=(S.cat&&S.cat.items||[]).filter(function(i){return i.active!==false&&tot.items[i.id]}).map(function(it){
    var series=keys.map(function(k){return {date:k,d:parseYmd(k),qty:(daily[it.id]||{})[k]||0}});
    var total=tot.items[it.id]||0, src=tot.src[it.id]||{};
    return {item:it, base:opBase(it.unit), total:total, dailyAvg:keys.length?total/keys.length:0,
            trend7:trendOf(series,7), weekday:byWeekday(series), series:series,
            sources:Object.keys(src).map(function(o){return {key:o,name:opName(ctx,o),amount:src[o]}}).sort(function(a,b){return b.amount-a.amount})};
  }).sort(function(a,b){return b.total-a.total});
  return {days:keys.length, rows:rows, tot:tot, ctx:ctx};
}
/** What the coming order's window needs, from the app's own forecast for each product (planFor is untouched). */
function opNeeds(plans){
  var ctx=opCtx(S.cat,S.branchId), exp=opAcc(), tgt=opAcc();
  plans.forEach(function(r){
    var keys=productKeys(r.p);
    opExpand(ctx,keys,r.plan.expected,exp,keys[0],0,[]);
    opExpand(ctx,keys,Math.max(r.plan.target,r.plan.expected),tgt,keys[0],0,[]);
  });
  var rows=(S.cat&&S.cat.items||[]).filter(function(i){return i.active!==false&&(exp.items[i.id]||tgt.items[i.id])}).map(function(it){
    var src=exp.src[it.id]||{};
    return {item:it, base:opBase(it.unit), expected:exp.items[it.id]||0, target:tgt.items[it.id]||0,
            sources:Object.keys(src).map(function(o){return {name:opName(ctx,o),amount:src[o]}}).sort(function(a,b){return b.amount-a.amount})};
  }).sort(function(a,b){return b.target-a.target});
  return {rows:rows, unlinked:exp.unlinked, ctx:ctx};
}

/**
 * The ORDER of each material for the made-to-order products — the same arithmetic planFor applies to a product
 * (forecast over the window, a reserve from the shelf life through serviceLevel/probit, and a hard ceiling of what
 * can be used before it expires × horizonBuffer), run on the material's own demand: each made-to-order product's
 * forecast × how much of the material one unit of it takes. A material without a shelf life gets no ceiling.
 * No material stock is subtracted (none is counted yet). planFor itself is untouched.
 */
function opMaterialOrder(plans,w){
  var mto=plans.filter(function(r){return r.p.mto});
  if(!mto.length||!S.cat) return null;
  var ctx=opCtx(S.cat,S.branchId), per={};
  mto.forEach(function(r){ var a=opAcc(), keys=productKeys(r.p); opExpand(ctx,keys,1,a,keys[0],0,[]); per[r.p.id]=a.items });
  var out={};
  (S.cat.items||[]).forEach(function(it){
    if(it.active===false) return;
    var users=mto.filter(function(r){return per[r.p.id][it.id]});
    if(!users.length) return;
    var u=function(r){return per[r.p.id][it.id]};
    var fc=w.days.map(function(_,i){return sum(users.map(function(r){return (r.plan.fc[i]||0)*u(r)}))});
    var expected=sum(fc);
    var cvN=0,cvD=0;
    users.forEach(function(r){ var m=S.model[r.p.id]||{base:0,sigma:0}, cv=m.base>0?m.sigma/m.base:0.45, e=r.plan.expected*u(r); cvN+=cv*e; cvD+=e });
    var cv=cvD>0?cvN/cvD:0.45;
    var sigmaW=cv*Math.sqrt(sum(fc.map(function(x){return x*x})));
    var shelf=+it.shelfLife||0;
    var cr=serviceLevel({shelfLife:shelf||30},w.span), z=probit(cr);
    var target=expected+z*sigmaW, cap=Infinity;
    if(shelf){
      var capSum=0;
      for(var i=0;i<shelf;i++){ var dd=addDays(w.delivery,i); capSum+=sum(users.map(function(r){return forecast(r.p,dd)*u(r)}))*(i===0?w.after:1) }
      cap=capSum*S.cfg.horizonBuffer;
    }
    var q=Math.max(0,Math.min(target,cap));
    q=opBase(it.unit)==="قطعة"||!opStd(it.unit)?Math.ceil(q-1e-9):Math.round(q*100)/100;
    out[it.id]={expected:expected, target:target, cap:cap, capBinds:target>cap+1e-9, order:q, shelf:shelf, cr:cr,
                from:users.map(function(r){return r.p.name})};
  });
  return out;
}
